/* ================= bedrijfsprofiel =================
   Naam, ondertitel en logo. Het logo wordt verkleind naar maximaal 480 px breed,
   zodat het klein genoeg blijft om mee te reizen in de database. */
const LOGO_MAX_BREED=480, LOGO_MAX_BYTES=280*1024;

function verkleinLogo(bestand){
  return new Promise((klaar,fout)=>{
    if(!/^image\//.test(bestand.type)) return fout('geen afbeelding');
    const lezer=new FileReader();
    lezer.onerror=()=>fout('lezen mislukt');
    lezer.onload=()=>{
      const img=new Image();
      img.onerror=()=>fout('afbeelding onleesbaar');
      img.onload=()=>{
        const schaal=Math.min(1,LOGO_MAX_BREED/(img.width||1));
        const b=Math.max(1,Math.round(img.width*schaal)), h=Math.max(1,Math.round(img.height*schaal));
        const c=document.createElement('canvas'); c.width=b; c.height=h;
        c.getContext('2d').drawImage(img,0,0,b,h);
        /* png houdt een doorzichtige achtergrond heel; is het te zwaar, dan jpeg */
        let uit=c.toDataURL('image/png');
        if(uit.length>LOGO_MAX_BYTES){
          const c2=document.createElement('canvas'); c2.width=b; c2.height=h;
          const x=c2.getContext('2d');
          x.fillStyle='#ffffff'; x.fillRect(0,0,b,h); x.drawImage(img,0,0,b,h);
          uit=c2.toDataURL('image/jpeg',0.86);
        }
        if(uit.length>LOGO_MAX_BYTES) return fout('te groot');
        klaar(uit);
      };
      img.src=lezer.result;
    };
    lezer.readAsDataURL(bestand);
  });
}

       <button class="miniknop" id="cOk">Toevoegen</button></div></div>
     <button class="knop2" id="cMeet" style="margin:0 0 22px">${svg(I.temp)}Meting toevoegen</button>
     ${BRONREGEL}${voorstelBlokken('data-voorstel')}`,
    `<button class="prim" style="margin-top:0" id="cTerug">Klaar</button>`);
  $('#cOk').onclick=()=>{
    const v=$('#cN').value.trim(); if(!v) return toast('Vul iets in.');
    S.checks.push({id:uid(),tekst:v,soort:'vink'}); bewaarNu(); sheetChecks(); toast('Toegevoegd.');
  };
  $('#cMeet').onclick=()=>sheetMeting({terug:sheetChecks});
  $$('[data-bewerk]').forEach(b=>b.onclick=()=>sheetMeting({mpId:b.dataset.bewerk,terug:sheetChecks}));
  $$('[data-voorstel]').forEach(x=>x.onclick=()=>{
    if(x.dataset.meting==='1') return sheetMeting({naam:x.dataset.voorstel,min:x.dataset.min,max:x.dataset.max,
      eenheid:x.dataset.eenheid,groep:x.dataset.groep,terug:sheetChecks});
    S.checks.push({id:uid(),tekst:x.dataset.voorstel,soort:'vink',groep:x.dataset.groep}); bewaarNu(); sheetChecks();
  });
  $$('[data-wis]').forEach(b=>b.onclick=()=>{S.checks.splice(parseInt(b.dataset.wis),1);bewaarNu();sheetChecks();toast('Verwijderd.')});
  $('#cTerug').onclick=sheetInstellingen;
}

function sheetMal(){
  sheet('Bonbons per mal',
    `<p class="hint">Hoeveel bonbons passen er in één mal? Hiermee reken je bij een batch in mallen in plaats van in losse stuks.</p>
     <div class="veld"><div class="stepper">
       <button class="stepbtn" id="gMin">${svg(I.min)}</button>
       <div class="stepval"><input id="gV" type="number" inputmode="numeric" value="${S.malGrootte}"><span class="eenh">bonbons</span></div>
       <button class="stepbtn" id="gPlus">${svg(I.plus)}</button></div></div>`,
    `<button class="prim" style="margin-top:0" id="gOk">Opslaan</button>`);
  $('#gMin').onclick=()=>{$('#gV').value=Math.max(1,parseInt($('#gV').value||1)-1)};
  $('#gPlus').onclick=()=>{$('#gV').value=parseInt($('#gV').value||0)+1};
  $('#gOk').onclick=()=>{
    const v=parseInt($('#gV').value);
    if(!v||v<1) return toast('Vul in hoeveel bonbons er in een mal gaan.');
    S.malGrootte=v; render(); sheetInstellingen(); toast('Eén mal is nu '+v+' bonbons.');
  };
}
function sheetMeetpunten(){
  sheet('Meetpunten',
    `<p class="hint">De plekken waar jij temperatuur meet, met de grenzen die je aanhoudt. Buiten die grenzen vraagt de app om een actie.</p>
     <div>${S.meetpunten.length?S.meetpunten.map((m,i)=>`<div class="rrij">
        <div class="rinfo"><div class="rnaam">${esc(m.naam)}</div>
        <div class="rsub">${komma(m.min)} tot ${komma(m.max)} °C</div></div>
        <button class="wisbtn" data-wis="${i}">${svg(I.kruis,'2')}</button></div>`).join('')
      :'<div class="geen">Nog geen meetpunten.</div>'}</div>
     <div class="inlineform open" style="margin-top:16px">
       <div class="rijtje"><input class="mini" id="mN" placeholder="Naam, bijv. Koelkast"></div>
       <div class="rijtje"><input class="mini" id="mMin" type="number" inputmode="decimal" placeholder="Min °C">
         <input class="mini" id="mMax" type="number" inputmode="decimal" placeholder="Max °C">
         <button class="miniknop" id="mOk">Opslaan</button></div></div>`,
    `<button class="prim" style="margin-top:0" id="mTerug">Klaar</button>`);
  $('#mOk').onclick=()=>{
    const n=$('#mN').value.trim(), mi=parseFloat($('#mMin').value), ma=parseFloat($('#mMax').value);
    if(!n) return toast('Geef het meetpunt een naam.');
    if(isNaN(mi)||isNaN(ma)) return toast('Vul een minimum en maximum in.');
    if(mi>ma) return toast('Het minimum moet lager zijn dan het maximum.');
    S.meetpunten.push({id:uid(),naam:n,min:mi,max:ma}); sheetMeetpunten(); toast('Meetpunt toegevoegd.');
  };
  $$('[data-wis]').forEach(b=>b.onclick=()=>{S.meetpunten.splice(parseInt(b.dataset.wis),1);sheetMeetpunten();toast('Verwijderd.')});
  $('#mTerug').onclick=sheetInstellingen;
}

/* merkbalk krimpt zodra je gaat scrollen */
(function(){
  const kop=document.querySelector('header'), scr=$('#scherm');
  if(!kop||!scr) return;
  scr.addEventListener('scroll',()=>{
    if(!kop.classList.contains('gecentreerd')) return;
    const t=scr.scrollTop;
    if(t>34) kop.classList.add('klein');
    else if(t<14) kop.classList.remove('klein');
  },{passive:true});
})();

/* een sheet sluit je op de telefoon door omlaag te vegen */
(function(){
  const vel=$('#sheet'), body=$('#sheetBody'); if(!vel) return;
  let y0=null, y=0, bezig=false;
  vel.addEventListener('touchstart',e=>{
    /* alleen vegen als je bovenaan staat of de kop vastpakt, anders wil je scrollen */
    if(body&&body.scrollTop>2&&!e.target.closest('.sheetkop')&&!e.target.closest('.grip')) return;
    if(e.target.closest('input,textarea,select,button')) return;
    y0=e.touches[0].clientY; y=0; bezig=true; vel.style.transition='none';
  },{passive:true});
  vel.addEventListener('touchmove',e=>{
    if(!bezig||y0===null) return;
    y=Math.max(0,e.touches[0].clientY-y0);
    vel.style.transform='translateY('+y+'px)';
    const ov=$('#overlay'); if(ov) ov.style.opacity=String(Math.max(0,1-y/400));
  },{passive:true});
  const los=()=>{
    if(!bezig) return;
    bezig=false; vel.style.transition='transform .22s ease-out';
    const ov=$('#overlay');
    if(y>110){ vel.style.transform='translateY(100%)';
      setTimeout(()=>{vel.style.transform='';vel.style.transition='';if(ov)ov.style.opacity='';dicht()},170); }
    else { vel.style.transform=''; if(ov) ov.style.opacity=''; }
    y0=null; y=0;
  };
  vel.addEventListener('touchend',los);
  vel.addEventListener('touchcancel',los);
})();

/* je telefoon valt in slaap terwijl je staat te werken — met chocoladehanden ontgrendelen is geen optie */
let wakeSlot=null;
async function schermWakker(aan){
  try{
    if(aan){
      if(wakeSlot||!('wakeLock' in navigator)) return;
      wakeSlot=await navigator.wakeLock.request('screen');
      wakeSlot.addEventListener('release',()=>{wakeSlot=null});
    } else if(wakeSlot){ await wakeSlot.release(); wakeSlot=null; }
  }catch(e){ wakeSlot=null; }
}
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'){
    const b=batch();
    if(b&&(lopendWerk(b)||S.kook)) schermWakker(true);
  }
});

/* een afgelopen timer moet je hóren, niet zien.
   iOS speelt alleen geluid af als de context door een tik is vrijgegeven. */
let piepCtx=null;
function geluidVrijgeven(){
  try{
    piepCtx=piepCtx||new (window.AudioContext||window.webkitAudioContext)();
    if(piepCtx.state==='suspended') piepCtx.resume();
    const o=piepCtx.createOscillator(), g=piepCtx.createGain();
    g.gain.value=0; o.connect(g); g.connect(piepCtx.destination);
    o.start(); o.stop(piepCtx.currentTime+.01);
  }catch(e){}
}
function piep(){
  try{
    piepCtx=piepCtx||new (window.AudioContext||window.webkitAudioContext)();
    if(piepCtx.state==='suspended') piepCtx.resume();
    [0,340,680].forEach(vert=>{
      const o=piepCtx.createOscillator(), g=piepCtx.createGain();
      o.type='sine'; o.frequency.value=880;
      const t=piepCtx.currentTime+vert/1000;
      g.gain.setValueAtTime(0,t);
      g.gain.linearRampToValueAtTime(.28,t+.02);
      g.gain.exponentialRampToValueAtTime(.001,t+.26);
      o.connect(g); g.connect(piepCtx.destination); o.start(t); o.stop(t+.28);
    });
  }catch(e){}
  if(navigator.vibrate) try{navigator.vibrate([220,120,220])}catch(e){}
}

/* de klok laten lopen zonder het hele scherm te hertekenen */
setInterval(()=>{
  const kl=$$('.tikker'); if(!kl.length) return;
  const b=batch(); if(!b) return;
  const w=lopendWerk(b);
  const t = w ? duurTekst(Date.now()-w.start) : '—';
  kl.forEach(el=>{if(el.textContent!==t)el.textContent=t});
  const ring=document.querySelector('.rvul');
  if(ring&&w){
    const c=2*Math.PI*92, sec=Math.floor((Date.now()-w.start)/1000);
    ring.setAttribute('stroke-dashoffset',(c*(1-((sec%60)/60))).toFixed(1));
  }
},1000);

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
