/* de regel onder de paginatitel: kort wat er op deze tab speelt */
function schermOnder(tab){
  const d=new Date();
  const datumtekst=`${DAG[d.getDay()]} ${d.getDate()} ${MND[d.getMonth()]}`;
  if(tab==='productie'){
    const loopt=S.batches.filter(b=>b.status!=='klaar');
    return loopt.length
      ? loopt.length+(loopt.length===1?' batch loopt':' batches lopen')+' · '+
        loopt.reduce((n,b)=>n+bTotaal(b),0)+' bonbons onderweg'
      : datumtekst;
  }
  if(tab==='voorraad'){
    const t=voorraadGereed().reduce((n,v)=>n+v.aantal,0);
    const w=voorraadWaarde();
    return t? t+' bonbons'+(w.bekend?' · '+euro(w.bekend)+' aan grondstoffen':'')
            : 'gereed product, grondstoffen en verpakking';
  }
  if(tab==='geld'){
    const om=omzetVan(new Date().getFullYear(),0);
    return om.bruto? euro(om.bruto)+' omzet dit jaar · '+om.orders+' '+(om.orders===1?'order':'orders')
                   : 'omzet, btw, kilometers en bonnen';
  }
  if(tab==='orders'){
    const open=(S.orders||[]).filter(o=>o.status==='nieuw');
    return open.length
      ? open.length+(open.length===1?' order open':' orders open')+' · '+
        open.reduce((n,o)=>n+orderAantal(o),0)+' bonbons'
      : 'klanten en bestellingen';
  }
  return datumtekst;
}

/* een ring die laat zien hoe ver je bent — compacter dan een balk */
function ringHTML(gedaan,totaal,klas){
  const pct=totaal?Math.min(100,Math.round(gedaan/totaal*100)):0;
  const omtrek=2*Math.PI*16;
  const vul=omtrek*pct/100;
  return `<span class="mring ${klas||''}">
    <svg viewBox="0 0 38 38" width="38" height="38"><circle class="baan" cx="19" cy="19" r="16"></circle>
      <circle class="vul" cx="19" cy="19" r="16"
        stroke-dasharray="${vul.toFixed(1)} ${(omtrek-vul).toFixed(1)}"></circle></svg>
    <span class="rt">${pct}</span></span>`;
}

/* ---------- dashboard ---------- */
/* ================= het dashboard =================
   Geen vaste tegels, maar één hoofdkaart die past bij waar je nu staat, met
   daaronder alleen wat daarbij hoort. De toestand wordt op volgorde bepaald:
   het meest dringende wint. */

/* een week in beeld: welke dagen zijn bezet en waarmee */
function weekstripHTML(dagenVooruit){
  const n=dagenVooruit||7;
  const perDag={};
  allePlanTaken().forEach(t=>{(perDag[t.datum]=perDag[t.datum]||[]).push(t)});
  (S.orders||[]).filter(o=>o.status==='nieuw'&&o.leverdatum).forEach(o=>{
    (perDag[o.leverdatum]=perDag[o.leverdatum]||[]).push({soort:'leveren',tekst:klantNaam(o.klantId)});
  });
  const loopt=lopende();
  if(loopt.length) (perDag[vandaag()]=perDag[vandaag()]||[])
    .push({soort:'productie',tekst:'batch onderweg'});

  let uit=`<div class="weekstrip">`;
  for(let i=0;i<n;i++){
    const d=datumPlus(vandaag(),i), dt=new Date(d);
    const taken=perDag[d]||[];
    /* per soort één balkje, in vaste volgorde */
    const volgorde=['boodschappen','voorbereiden','half','productie','verzenden','live','overig','leveren'];
    const soorten2=volgorde.filter(k=>taken.some(t=>t.soort===k));
    const titel=soorten2.map(k=>k==='leveren'?'leveren':(DAGSOORT[k]||{}).n).join(' · ');
    const nieuweMaand=i>0&&dt.getDate()===1;
    /* vandaag toont de maand in plaats van de dagletter — dat scheelt een regel */
    const bovenaan = i===0 ? MND[dt.getMonth()].slice(0,3)
      : nieuweMaand ? MND[dt.getMonth()].slice(0,3) : DAG[dt.getDay()].slice(0,2);
    uit+=`<button class="wdag ${i===0?'nu':''} ${taken.length?'vol':'leeg'} ${nieuweMaand?'maand':''}"
      data-weekdag="${d}" title="${esc(titel||'niets gepland')}">
      <span class="wd">${bovenaan}</span>
      <span class="wn">${dt.getDate()}</span>
      <span class="wstippen">${soorten2.map(k=>`<i class="s-${k}"></i>`).join('')}</span>
    </button>`;
  }
  uit+=`<button class="wkleuren" data-legenda aria-label="Wat betekenen de kleuren?">${svg(I.palet)}</button>`;
  uit+='</div>';
  uit+=`<div class="wlegenda" id="wLeg">
    ${Object.keys(DAGSOORT).map(k=>`<span><i class="s-${k}"></i>${DAGSOORT[k].n.toLowerCase()}</span>`).join('')}
    <span><i class="s-leveren"></i>leveren</span></div>`;
  return uit;
}

function dashboardToestand(){
  const open=lopende();
  const bezig=open.find(x=>lopendWerk(x))||open[0];
  if(bezig) return {soort:'bezig',b:bezig};

  /* wat vandaag de deur uit moet gaat voor: daar zit een klant op te wachten */
  const verz=verzendTaken().filter(v=>v.datum<=vandaag());
  const plan=planLijst();
  const vandaagP=plan.filter(p=>dagenTussen(vandaag(),p.datum)<=0);
  if(verz.length&&!bezig) return {soort:'verzenden',lijst:verz,plan:vandaagP};
  if(vandaagP.length) return {soort:'vandaag',p:vandaagP[0],rest:vandaagP.slice(1)};

  /* boodschappen: alleen op de dag zelf, en niet meer 's avonds laat.
     Na sluitingstijd schuift het naar morgen — dan is het ook niet urgent meer. */
  const uurNu=new Date().getHours();
  const boodNu=plan.filter(p=>{
    const bd=boodschapDatum(p); if(!bd) return false;
    const n=dagenTussen(vandaag(),bd);
    if(n<0) return true;                    /* had al gemoeten: blijft staan */
    if(n>0) return false;                   /* nog niet aan de beurt */
    return uurNu>=6&&uurNu<20;              /* vandaag, maar wel op een normaal tijdstip */
  });
  if(boodNu.length) return {soort:'boodschappen',p:boodNu[0],alle:boodNu};

  /* een live of andere losse klus vandaag */
  const vandaagTaken=allePlanTaken().filter(x=>x.datum===vandaag()
    &&x.soort!=='productie'&&!(x.soort==='boodschappen'&&!x.los));
  if(vandaagTaken.length) return {soort:'taakdag',taken:vandaagTaken};

  if(plan.length) return {soort:'gepland',p:plan[0]};

  /* net afgerond vandaag, en er ligt product klaar */
  const afVandaag=S.batches.filter(x=>x.status==='klaar'&&x.eindDatum===vandaag());
  if(afVandaag.length) return {soort:'afgerond',lijst:afVandaag};

  const openOrd=(S.orders||[]).filter(o=>o.status==='nieuw');
  if(openOrd.length) return {soort:'orders',lijst:openOrd};

  if(!S.recepten.length) return {soort:'start'};
  return {soort:'rustig'};
}

          <span class="ivak ink">${svg(I.vorm)}</span>
          <span class="naam">${esc(p2.regels.map(r=>smaakNaam(r.receptId)).join(', '))}

    grondVoorraad().filter(v=>grondOnder(v)||v.saldo<=0).forEach(v=>{
      if(!lijst.some(x=>gKey(x.product)===gKey(v.product)))
        lijst.push({product:v.product,gram:Math.max(0,(grondDrempel(v.product)||0)-v.saldo)});
    });
    const bd0=boodschapDatum(t.p);
    const bn0=bd0?dagenTussen(vandaag(),bd0):0;
    h+=`<div class="hoofdkaart">
      <div class="stap" style="color:${DAGSOORT.boodschappen.kleur}">${
        bn0<0?'Boodschappen · '+Math.abs(bn0)+(Math.abs(bn0)===1?' dag':' dagen')+' te laat':'Boodschapdag'}</div>
      <h2 style="margin-top:6px">${bn0<0?'Nog inkopen':'Vandaag inkopen'}</h2>
      <div class="sub">Voor je batch van ${kort(new Date(t.p.datum))}${
        n>1?' — over '+n+' dagen':n===1?' — morgen':''}. ${
        lijst.length?lijst.length+' '+(lijst.length===1?'product':'producten')+' nodig.':'Grondstoffen nodig.'}</div>
      <button class="prim" data-boodschap>${svg(I.vracht)}Boodschappenlijst openen</button></div>`;
    if(lijst.length){
      const per={};
      lijst.forEach(x=>{const l=leverancierVan(x.product)||'Nog geen leverancier';(per[l]=per[l]||[]).push(x)});
      Object.keys(per).sort().forEach(g=>{
        h+=`<div class="blokkop"><span class="eyebrow">${esc(g)}</span><span class="tel">${per[g].length}</span></div>
          <div class="paneel">${per[g].map(x=>{
            const v=grondVoorraad().find(y=>gKey(y.product)===gKey(x.product));
            const ink=inkoopVan(x.product);
            const hoev=ink&&x.gram>0?Math.max(1,Math.ceil(x.gram/ink.basis))+' × '+inkoopTekst(ink)
              :(x.gram>0?toonHoeveel(x.gram,v?v.basis:'g'):'aanvullen');
            return `<div class="arij" style="cursor:default">
              <span class="ivak amber">${svg(I.doos)}</span>
              <span class="naam">${esc(x.product)}<small>${v?'nu '+toonHoeveel(v.saldo,v.basis):'niet op voorraad'}</small></span>
              <span class="waarde gevuld">${hoev}</span></div>`}).join('')}</div>`;
      });
    }
  }

  else if(t.soort==='taakdag'){
    const taken=t.taken;
    const eerste=taken[0];
    h+=`<div class="hoofdkaart">
      <div class="stap" style="color:${DAGSOORT[eerste.soort].kleur}">${
        DAGSOORT[eerste.soort].n}${eerste.tijd?' · '+esc(eerste.tijd):''}</div>
      <h2 style="margin-top:6px">${esc(eerste.tekst)}</h2>
      <div class="sub">${taken.length>1?taken.length+' klussen vandaag'
        :(eerste.plan?'voor de batch van '+kort(new Date(eerste.plan.datum)):'vandaag op de rol')}</div>
      <button class="prim" data-planning>${svg(I.klok)}Planning bekijken</button></div>
      <div class="blokkop"><span class="eyebrow">Vandaag</span><span class="tel">${taken.length}</span></div>
      <div class="paneel">${taken.map(x=>`<div class="arij" style="cursor:default">
        <span class="ivak" style="background:${DAGSOORT[x.soort].kleur}22;color:${DAGSOORT[x.soort].kleur}">
          ${svg(I[DAGSOORT[x.soort].ico])}</span>
        <span class="naam">${esc(x.tekst)}<small>${DAGSOORT[x.soort].n.toLowerCase()}${
          x.tijd?' · '+esc(x.tijd):''}${x.plan?' · batch van '+kort(new Date(x.plan.datum)):''}</small></span>
        </div>`).join('')}</div>`;
  }

  else if(t.soort==='gepland'){
    const p=t.p, n=dagenTussen(vandaag(),p.datum);
    const bd=boodschapDatum(p), bn=bd?dagenTussen(vandaag(),bd):null;
    const dek=dekkingGrond(p.regels).filter(x=>x.tekort>0);
    h+=`<div class="hoofdkaart">
      <div class="stap">Volgende batch · over ${n} ${n===1?'dag':'dagen'}</div>
      <h2 style="margin-top:6px">${esc(p.regels.map(r=>smaakNaam(r.receptId)).join(', '))}</h2>
      <div class="sub">${kort(new Date(p.datum))} · ${p.regels.reduce((x,r)=>x+r.aantal,0)} bonbons${
        bd?' · boodschappen '+(bn===0?'vandaag':bn===1?'morgen':'over '+bn+' dagen'):' · alles in huis'}</div>
      <button class="prim" data-planning>${svg(I.klok)}Planning bekijken</button></div>`;
    if(dek.length){
      h+=`<div class="blokkop"><span class="eyebrow">Nog te halen</span>
          <span class="tel ${bn!==null&&bn<=1?'let':''}">${dek.length}</span></div>
        <div class="paneel">${dek.map(x=>`<div class="arij" style="cursor:default">
          <span class="ivak amber">${svg(I.doos)}</span>
          <span class="naam">${esc(x.naam)}<small>${x.onbekend?'staat niet in je voorraad'
            :'aanwezig '+toonHoeveel(x.op,'g')+' van '+toonHoeveel(x.nodig,'g')}</small></span>
          <span class="waarde gevuld">−${toonHoeveel(x.tekort,'g')}</span></div>`).join('')}
          <button class="meer" data-boodschap>Naar je boodschappenlijst</button></div>`;
    }
  }

  else if(t.soort==='afgerond'){
    const goed=t.lijst.reduce((n,x)=>n+(x.resultaat?x.resultaat.goed:0),0);
    const afk=t.lijst.reduce((n,x)=>n+(x.resultaat?x.resultaat.afkeur:0),0);
    const klaar=(S.orders||[]).filter(o=>o.status==='nieuw'&&!dekking(o).some(x=>x.tekort>0));
    h+=`<div class="hoofdkaart">
      <div class="vinkje">${svg(I.vink,'2.2')}</div>
      <h2 style="text-align:center">${goed} bonbons klaar</h2>
      <div class="sub" style="text-align:center">${t.lijst.length}
        ${t.lijst.length===1?'batch':'batches'} afgerond vandaag${afk?' · '+afk+' afkeur':''}</div>
      <button class="prim" data-sheet="nieuwbatch">${svg(I.plus)}Nieuwe batch</button></div>`;
    if(klaar.length){
      h+=`<div class="blokkop"><span class="eyebrow">Kun je nu inpakken</span>
          <span class="tel">${klaar.length}</span></div>
        <div class="paneel">${klaar.slice(0,4).map(o=>`<button class="arij" data-order="${o.id}">
          <span class="ivak groen">${svg(I.doos)}</span>
          <span class="naam">${esc(klantNaam(o.klantId))}<small>${esc(o.nummer)} · ${orderAantal(o)} bonbons${
            o.leverdatum?' · leveren '+kort(new Date(o.leverdatum)):''}</small></span>
          <span class="pijl">${svg(I.pijl,'2')}</span></button>`).join('')}</div>`;
    }
  }

  else if(t.soort==='orders'){
    const met=t.lijst.map(o=>({o,d:o.leverdatum?dagenTussen(vandaag(),o.leverdatum):999,
      tekort:dekking(o).filter(x=>x.tekort>0).reduce((n,x)=>n+x.tekort,0)}))
      .sort((a,b2)=>a.d-b2.d);
    const eerst=met[0];
    h+=`<div class="hoofdkaart">
      <div class="stap">${t.lijst.length} ${t.lijst.length===1?'order open':'orders open'}</div>
      <h2 style="margin-top:6px">${eerst.tekort?eerst.tekort+' bonbons maken':'Klaar om in te pakken'}</h2>
      <div class="sub">${esc(klantNaam(eerst.o.klantId))}${eerst.d<999
        ? ' · '+(eerst.d<0?'was '+Math.abs(eerst.d)+' dagen geleden':eerst.d===0?'vandaag leveren'
          :eerst.d===1?'morgen leveren':'over '+eerst.d+' dagen')
        :''}</div>
      <button class="prim" data-sheet="nieuwbatch">${svg(I.plus)}Batch maken</button></div>
      <div class="blokkop"><span class="eyebrow">Openstaand</span><span class="tel">${t.lijst.length}</span></div>
      <div class="paneel">${met.slice(0,5).map(x=>`<button class="arij" data-order="${x.o.id}">
        <span class="ivak ${x.d<0?'rood':x.d<=2?'amber':''}">${svg(I.doos)}</span>
        <span class="naam">${esc(klantNaam(x.o.klantId))}<small>${orderAantal(x.o)} bonbons${
          x.d<999?' · '+(x.d<0?Math.abs(x.d)+' dagen te laat':x.d===0?'vandaag':x.d===1?'morgen':'over '+x.d+' dagen'):''}${
          x.tekort?' · '+x.tekort+' maken':' · voorraad is genoeg'}</small></span>
        <span class="pijl">${svg(I.pijl,'2')}</span></button>`).join('')}</div>`;
  }

  else if(t.soort==='start'){
    h+=`<div class="hoofdkaart">
      <h2>Begin met je eerste smaak</h2>
      <div class="sub">Beschrijf één bonbon: de schelp en de lagen erin. Daarna rekent de app
        elke batch voor je uit en weet hij precies wat je nodig hebt.</div>
      <button class="prim" data-sheet="receptnieuw">${svg(I.plus)}Smaak toevoegen</button></div>`;
  }

  else {
    const vw=voorraadGereed().reduce((n,v)=>n+v.aantal,0);
    h+=`<div class="hoofdkaart">
      <div class="vinkje">${svg(I.vink,'2.2')}</div>
      <h2 style="text-align:center">Niets op de rol</h2>
      <div class="sub" style="text-align:center">${vw?vw+' bonbons op voorraad. ':''}Plan een batch
        of begin er meteen een.</div>
      <button class="prim" data-sheet="nieuwbatch">${svg(I.plus)}Nieuwe batch</button>
      <button class="knop2" data-planning style="margin-top:8px">${svg(I.klok)}Batch inplannen</button></div>`;
  }

  /* ── wat er echt mis gaat: alleen rood en de dingen met een datum ── */
  const dringend=sig.filter(x=>x.ernst==='rood');
  const later=sig.filter(x=>x.ernst!=='rood');
  if(dringend.length){
    h+=`<div class="blokkop"><span class="eyebrow">Moet nu</span>
        <span class="tel let">${dringend.length}</span></div>
      <div class="paneel">${dringend.slice(0,4).map(s2=>`<button class="arij" data-naar="productie">
        <span class="ivak rood">${svg(I.alarm)}</span>
        <span class="naam">${esc(s2.tekst)}<small>${esc(s2.extra)}</small></span>
        <span class="pijl">${svg(I.pijl,'2')}</span></button>`).join('')}</div>`;
  }
  if(later.length){
    h+=`<div class="blokkop"><span class="eyebrow">Een keer doen</span>
        <span class="tel">${later.length}</span></div>
      <div class="paneel">${later.slice(0,4).map(s2=>`<button class="arij" data-naar="productie">
        <span class="ivak">${svg(I.alarm)}</span>
        <span class="naam">${esc(s2.tekst)}<small>${esc(s2.extra)}</small></span>
        <span class="pijl">${svg(I.pijl,'2')}</span></button>`).join('')}</div>`;
  }

  /* ── snel naar ── */
  h+=`<div class="blokkop"><span class="eyebrow">Snel naar</span></div>
  <div class="snelrij">
    <button class="snelknop" data-planning>${svg(I.klok)}Planning</button>
    <button class="snelknop" data-taaknieuw>${svg(I.plus)}Iets inplannen</button>
    <button class="snelknop" data-boodschap>${svg(I.vracht)}Boodschappen</button>
    <button class="snelknop" data-sheet="receptnieuw">${svg(I.plus)}Smaak toevoegen</button>
    <button class="snelknop" data-sheet="haccp">${svg(I.klembord)}HACCP</button>
    <button class="snelknop" data-sheet="wenskaart">${svg(I.doc)}Wenskaart</button>
    <button class="snelknop" data-uitlegopen>${svg(I.boek)}Hoe werkt het?</button>
    <button class="snelknop" data-sheet="instellingen">${svg(I.instel)}Instellingen</button>
  </div>`;
  return h;
}


/* ---------- de dagcijfers in de donkere kopband ----------
   Vier korte cellen die je opzij kunt schuiven, met een balk voor je voortgang.
   Bij het scrollen schuift dit blok dicht, zodat je merk klein bovenin blijft. */
function dagStrook(){
  const kb=S.batches.filter(x=>x.status==='klaar');
  const goed=kb.reduce((s,x)=>s+(x.resultaat?x.resultaat.goed:0),0);
  const afk=kb.reduce((s,x)=>s+(x.resultaat?x.resultaat.afkeur:0),0);
  const afw=S.batches.reduce((s,x)=>s+x.logs.filter(l=>l.type==='afwijking').length,0);
  const gepland=S.batches.reduce((s,x)=>s+bTotaal(x),0);
  const nb=S.batches.length;
  const pct=gepland?Math.min(100,Math.round(goed/gepland*100)):0;

  const cel=(label,waarde,bij)=>`<div class="kcel"><div class="kl">${label}</div>
    <div class="kw ${waarde?'':'nul'}">${waarde}${bij?`<em>${bij}</em>`:''}</div></div>`;

  return `<div class="kstrook">
      ${cel('Bonbons',goed,gepland?'van '+gepland:'')}
      ${cel('Batches',nb?kb.length+'/'+nb:0,'')}
      ${cel('Afkeur',afk,'')}
      ${cel('Afwijkingen',afw,'')}
    </div>
    ${gepland?`<div class="kbalk"><span style="width:${pct}%"></span></div>`:''}`;
}

/* ---------- productie ---------- */
function productieHTML(){
  const loopt=S.batches.filter(b=>b.status!=='klaar');
  const afVandaag=S.batches.filter(b=>b.status==='klaar'&&b.eindDatum===vandaag());
  const eerder=S.batches.filter(b=>b.status==='klaar'&&b.eindDatum!==vandaag());
  const goedVandaag=afVandaag.reduce((n,b)=>n+(b.resultaat?b.resultaat.goed:0),0);
  const afkVandaag=afVandaag.reduce((n,b)=>n+(b.resultaat?b.resultaat.afkeur:0),0);
  const inProductie=loopt.reduce((n,b)=>n+bTotaal(b),0);

  /* afkeur over alles wat af is: je kwaliteitsgraadmeter */
  const alleAf=S.batches.filter(b=>b.status==='klaar'&&b.resultaat);
  const totGoed=alleAf.reduce((n,b)=>n+b.resultaat.goed,0);
  const totAfk=alleAf.reduce((n,b)=>n+b.resultaat.afkeur,0);
  const afkPct=(totGoed+totAfk)?Math.round(totAfk/(totGoed+totAfk)*100):null;

  let h='';
  if(!S.recepten.length) h+=`<div class="melding amber" style="margin-bottom:14px">${svg(I.alarm,'2')}
    <span>Begin met je eerste smaak — daarna kun je batches maken.</span></div>`;

  const tegel=(attr,icoon,kop,waarde,sub,klas)=>`<button class="tegel" ${attr}>
    <span class="tk">${svg(icoon)}${kop}</span>
    <span class="tw ${waarde==='—'?'nul':''}">${waarde}</span>
    <span class="ts ${klas||''}">${sub}</span></button>`;

  h+=`<div class="tegels">
    ${tegel('data-sheet="nieuwbatch"',I.plus,'Onderweg',loopt.length||'—',
      loopt.length?inProductie+' bonbons':'nieuwe batch starten')}
    ${tegel('',I.vink,'Vandaag af',goedVandaag||'—',
      afVandaag.length?afVandaag.length+(afVandaag.length===1?' batch':' batches')
        +(afkVandaag?' · '+afkVandaag+' afkeur':''):'nog niets afgerond',afkVandaag?'let':'')}
    ${tegel('data-planning',I.klok,'Gepland',(S.planning||[]).length||'—',(()=>{
      const l=planLijst(); if(!l.length) return 'niets ingepland';
      const n=dagenTussen(vandaag(),l[0].datum);
      return n<=0?'vandaag draaien':n===1?'morgen de eerste':'eerste over '+n+' dagen'})(),
      (()=>{const l=planLijst();return l.length&&dagenTussen(vandaag(),l[0].datum)<=0?'let':''})())}
    ${tegel('data-sheet="recepten"',I.boek,'Smaken',S.recepten.length||'—',
      S.recepten.length?'in je bibliotheek':'nog geen smaak')}
  </div>`;

  /* ── wat er gepland staat ── */
  const plan=planLijst().slice(0,4);
  if(plan.length){
    h+=`<div class="blokkop" style="margin-top:24px"><span class="eyebrow">Gepland</span>
        <span class="tel">${(S.planning||[]).length}</span></div>
      <div class="paneel">${plan.map(p2=>{
        const n=dagenTussen(vandaag(),p2.datum);
        const tot=p2.regels.reduce((x,r)=>x+r.aantal,0);
        const bd=boodschapDatum(p2), bn=bd?dagenTussen(vandaag(),bd):null;
        return veegRij(`<div class="arij">
          <span class="ivak ${n<=0?'ink':n===1?'amber':''}">${svg(I.vorm)}</span>
          <span class="naam">${esc(p2.regels.map(r=>smaakNaam(r.receptId)).join(', '))}
            <small>${n<0?Math.abs(n)+' dagen geleden gepland':n===0?'vandaag':n===1?'morgen':'over '+n+' dagen'
              } · ${tot} bonbons${bd&&bn>=0?' · boodschappen '+(bn===0?'vandaag':bn===1?'morgen':'over '+bn+' dagen'):''}</small></span>
          ${n<=0?`<button class="miniknop" data-planstart="${p2.id}">Starten</button>`
                :`<span class="pijl" data-planning>${svg(I.pijl,'2')}</span>`}
        </div>`,'data-planwis="'+p2.id+'"')}).join('')}
        <button class="meer" data-planning>Hele planning</button></div>`;
  }

  /* ── wat er deze week de deur uit moet ── */
  const open=(S.orders||[]).filter(o=>o.status==='nieuw'&&o.leverdatum)
    .sort((a,b2)=>a.leverdatum.localeCompare(b2.leverdatum)).slice(0,4);
  if(open.length){
    h+=`<div class="blokkop" style="margin-top:24px"><span class="eyebrow">Moet gemaakt worden</span>
        <span class="tel">${open.length}</span></div>
      <div class="paneel">${open.map(o=>{
        const d=Math.round((new Date(o.leverdatum)-new Date(vandaag()))/86400000);
        const dek=dekking(o), tekort=dek.filter(x=>x.tekort>0);
        const tk=tekort.reduce((n,x)=>n+x.tekort,0);
        return `<button class="arij" data-order="${o.id}">
          <span class="ivak ${d<0?'rood':d<=2?'amber':''}">${svg(I.klok)}</span>
          <span class="naam">${esc(klantNaam(o.klantId))}<small>${
            d<0?Math.abs(d)+' dagen te laat':d===0?'vandaag leveren':d===1?'morgen leveren'
              :'over '+d+' dagen'} · ${orderAantal(o)} bonbons${
            tk?' · '+tk+' nog maken':' · voorraad is genoeg'}</small></span>
          ${tk?'<span class="stip amber"></span>':'<span class="stip groen"></span>'}
          <span class="pijl">${svg(I.pijl,'2')}</span></button>`}).join('')}</div>`;
  }

  /* ── de batches zelf ── */
  const rij=b=>{const k=b.status==='klaar', p2=b.status==='pauze';
    const dg=dagNummer(b);
    return veegRij(`<button class="arij" data-batch="${b.id}">
      ${k?`<span class="ivak ${b.afgebroken?'rood':'groen'}">${svg(b.afgebroken?I.kruis:I.vink)}</span>`
         :ringHTML(bGedaan(b),KERN.length,p2?'amber':'')}
      <span class="naam">${esc(bNamen(b))}
        <small>${b.code} · ${chocNaam(b.chocolade).toLowerCase()} · ${bTotaal(b)} st${
          k?(b.afgebroken?' · afgebroken':(b.resultaat?' · '+b.resultaat.goed+' goed':''))
           :p2?' · stilgelegd':' · stap '+bGedaan(b)+' van '+KERN.length}</small></span>
      ${k?`<span class="waarde gevuld">${b.afgebroken?'—':'Klaar'}</span>`
         :`<span class="dagenbadge ${dg>2?'let':''}">${p2?'pauze':dg===1?'dag 1':dg+' dagen'}</span>`}
      <span class="pijl">${svg(I.pijl,'2')}</span></button>`,'data-verwijder="'+b.id+'"')};

  if(!S.batches.length){
    h+=`<div class="blokkop" style="margin-top:24px"><span class="eyebrow">Batches</span></div>
      <div class="paneel"><button class="arij" data-sheet="${S.recepten.length?'nieuwbatch':'receptnieuw'}">
        <span class="ivak">${svg(I.plus)}</span>
        <span class="naam">${S.recepten.length?'Nog geen batch':'Nog geen smaak'}
          <small>${S.recepten.length?'genereer er één, dan gebeurt alles daarbinnen'
            :'voeg eerst een smaak toe'}</small></span>
        <span class="pijl">${svg(I.pijl,'2')}</span></button></div>`;
  } else {
    if(loopt.length) h+=`<div class="blokkop" style="margin-top:24px"><span class="eyebrow">Loopt nu</span>
      <span class="tel">${loopt.length}</span></div>
      <div class="paneel">${loopt.map(rij).join('')}</div>`;
    if(afVandaag.length) h+=`<div class="blokkop" style="margin-top:24px"><span class="eyebrow">Vandaag afgerond</span>
      <span class="tel">${afVandaag.length}</span></div>
      <div class="paneel">${afVandaag.map(rij).join('')}</div>`;
    if(eerder.length){
      h+=`<div class="blokkop" style="margin-top:24px"><span class="eyebrow">Eerdere dagen</span>
        <span class="tel">${eerder.length}</span></div>`;
      h+= S.toonEerder
        ? `<div class="paneel">${eerder.slice().reverse().map(rij).join('')}
           <button class="meer" data-eerder="dicht">Inklappen</button></div>`
        : `<div class="paneel"><button class="meer" data-eerder="open" style="border-top:none">
           ${eerder.length} eerdere ${eerder.length===1?'batch':'batches'} tonen</button></div>`;
    }
  }

  /* ── smaken: je kernbezit, niet weggestopt ── */
  if(S.recepten.length){
    const perSoort={};
    S.recepten.forEach(rc=>{perSoort[rc.chocolade]=(perSoort[rc.chocolade]||0)+1});
    h+=`<div class="blokkop" style="margin-top:24px"><span class="eyebrow">Smaken</span>
        <span class="tel">${S.recepten.length}</span></div>
      <div class="paneel">${S.recepten.slice(0,5).map(rc=>{
        const vp=verkoopPrijs(rc.id), m=margeVan(rc);
        const opv=voorraadPerSmaak()[rc.id]||0;
        return `<button class="arij" data-recept="${rc.id}">
          <span class="ivak">${svg(I.boek)}</span>
          <span class="naam">${esc(rc.naam)}<small>${chocNaam(rc.chocolade).toLowerCase()}${
            rc.tht?' · THT '+rc.tht+' dagen':''}${vp!==null?' · '+euro(vp):' · geen prijs'}${
            m&&m.pct!==null?' · marge '+m.pct+'%':''}</small></span>

      <span class="a">${rg.mallen?rg.mallen+(rg.mallen===1?' mal · ':' mallen · '):''}${rg.aantal} st</span></div>`;

/* ============ wenskaarten, zonder Photoshop ============ */
const KAARTFONTS=[
  {k:'petit', n:'Petit Formal Script', css:"'Petit Formal Script',cursive", basis:34, hoog:1.7},
  {k:'parisienne', n:'Parisienne', css:"'Parisienne',cursive", basis:40, hoog:1.55},
  {k:'caveat', n:'Caveat', css:"'Caveat',cursive", basis:42, hoog:1.5},
  {k:'cormorant', n:'Cormorant', css:"'Cormorant Garamond',Georgia,serif", basis:30, hoog:1.75}
];
const kaartFont=()=>KAARTFONTS.find(f=>f.k===S.kaartFont)||KAARTFONTS[0];

/* Een witregel vóór de afsluiting leest rustiger. */
const AFSLUITERS=['liefs','groetjes','groeten','veel liefs','hartelijke groet','met liefde',
  'tot snel','xxx','xx','warme groet','veel plezier','geniet ervan','dikke kus'];
function kaartRegels(tekst){
  const rijen=String(tekst||'').replace(/\r/g,'').split('\n');
  const uit=[];
  rijen.forEach((r,i)=>{
    const kaal=r.trim().toLowerCase().replace(/[,.!]+$/,'');
    const isAfsluiter=AFSLUITERS.some(a=>kaal===a||kaal.startsWith(a+' '));
    if(isAfsluiter&&i>0&&uit.length&&uit[uit.length-1].trim()!=='') uit.push('');
    uit.push(r);
  });
  return uit;
}
/* De tekst mag krimpen om te passen, maar nooit groeien. */
function kaartGrootte(tekst,font){
  const regels=kaartRegels(tekst);
  const langste=regels.reduce((n,r)=>Math.max(n,r.length),0);
  let pt=font.basis;
  const maxRegels=Math.floor(74/(font.hoog*4.2));
  while(pt>18&&(langste*pt*0.46>860||regels.length*pt*font.hoog>640)) pt-=2;
  return Math.max(18,pt);
}
/* ---------- de wenskaart als afbeelding ----------
   Printen via de browser werkt niet in een app op je telefoon: een webview
   heeft geen printvenster. Daarom tekenen we de kaart op een canvas en geven
   we hem aan het deelmenu van je toestel — daar zit Print en Bewaar in. */
const KAART_DPI=300;
const mmNaarPx=mm=>Math.round(mm/25.4*KAART_DPI);

async function kaartCanvas(tekst,font,pt){
  const f=font||kaartFont(), g=pt||kaartGrootte(tekst,f);
  const B=mmNaarPx(210), H=mmNaarPx(148);
  const c=document.createElement('canvas');
  c.width=B; c.height=H;
  const x=c.getContext('2d');
  x.fillStyle='#ffffff'; x.fillRect(0,0,B,H);

  /* wachten tot het handschrift geladen is, anders tekent hij een systeemletter */
  const pxPerPt=KAART_DPI/72;
  const groot=Math.round(g*pxPerPt);
  const fam=f.css;
  try{ if(document.fonts&&document.fonts.load) await document.fonts.load(`${groot}px ${fam}`); }catch(e){}

  x.fillStyle='#1a1a1a';
  x.textAlign='center';
  x.textBaseline='middle';
  x.font=`${groot}px ${fam}`;

  const regels=kaartRegels(tekst);
  const regelHoogte=groot*f.hoog;
  const totaal=regels.length*regelHoogte;
  let y=H/2-totaal/2+regelHoogte/2;
  regels.forEach(r=>{ if(r.trim()) x.fillText(r,B/2,y); y+=regelHoogte });

  /* woordmerk onderaan */
  const mGroot=Math.round(7.5*pxPerPt);
  try{ if(document.fonts&&document.fonts.load) await document.fonts.load(`600 ${mGroot}px 'Cormorant Garamond'`); }catch(e){}
  x.font=`600 ${mGroot}px 'Cormorant Garamond',Georgia,serif`;
  x.fillStyle='#8a8a8a';
  const naam=merkNaam(), sp=mGroot*0.34;
  const breedte=naam.split('').reduce((n,ch)=>n+x.measureText(ch).width+sp,0)-sp;
  let mx=B/2-breedte/2;
  x.textAlign='left';
  naam.split('').forEach(ch=>{ x.fillText(ch,mx,H-mmNaarPx(14)); mx+=x.measureText(ch).width+sp });

  return c;
}

function canvasNaarBlob(c){
  return new Promise(k=>{ c.toBlob(b=>k(b),'image/png') });
}

async function kaartDelen(tekst){
  const c=await kaartCanvas(tekst);
  const blob=await canvasNaarBlob(c);
  if(!blob) return toast('De kaart kon niet gemaakt worden.');
  const naam='wenskaart-'+vandaag()+'.png';
  const bestand=new File([blob],naam,{type:'image/png'});

  /* het deelmenu van je toestel: daar zit Print, Bewaar en Mail in */
  if(navigator.canShare&&navigator.canShare({files:[bestand]})){
    try{ await navigator.share({files:[bestand],title:'Wenskaart'}); return }
    catch(e){ if(e&&e.name==='AbortError') return }
  }
  /* anders: gewoon downloaden */
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=naam; document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(url); a.remove()},1500);
  toast('Kaart opgeslagen als afbeelding.');
}

/* ---------- afdrukken dat ook op een telefoon werkt ----------
   Een webview heeft geen printvenster. We openen daarom een echt tabblad met
   alleen het vel erin; daar werkt Deel → Print wél. Lukt dat niet, dan vallen
   we terug op het printvenster van de browser zelf. */
function drukAf(html,titel,paginaCss){
  const stijlen=[...document.querySelectorAll('style')].map(x=>x.textContent).join('\n');
  const fonts=[...document.querySelectorAll('link[rel="stylesheet"]')]

  const doc=`<!DOCTYPE html><html lang="nl"><head><meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>${esc(titel||'Afdruk')}</title>${fonts}
    <style>${stijlen}
      body{margin:0;background:#fff}
      .app{display:none!important}
      #printvel{display:block!important}
      ${paginaCss||'@page{size:A4;margin:8mm}'}
    </style></head>
    <body><div id="printvel">${html}</div>
    <script>window.addEventListener('load',function(){setTimeout(function(){try{window.print()}catch(e){}},400)})<\/script>
    </body></html>`;

  const w=window.open('','_blank');
  if(!w){
    /* pop-up geblokkeerd of geen nieuw venster mogelijk: oude manier proberen */
    $('#printvel').innerHTML=html;
    let st=document.getElementById('printstijl');
    if(!st){st=document.createElement('style');st.id='printstijl';document.head.appendChild(st)}
    st.textContent='@media print{'+(paginaCss||'@page{size:A4;margin:8mm}')+'}';
    setTimeout(()=>{try{window.print()}catch(e){toast('Afdrukken lukt niet in de app. Open de site in Safari.')}},80);
    return;
  }
  w.document.open(); w.document.write(doc); w.document.close();
}

function kaartHTML(tekst,font,pt){
  const f=font||kaartFont();
  const g=pt||kaartGrootte(tekst,f);
  return `<div class="wenskaart">
    <div class="wktekst" style="font-family:${f.css};font-size:${g}pt;line-height:${f.hoog}">
      ${kaartRegels(tekst).map(r=>r.trim()?esc(r):'&nbsp;').join('<br>')}
    </div>
    <div class="wkmerk">${esc(merkNaam())}</div>
  </div>`;
}

function sheetWenskaart(vooraf){
  S.kaartFont=S.kaartFont||KAARTFONTS[0].k;
  const teken=()=>{
    const tekst=($('#wkT')&&$('#wkT').value)||vooraf||'';
    const f=kaartFont(), pt=kaartGrootte(tekst,f);
    sheet('Wenskaart',
      `<p class="hint">A5 liggend, klaar om te printen. De tekst past zichzelf aan:
        hij wordt kleiner als je meer schrijft, nooit groter.</p>
       <div class="etvoorbeeld" style="padding:12px"><div class="schaal" id="wkSchaal">${kaartHTML(tekst,f,pt)}</div></div>
       <div class="veld"><label>Wat komt erop?</label>
         <textarea class="inp" id="wkT" rows="5" placeholder="Lieve Els,&#10;&#10;Van harte gefeliciteerd!&#10;&#10;Liefs, Marieke">${esc(tekst)}</textarea>
         <div class="geen" id="wkU" style="padding-top:8px"></div></div>
       <div class="veld"><label>Handschrift</label>
         <div class="chips" id="wkF">${KAARTFONTS.map(x=>
           `<button class="chip klein ${x.k===f.k?'aan':''}" data-wkf="${x.k}"
             style="font-family:${x.css};font-size:15px">${x.n}</button>`).join('')}</div></div>`,
      `<button class="prim" style="margin-top:0" id="wkDeel">${svg(I.doc)}Printen of bewaren</button>
       <button class="sec" id="wkPrint">Printen via de browser</button>`);
    setTimeout(()=>pasSchaal('wkSchaal'),20);
    const bij=()=>{
      const t=$('#wkT').value;
      const g=kaartGrootte(t,kaartFont());
      $('#wkSchaal').innerHTML=kaartHTML(t,kaartFont(),g);
      pasSchaal('wkSchaal');
      const r=kaartRegels(t).length;
      $('#wkU').textContent=t.trim()
        ? r+' '+(r===1?'regel':'regels')+' · '+g+' pt'+(g<f.basis?' (verkleind om te passen)':'')
        : 'Nog niets ingevuld.';
    };
    $('#wkT').oninput=bij; bij();
    $$('[data-wkf]').forEach(c=>c.onclick=()=>{
      S.kaartFont=c.dataset.wkf; bewaarNu();
      $$('[data-wkf]').forEach(y=>y.classList.remove('aan')); c.classList.add('aan');
      bij();
    });
    $('#wkDeel').onclick=async()=>{
      const t=$('#wkT').value;
      if(!t.trim()) return toast('Schrijf eerst iets.');
      const k=$('#wkDeel'); k.disabled=true; const oud=k.innerHTML; k.textContent='Even geduld…';
      try{ await kaartDelen(t) }
      catch(e){ toast('Het maken van de kaart lukte niet.') }
      k.disabled=false; k.innerHTML=oud;
    };
    $('#wkPrint').onclick=()=>{
      const t=$('#wkT').value;
      if(!t.trim()) return toast('Schrijf eerst iets.');
      drukAf(`<div class="vel wenskaartvel">${kaartHTML(t,kaartFont(),kaartGrootte(t,kaartFont()))}</div>`,
        'Wenskaart','@page{size:210mm 148mm;margin:0}');
    };
  };
  teken();
}

  sheet(bestaand?'Bon bewerken':'Bon vastleggen',
    `<div class="veld"><label>Bij wie</label>
       <input class="inp" id="bnW" value="${esc(b.wie)}" placeholder="Bijv. Callebaut, of Makro"></div>
     <div class="veld"><label>Waarvoor</label>
       <input class="inp" id="bnT" value="${esc(b.wat)}" placeholder="Bijv. 10 kg witte chocolade"></div>
     <div class="veld"><label>Soort</label>
       <div class="chips" id="bnS">${BONSOORT.map(x=>
         `<button class="chip klein ${b.soort===x?'aan':''}" data-bs="${x}">${x}</button>`).join('')}</div></div>
     <div class="veld"><label>Bedrag inclusief btw</label>
       <div class="mveld"><span>€</span><input id="bnB" type="number" inputmode="decimal" step="0.01"
         value="${b.bedrag||''}" placeholder="0,00"></div></div>
     <div class="veld"><label>Waarvan btw</label>
       <div class="mveld"><span>€</span><input id="bnV" type="number" inputmode="decimal" step="0.01"
         value="${b.btw||''}" placeholder="0,00"></div>
       <div class="duo" id="bnP" style="margin-top:8px">
         <button data-p="9">9% berekenen</button><button data-p="21">21% berekenen</button></div></div>
     <div class="veld"><label>Datum</label>
       <input class="inp" id="bnD" type="date" value="${b.datum}"></div>`,
    `<button class="prim" style="margin-top:0" id="bnOk">${bestaand?'Opslaan':'Vastleggen'}</button>
     ${bestaand?`<button class="sec" id="bnWis" style="color:var(--rood)">Bon verwijderen</button>`:''}`);
  let soort=b.soort;
  $$('[data-bs]').forEach(x=>x.onclick=()=>{
    $$('[data-bs]').forEach(y=>y.classList.remove('aan')); x.classList.add('aan'); soort=x.dataset.bs;
  });
  $$('#bnP button').forEach(x=>x.onclick=()=>{
    const bed=parseFloat(($('#bnB').value||'0').replace(',','.'));
    if(!bed) return toast('Vul eerst het bedrag in.');
    const pct=parseInt(x.dataset.p);
    $('#bnV').value=(bed-bed/(1+pct/100)).toFixed(2);
  });
  $('#bnOk').onclick=()=>{
    const bed=parseFloat(($('#bnB').value||'0').replace(',','.'));
    if(!bed||bed<=0) return toast('Vul het bedrag in.');
    const wie=$('#bnW').value.trim();
    if(!wie) return toast('Vul in bij wie je dit hebt gekocht.');
    const nieuw={id:bestaand?bestaand.id:uid(),datum:$('#bnD').value||iso(new Date()),
      soort,bedrag:bed,btw:parseFloat(($('#bnV').value||'0').replace(',','.'))||0,
      wie,wat:$('#bnT').value.trim()};
    S.bonnen=S.bonnen||[];
    if(bestaand) Object.assign(bestaand,nieuw); else S.bonnen.push(nieuw);
    bewaarNu(); render(); klaarSheet('Bon vastgelegd.');
  };
  if($('#bnWis')) $('#bnWis').onclick=()=>{
    if(!confirm('Deze bon verwijderen?')) return;
    S.bonnen=S.bonnen.filter(x=>x.id!==bestaand.id); bewaarNu(); render(); dicht();
  };
}

  sheet('Vaste plekken',

       <span>Dit is mijn vestigingsadres</span></label>
     <div class="geen" id="plU">Je locatie wordt bepaald…</div>
     <div class="geen">Typ een adres om een andere plek toe te voegen dan waar je nu bent.</div>`,
    `<button class="prim" style="margin-top:0" id="plOk">Deze plek vastleggen</button>`);
  $$('[data-plekbew]').forEach(x=>x.onclick=()=>sheetPlek(x.dataset.plekbew));
  let hier=null;
  adresHulp('plA',d=>{ if(d.lat!==null) hier={lat:d.lat,lon:d.lon,nauw:1};
    if(!$('#plN').value) $('#plN').value=d.adres.split(',')[0]; });
  positieNu({ms:9000}).then(async p=>{
    hier=p;
    $('#plU').textContent='Locatie bepaald op '+p.nauw+' meter nauwkeurig.';
    if(!$('#plA').value){ const a=await adresVan(p.lat,p.lon); if(a&&!$('#plA').value) $('#plA').value=a; }
  }).catch(()=>{ $('#plU').textContent='Locatie niet gevonden. Zet je locatie aan en probeer het buiten.' });
  $('#plOk').onclick=()=>{
    const a=$('#plA').value.trim(), n=$('#plN').value.trim();
    if(!a) return toast('Vul het adres in.');

    const nieuw={id:uid(),naam:n||a,adres:a,lat:hier.lat,lon:hier.lon,vestiging:$('#plV').checked};
    if(nieuw.vestiging) (S.plekken||[]).forEach(x=>x.vestiging=false);
    S.plekken.push(nieuw); bewaarNu(); sheetPlekken(); toast('Plek vastgelegd.');
  };

  const pct=Math.min(100,Math.round(gedaan/norm*100));

     ${recent.length?`<div class="blokkop" style="margin-top:24px"><span class="eyebrow">Laatst geregistreerd</span>

    sluitVeeg(); bewaarNu(); sheetUren(); render(); toast('Registratie verwijderd.',herstel);
  });
  $('#uHand').onclick=()=>sheetUrenHand();
  $('#uStaat').onclick=()=>sheetUrenstaat();
  setTimeout(bindVeeg,20);
}

/* een klok die de hele nacht doorloopt maakt je urenstaat waardeloos.
   Bij zes uur vragen we of het klopt, en je mag de eindtijd bijstellen. */
function klusVergeten(){
  const k=S.klus; if(!k) return null;
  const uren=(Date.now()-k.start)/3600000;
  return uren>=6?{k,uren:Math.round(uren)}:null;
}
function sheetKlusCorrectie(){
  const v=klusVergeten(); if(!v) return;
  const k=v.k, start=new Date(k.start);
  sheet('Loopt deze klok nog?',
    `<p class="uitleg">${esc(klusSoort(k.soort).n)}${k.tekst?' · '+esc(k.tekst):''}<br>
       Loopt sinds ${pad(start.getHours())}:${pad(start.getMinutes())} — dat is ${v.uren} uur.</p>
     <div class="veld"><label>Tot hoe laat heb je gewerkt?</label>
       <input class="inp" id="kcE" type="time" value="${pad(start.getHours()+1)}:${pad(start.getMinutes())}"></div>`,
    `<button class="prim" style="margin-top:0" id="kcJa">Eindtijd vastleggen</button>
     <button class="sec" id="kcDoor">Nee, ik werk nog door</button>
     <button class="sec" id="kcWeg" style="color:var(--rood)">Weggooien</button>`);
  $('#kcDoor').onclick=()=>{k.gevraagd=Date.now();bewaarNu();dicht()};
  $('#kcWeg').onclick=()=>{S.klus=null;bewaarNu();badgeBij();dicht();render();toast('Klok weggegooid.')};
  $('#kcJa').onclick=()=>{
    const t=($('#kcE').value||'').split(':');
    if(t.length!==2){ toast('Vul een eindtijd in.'); return }
    const e=new Date(k.start); e.setHours(parseInt(t[0]),parseInt(t[1]),0,0);
    /* begonnen om 22:00 en gestopt om 01:00? Dan is dat de volgende dag. */
    if(e<=k.start) e.setDate(e.getDate()+1);
    if(e-k.start>24*3600000){ toast('Dat is meer dan een etmaal — klopt de tijd?'); return }
    k.eind=e.getTime(); k.sec=Math.round((k.eind-k.start)/1000);
    S.klussen=S.klussen||[]; S.klussen.push(k); S.klus=null;
    bewaarNu(); badgeBij(); dicht(); render(); toast(urenTekst(k.sec)+' geregistreerd.');
  };
}

/* de urenstaat: één regel per dag per soort, zoals de Belastingdienst
   het wil zien — datum, omschrijving, uren. Productie-uren staan erbij,
   met het batchnummer als onderbouwing. */
function urenstaatHTML(jaar){
  const van=jaar+'-01-01', tot=jaar+'-12-31';
  const regels=[];
  (S.klussen||[]).forEach(x=>{ if(x.datum<van||x.datum>tot) return;
    regels.push({datum:x.datum,soort:klusSoort(x.soort).n,
      oms:x.tekst||klusSoort(x.soort).n,sec:klusSec(x),bron:x.handmatig?'handmatig':'geklokt'}) });
  (S.batches||[]).forEach(b=>{
    const per={};
    (werkLijst(b)||[]).forEach(w=>{const d=iso(new Date(w.start));
      if(d<van||d>tot) return; per[d]=(per[d]||0)+seconden(w)});
    Object.keys(per).forEach(d=>regels.push({datum:d,soort:'Productie',
      oms:'Batch '+b.code+' — '+bNamen(b),sec:per[d],bron:'geklokt'}));
  });
  regels.sort((a,b)=>a.datum.localeCompare(b.datum));

  const totSec=regels.reduce((n,r)=>n+r.sec,0), tot2=urenGetal(totSec);
  const norm=S.urennorm||1225;
  const perSoort={}; regels.forEach(r=>{perSoort[r.soort]=(perSoort[r.soort]||0)+r.sec});
  const mnd={}; regels.forEach(r=>{const m=r.datum.slice(0,7); mnd[m]=(mnd[m]||0)+r.sec});

  let h=`<div class="rapport">${rKop('Urenregistratie','Kalenderjaar '+jaar)}
    <div class="rij"><span>Totaal geregistreerde uren</span><b>${komma(tot2)} uur</b></div>
    <div class="rij"><span>Urencriterium</span><b>${tot2>=norm?'gehaald':'nog '+komma(Math.round((norm-tot2)*10)/10)+' uur'} van ${norm}</b></div>
    <div class="rij"><span>Aantal registraties</span><b>${regels.length}</b></div>

    <h3>Per soort werk</h3>
    <table class="uren"><tr><th>Soort</th><th>Uren</th><th>Aandeel</th></tr>
    ${Object.keys(perSoort).sort((a,b)=>perSoort[b]-perSoort[a]).map(k=>
      `<tr><td>${esc(k)}</td><td class="n">${komma(urenGetal(perSoort[k]))}</td>
       <td class="n">${totSec?Math.round(perSoort[k]/totSec*100):0}%</td></tr>`).join('')}</table>

    <h3>Per maand</h3>
    <table><tr><th>Maand</th><th>Uren</th></tr>
    ${Object.keys(mnd).sort().map(m=>{const d=new Date(m+'-01');
      return `<tr><td>${MND[d.getMonth()]} ${d.getFullYear()}</td>
        <td class="n">${komma(urenGetal(mnd[m]))}</td></tr>`}).join('')}</table>

    <h3>Alle registraties</h3>
    ${regels.length?`<table class="uren"><tr><th>Datum</th><th>Soort</th><th>Omschrijving</th><th>Uren</th><th>Vastgelegd</th></tr>
      ${regels.map(r=>`<tr><td class="t">${kort(new Date(r.datum))}</td>
        <td>${esc(r.soort)}</td><td>${esc(r.oms)}</td>
        <td class="n">${komma(urenGetal(r.sec))}</td><td>${r.bron}</td></tr>`).join('')}</table>`
     :rLeeg('Nog geen uren geregistreerd in '+jaar+'.')}

    <div class="leeg" style="text-align:left">Uren zijn met een klok in de app vastgelegd of
      achteraf ingevoerd; de kolom Vastgelegd laat zien welke van de twee. Productie-uren komen
      uit de batchregistratie en zijn herleidbaar tot het batchnummer. Bewaartermijn zeven jaar.</div>
    ${rHand()}${rVoet('urenregistratie')}</div>`;
  return h;
}

/* ================= omzet, marge en btw =================
   De verkoopprijs leg je per smaak vast, per bonbon. Daaruit volgt je omzet,
   je marge en je btw-aangifte. Alles wat hier staat komt uit orders die je
   daadwerkelijk hebt ingepakt. */
const BTW_ETEN=0.09, BTW_REST=0.21;
const verkoopPrijs=id=>{const v=(S.verkoop||{})[id];return typeof v==='number'?v:null};
function orderBedrag(o){
  let bekend=0, mist=0;
  (o.regels||[]).forEach(r=>{
    const p=verkoopPrijs(r.receptId);
    if(p===null) mist+=r.aantal; else bekend+=p*r.aantal;
  });
  return {bedrag:bekend,mist};
}
function orders_in(jaar,kwartaal){
  const j=String(jaar);
  return (S.orders||[]).filter(o=>{
    if(o.status!=='ingepakt'&&o.status!=='geleverd') return false;
    const d=o.ingepakt||o.datum; if(!d) return false;
    if(String(d).slice(0,4)!==j) return false;
    return kwartaal?kwartaalVan(d)===kwartaal:true;
  });
}
function omzetVan(jaar,kwartaal){
  let bruto=0, mist=0, n=0;
  orders_in(jaar,kwartaal).forEach(o=>{
    const b=orderBedrag(o); bruto+=b.bedrag; mist+=b.mist; n++;
  });
  return {bruto,mist,orders:n,btw:bruto-bruto/(1+BTW_ETEN),excl:bruto/(1+BTW_ETEN)};
}
/* wat je aan grondstoffen inkocht in een periode */
function inkoopVanPeriode(jaar,kwartaal){
  return (S.gmut||[]).filter(m=>{
    if(m.aantal<=0) return false;
    if(!/ontvangst/i.test(m.reden||'')) return false;
    const d=String(m.datum||''); if(d.slice(0,4)!==String(jaar)) return false;
    return kwartaal?kwartaalVan(d)===kwartaal:true;
  }).reduce((n,m)=>{const pr=gPrijs(m.product);
    return pr===null?n:n+naarBasis(m.aantal,m.eenheid)*pr},0);
}
function bonnenPeriode(jaar,kwartaal){
  return (S.bonnen||[]).filter(b=>{
    const d=String(b.datum||''); if(d.slice(0,4)!==String(jaar)) return false;
    return kwartaal?kwartaalVan(d)===kwartaal:true;
  });
}
/* marge per smaak */
function margeVan(r){
  const vk=verkoopPrijs(r.id);
  if(vk===null) return null;
  const exclBtw=vk/(1+BTW_ETEN);
  const kv=kostprijsVol(r);
  const kost=kv.totaal;
  return {vk,excl:exclBtw,kost,
    arbeid:kv.arbeid, grond:kv.grond, grondNa:kv.grondNa,
    derving:kv.dervingPct, verlies:kv.verlies, vast:kv.vast,
    marge:kost===null?null:exclBtw-kost,
    pct:kost===null||exclBtw<=0?null:Math.round((exclBtw-kost)/exclBtw*100),
    mist:kv.mist};
}

  sheet('Verkoopprijzen',

       const mist=[];
       if(!vasteLastenPerMaand()) mist.push('vaste lasten');
       if(d.pct===null) mist.push('derving');
       if(!uurtarief()) mist.push('uurtarief');
       return mist.length?`<div class="melding amber">${svg(I.alarm,'2')}
         <span>Nog niet ingevuld: ${mist.join(', ')}. Je marge ziet er dan rooskleuriger
           uit dan hij is.</span></div>`
        :(vb.per!==null&&vb.per>0?`<div class="melding" style="background:var(--bg);color:var(--ink)">
           ${svg(I.doos,'2')}<span>Inclusief ${euro(vb.per)} vaste lasten en
             ${komma(d.pct||0)}% derving per bonbon.</span></div>`:'')})()}
     ${lijst.length?`<div class="paneel">${lijst.map(x=>`<button class="arij" data-vkprijs>
       <span class="naam">${esc(x.r.naam)}<small>${x.m.kost!==null
         ? 'excl. btw '+euro(x.m.excl)+' − kostprijs '+euro(x.m.kost)+
           ' (grondstof '+euro(x.m.grondNa)+(x.m.arbeid?' · arbeid '+euro(x.m.arbeid):'')+
           (x.m.vast?' · vast '+euro(x.m.vast):'')+')'
         : 'kostprijs onbekend — '+x.m.mist.length+' ingrediënten zonder inkoopprijs'}</small></span>
       ${x.m.pct!==null?`<span class="stip ${x.m.pct<40?'amber':'groen'}"></span>`:''}
       <span class="waarde gevuld">${x.m.marge!==null?euro(x.m.marge)+(x.m.pct!==null?' · '+x.m.pct+'%':''):'—'}</span>
     </button>`).join('')}</div>`
      :`<div class="paneel"><div class="geen">Nog geen verkoopprijzen ingevuld.</div></div>`}
     ${zonder?`<div class="geen" style="padding-top:10px">${zonder} ${zonder===1?'smaak heeft':'smaken hebben'}
       nog geen verkoopprijs.</div>`:''}`,
    `<button class="prim" style="margin-top:0" id="mgPr">Verkoopprijzen aanpassen</button>`);
  $('#mgPr').onclick=sheetVerkoopprijzen;
  $$('[data-vkprijs]').forEach(x=>x.onclick=sheetVerkoopprijzen);
}

      <tr><th>Smaak</th><th class="n">Per bonbon</th><th class="n">Per ${inh}</th></tr>
      ${regels.map(r=>`<tr><td>${esc(r.naam)}</td>
        <td class="n">${euro(a.prijzen[r.id])}</td>
        <td class="n">${euro(a.prijzen[r.id]*inh)}</td></tr>`).join('')}

    <div class="fvoet">

function sheetAfspraak(klantId){
  const k=(S.klanten||[]).find(x=>x.id===klantId); if(!k) return sheetAfspraken();

  const v=a?vorm(a.vormId):null;

  sheet(k.naam,
    a? `<div class="vrkop"><div class="vrgetal" style="font-size:22px">${a.marge}%<em>marge</em></div>
          <div class="vrmeta">${v?esc(v.naam):'vorm verwijderd'}<br>vastgelegd ${kort(new Date(a.datum))}</div></div>

        <div class="blokkop"><span class="eyebrow">Lijstprijs excl. btw</span>
          <span class="tel">${lijst.length}</span></div>
        <div class="paneel">${lijst.map(r=>`<div class="arij" style="cursor:default">
          <span class="naam">${esc(r.naam)}<small>${euro(a.prijzen[r.id]*inh)} per ${inh}</small></span>
          <span class="waarde gevuld">${euro(a.prijzen[r.id])}</span></div>`).join('')}</div>

        <div class="blokkop" style="margin-top:24px"><span class="eyebrow">Staffel</span></div>
        <div class="paneel">${staffel().map(t=>`<div class="arij" style="cursor:default">
          <span class="naam">Vanaf ${t.van} stuks</span>

        <p class="hint" style="margin-top:16px">De staffel rekent bij elke order opnieuw,
          over het totale aantal bonbons in die order.</p>`
     : `<p class="hint">Nog geen afspraak. Reken eerst een prijs uit in de calculator
          en leg hem hier vast — de app zet dan alle smaken in één keer op die marge.</p>`,
    a? `<button class="prim" style="margin-top:0" id="afOff">${svg(I.doc)}Offerte maken</button>
        <button class="sec" id="afNieuw">Opnieuw vastleggen</button>
        <button class="sec" id="afWeg" style="color:var(--rood)">Afspraak verwijderen</button>`
     : `<button class="prim" style="margin-top:0" id="afNieuw">Prijzen vastleggen</button>
        <button class="sec" id="afTerug2">Terug</button>`);

  if($('#afTerug2')) $('#afTerug2').onclick=sheetAfspraken;
  if($('#afOff')) $('#afOff').onclick=()=>sheetOfferte(klantId);

    if(!vormen().length) zetStandaardVormen();
    const vId=B2B.vorm&&vorm(B2B.vorm)?B2B.vorm:vormen()[0].id;
    zetAfspraak(klantId,vId,b2bMarge());
    render(); sheetAfspraak(klantId);
    toast('Prijzen vastgelegd op '+b2bMarge()+'% marge.');

  if($('#afWeg')) $('#afWeg').onclick=()=>{

    const kopie=Object.assign({},afspraken()); delete kopie[klantId];
    S.afspraken=kopie; bewaarNu(); render(); sheetAfspraken();
    toast('Afspraak verwijderd.',herstel);
  };
}

/* ---------- B2B-calculator ---------- */
let B2B={smaak:null,vorm:null,stuks:96};

function sheetB2B(){
  const rec=(S.recepten||[]);
  if(!rec.length) return toast('Voeg eerst een smaak toe.');
  if(!vormen().length){ zetStandaardVormen(); }
  if(!B2B.smaak||!rec.some(r=>r.id===B2B.smaak)) B2B.smaak=rec[0].id;
  if(!B2B.vorm||!vorm(B2B.vorm)) B2B.vorm=vormen()[0].id;
  const r=rec.find(x=>x.id===B2B.smaak), v=vorm(B2B.vorm);
  const b=b2bBereken(r,v,B2B.stuks);
  const af=b.prijs!==null?afnemerMarge(r,b.prijs):null;

  const rij=(l,w,extra)=>`<div class="arij" style="cursor:default">
    <span class="naam">${l}${extra?`<small>${extra}</small>`:''}</span>
    <span class="waarde gevuld">${w}</span></div>`;

  sheet('B2B-calculator',
    `<div class="veld"><label>Smaak</label>
       <div class="chips" id="bqS">${rec.map(x=>
         `<button class="chip ${x.id===B2B.smaak?'aan':''}" data-v="${x.id}">${esc(x.naam)}</button>`).join('')}</div></div>

     <div class="veld"><label>Wat neemt de klant af?</label>
       <div class="chips" id="bqV">${vormen().map(x=>
         `<button class="chip ${x.id===B2B.vorm?'aan':''}" data-v="${x.id}">${esc(x.naam)}</button>`).join('')}</div></div>

     <div class="veld"><label>Aantal bonbons</label>
       <div class="rijtje">
         <input class="inp" id="bqN" type="number" inputmode="numeric" value="${B2B.stuks}">
         <button class="miniknop" id="bqOk">Reken</button></div>
       <div class="hint" style="margin:8px 0 0">${b.dozen
         ? b.dozen+' '+(b.dozen===1?'eenheid':'eenheden')+' van '+b.inh+' · staffel '+
           (b.trede.pct?b.trede.pct+'% korting vanaf '+b.trede.van:'geen korting')
         : 'los, zonder verpakking'}</div></div>

     ${b.mist.length?`<div class="melding amber">${svg(I.alarm,'2')}
       <span>Geen prijs bekend voor: ${b.mist.slice(0,4).map(esc).join(', ')}${
         b.mist.length>4?' en '+(b.mist.length-4)+' meer':''}. De uitkomst klopt nog niet.</span></div>`:''}

     <div class="blokkop"><span class="eyebrow">Kostprijs per bonbon</span>
       <span class="tel">${b.kostBonbon!==null?euro(b.kostBonbon):'—'}</span></div>
     <div class="paneel">
       ${rij('Grondstoffen',b.kv.grondNa!==null?euro(b.kv.grondNa):'—',
             b.kv.dervingPct?'inclusief '+komma(b.kv.dervingPct)+'% derving':'')}
       ${rij('Arbeid',b.kv.arbeid?euro(b.kv.arbeid):'—',b.kv.arbeid?'':'uurtarief niet ingesteld')}
       ${rij('Vaste lasten',b.kv.vast?euro(b.kv.vast):'—',b.kv.vast?'':'nog niet ingevuld')}
       ${rij('Verpakking',euro(b.vp.per),v&&v.regels&&v.regels.length?'over '+b.inh+' bonbons':'geen verpakking')}
     </div>

     <div class="blokkop" style="margin-top:26px"><span class="eyebrow">Jouw prijs</span>
       <span class="tel">${b.marge}% marge</span></div>
     <div class="paneel">
       ${rij('Per bonbon',b.prijs!==null?euro(b.prijs):'—',
             b.trede.pct?'na '+b.trede.pct+'% staffelkorting':'excl. btw')}
       ${v&&v.regels.length?rij('Per eenheid van '+b.inh,b.perDoos!==null?euro(b.perDoos):'—',''):''}
       ${b.zending?rij('Verzendmateriaal',euro(b.zending),'eenmalig per levering'):''}
       ${rij('Totaal '+b.stuks+' stuks',b.totaal!==null?euro(b.totaal):'—','excl. btw')}
       ${rij('Jij houdt over',b.winst!==null?euro(b.winst):'—',
             b.margePct!==null?b.margePct+'% op deze order':'')}
     </div>

     ${b.onderKost?`<div class="melding rood" style="margin-top:14px">${svg(I.alarm,'2')}
       <span>Deze prijs ligt onder je kostprijs. Elke bonbon kost je geld.</span></div>`:''}

     ${af?`<div class="melding ${af.pct<40?'amber':''}" style="margin-top:14px;${
        af.pct<40?'':'background:var(--bg);color:var(--ink)'}">${svg(I.doos,'2')}
       <span>Verkoopt je afnemer door voor jouw adviesprijs van ${euro(af.advExcl)} excl. btw,
         dan houdt hij <b>${af.pct}%</b> over.${af.pct<40
           ? ' Winkels rekenen meestal op 40 tot 50 procent — jouw prijs is voor hen aan de hoge kant.'
           : ''}</span></div>`
      :`<div class="hint" style="margin-top:14px">Vul een consumentenprijs in bij Verkoopprijzen,
         dan zie je ook wat je afnemer overhoudt.</div>`}

     <div class="veld" style="margin-top:22px"><label>Gewenste marge</label>
       <div class="rijtje">
         <input class="mini" id="bqM" type="number" inputmode="decimal" value="${b.marge}" style="max-width:96px">
         <button class="miniknop" id="bqMOk">Instellen</button></div>
       <div class="hint" style="margin:8px 0 0">${b.marge}% marge is ${
         b.marge<100?Math.round(b.marge/(100-b.marge)*100):'—'}% opslag op je kostprijs.</div></div>`,
    `<button class="prim" style="margin-top:0" id="bqKlant">${svg(I.doc)}Vastleggen bij een klant</button>
     <button class="sec" id="bqVormen">Leveringsvormen</button>
     <button class="sec" id="bqStaffel">Staffel aanpassen</button>`);

  chips('#bqS',false,()=>{B2B.smaak=chipV('#bqS');sheetB2B()});
  chips('#bqV',false,()=>{B2B.vorm=chipV('#bqV');sheetB2B()});
  const lees=()=>{const n=parseInt($('#bqN').value,10); B2B.stuks=n>0?n:1; sheetB2B()};
  $('#bqOk').onclick=lees;
  $('#bqN').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();sluitToetsenbord();lees()}};
  $('#bqMOk').onclick=()=>{
    const n=parseFloat($('#bqM').value);
    if(isNaN(n)||n<0||n>=100) return toast('Vul een marge tussen 0 en 99 in.');
    S.b2bMarge=n; bewaarNu(); sheetB2B();
  };
  $('#bqVormen').onclick=sheetVormen;
  $('#bqStaffel').onclick=sheetStaffel;
  $('#bqKlant').onclick=sheetAfspraken;
}

function zetStandaardVormen(){
  S.vormen=VORMVOORBEELDEN.map(v=>({id:uid(),naam:v.naam,inhoud:v.inhoud,regels:[]}));
  S.vormGezet=true; bewaarNu();
}

function sheetVormen(){
  const l=vormen();
  sheet('Leveringsvormen',
    `<p class="hint">Wat gaat er mee bij een levering? Los in bulk, in doosjes,
      of compleet afgewerkt. Per vorm reken je met andere verpakkingskosten.</p>
     <div class="paneel">${l.length?l.map(v=>{
       const vp=verpakkingPerBonbon(v);
       return `<button class="arij" data-vorm="${v.id}">
         <span class="naam">${esc(v.naam)}<small>${v.inhoud} per eenheid · ${
           (v.regels||[]).filter(x=>(parseFloat(x.aantal)||0)>0).length} ${
           (v.regels||[]).filter(x=>(parseFloat(x.aantal)||0)>0).length===1?'artikel':'artikelen'} · ${
           euro(vp.per)} per bonbon</small></span>
         <span class="pijl">${svg(I.pijl,'2')}</span></button>`}).join('')
      :'<div class="geen">Nog geen vormen.</div>'}</div>`,
    `<button class="prim" style="margin-top:0" id="vmNieuw">${svg(I.plus)}Vorm toevoegen</button>
     <button class="sec" id="vmTerug">Terug</button>`);
  $('#vmTerug').onclick=sheetB2B;
  $('#vmNieuw').onclick=()=>{
    S.vormen=vormen().concat([{id:uid(),naam:'Nieuwe vorm',inhoud:25,regels:[]}]);
    bewaarNu(); sheetVorm(S.vormen[S.vormen.length-1].id);
  };
  $$('[data-vorm]').forEach(b=>b.onclick=()=>sheetVorm(b.dataset.vorm));
}

function sheetVorm(id){
  const v=vorm(id); if(!v) return sheetVormen();
  const arts=verpakkingsArtikelen();
  const aantalVan=p=>{const rg=(v.regels||[]).find(x=>gKey(x.product)===gKey(p));
    return rg?(parseFloat(rg.aantal)||0):0};
  const vp=verpakkingPerBonbon(v);

  sheet(v.naam||'Leveringsvorm',
    `<div class="veld"><label>Naam</label>
       <input class="inp" id="vfN" value="${esc(v.naam||'')}"></div>
     <div class="veld"><label>Bonbons per eenheid</label>
       <input class="inp" id="vfI" type="number" inputmode="numeric" value="${v.inhoud||''}">
       <div class="hint" style="margin:8px 0 0">Bij een groothandelsdoos van vier trays van 24 is dat 96.</div></div>

     <div class="blokkop"><span class="eyebrow">Wat gaat er mee</span>
       <span class="tel">${euro(vp.per)} per bonbon</span></div>
     <div class="paneel">${arts.length?arts.map(p=>{
       const n=aantalVan(p), sch=artSchaal(p), pr=ingPrijs(p);
       return `<div class="orij"><span class="on">${esc(p)}
         <em>${VERPAKSCHAAL[sch].n.toLowerCase()}${pr!==null?' · '+euro(pr)+' per stuk':' · geen prijs'}</em></span>
         <div class="ostep"><button class="stepbtn klein" data-vm="${esc(p)}">${svg(I.min)}</button>
           <span class="oa ${n?'aan':''}">${n}</span>
           <button class="stepbtn klein" data-vp="${esc(p)}">${svg(I.plus)}</button></div></div>`}).join('')
      :'<div class="geen">Nog geen verpakkingsartikelen. Zet bij een artikel de soort op Verpakking.</div>'}</div>

     ${vp.mist.length?`<div class="melding amber" style="margin-top:14px">${svg(I.alarm,'2')}
       <span>Geen prijs bij: ${vp.mist.map(esc).join(', ')}.</span></div>`:''}
     ${vp.zending?`<div class="hint" style="margin-top:12px">Daarnaast ${euro(vp.zending)}
       aan verzendmateriaal per levering.</div>`:''}`,
    `<button class="prim" style="margin-top:0" id="vfOk">Bewaren</button>
     <button class="sec" id="vfWeg" style="color:var(--rood)">Vorm verwijderen</button>`);

  const zet=(p,d)=>{
    v.regels=v.regels||[];
    const rg=v.regels.find(x=>gKey(x.product)===gKey(p));
    const n=Math.max(0,(rg?(parseFloat(rg.aantal)||0):0)+d);
    if(rg) rg.aantal=n; else if(n>0) v.regels.push({product:p,aantal:n});
    v.regels=v.regels.filter(x=>(parseFloat(x.aantal)||0)>0);
    bewaarNu(); sheetVorm(id);
  };
  $$('[data-vp]').forEach(b=>b.onclick=()=>zet(b.dataset.vp,1));
  $$('[data-vm]').forEach(b=>b.onclick=()=>zet(b.dataset.vm,-1));
  $('#vfOk').onclick=()=>{
    v.naam=$('#vfN').value.trim()||'Leveringsvorm';
    const i=parseInt($('#vfI').value,10); v.inhoud=i>0?i:1;
    bewaarNu(); sheetVormen(); render(); toast('Vorm bewaard.');
  };
  $('#vfWeg').onclick=()=>{

/* ---------- arbeid in je kostprijs ----------
   Je timet je batches al. Met een uurtarief weet je wat een bonbon echt kost. */
const uurtarief=()=>typeof S.uurtarief==='number'?S.uurtarief:0;
/* gemiddelde arbeidskosten per bonbon, uit je afgeronde batches */
function arbeidPerBonbon(){
  const t=uurtarief(); if(!t) return null;
  const af=(S.batches||[]).filter(b=>b.status==='klaar'&&werkTotaal(b)>60&&b.resultaat&&b.resultaat.goed>0);
  if(!af.length) return null;
  const uren=af.reduce((n,b)=>n+werkTotaal(b)/3600,0);
  const stuks=af.reduce((n,b)=>n+b.resultaat.goed,0);
  if(!stuks) return null;
  return {perStuk:(uren*t)/stuks,uren,stuks,batches:af.length};
}

/* ---------- verzending en kado-opties: 21% ---------- */
function orderExtra(o){
  const v=parseFloat(o.verzending)||0, k=parseFloat(o.kado)||0;
  return v+k;
}
function btwSplit(jaar,kwartaal){
  let laag=0, hoog=0, mist=0, n=0;
  orders_in(jaar,kwartaal).forEach(o=>{
    const b=orderBedrag(o); laag+=b.bedrag; mist+=b.mist;
    hoog+=orderExtra(o); n++;
  });
  return {laag,hoog,mist,orders:n,
    laagExcl:laag/(1+BTW_ETEN), hoogExcl:hoog/(1+BTW_REST),
    laagBtw:laag-laag/(1+BTW_ETEN), hoogBtw:hoog-hoog/(1+BTW_REST),
    bruto:laag+hoog};
}

/* ---------- winst en verlies ---------- */
function winstVan(jaar,kwartaal){
  const b=btwSplit(jaar,kwartaal);
  const omzet=b.laagExcl+b.hoogExcl;
  const inkoop=inkoopVanPeriode(jaar,kwartaal);
  const bns=bonnenPeriode(jaar,kwartaal);
  const bonnenExcl=bns.reduce((n,x)=>n+(x.bedrag-(x.btw||0)),0);
  const km=kmPeriode(true,kwartaal)*kmTarief();
  const ap=arbeidPerBonbon();
  const stuks=orders_in(jaar,kwartaal).reduce((n,o)=>n+orderAantal(o),0);
  const arbeid=ap?ap.perStuk*stuks:0;
  return {omzet,inkoop,bonnenExcl,km,arbeid,stuks,
    resultaat:omzet-inkoop-bonnenExcl-km-arbeid};
}

      const dagen=d?Math.round((nu4-new Date(d))/86400000):0;
      return {o,dagen,bedrag:orderBedrag(o).bedrag+orderExtra(o)};
    }).sort((a,b2)=>b2.dagen-a.dagen);
}
