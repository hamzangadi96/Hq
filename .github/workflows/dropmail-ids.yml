name: Dropmail ids
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - env:
          FIREBASE_SLEUTEL: ${{ secrets.FIREBASE_SLEUTEL }}
        run: |
          printf '%s' "$FIREBASE_SLEUTEL" > "$RUNNER_TEMP/s.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/s.json"
          npm i -g firebase-tools >/dev/null 2>&1
          firebase database:get /werkvloer/WAGUngBbc9YWpZBV8DECs0UCnIy1/dropMail --project cacaoboetiek-hq > m.json
          node -e 'const m=require("./m.json")||{}; for(const [c,v] of Object.entries(m)){ console.log("UIT",c,"verstuurd="+Object.keys(v.verstuurd||{}).join(","),"ongeldig="+Object.keys(v.ongeldig||{}).join(",")) }'
          rm -f m.json "$RUNNER_TEMP/s.json"
