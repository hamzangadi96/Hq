function geldHTML(){
  const r=S.rit, lijst=ritten();
  const zak=kmDitJaar(true), pri=kmDitJaar(false);
  const jr0=new Date().getFullYear(), kw0=kwartaalVan(new Date());
  const omJ=omzetVan(jr0,0), omK=omzetVan(jr0,kw0), btwK=btwSplit(jr0,kw0);
  const voorK=bonnenPeriode(jr0,kw0).reduce((n,b)=>n+(b.btw||0),0);
  const openst=openstaand(), openTot=openst.reduce((n,x)=>n+x.bedrag,0);
  const wv=winstVan(jr0,kw0);

  let h='';

  /* een rit die loopt hoort bovenaan — anders staat geld voorop */
  if(r){
    h+=`<div class="ritkaart">
      <div class="rkstatus"><span class="rkbol"></span>Onderweg sinds ${r.start.tijd}</div>
      <div class="rkkm"><span id="rkKm">${komma(Math.round((r.km||0)*10)/10)}</span><em>km</em></div>
      <button class="rkvan" data-ritvan>${r.start.adres
        ? (r.start.bekend?svg(r.start.vestiging?I.huis:I.vink,'2.2'):'')+'vanaf '+esc(toonPlek(r.start))
        : 'adres opzoeken…'}</button>
      ${r.doel?`<button class="rkroute" data-ritroute>${svg(I.auto,'2')}
        Route naar ${esc(r.doel.adres.split(',')[0])}</button>`:''}
      <button class="rkstop" data-ritstop>Rit beëindigen</button>
      <button class="rkweg" data-ritweg>Annuleren</button>
      <span id="rkPunten" hidden></span></div>`;
  }

  /* ── omzet ── */
  const tegel=(attr,icoon,kop,waarde,sub,klas,breed)=>`<button class="tegel ${breed?'breed':''}" ${attr}>
    <span class="tk">${svg(icoon)}${kop}</span>
    <span class="tw ${waarde==='—'?'nul':''}">${waarde}</span>
    <span class="ts ${klas||''}">${sub}</span></button>`;

  const margeGem=(()=>{const l=(S.recepten||[]).map(margeVan).filter(m=>m&&m.pct!==null);
    return l.length?Math.round(l.reduce((n,m)=>n+m.pct,0)/l.length):null})();

  h+=`<div class="blokkop" style="margin-top:${r?'24px':'8px'}"><span class="eyebrow">Kwartaal ${kw0}</span>
      <span class="tel">${jr0}</span></div>
    <div class="tegels">
      ${tegel('data-btw',I.euro,'Omzet',omK.bruto?euro(omK.bruto):'—',
        omK.orders?omK.orders+(omK.orders===1?' order':' orders'):'nog geen orders')}
      ${tegel('data-btw',I.doc,'Btw',euro(omK.btw-voorK),
        (omK.btw-voorK)>=0?'te betalen':'terug te krijgen')}
      ${tegel('data-winst',I.spark,'Resultaat',
        (wv.resultaat<0?'−':'')+euro(Math.abs(wv.resultaat)),
        wv.resultaat<0?'verlies dit kwartaal':'na alle kosten',wv.resultaat<0?'fout':'')}
      ${tegel('data-openstaand',I.klok,'Openstaand',openTot?euro(openTot):'—',
        openst.length?openst.length+(openst.length===1?' order open':' orders open'):'alles betaald',
        openst.some(x=>x.dagen>30)?'fout':openst.some(x=>x.dagen>14)?'let':'')}
      ${tegel('data-marges',I.vorm,'Marge',margeGem!==null?margeGem+'%':'—',
        margeGem!==null?'gemiddeld per bonbon':'geen verkoopprijzen',margeGem!==null&&margeGem<40?'let':'')}
      ${tegel('data-bonnen',I.doos,'Bonnen',bonTotaal(jr0)?euro(bonTotaal(jr0)):'—',
        (S.bonnen||[]).length?euro(btwTotaal(jr0))+' btw terug':'nog niets vastgelegd')}
    </div>
    ${omJ.mist?`<div class="melding amber" style="margin-top:12px">${svg(I.alarm,'2')}
      <span>${omJ.mist} bonbons zonder verkoopprijs — die tellen niet mee in je omzet.</span></div>`:''}`;

  /* ── kilometers ── */
  const gaten=kmControle(), mist=onvolledig();
  const kwK=kmPeriode(true,kw0);
  h+=`<div class="blokkop" style="margin-top:24px"><span class="eyebrow">Kilometers</span>
      <span class="tel">${lijst.length?lijst.length+(lijst.length===1?' rit':' ritten'):''}</span></div>`;

  if(gaten.length||mist.length){
    h+=`<div class="melding ${gaten.length?'rood':'amber'}" style="margin-bottom:12px">${svg(I.alarm,'2')}
      <span>${[
        gaten.filter(g=>g.soort==='gat').length?getal(Math.round(gaten.filter(g=>g.soort==='gat')
          .reduce((n,g)=>n+g.km,0)))+' km niet verantwoord tussen twee ritten':'',
        gaten.filter(g=>g.soort==='terug').length?'kilometerstand loopt ergens terug':'',
        mist.length?mist.length+(mist.length===1?' rit is':' ritten zijn')+' niet compleet':''
      ].filter(Boolean).join(' · ')}.${autoVanDeZaak()
        ?' Een registratie met gaten wordt afgekeurd.'
        :' Vul aan wat er mist, dan is je aftrek onderbouwd.'}</span></div>`;
  }

  h+=`<div class="paneel">
      <div class="arij" style="cursor:default">
        <span class="naam">Dit kwartaal<small>Q${kw0} · ${komma(kmTarief())} per km</small></span>
        <span class="waarde ${kwK?'gevuld':''}">${getal(Math.round(kwK))} km · ${euro(kwK*kmTarief())}</span></div>
      <div class="arij" style="cursor:default">
        <span class="naam">Dit jaar<small>aftrekbaar van je winst</small></span>
        <span class="waarde ${zak?'gevuld':''}">${getal(Math.round(zak))} km · ${euro(zak*kmTarief())}</span></div>
      ${autoVanDeZaak()?`<div class="arij" style="cursor:default">
        <span class="naam">Privé dit jaar<small>${pri>500
          ?'meer dan 500 km — je ontkomt niet aan bijtelling'
          :'nog '+getal(Math.round(500-pri))+' km tot de grens van 500'}</small></span>
        ${pri>500?'<span class="stip amber"></span>':''}
        <span class="waarde gevuld">${getal(Math.round(pri))} km</span></div>`:''}
    </div>`;

  if(!r) h+=`<button class="prim" data-ritstart style="margin-top:12px">${svg(I.auto)}Rit starten</button>
    <button class="knop2" data-ritbestem style="margin-top:8px">Rit starten met bestemming</button>`;

  if(lijst.length){
    h+=`<div class="blokkop" style="margin-top:24px"><span class="eyebrow">Laatste ritten</span></div>
      <div class="paneel">${lijst.slice(0,8).map(x=>{
        const m=ritMankeert(x);
        return `<button class="arij" data-rit="${x.id}">
          <span class="naam">${esc(x.reden||'geen reden ingevuld')}
            <small>${kort(new Date(x.datum))} · ${esc(toonPlek(x.start)||'vertrek')} → ${
              esc(toonPlek(x.eind)||'aankomst')}${m.length?' · mist '+m.join(', '):''}</small></span>
          ${m.length?'<span class="stip amber"></span>':''}
          <span class="waarde gevuld">${komma(Math.round(x.km*10)/10)} km</span>
          <span class="pijl">${svg(I.pijl,'2')}</span></button>`}).join('')}</div>`;
    const b=maandBalken();
    if(b) h+=`<div class="kaartje" style="margin-top:12px">${b}</div>`;
  } else {
    h+=`<div class="geen" style="padding:10px 2px 0">Nog geen ritten. Druk op start als je wegrijdt.</div>`;
  }

  /* ── beheer ── */
  const rij=(attr,icoon,label,waarde,let2)=>`<button class="beheerrij" ${attr}>
    ${svg(icoon)}<span class="l">${label}</span>
    ${waarde?`<span class="w ${let2?'let':''}">${waarde}</span>`:''}
    <span class="p">${svg(I.pijl,'2')}</span></button>`;

  const zonderPrijs=(S.recepten||[]).filter(x=>verkoopPrijs(x.id)===null).length;
  h+=`<div class="blokkop" style="margin-top:26px"><span class="eyebrow">Beheer</span></div>
    <div class="paneel">
      ${rij('data-btw',I.doc,'Btw-aangifte','')}
      ${rij('data-verkoop',I.spark,'Verkoopprijzen',
        zonderPrijs?zonderPrijs+' zonder prijs':(S.recepten||[]).length+' ingevuld',!!zonderPrijs)}
      ${rij('data-uurtarief',I.klok,'Uurtarief',uurtarief()?euro(uurtarief())+' per uur':'niet ingesteld',!uurtarief())}
      ${(()=>{const m=vasteLastenPerMaand(), vb=vastPerBonbon();
        return rij('data-kostenbasis',I.doos,'Kostenbasis',
          m? euro(m)+' per maand'+(vb.per!==null?' · '+euro(vb.per)+' per bonbon':' · verdeling onbekend')
           : 'vaste lasten en derving', !m||vb.per===null)})()}
      ${rij('data-b2b',I.spark,'B2B-calculator',
        vormen().length?vormen().length+' leveringsvormen · '+b2bMarge()+'% marge':'prijs per bonbon voor je afnemers')}
      ${(()=>{const n=Object.keys(afspraken()).length;
        return rij('data-afspraken',I.doc,'Prijsafspraken',
          n?n+' '+(n===1?'klant':'klanten'):'nog geen')})()}
      ${rij('data-kmtarief',I.spark,'Kilometervergoeding',komma(kmTarief())+' per km')}
      ${rij('data-autosoort',I.auto,'Soort auto',S.autoSoort==='zaak'?'van de zaak':'privé')}
      ${rij('data-plekken',I.huis,'Vaste plekken',(S.plekken||[]).length||'geen')}
      ${lijst.length?rij('data-kmexport',I.doc,'Rittenoverzicht printen',''):''}
    </div>`;
  return h;
}


async function ritStart(doel){
  if(S.rit) return;
  toast('Locatie zoeken…');
  try{
    const p=await positieNu({ms:6000,doel:15,min:1});
    S.rit={begonnen:Date.now(),start:{tijd:nu(),lat:p.lat,lon:p.lon,adres:null},
      punten:[{lat:p.lat,lon:p.lon,t:Date.now()}],km:0,nauw:p.nauw,
      doel:doel?{adres:doel.adres,lat:doel.lat,lon:doel.lon}:null};
    bewaarNu(); render(); ritVolgen(true); schermWakker(true);
    toast('Rit gestart.');
    /* het vertrekpunt scherper maken zolang je nog niet weg bent */
    positieNu({ms:15000,doel:5,min:5}).then(async beter=>{
      if(!S.rit||S.rit.punten.length>3) return;
      if(afstandKm(beter,S.rit.start)>0.06) return;      /* je bent al onderweg */
      S.rit.start.lat=beter.lat; S.rit.start.lon=beter.lon; S.rit.nauw=beter.nauw;
      S.rit.punten[0]={lat:beter.lat,lon:beter.lon,t:Date.now()};
      const n2=await plaatsNaam(beter.lat,beter.lon);
      if(n2.adres){S.rit.start.adres=n2.adres;S.rit.start.naam=n2.naam;
        S.rit.start.bekend=n2.bekend;S.rit.start.vestiging=n2.vestiging}
      bewaarNu(); render();
    }).catch(()=>{});
    const n=await plaatsNaam(p.lat,p.lon);
    if(n.adres&&S.rit){S.rit.start.adres=n.adres;S.rit.start.naam=n.naam;
      S.rit.start.bekend=n.bekend;S.rit.start.vestiging=n.vestiging;bewaarNu();render()}
  }catch(e){
    toast(e&&e.code===1?'Geef de app toegang tot je locatie.':'Locatie niet gevonden. Probeer het buiten opnieuw.');
  }
}
async function ritStop(){
  const r=S.rit; if(!r) return;
  schermWakker(false);
  let eind={tijd:nu(),lat:null,lon:null,adres:null,nauw:null};
  const laatste=r.punten[r.punten.length-1];
  if(laatste){ eind.lat=laatste.lat; eind.lon=laatste.lon; }
  /* niet wachten: je wilt de auto uit. De gps meet door terwijl je de reden typt. */
  const verfijnen=positieNu({ms:10000,doel:6,min:4}).catch(()=>null);
  ritVolgen(false);
  /* de app kan alleen meten zolang hij openstaat. Was hij dicht, dan berekenen we de route. */
  let km=Math.round(r.km*10)/10, bron='gemeten';
  if(eind.lat!==null){
    const via=await wegAfstand(r.start,{lat:eind.lat,lon:eind.lon});
    if(via!==null){
      const viaKm=Math.round(via*10)/10;
      if(viaKm>km*1.15){ km=viaKm; bron='berekend'; }   /* gaten in de meting */
    }
  }
  const begin=S.kmStand;
  sheet('Rit afronden',
    `<div class="ritklaar">
       <div class="rkgetal">${komma(km)}<em>km</em></div>
       <div class="rkregels">
         <div><b>${r.start.tijd}${eind.tijd!==r.start.tijd?' – '+eind.tijd:''}</b></div>
         <div>${bron==='gemeten'
           ? esc(toonPlek(r.start)||'vertrek')+' → '+esc(toonPlek(eind)||'…')
           : 'route berekend'}</div>
       </div>
     </div>
     ${bron==='berekend'?`<div class="melding amber" style="margin:0 0 20px">${svg(I.alarm,'2')}
       <span>De app was tussendoor dicht en kon niet meten. Dit is de kortste route over de weg —
         reed je om, pas het aantal dan aan.</span></div>`:''}
     <div class="veld"><label>Waarvoor was deze rit?</label>
       <input class="inp" id="rrR" placeholder="Bijv. levering Bakkerij De Vries">
       <div class="chips" id="rrSug" style="padding-top:10px"></div></div>
     ${autoVanDeZaak()?`<div class="veld"><label>Soort rit</label><div class="duo" id="rrZ">
       <button class="aan" data-v="zak">Zakelijk</button><button data-v="pri">Privé</button></div></div>`:''}

     <button class="klapkop" id="rrMeer">${svg(I.pijl,'2')}<span>Gegevens controleren</span></button>
     <div class="klapin" id="rrDetail">
       <div class="veld"><label>Afstand</label>
         <div class="mveld"><input id="rrKm" type="number" inputmode="decimal" step="0.1" value="${km}"><span>km</span></div></div>
       <div class="veld"><label>Kilometerstand na de rit${autoVanDeZaak()?'':' <span style="font-weight:400">— niet verplicht</span>'}</label>
         <div class="mveld"><input id="rrK" type="number" inputmode="numeric"
           value="${begin!==null?Math.round(begin+km):''}" placeholder="${begin!==null?'':(autoVanDeZaak()?'aflezen van je dashboard':'mag leeg blijven')}"><span>km</span></div>
         <div class="geen" style="padding-top:8px">${autoVanDeZaak()
           ? (begin!==null?'Beginstand was '+getal(begin)+' km. Bij een auto van de zaak moet de reeks sluiten.'
                          :'Eén keer invullen, daarna telt de app zelf door.')
           : 'Met een privéauto hoeft dit niet — je adressen en de afstand zijn genoeg.'}</div></div>
       <div class="veld"><label>Vertrokken vanaf</label>
         <input class="inp" id="rrV" value="${esc(r.start.adres||'')}" placeholder="adres wordt opgezocht…">
         <div class="adresvoet" id="rrVvoet">
           ${r.start.bekend
             ? '<span class="bekend">'+svg(I.vink,'2.6')+'Uit je vaste plekken</span>'
             : '<label class="onthoud klein"><input type="checkbox" id="rrOnthV"><span>Onthouden als vaste plek</span></label>'}
         </div></div>
       <div class="veld"><label>Aangekomen bij</label>
         <input class="inp" id="rrN" value="${esc(eind.adres||'')}" placeholder="adres wordt opgezocht…">
         <div class="adresvoet" id="rrNvoet">
           <label class="onthoud klein"><input type="checkbox" id="rrOnth"><span>Onthouden als vaste plek</span></label>
         </div></div>
       <div class="geen" id="rrNauw">Vertrek gemeten op ${r.nauw||'?'} m nauwkeurig.</div>
     </div>`,
    `<button class="prim" style="margin-top:0" id="rrOk">Rit vastleggen</button>`);
  let zak=true;                       /* met een privéauto leg je alleen zakelijke ritten vast */
  $$('#rrZ button').forEach(x=>x.onclick=()=>{sluitToetsenbord();
    $$('#rrZ button').forEach(y=>y.classList.remove('aan'));x.classList.add('aan');zak=x.dataset.v==='zak'});
  if(r.doel&&r.doel.adres){ eind.adres=eind.adres||r.doel.adres; }
  verfijnen.then(async beter=>{
    if(beter){
      eind.lat=beter.lat; eind.lon=beter.lon; eind.nauw=beter.nauw;
      r.punten.push({lat:beter.lat,lon:beter.lon,t:Date.now()});
      const nieuwKm=Math.round(ritKm(r.punten)*10)/10;
      const veld=$('#rrKm');
      if(veld&&bron==='gemeten'&&!veld.dataset.aangepast&&nieuwKm>0) veld.value=nieuwKm;
      const nw=$('#rrNauw');
      if(nw) nw.textContent='Vertrek gemeten op '+(r.nauw||'?')+' m, aankomst op '+beter.nauw+' m nauwkeurig.';
    }
    if(eind.lat===null) return;
    const n=await plaatsNaam(eind.lat,eind.lon);
    if(!n.adres) return;
    eind.adres=n.adres; eind.naam=n.naam; eind.bekend=n.bekend; eind.vestiging=n.vestiging;
    const el=$('#rrN'); if(el&&!el.dataset.aangepast) el.value=n.adres;
    const voet=$('#rrNvoet');
    if(voet&&n.bekend) voet.innerHTML='<span class="bekend">'+svg(n.vestiging?I.huis:I.vink,'2.4')+
      (n.vestiging?'Je vestigingsadres':'Uit je vaste plekken')+'</span>';
    suggesties();
  });
  ['rrN','rrKm'].forEach(id=>{const el=$('#'+id); if(el) el.addEventListener('input',()=>{el.dataset.aangepast='1'})});
  adresHulp('rrV',d=>{ if(d.lat!==null){r.start.lat=d.lat;r.start.lon=d.lon} });
  adresHulp('rrN',d=>{ if(d.lat!==null){eind.lat=d.lat;eind.lon=d.lon} });
  const suggesties=()=>{
    const vak=$('#rrSug'); if(!vak) return;
    const lijst=redenSuggesties(eind.lat,eind.lon,r.start.lat,r.start.lon);
    vak.innerHTML=lijst.map(x=>`<button class="chip klein" data-sug="${esc(x.reden)}"
      data-zak="${x.zakelijk?1:0}">${esc(x.reden)}</button>`).join('');
    $$('[data-sug]').forEach(c=>c.onclick=()=>{
      $('#rrR').value=c.dataset.sug;
      if(autoVanDeZaak()){
        const wilZak=c.dataset.zak==='1';
        $$('#rrZ button').forEach(b=>b.classList.toggle('aan',(b.dataset.v==='zak')===wilZak));
        zak=wilZak;
      }
      sluitToetsenbord();
    });
  };
  suggesties();
  $('#rrMeer').onclick=()=>{
    const open=$('#rrDetail').classList.toggle('open');
    $('#rrMeer').classList.toggle('open',open);
  };
  $('#rrKm').oninput=()=>{
    const v=parseFloat($('#rrKm').value);
    if(!isNaN(v)&&S.kmStand!==null) $('#rrK').value=Math.round(S.kmStand+v);
  };
  $('#rrOk').onclick=()=>{
    const reden=$('#rrR').value.trim();
    if(!reden) return toast('Vul in waarvoor je hebt gereden.');
    const km2=parseFloat($('#rrKm').value);
    if(isNaN(km2)||km2<=0) return toast('Vul het aantal kilometers in.');
    const km=Math.round(km2*10)/10;
    const stand=parseFloat($('#rrK').value);
    const rit={id:uid(),datum:iso(new Date()),km,reden,zakelijk:zak,bron,
      start:{tijd:r.start.tijd,lat:r.start.lat,lon:r.start.lon,
        adres:$('#rrV').value.trim()||r.start.adres,naam:r.start.bekend?r.start.naam:null},
      eind:{tijd:eind.tijd,lat:eind.lat,lon:eind.lon,
        adres:$('#rrN').value.trim()||eind.adres,naam:eind.bekend?eind.naam:null},
      standBegin:isNaN(stand)?null:Math.round(stand-km), standEind:isNaN(stand)?null:Math.round(stand),
      punten:r.punten.length};
    S.ritten=S.ritten||[]; S.ritten.push(rit);
    S.plekken=S.plekken||[];
    const onthou=(vink,lat,lon,adres)=>{
      if(!vink||!vink.checked||lat===null||!adres) return;
      const best=plekBij(lat,lon);
      if(best){best.adres=adres;best.naam=adres}          /* bestaande plek bijwerken */
      else S.plekken.push({id:uid(),naam:adres,adres,lat,lon});
    };
    onthou($('#rrOnthV'),r.start.lat,r.start.lon,rit.start.adres);
    onthou($('#rrOnth'),eind.lat,eind.lon,rit.eind.adres);
    if(!isNaN(stand)) S.kmStand=Math.round(stand);
    S.rit=null; bewaarNu(); render();
    klaarSheet(komma(km)+' km vastgelegd'+(zak?' · '+euro(km*kmTarief())+' aftrekbaar':'')+'.');
  };
}

/* ============ De werkvloer: telefoon stuurt, Mac voert uit ============ */
const MACMODES=[
  {k:'ophaal',n:'Orders ophalen',u:'nieuwe orders, facturen en labels'},
  {k:'wijzigingen',n:'Wijzigingen nakijken',u:'is er iets veranderd aan een order?'},
  {k:'verwerk',n:'Archiveren',u:'verwerkte orders naar de boekhouding'}
];
const macHart=()=>((S.werk||{}).hart)||null;
function macLeeft(){
  const h=macHart(); if(!h||!h.tijd) return false;
  return (Date.now()-new Date(h.tijd).getTime())<90000;      /* 90 sec stilte = offline */
}
const macOrders=()=>Object.values((S.werk||{}).orders||{})
  .sort((a,b2)=>String(b2.nummer).localeCompare(String(a.nummer)));
const macOpdrachten=()=>Object.entries((S.werk||{}).opdrachten||{})
  .map(([id,x])=>Object.assign({id},x))
  .sort((a,b2)=>String(b2.gevraagd||'').localeCompare(String(a.gevraagd||'')));
const lopendeOpdracht=()=>macOpdrachten().find(x=>x.status==='open'||x.status==='bezig')||null;

/* ============ rechtstreeks naar Shopify en MyParcel ============ */
async function roep(naam,gegevens){
  if(!fbUser) throw new Error('Log eerst in.');
  if(typeof firebase==='undefined'||!firebase.functions) throw new Error('Functions niet geladen.');
  const f=firebase.app().functions('europe-west1').httpsCallable(naam);
  const r=await f(gegevens||{});
  return r.data;
}
const koppeling=()=>((S.werk||{}).koppeling)||{};

      Zo kan niemand die de pagina opent erbij.</p>
     <div class="paneel">
       ${rij('shopify','Shopify','je webshop, voor de orders')}
       ${rij('myparcel','MyParcel','voor je verzendlabels')}
     </div>
     ${(S.werk||{}).laatstOpgehaald?`<div class="geen" style="padding-top:12px">

const fout=e=>((e&&e.message)||'Er ging iets mis.').replace(/^[A-Z_]+:\s*/,'');

function sheetKoppel(welke){
  const k=koppeling();
  const shop=welke==='shopify';
  sheet(shop?'Shopify koppelen':'MyParcel koppelen',
    shop
    ? `<p class="hint">Maak in Shopify een app aan via het Dev Dashboard met leesrechten op orders
        en klanten. Plak hier het adres van je winkel en het toegangstoken.</p>
       <div class="veld"><label>Adres van je winkel</label>
         <input class="inp" id="kpW" placeholder="jouwwinkel.myshopify.com" autocapitalize="off"></div>
       <div class="veld"><label>Toegangstoken</label>
         <input class="inp" id="kpT" placeholder="shpat_…" autocapitalize="off"></div>
       <div class="veld"><label>Webhook-geheim <span style="font-weight:400">— mag leeg</span></label>
         <input class="inp" id="kpG" placeholder="alleen als je webhooks gebruikt" autocapitalize="off"></div>`
    : `<p class="hint">Je vindt je sleutel in MyParcel onder Instellingen, bij API-instellingen.</p>
       <div class="veld"><label>API-sleutel</label>
         <input class="inp" id="kpS" placeholder="je MyParcel-sleutel" autocapitalize="off"></div>`,
    `<button class="prim" style="margin-top:0" id="kpOk">Koppelen en uitproberen</button>
     ${k[welke]?`<button class="sec" id="kpWeg" style="color:var(--rood)">Koppeling verwijderen</button>`:''}`);
  $('#kpOk').onclick=async()=>{
    const knop=$('#kpOk'); knop.disabled=true; knop.textContent='Uitproberen…';
    try{
      if(shop){
        const w=$('#kpW').value.trim(), t=$('#kpT').value.trim();
        if(!w||!t) throw new Error('Vul beide velden in.');
        await roep('zetKoppeling',{shopify:{winkel:w,token:t,webhook_geheim:$('#kpG').value.trim()||null}});
      } else {
        const sl=$('#kpS').value.trim();
        if(!sl) throw new Error('Vul je sleutel in.');
        await roep('zetKoppeling',{myparcel:{sleutel:sl}});
      }
      render(); klaarSheet('Gekoppeld en getest.');
    }catch(e){ toast(fout(e)); knop.disabled=false; knop.textContent='Koppelen en uitproberen'; }
  };
  if($('#kpWeg')) $('#kpWeg').onclick=async()=>{
    if(!confirm('Koppeling verwijderen?')) return;
    try{ await roep('wisKoppeling',{welke}); render(); sheetKoppelingen(); }catch(e){ toast(fout(e)) }
  };
}

function macOpdracht(mode,order,boodschap){
  if(!fbUser) return toast('Log eerst in bij synchronisatie.');
  const id='c_'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
  firebase.database().ref('werkvloer/'+fbUser.uid+'/opdrachten/'+id).set({
    mode, order:order||null, boodschap:!!boodschap,
    status:'open', gevraagd:new Date().toISOString()
  }).then(()=>toast(macLeeft()?'Je Mac pakt het op.':'In de wachtrij tot je Mac draait.'))
    .catch(()=>toast('Kon de opdracht niet wegschrijven.'));
}

  $$('[data-klant]').forEach(x=>x.onclick=()=>{

function sheetNieuweOrder(){
  if(!(S.recepten||[]).length) return toast('Voeg eerst een smaak toe.');
  const W={klantId:null,leverdatum:'',regels:{}};
  const teken=()=>{
    const gekozen=Object.entries(W.regels).filter(([k,v])=>v>0);
    const tot=gekozen.reduce((n,[k,v])=>n+v,0);
    sheet('Nieuwe order',
      `<div class="veld"><label>Klant</label>
         <button class="inp kies" id="oK">${W.klantId?esc(klantNaam(W.klantId)):'Kies een klant'}

       <div class="paneel">${S.recepten.map(r=>{
         const n=W.regels[r.id]||0, op=voorraadPerSmaak()[r.id]||0;
         return `<div class="orij"><span class="on">${esc(r.naam)}<em>${op} op voorraad</em></span>
           <div class="ostep"><button class="stepbtn klein" data-om="${r.id}">${svg(I.min)}</button>

      `<button class="prim" style="margin-top:0" id="oOk">Order aanmaken</button>`);
    $('#oK').onclick=()=>sheetKlanten(id=>{W.klantId=id;teken()});
    $('#oD').onchange=()=>{W.leverdatum=$('#oD').value};
    $$('[data-op]').forEach(x=>x.onclick=()=>{const k=x.dataset.op;
      W.regels[k]=(W.regels[k]||0)+S.malGrootte; teken()});
    $$('[data-om]').forEach(x=>x.onclick=()=>{const k=x.dataset.om;
      W.regels[k]=Math.max(0,(W.regels[k]||0)-S.malGrootte); teken()});
    $('#oOk').onclick=()=>{
      if(!W.klantId) return toast('Kies een klant.');
      const regels=Object.entries(W.regels).filter(([k,v])=>v>0).map(([k,v])=>({receptId:k,aantal:v}));
      if(!regels.length) return toast('Voeg minstens één smaak toe.');
      const o={id:uid(),nummer:nieuwOrdernr(),klantId:W.klantId,regels,
        leverdatum:$('#oD').value||'',datum:iso(new Date()),
        besteldOm:new Date().toTimeString().slice(0,5),status:'nieuw',lots:{}};
      S.orders=S.orders||[]; S.orders.push(o); bewaarNu(); render();
      sheetOrder(o.id); toast('Order '+o.nummer+' aangemaakt.');
    };
  };
  teken();
}

/* Welk lot gaat naar welke klant? Dat is de laatste schakel: één stap vooruit. */
function sheetInpakken(id){
  const o=(S.orders||[]).find(x=>x.id===id); if(!o) return;
  const keuze={};                                  /* receptId -> [{lot, aantal}] */
  const dozen={};                                  /* product -> aantal dozen */
  const teken=()=>{
    const rijen=o.regels.map(rg=>{
      const beschikbaar=voorraadGereed().filter(v=>v.receptId===rg.receptId&&v.aantal>0)
        .sort((a,b2)=>(a.tht||'').localeCompare(b2.tht||''));   /* oudste eerst */
      const gekozen=keuze[rg.receptId]||[];
      const tot=gekozen.reduce((n,x)=>n+x.aantal,0);
      return `<div class="veld">
        <div class="lotkop"><span class="n">${esc(smaakNaam(rg.receptId))}</span>
          <span class="g ${tot===rg.aantal?'goed':''}">${tot} van ${rg.aantal}</span></div>
        ${beschikbaar.length?beschikbaar.map(v=>{
          const g=gekozen.find(x=>x.lot===v.lot), n=g?g.aantal:0;
          const d=dagenTotTHT(v.tht);
          return `<div class="orij"><span class="on">lot ${esc(v.lot)}
            <em>${v.aantal} op voorraad${v.tht?' · THT '+kort(new Date(v.tht))+(d<0?' — verlopen':d<=14?' — nog '+d+' dg':''):''}</em></span>
            <div class="ostep"><button class="stepbtn klein" data-im="${rg.receptId}|${v.lot}">${svg(I.min)}</button>
              <span class="oa ${n?'aan':''}">${n}</span>
              <button class="stepbtn klein" data-ip="${rg.receptId}|${v.lot}">${svg(I.plus)}</button></div></div>`
        }).join(''):'<div class="geen">Geen voorraad van deze smaak.</div>'}
      </div>`;
    }).join('');
    const compleet=o.regels.every(rg=>(keuze[rg.receptId]||[]).reduce((n,x)=>n+x.aantal,0)===rg.aantal);

    /* welke doosjes gaan eraan op */
    const verp=grondVoorraad().filter(v=>artSoort(v.product)==='verpakking');
    const totBonbon=orderAantal(o);
    const gedekt=Object.entries(dozen).reduce((n,[p,a])=>n+a*(art(p).maat||0),0);
    const doosBlok=verp.length?`<div class="blokkop"><span class="eyebrow">Verpakking</span>
        <span class="tel ${gedekt>=totBonbon?'':'let'}">${gedekt} van ${totBonbon} bonbons</span></div>
      <div class="paneel">${verp.map(v=>{
        const a=dozen[v.product]||0, m=art(v.product).maat||0;
        const tekort=a>v.saldo;
        return `<div class="orij"><span class="on">${esc(v.product)}
          <em>${getal(v.saldo)} op voorraad${m?' · '+m+' bonbons per doos':''}${tekort?' — te weinig':''}</em></span>
          <div class="ostep"><button class="stepbtn klein" data-dm="${esc(v.product)}">${svg(I.min)}</button>
            <span class="oa ${a?'aan':''}">${a}</span>
            <button class="stepbtn klein" data-dp="${esc(v.product)}">${svg(I.plus)}</button></div></div>`}).join('')}</div>
      <div class="geen" style="padding-top:8px">Laat op nul staan wat je niet gebruikt. Wordt afgeboekt bij het inpakken.</div>`:'';

    sheet('Inpakken voor '+klantNaam(o.klantId),
      `<p class="hint">Kies uit welke partij je pakt. De app boekt het af en legt vast welk lot
        naar deze klant is gegaan — daarmee is je keten compleet.</p>${rijen}${doosBlok}`,
      `<button class="prim" style="margin-top:0" id="ipOk" ${compleet?'':'disabled'}>
        ${compleet?'Afboeken en inpakken':'Kies eerst alle aantallen'}</button>
       ${compleet?`<button class="sec" id="ipEt">${svg(I.doc)}Productetiketten printen</button>`:''}`);
    const pas=(sleutel,delta)=>{
      const [rid,lot]=sleutel.split('|');
      const rg=o.regels.find(x=>x.receptId===rid);
      const v=voorraadGereed().find(x=>x.receptId===rid&&x.lot===lot);
      keuze[rid]=keuze[rid]||[];
      let g=keuze[rid].find(x=>x.lot===lot);
      if(!g){g={lot,aantal:0};keuze[rid].push(g)}
      const anders=keuze[rid].filter(x=>x.lot!==lot).reduce((n,x)=>n+x.aantal,0);
      const ruimte=Math.min(v?v.aantal:0, rg.aantal-anders);
      g.aantal=Math.max(0,Math.min(ruimte,g.aantal+delta));
      keuze[rid]=keuze[rid].filter(x=>x.aantal>0);
      teken();
    };
    $$('[data-ip]').forEach(x=>x.onclick=()=>pas(x.dataset.ip,S.malGrootte||1));
    $$('[data-im]').forEach(x=>x.onclick=()=>pas(x.dataset.im,-(S.malGrootte||1)));
    $$('[data-dp]').forEach(x=>x.onclick=()=>{const p=x.dataset.dp;dozen[p]=(dozen[p]||0)+1;teken()});
    $$('[data-dm]').forEach(x=>x.onclick=()=>{const p=x.dataset.dm;dozen[p]=Math.max(0,(dozen[p]||0)-1);
      if(!dozen[p])delete dozen[p]; teken()});
    if($('#ipEt')) $('#ipEt').onclick=()=>{
      const eerste=o.regels[0];
      sheetProductEtiket(eerste.receptId);
    };
    if($('#ipOk')&&compleet) $('#ipOk').onclick=()=>{
      const naar=klantNaam(o.klantId);
      o.lots={};
      o.regels.forEach(rg=>{
        (keuze[rg.receptId]||[]).forEach(g=>{
          const v=voorraadGereed().find(x=>x.receptId===rg.receptId&&x.lot===g.lot);
          muteer({soort:'verkocht',receptId:rg.receptId,lot:g.lot,tht:v?v.tht:null,
            aantal:-g.aantal,reden:'order '+o.nummer+' · '+naar});
          o.lots[rg.receptId]=(o.lots[rg.receptId]||[]).concat([{lot:g.lot,aantal:g.aantal}]);
        });
      });
      o.verpakking=[];
      Object.entries(dozen).forEach(([prod,a])=>{
        if(a>0){ gBoek(prod,-a,'st','Order '+o.nummer+' · '+naar); o.verpakking.push({product:prod,aantal:a}) }
      });
      o.status='ingepakt'; o.ingepakt=iso(new Date());
      const nd=Object.values(dozen).reduce((n,a)=>n+a,0);
      bewaarNu(); render();
      klaarSheet('Ingepakt en afgeboekt voor '+naar+(nd?' · '+nd+(nd===1?' doosje':' doosjes'):'')+'.');
    };
  };
  teken();
}

function sheetOrder(id){
  const o=(S.orders||[]).find(x=>x.id===id); if(!o) return;
  const d=dekking(o), tekort=d.filter(x=>x.tekort>0);
  const st=OSTATUS[o.status]||OSTATUS.nieuw;
  sheet(klantNaam(o.klantId),
    `<div class="vrkop"><div class="vrgetal">${orderAantal(o)}<em>bonbons</em></div>
       <div class="vrmeta">${o.nummer}<br>${o.leverdatum?'leveren '+kort(new Date(o.leverdatum)):'geen datum'}<br>${st.n}</div></div>
     ${o.lots&&Object.keys(o.lots).length?`<div class="blokkop"><span class="eyebrow">Meegegeven</span>
       <span class="tel">één stap vooruit</span></div>
       <div class="paneel" style="margin-bottom:20px">${Object.entries(o.lots).map(([rid,ls])=>
         ls.map(x=>`<div class="item"><span class="t">${x.aantal}</span>
           <span class="b">${esc(smaakNaam(rid))}<em>lot ${esc(x.lot)}</em></span></div>`).join('')).join('')}</div>`:''}
     <div class="blokkop"><span class="eyebrow">Dekking</span></div>
     <div class="paneel">${d.map(x=>`<div class="item ${x.tekort?'let':''}">
       <span class="t">${x.nodig}</span>
       <span class="b">${esc(smaakNaam(x.receptId))}
         <em>${x.tekort?'tekort van '+x.tekort+' — '+x.beschikbaar+' beschikbaar'
              :'kan geleverd worden · '+x.beschikbaar+' beschikbaar'}${
              x.beloofd?' · '+x.beloofd+' aan andere orders':''}</em></span></div>`).join('')}</div>
     ${tekort.length?`<div class="melding amber" style="margin-top:16px">${svg(I.alarm,'2')}
       <span>Je komt ${tekort.reduce((n,x)=>n+x.tekort,0)} bonbons tekort.
         Maak een batch aan voor ${tekort.map(x=>esc(smaakNaam(x.receptId))).join(' en ')}.</span></div>`:''}`,
    `${o.status==='nieuw'?`<button class="prim" style="margin-top:0" id="orKlaar"
        ${tekort.length?'disabled':''}>Inpakken en afboeken</button>`:''}
     ${o.status==='ingepakt'?`<button class="prim" style="margin-top:0" id="orLever">Als geleverd markeren</button>`:''}
     ${o.status!=='nieuw'?`<button class="sec" data-factuur="${o.id}">${svg(I.doc)}Factuur${
       o.betaald?' · betaald':''}</button>`:''}
     <button class="sec" id="orVerw" style="color:var(--rood)">Order verwijderen</button>`);
  if($('#orLever')) $('#orLever').onclick=()=>{
    o.status='geleverd'; o.geleverd=iso(new Date());
    bewaarNu(); render(); klaarSheet('Order '+o.nummer+' geleverd.');
  };
  if($('#orKlaar')) $('#orKlaar').onclick=()=>sheetInpakken(o.id);
  $('#orVerw').onclick=()=>{
    if(!confirm('Order '+o.nummer+' verwijderen?')) return;
    S.orders=S.orders.filter(x=>x.id!==o.id); bewaarNu(); render(); dicht();
  };
}

function voorraadHTML(){
  const gereed=voorraadGereed();
  const totaal=gereed.reduce((n,v)=>n+v.aantal,0);
  const bijna=gereed.filter(v=>{const d=dagenTotTHT(v.tht);return d!==null&&d<=14});
  const over=gereed.filter(v=>{const d=dagenTotTHT(v.tht);return d!==null&&d<0});
  const alles=grondVoorraad();
  const w2=voorraadWaarde();
  const laagNu=alles.filter(grondOnder);

  let h='';

  /* ── wat aandacht vraagt ── */
  if(over.length) h+=`<div class="melding rood" style="margin-bottom:12px">${svg(I.alarm,'2')}
    <span>${over.length===1?'Eén partij is':over.length+' partijen zijn'} over de THT.
      Boek die af als derving.</span></div>`;
  else if(bijna.length) h+=`<div class="melding amber" style="margin-bottom:12px">${svg(I.alarm,'2')}
    <span>${bijna.length===1?'Eén partij loopt':bijna.length+' partijen lopen'} binnen twee weken af.</span></div>`;
  if(laagNu.length) h+=`<div class="melding amber" style="margin-bottom:12px">${svg(I.alarm,'2')}
    <span>${laagNu.map(v=>esc(v.product)).slice(0,3).join(', ')}${laagNu.length>3?' en meer':''}
      ${laagNu.length===1?'is':'zijn'} bijna op.</span></div>`;

  /* ── overzicht in tegels ── */
  const grondT=alles.filter(v=>artSoort(v.product)==='ingredient');
  const verpT=alles.filter(v=>artSoort(v.product)==='verpakking');
  const teBestellenT=alles.filter(v=>grondOnder(v)||v.saldo<=0).length;
  const vlT=verlopenPartijen(), vlOverT=vlT.filter(x=>x.dagen<0).length;
  const tegel=(attr,icoon,kop,waarde,sub,klas)=>`<button class="tegel" ${attr}>
    <span class="tk">${svg(icoon)}${kop}</span>
    <span class="tw ${waarde==='—'?'nul':''}">${waarde}</span>
    <span class="ts ${klas||''}">${sub}</span></button>`;

  h+=`<div class="tegels">
    ${tegel('data-naar="productie"',I.doos,'Gereed',totaal||'—',
      gereed.length?gereed.length+(gereed.length===1?' partij':' partijen'):'nog geen product')}
    ${tegel('data-waardering',I.euro,'Waarde',w2.bekend?euro(w2.bekend):'—',
      w2.onbekend?w2.onbekend+' zonder prijs':'aan grondstoffen',w2.onbekend?'let':'')}
    ${tegel('data-bestel',I.vracht,'Bestellen',teBestellenT||'—',
      teBestellenT?'onder de drempel':'niets nodig',teBestellenT?'let':'')}
    ${tegel('data-tht',I.klok,'Houdbaarheid',vlT.length||'—',
      vlOverT?vlOverT+' over datum':(vlT.length?'binnen twee weken':'niets loopt af'),
      vlOverT?'fout':vlT.length?'let':'')}
  </div>`;

  /* een lege categorie wordt één rij die je verder helpt, geen groot leeg vlak */
  const leegRij=(tekst,sub,attr)=>`<div class="paneel"><button class="arij" ${attr||''}>
    <span class="naam">${tekst}<small>${sub}</small></span>
    ${attr?`<span class="pijl">${svg(I.pijl,'2')}</span>`:''}</button></div>`;

  /* ── gereed product ── */
  h+=`<div class="blokkop" style="margin-top:24px"><span class="eyebrow">Gereed product</span>
      <span class="tel">${gereed.length?totaal+' bonbons':''}</span></div>`;
  h+=gereed.length?`<div class="paneel">${gereed.map(v=>{
    const d=dagenTotTHT(v.tht), st=d===null?'':(d<0?'rood':d<=14?'amber':'');
    return `<button class="arij" data-vr="${v.receptId}|${v.lot}">
      <span class="ivak ${st||'groen'}">${svg(I.vorm)}</span>
      <span class="naam">${esc(smaakNaam(v.receptId))}<small>lot ${esc(v.lot)}${
        v.tht?' · THT '+kort(new Date(v.tht))+(d<0?' — verlopen':d<=14?' — nog '+d+' dagen':''):''}</small></span>
      <span class="waarde gevuld">${v.aantal}</span>
      <span class="pijl">${svg(I.pijl,'2')}</span></button>`}).join('')}</div>`
   :leegRij('Nog geen gereed product','komt hier zodra je een batch afrondt','data-naar="productie"');

  const rij=v=>{
    const d=grondDrempel(v.product), laag=grondOnder(v), leeg=v.saldo<=0;
    const lots=Object.keys(v.lots).filter(k=>v.lots[k]>0);
    const f=fefoLot(v.product), fd=f?dagenTotTHT(f.tht):null;
    const onder=f
      ? `eerst lot ${esc(f.lot)}${fd!==null?(fd<0?' — verlopen':' · nog '+fd+' dagen'):''}`
      : (lots.length?lots.length+(lots.length===1?' lot':' lots')+' · '+esc(lots.slice(0,2).join(', '))+(lots.length>2?'…':'')
                   :'geen lot bekend');
    const soort=artSoort(v.product);
    const ico=soort==='verpakking'?I.doos:soort==='hulp'?I.spark:soort==='half'?I.vorm:I.doos;
    return `<button class="arij" data-gs="${esc(v.product)}">
      <span class="ivak ${leeg?'rood':laag?'amber':''}">${svg(ico)}</span>
      <span class="naam">${esc(v.product)}<small>${onder}${d?' · drempel '+toonHoeveel(d,v.basis):''}</small></span>
      <span class="waarde gevuld">${toonHoeveel(v.saldo,v.basis)}</span>
      <span class="pijl">${svg(I.pijl,'2')}</span></button>`;
  };

  /* ── grondstoffen ── */
  const grond=alles.filter(v=>artSoort(v.product)==='ingredient');
  const opRaken=grond.filter(grondOnder);
  h+=`<div class="blokkop" style="margin-top:24px"><span class="eyebrow">Grondstoffen</span>
      <span class="tel ${opRaken.length?'let':''}">${opRaken.length?opRaken.length+' bijna op'
        :(grond.length?grond.length+(grond.length===1?' product':' producten'):'')}</span></div>`;
  h+=grond.length?`<div class="paneel">${grond.map(rij).join('')}</div>`
   :leegRij('Nog geen grondstoffen','leg een levering vast bij Ontvangst','data-sheet="ontvangst"');

  /* ── halffabricaat ── */
  const half=alles.filter(v=>artSoort(v.product)==='half');
  if(half.length){
    const laagHf=half.filter(grondOnder);
    h+=`<div class="blokkop" style="margin-top:24px"><span class="eyebrow">Halffabricaat</span>
        <span class="tel ${laagHf.length?'let':''}">${laagHf.length?laagHf.length+' bijna op'
          :half.length+(half.length===1?' product':' producten')}</span></div>
      <div class="paneel">${half.map(rij).join('')}</div>`;
  }

  /* ── verpakking ── */
  const verp=alles.filter(v=>artSoort(v.product)==='verpakking');
  const laagV=verp.filter(grondOnder);
  h+=`<div class="blokkop" style="margin-top:24px"><span class="eyebrow">Verpakking</span>
      <span class="tel ${laagV.length?'let':''}">${laagV.length?laagV.length+' bijna op'
        :(verp.length?verp.length+(verp.length===1?' artikel':' artikelen'):'')}</span></div>`;
  if(verp.length){
    const maten=[...new Set(verp.map(v=>art(v.product).maat).filter(Boolean))].sort((a,b2)=>a-b2);
    const kleuren=[...new Set(verp.map(v=>art(v.product).kleur).filter(Boolean))];
    const los=verp.filter(v=>!art(v.product).maat||!art(v.product).kleur);
    if(maten.length&&kleuren.length){
      h+=`<div class="paneel" style="padding:4px 0"><div class="vraster">
        <div class="vrhoek"></div>
        ${maten.map(m=>`<div class="vrmaat">${m}<small>st</small></div>`).join('')}
        ${kleuren.map(k=>`<div class="vrkleur">${esc(k)}</div>
          ${maten.map(m=>{
            const v=verp.find(x=>art(x.product).maat===m&&art(x.product).kleur===k);
            if(!v) return `<div class="vrcel leeg">—</div>`;
            const st=grondOnder(v)?(v.saldo<=0?'rood':'amber'):'';
            return `<button class="vrcel ${st}" data-gs="${esc(v.product)}">${getal(v.saldo)}</button>`;
          }).join('')}`).join('')}
      </div></div>`;
    }
    if(los.length) h+=`<div class="paneel" style="margin-top:${maten.length&&kleuren.length?'10px':'0'}">${
      los.map(rij).join('')}</div>`;
  } else {
    h+=leegRij('Nog geen verpakking','maak je doosjes in één keer aan','data-verpnieuw');
  }

  /* ── beheer ── */
  const teBestellen=alles.filter(v=>grondOnder(v)||v.saldo<=0).length;
  const vl=verlopenPartijen(), vlOver=vl.filter(x=>x.dagen<0).length;
  const brij=(attr,icoon,label,waarde,let2)=>`<button class="beheerrij" ${attr}>
    ${svg(icoon)}<span class="l">${label}</span>
    ${waarde?`<span class="w ${let2?'let':''}">${waarde}</span>`:''}
    <span class="p">${svg(I.pijl,'2')}</span></button>`;

  h+=`<div class="blokkop" style="margin-top:26px"><span class="eyebrow">Beheer</span></div>
    <div class="paneel">
      ${brij('data-sheet="ontvangst"',I.plus,'Ontvangst vastleggen','')}
      ${brij('data-verpnieuw',I.plus,'Verpakking toevoegen','')}
      ${brij('data-tht',I.klok,'Houdbaarheid',
        vl.length?(vlOver?vlOver+' over datum':vl.length+' binnenkort'):'niets loopt af',!!vlOver)}
      ${brij('data-boodschap',I.vracht,'Boodschappenlijst',(()=>{
        const n=(S.boodschappen||[]).length+alles.filter(v=>grondOnder(v)||v.saldo<=0)
          .filter(v=>!(S.boodschappen||[]).some(x=>gKey(x.product)===gKey(v.product))).length;
        return n?n+' te halen':'niets nodig'})(),(()=>{
        const n=(S.boodschappen||[]).length+teBestellen; return !!n})())}
      ${brij('data-telronde',I.vink,'Telronde','')}
      ${brij('data-waardering',I.doc,'Voorraadwaardering',w2.bekend?euro(w2.bekend):'geen prijzen')}
      ${brij('data-levertijd',I.vracht,'Levertijden',
        Object.keys(S.levertijden||{}).length?Object.keys(S.levertijden).length+' ingevuld':'niet ingevuld')}
      ${brij('data-vmut',I.ververs,'Alle mutaties',(S.mutaties||[]).length||'geen')}
    </div>`;
  return h;
}

/* ---------- branche kiezen en het sjabloon toepassen ----------
   Toepassen voegt alleen toe wat je nog niet hebt. Wat je zelf hebt ingesteld
   blijft altijd staan; een sjabloon is een startpunt, geen voorschrift. */
function pasSjabloonToe(key){
  const t=BRANCHES[key]; if(!t) return 0;
  let n=0;
  (t.werkplan||[]).forEach(x=>{if(!S.werkplan.includes(x)){S.werkplan.push(x);n++}});
  (t.activiteiten||[]).forEach(x=>{if(!S.activiteiten.includes(x)){S.activiteiten.push(x);n++}});
  (t.zones||[]).forEach(x=>{if(!S.zones.includes(x)){S.zones.push(x);n++}});
  (t.meet||[]).forEach(m=>{
    if(S.meetpunten.some(x=>x.naam===m.t)) return;
    const mp={id:uid(),naam:m.t,min:m.min,max:m.max,eenheid:m.e||'°C'};
    S.meetpunten.push(mp);
    if(!heeftCheck(m.t)) S.checks.push({id:uid(),tekst:m.t,soort:'meting',mpId:mp.id,groep:'Temperatuur en opslag'});
    n++;
  });
  return n;
}

/* ---------- verbruik van grondstoffen bij het afronden ----------
   De brug bestaat al: per ingrediënt koos je een lotnummer, en dat lot hoort
   bij een product uit je voorraad. Zijn er meerdere lots gekozen, dan wordt het
   verbruik daarover verdeeld. Zonder lot valt de app terug op de productnaam. */
function verbruikVanBatch(b){
  const uit=[];
  bIngredienten(b).forEach(i=>{
    const lots=lotLijst(b,i.naam);
    if(lots.length){
      const deel=i.hoeveel/lots.length;
      lots.forEach(l=>{
        const p=(S.lots||[]).find(x=>x.lot===l);
        uit.push({product:p?p.product:i.naam,lot:l,gram:deel});
      });
    } else {
      const bekend=grondVoorraad().find(v=>gKey(v.product)===gKey(i.naam));
      uit.push({product:bekend?bekend.product:i.naam,lot:'',gram:i.hoeveel,onbekend:!bekend});
    }
  });
  return uit;
}
function boekVerbruik(b){
  if(b.verbruikGeboekt) return 0;
  const lijst=verbruikVanBatch(b);
  lijst.forEach(v=>{ if(v.gram>0) gBoek(v.product,-v.gram,'g','Verbruik batch '+b.code,v.lot) });
  b.verbruikGeboekt=true;
  return lijst.length;
}

/* ---------- verpakking in één keer aanmaken ----------
   Twee maten in zes kleuren zijn twaalf artikelen. Die typ je niet los;
   je geeft de maten en de kleuren, en de app maakt de combinaties. */
const V={maten:'',kleuren:'',naam:'Doosje',start:0,drempel:0};
/* ================= dekking, bestellen, tellen en waarde =================
   Alles hier leest de voorraad die je al hebt; er wordt niets bijgehouden
   wat de app niet toch al weet. */

/* wat heb je nodig voor een set batchregels? matcht op productnaam */
function nodigVoor(regels,receptenBron){
  const map={};
  (regels||[]).forEach(rg=>{
    const r=(receptenBron&&receptenBron[rg.receptId])||recept(rg.receptId);
    if(!r) return;
    (r.onderdelen||[]).forEach(o=>{
      verdeel(o,(parseFloat(o.gram)||0)*rg.aantal).forEach(x=>{
        if(!x.naam) return;
        map[x.naam]=(map[x.naam]||0)+x.gram;
      });
    });
  });
  return Object.keys(map).map(n=>({naam:n,gram:map[n]}));
}
/* per ingrediënt: hoeveel ligt er, en kom je tekort? */
function dekkingGrond(regels,receptenBron){
  const vv=grondVoorraad();
  return nodigVoor(regels,receptenBron).map(i=>{
    const v=vv.find(x=>gKey(x.product)===gKey(i.naam));
    const op=v?v.saldo:0;
    return {naam:i.naam,nodig:i.gram,op,onbekend:!v,tekort:Math.max(0,i.gram-op)};
  }).sort((a,b2)=>b2.tekort-a.tekort);
}
function dekkingBlok(regels,receptenBron){
  const d=dekkingGrond(regels,receptenBron);
  if(!d.length) return '';
  const kort2=d.filter(x=>x.tekort>0), onbek=d.filter(x=>x.onbekend);
  const kop=kort2.length
    ? `<div class="melding ${onbek.length===kort2.length?'amber':'rood'}" style="margin-bottom:12px">${svg(I.alarm,'2')}
        <span>${kort2.length===1?'Eén grondstof':kort2.length+' grondstoffen'} ${
          onbek.length===kort2.length?'staan nog niet in je voorraad':'zijn niet genoeg'}.</span></div>`
    : `<div class="melding groen" style="margin-bottom:12px">${svg(I.vink,'2')}
        <span>Je hebt alles in huis voor deze batch.</span></div>`;
  return `${kop}<div class="blokkop"><span class="eyebrow">Dekking grondstoffen</span></div>
    <div class="paneel">${d.map(x=>`<div class="arij" style="cursor:default">
      <span class="naam">${esc(x.naam)}<small>${x.onbekend?'niet in voorraad'
        :'nodig '+toonHoeveel(x.nodig,'g')+' · aanwezig '+toonHoeveel(x.op,'g')}</small></span>
      ${x.tekort?`<span class="stip ${x.onbekend?'amber':'rood'}"></span>`:''}
      <span class="waarde gevuld">${x.tekort?'−'+toonHoeveel(x.tekort,'g'):'ok'}</span>
    </div>`).join('')}</div>`;
}

/* ---------- eerst gebruiken: het lot dat het snelst verloopt ---------- */
function fefoLot(product){
  const v=grondVoorraad().find(x=>gKey(x.product)===gKey(product));
  if(!v) return null;
  const kandidaten=Object.keys(v.lots).filter(k=>v.lots[k]>0)
    .map(l=>{const p=(S.lots||[]).find(x=>x.lot===l);return {lot:l,rest:v.lots[l],tht:p?p.tht:''}})
    .filter(x=>x.tht);
  if(!kandidaten.length) return null;
  kandidaten.sort((a,b2)=>a.tht.localeCompare(b2.tht));
  return kandidaten[0];
}

/* ---------- inkoopprijs en voorraadwaarde ---------- */
const gPrijs=p=>{const a=art(p);return typeof a.prijs==='number'?a.prijs:null};
function waardeVan(v){
  const pr=gPrijs(v.product);
  if(pr===null) return null;
  /* prijs is per basiseenheid: per gram, per ml of per stuk */
  return v.saldo*pr;
}
function voorraadWaarde(){
  let bekend=0, onbekend=0;
  grondVoorraad().forEach(v=>{const w=waardeVan(v); if(w===null)onbekend++; else bekend+=w});
  return {bekend,onbekend};
}

/* ---------- bestellijst: alles onder de drempel, per leverancier ---------- */
function leverancierVan(product){
  const l=(S.lots||[]).filter(x=>gKey(x.product)===gKey(product)&&x.leverancier)
    .sort((a,b2)=>String(b2.ontvangen||'').localeCompare(String(a.ontvangen||'')));
  return l.length?l[0].leverancier:'';
}
/* ================= boodschappenlijst =================
   Wat je tekortkomt voor een batch komt hier terecht, verrekend met wat er al
   ligt en met je drempel. Zo haal je genoeg, maar niet te veel. */
function boodschapZet(product,gram,reden){
  S.boodschappen=S.boodschappen||[];
  const k=gKey(product);
  const best=S.boodschappen.find(x=>gKey(x.product)===k);
  if(best){
    /* het hoogste van beide: één batch kan meer vragen dan de drempel */
    if(gram>best.gram){ best.gram=gram; best.reden=reden }
    return false;
  }
  S.boodschappen.push({id:uid(),product:product,gram:gram,reden:reden||'',datum:vandaag()});
  return true;
}
/* wat je écht moet halen: het tekort, opgehoogd tot je drempel */
function nodigVoorBoodschap(product,tekortGram){
  const v=grondVoorraad().find(x=>gKey(x.product)===gKey(product));
  const saldo=v?v.saldo:0;
  const drempel=grondDrempel(product);
  /* na deze batch wil je nog steeds boven je drempel zitten */
  const gewenst=Math.max(tekortGram, (drempel?drempel+tekortGram:tekortGram));
  return Math.max(0,Math.round(gewenst));
}
function boodschapUitBatch(regels,receptenBron){
  const d=dekkingGrond(regels,receptenBron).filter(x=>x.tekort>0);
  let n=0;
  d.forEach(x=>{ if(boodschapZet(x.naam,nodigVoorBoodschap(x.naam,x.tekort),'batch')) n++; });
  return {toegevoegd:n,totaal:d.length};
}

/* ================= planning =================
   Een geplande batch is nog geen batch: het is een voornemen met een datum.
   Op de dag zelf maak je er met één tik een echte batch van. De app rekent
   zelf uit wanneer je boodschappen moet doen, op basis van je levertijden. */

/* wat je op een dag kunt doen, elk met een eigen kleur in de strip */
const DAGSOORT={
  boodschappen:{n:'Boodschappen',kleur:'var(--amber)',ico:'vracht'},
  voorbereiden:{n:'Voorbereiden',kleur:'#7c8fa8',ico:'spark'},
  half:{n:'Halffabricaat',kleur:'#9a9aa4',ico:'vorm'},
  productie:{n:'Productiedag',kleur:'var(--ink)',ico:'vorm'},
  live:{n:'Live',kleur:'#c0392b',ico:'spark'},
  overig:{n:'Overig',kleur:'#5b7c6b',ico:'klembord'},
  verzenden:{n:'Verzenden',kleur:'#6b5b95',ico:'vracht'}
};
/* losse taken staan los van een batch: een live, een afspraak, een klus */
const TAAKSOORTEN=[
  {k:'live',n:'Live gaan'},
  {k:'boodschappen',n:'Boodschappen'},
  {k:'voorbereiden',n:'Voorbereiden'},
  {k:'half',n:'Halffabricaat'},
  {k:'overig',n:'Iets anders'}
];
const takenOp=d=>(S.taken||[]).filter(t=>t.datum===d);

/* ---------- verzendregel ----------
   Besteld voor 14:00 op een werkdag gaat dezelfde dag de deur uit. Daarna,
   of in het weekend, schuift het door naar de eerstvolgende werkdag. */
const verzendgrens=()=>typeof S.verzendgrens==='number'?S.verzendgrens:14;
const isWeekend=d=>{const n=new Date(d).getDay();return n===0||n===6};
function volgendeWerkdag(d){
  let x=d;
  do{ x=datumPlus(x,1) }while(isWeekend(x));
  return x;
}
function verzenddagVan(o){
  if(o.afhaal) return null;
  if(o.verzonden) return null;
  if(o.verzenddag) return o.verzenddag;      /* handmatig gezet wint */
  const d=String(o.datum||'').slice(0,10);
  if(!d) return null;
  const uur=(()=>{
    const t=o.besteldOm||o.tijd||'';
    const m=String(t).match(/^(\d{1,2})[:.](\d{2})/);
    return m?parseInt(m[1],10):null;
  })();
  /* geen tijd bekend: dan gewoon dezelfde dag, of maandag als het weekend is */
  if(isWeekend(d)) return volgendeWerkdag(d);
  if(uur===null||uur<verzendgrens()) return d;
  return volgendeWerkdag(d);
}
/* orders uit Shopify: die brengen hun eigen besteltijd mee */
function shopVerzendTaken(){
  return macOrders().filter(x=>!x.afhaal&&!x.verzonden&&!x.label)
    .map(x=>{
      /* Shopify levert een tijdstempel; daar rekenen we de verzenddag uit */
      const stempel=x.besteld||x.created_at||x.datum||'';
      const dag=String(stempel).slice(0,10);
      if(!dag) return null;
      const m=String(stempel).match(/T(\d{2}):(\d{2})/);
      const uur=m?parseInt(m[1],10):null;
      let datum;
      if(isWeekend(dag)) datum=volgendeWerkdag(dag);
      else if(uur===null||uur<verzendgrens()) datum=dag;
      else datum=volgendeWerkdag(dag);
      return {shop:x,datum,nummer:x.nummer,naam:x.naam||x.klant||('Order '+x.nummer)};
    }).filter(Boolean);
}

/* alle orders die nog verzonden moeten worden, met hun verzenddag */
function verzendTaken(){
  const eigen=(S.orders||[]).filter(o=>o.status!=='vervallen'&&!o.verzonden&&!o.afhaal)
    .map(o=>({o,datum:verzenddagVan(o),naam:klantNaam(o.klantId),nummer:o.nummer}))
    .filter(x=>x.datum);
  return eigen.concat(shopVerzendTaken());
}
/* welke stap uit je werkplan hoort bij welke soort */
function stapSoort(naam){
  const t=String(naam||'').toLowerCase();
  if(/gelei|ganache|karamel|prali|vulling|crunch/.test(t)) return 'half';
  return 'voorbereiden';
}

/* Een planning zonder id was niet te verwijderen: het kruisje filterde dan
   op "undefined" en haalde er niets uit, terwijl je wel een bevestiging zag.
   Twee planningen met hetzelfde id gingen samen weg. Allebei nu afgevangen. */
function migreerPlanning(){
  const gezien=new Set(); let hersteld=0;
  (S.planning||[]).forEach(p=>{
    if(!p||typeof p!=='object') return;
    if(!p.id||gezien.has(p.id)){ p.id=uid(); hersteld++; }
    gezien.add(p.id);
  });
  return hersteld;
}

/* dezelfde dag, dezelfde chocolade, dezelfde smaken en aantallen: dubbel */
const planKenmerk=p=>[p.datum,p.chocolade,
  (p.regels||[]).map(r=>r.receptId+':'+r.aantal).sort().join(',')].join('|');
function planDubbel(){
  const gezien={}, extra=[];
  (S.planning||[]).forEach(p=>{
    const k=planKenmerk(p);
    if(gezien[k]) extra.push(p); else gezien[k]=true;
  });
  return extra;
}

const planLijst=()=>(S.planning||[]).slice()
  .sort((a,b2)=>String(a.datum).localeCompare(String(b2.datum)));

/* alle losse dagtaken van een geplande batch, inclusief de boodschapdag */
function planTaken(p){
  const uit=[];
  const bd=boodschapDatum(p);
  if(bd) uit.push({datum:bd,soort:'boodschappen',tekst:'Boodschappen doen',plan:p});
  (p.voorbereiding||[]).forEach(v=>{
    if(v.datum) uit.push({datum:v.datum,soort:stapSoort(v.stap),tekst:v.stap,plan:p});
  });
  uit.push({datum:p.datum,soort:'productie',
    tekst:p.regels.map(r=>smaakNaam(r.receptId)).join(', '),plan:p});
  return uit;
}
const allePlanTaken=()=>planLijst().flatMap(planTaken)
  .concat((S.taken||[]).map(t=>({datum:t.datum,soort:t.soort,tekst:t.tekst,los:t,tijd:t.tijd||''})))
  .concat(verzendTaken().map(v=>({datum:v.datum,soort:'verzenden',
    tekst:v.naam,verzend:v,tijd:''})));

     <div class="info">
       <div class="inforij"><span class="k">Nu besteld</span>
         <span class="v">${(()=>{const nu7=new Date();
           const d=iso(nu7);
           const vd=isWeekend(d)?volgendeWerkdag(d):(nu7.getHours()<verzendgrens()?d:volgendeWerkdag(d));
           return 'verzenden op '+kort(new Date(vd))})()}</span></div>

  $('#vgOk').onclick=()=>{dicht();render()};

           <input class="inp" id="tkTd" type="time" value="${T.tijd}"></div></div>`,
      `<button class="prim" style="margin-top:0" id="tkOk">Inplannen</button>`);
    chips('#tkS',false,()=>{
      T.soort=chipV('#tkS');
      T.tekst=$('#tkT').value; T.datum=$('#tkD').value; T.tijd=$('#tkTd').value;

    });
    $('#tkOk').onclick=()=>{
      const tekst=$('#tkT').value.trim()
        || (TAAKSOORTEN.find(x=>x.k===chipV('#tkS'))||{}).n || 'Taak';

      S.taken.push({id:uid(),datum:$('#tkD').value||vandaag(),soort:chipV('#tkS')||'overig',
        tekst,tijd:$('#tkTd').value||''});
      bewaarNu(); dicht(); render(); toast('Ingepland.');
    };
  };
  teken();
}
const planOpDatum=d=>(S.planning||[]).filter(x=>x.datum===d);

/* de langste levertijd van wat je voor deze batch nodig hebt */
function levertijdVoor(regels){
  const d=dekkingGrond(regels).filter(x=>x.tekort>0);
  if(!d.length) return 0;
  let max=0;
  d.forEach(x=>{
    const lev=leverancierVan(x.naam);
    max=Math.max(max, levertijdVan(lev)||3);
  });
  return max;
}
const datumPlus=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return iso(x)};
const dagenTussen=(a,b2)=>Math.round((new Date(b2)-new Date(a))/86400000);

/* wanneer moet je boodschappen doen voor deze geplande batch? */
function boodschapDatum(p){
  const lt=p.levertijd||0;
  if(!lt) return null;
  return datumPlus(p.datum,-(lt+1));   /* een dag marge */
}

function sheetPlanBatch(vooraf){
  const P={choc:null,mallen:{},datum:vooraf||datumPlus(vandaag(),1)};
  const stap1=()=>{
    sheet('Wanneer wil je maken?',
      `<p class="hint">Kies de dag waarop je deze batch wil draaien. De app rekent uit wanneer
        je boodschappen moet doen om op tijd alles in huis te hebben.</p>
       <div class="veld"><label>Productiedag</label>
         <input class="inp" id="pbD" type="date" value="${P.datum}" min="${vandaag()}"></div>
       <div class="veld"><label>Snel kiezen</label>
         <div class="keuzeraster">
           ${[[1,'Morgen'],[2,'Overmorgen'],[7,'Volgende week']].map(([n,l])=>
             `<button class="chip" data-snel="${n}">${l}</button>`).join('')}
         </div></div>`,
      `<button class="prim" style="margin-top:0" id="pb1">Volgende</button>`,'Stap 1 van 4');
    $$('[data-snel]').forEach(b=>b.onclick=()=>{
      P.datum=datumPlus(vandaag(),parseInt(b.dataset.snel));
      $('#pbD').value=P.datum;
    });
    $('#pb1').onclick=()=>{
      P.datum=$('#pbD').value||P.datum;
      if(P.datum<vandaag()) return toast('Kies een dag vanaf vandaag.');
      stap2();
    };
  };

  const stap2=()=>{
    sheet('Welke '+(branche().basis||'basissoort').toLowerCase()+'?',
      `<div class="choc" id="pbC">${soorten().map(c=>{
        const n=S.recepten.filter(r=>r.chocolade===c.key).length;
        return `<button class="chocknop ${P.choc===c.key?'aan':''}" data-c="${c.key}">
          <span class="schijf ${c.key}"></span>
          <span class="ct"><span class="cn">${c.naam}</span>
            <span class="cs">${n?n+(n===1?' smaak':' smaken'):'nog geen smaken'}</span></span>
          <span class="pijl">${svg(I.pijl,'2')}</span></button>`}).join('')}</div>`,
      `<button class="sec" id="pb2T">Terug</button>`,'Stap 2 van 4');
    $$('#pbC [data-c]').forEach(b=>b.onclick=()=>{P.choc=b.dataset.c;stap3()});
    $('#pb2T').onclick=stap1;
  };

  const stap3=()=>{
    const lijst=S.recepten.filter(r=>r.chocolade===P.choc);
    const regels=Object.keys(P.mallen).filter(k=>P.mallen[k]>0)
      .map(k=>({receptId:k,mallen:P.mallen[k],aantal:P.mallen[k]*S.malGrootte}));
    const tot=regels.reduce((n,r)=>n+r.aantal,0);
    const lt=regels.length?levertijdVoor(regels):0;
    const bd=lt?datumPlus(P.datum,-(lt+1)):null;

    sheet('Hoeveel mallen?',
      `<p class="hint">Kies per smaak hoeveel mallen je draait.</p>
       ${lijst.length?lijst.map(r=>`<div class="orij">
         <span class="on">${esc(r.naam)}<em>${hintTekst(r,P.mallen[r.id]||0)}</em></span>
         <div class="ostep"><button class="stepbtn klein" data-pm="${r.id}">${svg(I.min)}</button>
           <span class="oa ${P.mallen[r.id]?'aan':''}">${P.mallen[r.id]||0}</span>
           <button class="stepbtn klein" data-pp="${r.id}">${svg(I.plus)}</button></div></div>`).join('')
        :'<div class="geen">Nog geen smaken met deze basissoort.</div>'}
       ${tot?`<div class="totaalregel" style="margin-top:18px"><span class="l">Totaal</span>
         <span class="w">${tot} bonbons</span></div>
         <div class="info" style="margin-top:16px">
           <div class="inforij"><span class="k">Productiedag</span>
             <span class="v">${kort(new Date(P.datum))}</span></div>
           ${bd?`<div class="inforij"><span class="k">Boodschappen doen</span>
             <span class="v">${kort(new Date(bd))}</span></div>
             <div class="inforij"><span class="k">Langste levertijd</span>
             <span class="v">${lt} dagen</span></div>`
            :`<div class="inforij"><span class="k">Grondstoffen</span>
              <span class="v">alles in huis</span></div>`}
         </div>`:''}`,
      `<button class="prim" style="margin-top:0" id="pb3" ${tot?'':'disabled'}>
         ${tot?'Volgende':'Kies eerst mallen'}</button>
       <button class="sec" id="pb3T">Terug</button>`,'Stap 3 van 4');

    $$('[data-pp]').forEach(b=>b.onclick=()=>{P.mallen[b.dataset.pp]=(P.mallen[b.dataset.pp]||0)+1;stap3()});
    $$('[data-pm]').forEach(b=>b.onclick=()=>{P.mallen[b.dataset.pm]=Math.max(0,(P.mallen[b.dataset.pm]||0)-1);stap3()});
    $('#pb3T').onclick=stap2;
    if($('#pb3')) $('#pb3').onclick=()=>{P.regels=regels;P.lt=lt;stap4()};
  };

  /* voorbereidingsstappen op een dag zetten */
  const stap4=()=>{
    const stappen=(S.werkplan||[]).slice(0,4);
    P.voor=P.voor||{};
    /* eerste keer: een redelijk voorstel */
    if(!P.voorGezet){
      stappen.forEach((st,i)=>{
        P.voor[st]= i===0 ? datumPlus(P.datum,-1) : '';
      });
      P.voorGezet=true;
    }
    const opties=[0,-1,-2,-3];
    sheet('Voorbereiden',
      `<p class="hint">Doe je iets al een dag eerder? Zet het hier op een dag, dan zie je het
        terug in je planning met een eigen kleur. Laat leeg wat je op de dag zelf doet.</p>
       ${stappen.map((st,si)=>{
         const soort=stapSoort(st);
         return `<div class="veld">
           <label style="display:flex;align-items:center;gap:8px">
             <i style="width:9px;height:4px;border-radius:99px;display:block;background:${
               DAGSOORT[soort].kleur}"></i>${esc(st)}</label>
           <div class="keuzeraster" data-vst="${si}">
             ${opties.map(o=>{
               const d=datumPlus(P.datum,o);
               const l=o===0?'Op de dag':o===-1?'Dag ervoor':Math.abs(o)+' dagen ervoor';
               const aan=(o===0? !P.voor[st] : P.voor[st]===d);
               return `<button class="chip ${aan?'aan':''}" data-vd="${o===0?'':d}">${l}</button>`}).join('')}
           </div></div>`}).join('')}`,
      `<button class="prim" style="margin-top:0" id="pb4">Inplannen op ${kort(new Date(P.datum))}</button>
       <button class="sec" id="pb4T">Terug</button>`,'Stap 4 van 4');

    $$('[data-vst]').forEach(rij=>{
      const st=stappen[parseInt(rij.dataset.vst,10)];
      if(st===undefined) return;
      rij.querySelectorAll('[data-vd]').forEach(b=>b.onclick=()=>{
        rij.querySelectorAll('[data-vd]').forEach(x=>x.classList.remove('aan'));
        b.classList.add('aan');
        P.voor[st]=b.dataset.vd||'';
      });
    });
    $('#pb4T').onclick=stap3;
    $('#pb4').onclick=()=>{
      const knop=$('#pb4');
      /* twee keer tikken gaf twee planningen. Eén keer is genoeg. */
      if(knop.dataset.bezig) return;
      let regels2, voorbereiding;
      try{
        regels2=(P.regels&&P.regels.length)?P.regels
          :Object.keys(P.mallen||{}).filter(k=>P.mallen[k]>0)
            .map(k=>({receptId:k,mallen:P.mallen[k],aantal:P.mallen[k]*S.malGrootte}));
        voorbereiding=Object.keys(P.voor).filter(st=>P.voor[st])
          .map(st=>({stap:st,datum:P.voor[st]}));
      }catch(e){ return toast('Inplannen lukte niet. Probeer het nog eens.'); }
      if(!regels2||!regels2.length) return toast('Kies eerst hoeveel mallen je draait.');
      knop.dataset.bezig='1';
      S.planning=S.planning||[];
      S.planning.push({id:uid(),datum:P.datum,chocolade:P.choc,regels:regels2,
        levertijd:P.lt||0,voorbereiding,gemaakt:vandaag()});
      bewaarNu();
      /* de planning staat er nu. Gaat het tekenen daarna mis, dan is dat geen
         reden om je te laten denken dat je opnieuw moet inplannen. */
      try{
        dicht(); render();
        const bd2=P.lt?datumPlus(P.datum,-(P.lt+1)):null;
        toast('Ingepland op '+kort(new Date(P.datum))+(bd2?' \u00b7 boodschappen '+kort(new Date(bd2)):''));
      }catch(e){ toast('Ingepland op '+P.datum+'.'); }
    };
  };
  stap1();
}

/* van plan naar echte batch */
function planStart(id){
  const p=(S.planning||[]).find(x=>x.id===id); if(!p) return;
  const kopie={};
  p.regels.forEach(rg=>{const r=recept(rg.receptId); if(r) kopie[rg.receptId]=JSON.parse(JSON.stringify(r))});
  const b={id:uid(),code:nieuweCode(),chocolade:p.chocolade,
    regels:JSON.parse(JSON.stringify(p.regels)),gestart:nu(),startDatum:vandaag(),
    status:'bezig',dagen:[],lots:{},logs:[],resultaat:null,
    recepten:kopie,werkplan:S.werkplan.slice(),uitPlan:p.id};
  S.batches.push(b);
  S.planning=S.planning.filter(x=>x.id!==id);
  S.tab='productie';S.batchId=b.id;S.open=null;
  bewaarNu(); dicht(); render();
  toast('Batch '+b.code+' gestart.'); $('#scherm').scrollTop=0;
}

let plKies=null;   /* null = uit, anders een Set met gekozen planning-id's */

function sheetPlanning(){
  migreerPlanning();
  /* stond de planning al open, dan blijf je waar je was. Anders lijkt het
     na het weghalen van een rij alsof er niets is gebeurd. */
  const kopNu=document.querySelector('#sheet.open .sheetkop h2');
  const bodyNu=document.querySelector('#sheet.open .sheetbody');
  const scrollNu=(kopNu&&kopNu.textContent.trim()==='Planning'&&bodyNu)?bodyNu.scrollTop:0;
  /* de rijen verwijzen naar de planning zelf, niet naar een id. Zo blijft

  const plRegister=[];
  const lijst=planLijst();
  const dagen={};
  allePlanTaken().forEach(t=>{
    const d=(dagen[t.datum]=dagen[t.datum]||{batches:[],bood:[],voor:[]});

    else d.voor.push(t);
  });
  /* orders met leverdatum horen ook in je agenda */
  const ord={};
  (S.orders||[]).filter(o=>o.status==='nieuw'&&o.leverdatum).forEach(o=>{

  const datums=Object.keys(dagen).sort();

    const n=dagenTussen(vandaag(),d);
    if(n<0) return Math.abs(n)+' dagen geleden';

    if(n===1) return 'morgen';
    if(n<7) return 'over '+n+' dagen';
    return kort(new Date(d));
  };

  const strip=weekstripHTML(14);

  const aantalPlan=Object.keys(dagen).reduce((n,d)=>n+dagen[d].batches.length,0);
  const kiesbalk = plKies
    ? `<div class="kiesbalk"><span class="kt">${plKies.size
        ?plKies.size+(plKies.size===1?' gekozen':' gekozen')

         ?'Er staat 1 dubbele planning in je agenda.'
         :'Er staan '+dub.length+' dubbele planningen in je agenda.'}</span>
       <button class="miniknop" id="plOpruim" style="height:38px;padding:0 14px">Opruimen</button></div>`
    : '';

  sheet('Planning',
    `${kiesbalk}${dubbelmelding}${strip}
     ${datums.length?datums.map(d=>{
       const dag=dagen[d], dn=new Date(d);
       const nu6=dagenTussen(vandaag(),d);
       return `<div class="blokkop" data-dag="${d}"><span class="eyebrow">${DAG[dn.getDay()]} ${dn.getDate()} ${MND[dn.getMonth()]}</span>
         <span class="tel ${nu6<=0?'let':''}">${labelVan(d)}</span></div>
       <div class="paneel">
         ${dag.bood.map(p=>{
           const binnenB=`<span class="ivak amber">${svg(I.vracht)}</span>
           <span class="naam">Boodschappen doen<small>voor de batch van ${kort(new Date(p.datum))}</small></span>`;
           /* in de verwijderstand hoort deze rij bij zijn batch: aanvinken doet
              hetzelfde als de batch aanvinken, zodat je ziet wat er meegaat */
           if(plKies) return `<button class="arij" data-plkies="${p.id}">${binnenB}
             <span class="kiesvak ${plKies.has(p.id)?'aan':''}">${svg(I.vink,'3')}</span></button>`;
           return `<button class="arij" data-boodschap>${binnenB}
             <span class="pijl">${svg(I.pijl,'2')}</span></button>`}).join('')}
         ${(dag.voor||[]).map(t=>{
           /* hoort de rij bij een geplande batch, dan kun je hem aantikken en
              daar de hele planning weghalen. Anders vind je nooit waar het
              kruisje zit: dat staat op een andere dag. */
           const bijPlan = t.plan && !t.los && !t.verzend && !plKies;
           let rij=-1;
           if(bijPlan){ plRegister.push(t.plan); rij=plRegister.length-1; }
           const binnen=`<span class="ivak" style="background:${DAGSOORT[t.soort].kleur}1f;color:${DAGSOORT[t.soort].kleur}">

           <span class="naam">${esc(t.tekst)}<small>${
             t.verzend ? 'verzenden · '+esc(t.verzend.nummer||'')+(t.verzend.shop?' · uit je webshop':'')
             : t.los ? DAGSOORT[t.soort].n.toLowerCase()+(t.tijd?' · '+esc(t.tijd):'')
             : 'voor de batch van '+kort(new Date(t.plan.datum))}</small></span>`;
           if(bijPlan) return `<button class="arij" data-plandetail="${rij}">${binnen}
             <span class="pijl">${svg(I.pijl,'2')}</span></button>`;
           if(plKies && t.plan && !t.los && !t.verzend)
             return `<button class="arij" data-plkies="${t.plan.id}">${binnen}

         ${dag.batches.map(p=>{

             <button data-plandetail="${rij}" style="flex:1;min-width:0;display:flex;

             ${kanNu?`<button class="miniknop" data-planstart="${rij}">Starten</button>`:''}
             <button class="wisbtn" data-planwis="${rij}">${svg(I.kruis,'2')}</button>
           </div>`}).join('')}
         ${(ord[d]||[]).map(o=>`<button class="arij" data-order="${o.id}">
           <span class="ivak">${svg(I.doos)}</span>
           <span class="naam">${esc(klantNaam(o.klantId))}<small>order ${esc(o.nummer)} · ${orderAantal(o)} bonbons leveren</small></span>
           <span class="pijl">${svg(I.pijl,'2')}</span></button>`).join('')}
       </div>`}).join('')
      :`<div class="paneel"><div class="rustig"><div class="ico">${svg(I.klok,'2.2')}</div>
         <p>Nog niets gepland.<br>Plan een batch, dan zie je hier wanneer je wat moet doen.</p></div></div>`}`,
    plKies
      ? `<button class="sec" id="plKlaar2">Klaar met selecteren</button>`
      : `<button class="prim" style="margin-top:0" id="plNieuw">${svg(I.plus)}Batch inplannen</button>
     <button class="sec" id="plTaak">${svg(I.plus)}Iets anders inplannen</button>
     ${aantalPlan?`<button class="sec" id="plKies" style="color:var(--rood)">${svg(I.kruis,'2')}${
       aantalPlan===1?'Planning verwijderen':'Planningen verwijderen'}</button>`:''}`);

  if($('#plNieuw')) $('#plNieuw').onclick=()=>sheetPlanBatch();

  if($('#plKies')) $('#plKies').onclick=()=>{plKies=new Set();sheetPlanning();naarBoven()};

    sheetPlanning();

  $$('[data-plkies]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.plkies;
    if(plKies.has(id)) plKies.delete(id); else plKies.add(id);

  if($('#plWeg')) $('#plWeg').onclick=()=>{

  $$('[data-taakwis]').forEach(b=>b.onclick=()=>{
    const herstel=terugpunt(['taken']);
    S.taken=(S.taken||[]).filter(x=>x.id!==b.dataset.taakwis);
    bewaarNu(); sheetPlanning(); render(); toast('Uit je planning gehaald.',herstel);

    else sheetPlanBatch(d);

  $$('[data-plandetail]').forEach(b=>b.onclick=()=>{
    const p=plRegister[+b.dataset.plandetail]; if(p) sheetPlanDetail(p.id);
  });
  $$('[data-planstart]').forEach(b=>b.onclick=()=>{
    const p=plRegister[+b.dataset.planstart]; if(p) planStart(p.id);
  });
  $$('[data-planwis]').forEach(b=>b.onclick=()=>{
    const p=plRegister[+b.dataset.planwis];
    const i=p?(S.planning||[]).indexOf(p):-1;
    if(i<0) return toast('Deze planning stond er al niet meer in.');
    const herstel=terugpunt(['planning']);
    S.planning.splice(i,1);
    bewaarNu(); sheetPlanning(); render(); toast('Uit je planning gehaald.',herstel);
  });
  if($('#plOpruim')) $('#plOpruim').onclick=()=>{
    const extra=planDubbel(); if(!extra.length) return;
    const herstel=terugpunt(['planning']);
    S.planning=(S.planning||[]).filter(p=>!extra.includes(p));
    bewaarNu(); sheetPlanning(); render();
    toast(extra.length+(extra.length===1?' dubbele planning':' dubbele planningen')+' opgeruimd.',herstel);
  };
  /* scrollpositie terugzetten zodat je ziet dat er iets is weggehaald */
  if(scrollNu){ const nb=document.querySelector('#sheet .sheetbody');
    if(nb) nb.scrollTop=scrollNu; }
}

/* Het detailscherm van één geplande batch. Je komt hier vanaf elke rij die
   bij die batch hoort, ook vanaf "Mallen wassen" op een heel andere dag.
   Daarmee is er altijd één plek waar je de hele planning kunt weghalen. */
function sheetPlanDetail(id){
  const p=(S.planning||[]).find(x=>x.id===id);
  if(!p) return toast('Deze planning staat er niet meer in.');
  const dn=new Date(p.datum);
  const tot=(p.regels||[]).reduce((n,r)=>n+r.aantal,0);
  const namen=(p.regels||[]).map(r=>smaakNaam(r.receptId)).join(', ');
  const bd=boodschapDatum(p);
  const kanNu=p.datum<=vandaag();

  const stappen=[];
  if(bd) stappen.push({tekst:'Boodschappen doen',datum:bd,vast:true});
  (p.voorbereiding||[]).forEach(v=>{ if(v.datum) stappen.push({tekst:v.stap,datum:v.datum}) });
  stappen.sort((a,b2)=>String(a.datum).localeCompare(String(b2.datum)));

  sheet(namen||'Geplande batch',
    `<div class="vrkop"><div class="vrgetal" style="font-size:22px">${tot}<em>bonbons</em></div>
       <div class="vrmeta">${chocNaam(p.chocolade)}<br>${DAG[dn.getDay()]} ${dn.getDate()} ${MND[dn.getMonth()]}</div></div>

     <div class="blokkop"><span class="eyebrow">Voorbereiding</span>
       <span class="tel">${stappen.length}</span></div>
     <div class="paneel">${stappen.length?stappen.map((s,i)=>`<div class="arij" style="cursor:default">
       <span class="naam">${esc(s.tekst)}<small>${kort(new Date(s.datum))}</small></span>
       ${s.vast?`<span class="waarde">volgt uit de levertijd</span>`
         :`<button class="wisbtn" data-stapwis="${i}">${svg(I.kruis,'2')}</button>`}
       </div>`).join('')
      :'<div class="geen">Geen voorbereiding ingepland.</div>'}</div>

     <p class="hint" style="margin-top:16px">Verwijder je deze planning, dan verdwijnen
       ook de voorbereidingsdagen die erbij horen.</p>`,
    `${kanNu?`<button class="prim" style="margin-top:0" id="pdStart">Batch starten</button>`:''}
     <button class="sec" id="pdWeg" style="color:var(--rood)">${svg(I.kruis,'2')}Planning verwijderen</button>`);

  if($('#pdStart')) $('#pdStart').onclick=()=>planStart(p.id);
  $('#pdWeg').onclick=()=>{
    const i=(S.planning||[]).indexOf(p);
    if(i<0) return toast('Deze planning staat er niet meer in.');
    const herstel=terugpunt(['planning']);
    S.planning.splice(i,1);
    bewaarNu(); render(); sheetPlanning();
    toast('Planning verwijderd, met alle voorbereiding.',herstel);
  };
  $$('[data-stapwis]').forEach(b=>b.onclick=()=>{
    const s=stappen[+b.dataset.stapwis]; if(!s) return;
    const herstel=terugpunt(['planning']);
    p.voorbereiding=(p.voorbereiding||[]).filter(v=>!(v.stap===s.tekst&&v.datum===s.datum));
    bewaarNu(); render(); sheetPlanDetail(p.id);
    toast(s.tekst+' uit je planning gehaald.',herstel);
  });
}

function sheetBoodschappen(){
  /* alles onder de drempel hoort er ook bij, ook zonder batch */
  const lijst=(S.boodschappen||[]).slice();
  grondVoorraad().filter(v=>grondOnder(v)||v.saldo<=0).forEach(v=>{
    if(lijst.some(x=>gKey(x.product)===gKey(v.product))) return;
    const d=grondDrempel(v.product);
    lijst.push({id:'auto-'+gKey(v.product),product:v.product,
      gram:Math.max(0,Math.round((d||0)-v.saldo)),reden:'drempel',auto:true});
  });

  const per={};
  lijst.forEach(x=>{
    const lev=leverancierVan(x.product)||'Nog geen leverancier';
    (per[lev]=per[lev]||[]).push(x);
  });
  const groepen=Object.keys(per).sort();

  const hoeveel=x=>{
    const v=grondVoorraad().find(y=>gKey(y.product)===gKey(x.product));
    const basis=v?v.basis:'g';
    const ink=inkoopVan(x.product);
    if(ink&&x.gram>0){
      const n=Math.max(1,Math.ceil(x.gram/ink.basis));
      return {tekst:n+' × '+inkoopTekst(ink),bij:'nodig '+toonHoeveel(x.gram,basis)};
    }
    return {tekst:x.gram>0?toonHoeveel(x.gram,basis):'aanvullen',bij:''};
  };

  const tekst=groepen.map(g=>g+':\n'+per[g].map(x=>{
    const h=hoeveel(x);
    return '- '+x.product+' — '+h.tekst;
  }).join('\n')).join('\n\n');

  sheet('Boodschappenlijst',
    lijst.length
      ? `<p class="hint">Wat je nodig hebt voor je batches, min wat er al ligt.
          Gegroepeerd per leverancier waar je het de vorige keer kocht.</p>
         ${groepen.map(g=>`<div class="blokkop"><span class="eyebrow">${esc(g)}</span>
           <span class="tel">${per[g].length}</span></div>
           <div class="paneel">${per[g].map(x=>{
             const h=hoeveel(x);
             const v=grondVoorraad().find(y=>gKey(y.product)===gKey(x.product));
             return `<div class="arij" style="cursor:default">
               <span class="ivak ${x.reden==='batch'?'amber':''}">${svg(x.reden==='batch'?I.vorm:I.doos)}</span>
               <span class="naam">${esc(x.product)}<small>${
                 x.reden==='batch'?'nodig voor een batch':'onder je drempel'}${
                 v?' · nu '+toonHoeveel(v.saldo,v.basis):' · niet op voorraad'}${
                 h.bij?' · '+h.bij:''}</small></span>
               <span class="waarde gevuld">${h.tekst}</span>
               ${x.auto?'':`<button class="wisbtn" data-bwis="${x.id}">${svg(I.kruis,'2')}</button>`}
             </div>`}).join('')}</div>`).join('')}`
      : `<div class="paneel"><div class="rustig"><div class="ico">${svg(I.vink,'2.2')}</div>
          <p>Niets te halen.<br>Alles wat je nodig hebt ligt er.</p></div></div>`,
    lijst.length?`<button class="prim" style="margin-top:0" id="bsKopie">Lijst kopiëren</button>
      ${(S.boodschappen||[]).length?`<button class="sec" id="bsLeeg">Lijst leegmaken</button>`:''}`:'');

  $$('[data-bwis]').forEach(b=>b.onclick=()=>{
    const herstel=terugpunt(['boodschappen']);
    S.boodschappen=(S.boodschappen||[]).filter(x=>x.id!==b.dataset.bwis);
    bewaarNu(); sheetBoodschappen(); render(); toast('Van de lijst gehaald.',herstel);
  });
  if($('#bsKopie')) $('#bsKopie').onclick=()=>{
    try{ navigator.clipboard.writeText(tekst); toast('Lijst gekopieerd.') }
    catch(e){ toast('Kopiëren lukte niet.') }
  };
  if($('#bsLeeg')) $('#bsLeeg').onclick=()=>{
    if(!confirm('De hele boodschappenlijst leegmaken?')) return;
    S.boodschappen=[]; bewaarNu(); sheetBoodschappen(); render(); toast('Lijst leeggemaakt.');
  };
}

/* ---------- telronde: de artikelen die je het vaakst gebruikt ---------- */
function sheetTelronde(){
  const lijst=grondVoorraad().map(v=>{
    const mut=(S.gmut||[]).filter(m=>gKey(m.product)===gKey(v.product));
    const beweging=mut.filter(m=>m.aantal<0).length;
