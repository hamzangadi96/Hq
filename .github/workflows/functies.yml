# Rolt de Cloud Functions uit zodra je iets in de map cloud verandert.
# Je hoeft hier verder niets mee te doen — GitHub regelt het.

name: Functies uitrollen

on:
  push:
    branches: [main]
    paths:
      - 'cloud/**'
  workflow_dispatch:        # zo kun je hem ook met de hand starten

jobs:
  uitrollen:
    runs-on: ubuntu-latest
    steps:
      - name: Code ophalen
        uses: actions/checkout@v4

      - name: Node klaarzetten
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Firebase-gereedschap
        run: npm install -g firebase-tools

      # Zonder deze stap kan Firebase je functies niet lezen: hij zoekt naar
      # het pakket firebase-functions en vindt niets. Vandaar npm install.
      - name: Pakketten installeren
        working-directory: cloud/functions
        run: npm install

      - name: Uitrollen naar Firebase
        working-directory: cloud
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/sleutel.json
          FIREBASE_SLEUTEL: ${{ secrets.FIREBASE_SLEUTEL }}
        run: |
          printf '%s' "$FIREBASE_SLEUTEL" > "$GITHUB_WORKSPACE/sleutel.json"
          firebase deploy \
            --only functions,database \
            --project cacaoboetiek-hq \
            --non-interactive \
            --force > uitrol.log 2>&1 || FOUT=1
          rm -f "$GITHUB_WORKSPACE/sleutel.json"
          cat uitrol.log
          # Bij een fout de belangrijkste regels als melding, zodat ze ook
          # zonder het volledige logboek te lezen zijn.
          if [ -n "$FOUT" ]; then
            grep -iE "error|failed|fout|denied|quota|cannot" uitrol.log | tail -10 | while IFS= read -r r; do echo "::error::$r"; done
            exit 1
          fi
