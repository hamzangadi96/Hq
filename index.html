    ${alle.map(b=>`<tr><td>${b.code}</td><td>${esc(bNamen(b))}</td>
      <td>${chocNaam(b.chocolade)}</td><td class="n">${bTotaal(b)} st</td>
      <td class="n">${b.resultaat?b.resultaat.goed+' goed · '+b.resultaat.afkeur+' afkeur':'liep nog'}</td></tr>`).join('')}</table>`
    :rLeeg('Geen batches op deze dag.');

  const dagAct={};
  alle.forEach(b=>(b.werk||[]).forEach(w=>{
    const d2=iso(new Date(w.start));
    if(d2===dag) dagAct[w.act]=(dagAct[w.act]||0)+seconden(w);
  }));
  const dagSec=Object.values(dagAct).reduce((a,c)=>a+c,0);
  if(dagSec){
    h+=`<h3>Tijdsbesteding</h3><table><tr><th>Werkzaamheid</th><th>Tijd</th><th>Aandeel</th></tr>
      ${Object.keys(dagAct).sort((a,b)=>dagAct[b]-dagAct[a]).map(a=>`<tr><td>${esc(a)}</td>
        <td class="n">${duurKort(dagAct[a])}</td><td class="n">${getal(dagAct[a]/dagSec*100)}%</td></tr>`).join('')}
      <tr><td><b>Totaal</b></td><td class="n"><b>${duurKort(dagSec)}</b></td><td></td></tr></table>`;
  }

  h+=`<h3>Alle registraties</h3>`;
  h+=logs.length?`<table><tr><th>Tijd</th><th>Batch</th><th>Registratie</th><th>Details</th></tr>
    ${logs.map(l=>`<tr><td class="t">${l.tijd}</td><td>${l.code==='—'?'—':l.code.slice(-2)}</td>
      <td class="${l.status==='fout'?'fout':l.status==='let'?'let':''}">${esc(l.titel)}</td>
      <td>${esc(l.sub||'')}</td></tr>`).join('')}</table>`:rLeeg('Niets gelogd op deze dag.');

  if(punten.length) h+=`<h3>Aandachtspunten</h3><table><tr><th>Tijd</th><th>Batch</th><th>Punt</th><th>Maatregel</th></tr>
    ${punten.map(l=>`<tr><td class="t">${l.tijd}</td><td>${l.code}</td>
      <td class="${l.status==='fout'?'fout':'let'}">${esc(l.titel)}</td><td>${esc(l.sub||'')}</td></tr>`).join('')}</table>`;

  const ij=laatsteIjking();
  h+=`<h3>Meetapparatuur</h3>`;
  h+=ij?`<div class="rij"><span>Thermometer laatst geijkt</span><b>${kort(new Date(ij.datum))}${
      ij.gemeten!==''&&ij.gemeten!==undefined?' · gemeten '+komma(ij.gemeten)+' °C in ijswater':''}</b></div>`
    :`<div class="rij"><span>Thermometer</span><b class="fout">nog geen ijking vastgelegd</b></div>`;

  return h+rHand()+rVoet()+`</div>`;
}

function verwijderBatch(id){
  const b=S.batches.find(x=>x.id===id); if(!b) return;
  const n=b.logs.length;
  if(!confirm('Batch '+b.code+' definitief verwijderen?\n\n'+
     bNamen(b)+'\n'+n+' registraties, tijden en metingen gaan weg. Dit kun je niet terugdraaien.')) return;
  S.batches=S.batches.filter(x=>x.id!==id);
  if(S.batchId===id) S.batchId=null;
  S.open=null; bewaarNu(); dicht(); render(); toast('Batch '+b.code+' verwijderd.');
}

function sheetRapport(soort,batchId,datum){
  const html = soort==='batch' ? batchRapportHTML(S.batches.find(b=>b.id===batchId)) : dagRapportHTML(datum);
  sheet(soort==='batch'?'Batchrapport':(datum&&datum!==vandaag()?'Dagrapport '+kort(new Date(datum)):'Dagrapport'),
    `<p class="hint">Op A4. Tik Printen en kies in het deelmenu van je telefoon voor <b>Bewaar in Bestanden</b> om er een pdf van te maken.</p>
     <div class="etvoorbeeld" style="padding:0"><div class="schaal" id="rpSchaal">${html}</div></div>`,
    `<button class="prim" style="margin-top:0" id="rpPrint">${svg(I.doc)}Printen of opslaan als pdf</button>
     <button class="sec" id="rpTerug">Sluiten</button>`);
  setTimeout(()=>pasSchaal('rpSchaal'),30);
  $('#rpTerug').onclick=dicht;
  $('#rpPrint').onclick=()=>{$('#printvel').innerHTML=html;setTimeout(()=>window.print(),60)};
}

/* ================= smaken / recepten ================= */
function sheetRecepten(){
  const perChoc=CHOC.map(c=>{
    const l=S.recepten.filter(r=>r.chocolade===c.key);
    if(!l.length) return '';
    return `<div class="uwkop" style="border-bottom:none;padding-top:16px"><span class="n">${c.naam}</span>
        <span class="a">${l.length}</span></div>`+
      l.map(r=>`<div class="rrij"><div class="rinfo"><div class="rnaam">${esc(r.naam)}</div>
        <div class="rsub">${(r.onderdelen||[]).length
          ? getal(gramPerBonbon(r))+' g per bonbon · '+r.onderdelen.length+(r.onderdelen.length===1?' onderdeel':' onderdelen')+' · THT '+r.tht+' dg'
          : 'nog niet af — voeg de onderdelen toe'}</div></div>
        <button class="chip klein" data-edit="${r.id}">Wijzig</button></div>`).join('');
  }).join('');
  sheet('Smaken',
    S.recepten.length?perChoc
    :`<p class="hint">Nog geen smaken. Een smaak is de opbouw van één bonbon: de schelp, de lagen erin, en hoeveel gram elk onderdeel weegt. Hoeveel bonbons je maakt kies je pas bij een batch.</p>`,
    `<button class="prim" style="margin-top:0" id="rN">Nieuwe smaak</button>`);
  $('#rN').onclick=()=>sheetReceptForm();
  $$('[data-edit]').forEach(b=>b.onclick=()=>sheetReceptForm(b.dataset.edit));
}

function sheetReceptForm(id,voorChoc){
  const best=id?S.recepten.find(x=>x.id===id):null;
  R.id=id||null;
  R.naam=best?best.naam:'';
  R.chocolade=best?best.chocolade:(voorChoc||'melk');
  R.tht=best?best.tht:14;
  R.onderdelen=best?JSON.parse(JSON.stringify(best.onderdelen||[])):[];
  R.stappen=best?(best.stappen||[]).slice():[];
  tekenRecept();
}

function leesRecept(){
  if($('#rNaam')) R.naam=$('#rNaam').value.trim();
  if($('#rT')) R.tht=parseInt($('#rT').value)||1;
  if(document.querySelector('#rC .chip.aan')) R.chocolade=chipV('#rC');
  if($('#rS')) R.stappen=$$('[data-stap]').map(i=>i.value.trim()).filter(Boolean);
}

function tekenRecept(){
  const totaal=gramPerBonbon(R);
  const stapRij=s=>`<div class="ingrij"><input class="nm" data-stap value="${esc(s)}" placeholder="Wat doe je?">
    <button class="wisbtn" data-wis-s>${svg(I.kruis,'2')}</button></div>`;
  const onderdelen = R.onderdelen.length
    ? R.onderdelen.map((o,i)=>`<button class="ondrij" data-ond="${i}">
        <span class="on"><span class="onn">${esc(o.naam||'Naamloos onderdeel')}</span>
          <span class="ons">${(o.ing||[]).length?((o.ing.length===1)?esc(o.ing[0].naam||'1 ingrediënt'):o.ing.length+' ingrediënten'):'nog geen ingrediënten'}${
            (o.werkwijze||[]).length?' · '+o.werkwijze.length+' stappen':''}${o.stap?' · '+esc(o.stap.toLowerCase()):''}</span></span>
        <span class="ong">${getal(o.gram||0)} <em>g</em></span>
        <span class="pijl">${svg(I.pijl,'2')}</span></button>`).join('')
    : `<div class="geen">Nog geen onderdelen. Denk aan de schelp, een gelei-laag en een ganache-laag.</div>`;

  sheet(R.id?'Smaak wijzigen':'Nieuwe smaak',
    `<div class="veld"><label>Naam van de smaak</label>
      <input class="inp" id="rNaam" value="${esc(R.naam)}" placeholder="Bijv. pistache & rode vruchten"></div>
     <div class="veld"><label>Chocolade</label><div class="chips" id="rC">
      ${CHOC.map(c=>`<button class="chip ${c.key===R.chocolade?'aan':''}" data-v="${c.key}">${c.naam}</button>`).join('')}</div></div>
     <div class="veld"><label>Houdbaar na productie</label>
      <div class="stepper"><div class="stepval"><input id="rT" type="number" inputmode="numeric" value="${R.tht}"><span class="eenh">dagen</span></div></div></div>
     <div class="veld"><label>Opbouw van één bonbon</label>
      ${onderdelen}
      <button class="sec" id="rOnd" style="margin-top:10px">${svg(I.plus)}&nbsp; Onderdeel toevoegen</button>
      <div class="totaalregel"><span class="l">Eén bonbon weegt</span><span class="w">${getal(totaal)} g</span></div></div>
     <div class="veld"><label>Werkwijze</label>
      <div id="rS">${(R.stappen.length?R.stappen:['']).map(stapRij).join('')}</div>
      <button class="sec" id="rPS" style="margin-top:2px">${svg(I.plus)}&nbsp; Stap toevoegen</button></div>
     ${R.id?`<div class="veld"><label>Etiket voor de klant</label>
       <button class="knop2" id="rEt" style="margin-top:0">${svg(I.doc)}Productetiket instellen</button></div>`:''}`,
    `<button class="prim" style="margin-top:0" id="rOk">${R.id?'Klaar':'Smaak opslaan'}</button>
     ${S.recepten.length?`<button class="sec" id="rTerug">Terug naar overzicht</button>`:''}`,
    R.id?'Opgeslagen':'');
  bijSluiten=()=>{leesRecept();bewaarSmaak()};

  chips('#rC');
  const bindWis=()=>$$('[data-wis-s]').forEach(b=>b.onclick=()=>{if($$('#rS .ingrij').length>1)b.parentElement.remove()});
  bindWis();
  $('#rPS').onclick=()=>{$('#rS').insertAdjacentHTML('beforeend',stapRij(''));bindWis()};
  if($('#rEt')) $('#rEt').onclick=()=>{leesRecept();bewaarSmaak();sheetProductEtiket(R.id)};
  $('#rOnd').onclick=()=>{
    leesRecept();
    if(!R.naam){ toast('Geef de smaak eerst een naam, dan bewaar ik \'m meteen.'); $('#rNaam').focus(); return; }
    bewaarSmaak(); sheetOnderdeel(null);
  };
  $$('[data-ond]').forEach(b=>b.onclick=()=>{leesRecept();bewaarSmaak();sheetOnderdeel(parseInt(b.dataset.ond))});
  if($('#rTerug')) $('#rTerug').onclick=sheetRecepten;
  $('#rOk').onclick=()=>{
    leesRecept();
    if(!R.naam) return toast('Geef de smaak een naam.');
    if(!R.onderdelen.length) return toast('Voeg minimaal één onderdeel toe, bijvoorbeeld de schelp.');
    const bestond=!!R.id;
    bewaarSmaak(); bijSluiten=null;
    render();sheetRecepten();toast(bestond?'Smaak bijgewerkt.':'Smaak opgeslagen.');
  };
}

/* onderdeel bewerken: gewicht per bonbon + het eigen recept van dat onderdeel */
function raadStap(naam){
  const n=(naam||'').toLowerCase();
  return S.werkplan.find(x=>x.toLowerCase().includes(n)||n.includes(x.toLowerCase().split(' ')[0]))||'';
}
function sheetOnderdeel(idx){
  const nieuw = idx===null;
  const o = nieuw ? {naam:'',gram:'',ing:[{naam:'',deel:''}],werkwijze:[''],stap:''} : JSON.parse(JSON.stringify(R.onderdelen[idx]));
  if(!o.ing||!o.ing.length) o.ing=[{naam:'',deel:''}];
  if(!o.werkwijze||!o.werkwijze.length) o.werkwijze=[''];
  const ingRij=i=>`<div class="ingrij">
    <input class="nm" data-in value="${esc(i.naam)}" placeholder="Ingrediënt">
    <input class="hv" data-id2 type="number" inputmode="decimal" value="${esc(i.deel)}" placeholder="gram">
    <button class="wisbtn" data-wis-i>${svg(I.kruis,'2')}</button></div>`;
  sheet(nieuw?'Onderdeel toevoegen':'Onderdeel',
    `<div class="veld"><label>Wat is dit onderdeel?</label>
      <input class="inp" id="oN" value="${esc(o.naam)}" placeholder="Bijv. schelp, gelei of ganache"></div>
     <div class="veld"><label>Hoeveel gaat er in één bonbon?</label>
      <div class="stepper"><button class="stepbtn" id="oMin">${svg(I.min)}</button>
       <div class="stepval"><input id="oG" type="number" inputmode="decimal" step="0.25" value="${esc(o.gram)}" placeholder="0"><span class="eenh">g</span></div>
       <button class="stepbtn" id="oPlus">${svg(I.plus)}</button></div></div>
     <div class="veld"><label>Jouw recept voor dit onderdeel</label>
      <p class="hint" style="margin-bottom:12px">Vul je recept in zoals je het écht maakt — één hele bak, in grammen.
        De app rekent zelf uit hoeveel daarvan in één bonbon gaat.</p>
      <div id="oI">${o.ing.map(ingRij).join('')}</div>
      <button class="sec" id="oP" style="margin-top:2px">${svg(I.plus)}&nbsp; Ingrediënt toevoegen</button>
      <div id="oSam"></div></div>
     <div class="veld"><label>Werkwijze voor dit onderdeel</label>
       <p class="hint" style="margin-bottom:10px">Elke regel is één handeling. Typ, druk op enter, typ door.
         Straks krijg je ze één voor één te zien tijdens het maken.</p>
       <textarea class="inp wzvak" id="oW" rows="7"
         placeholder="Room verwarmen tot 80 °C&#10;Van het vuur halen&#10;Chocolade erdoor roeren&#10;Laten afkoelen 20 min&#10;Boter erdoor mixen">${esc((o.werkwijze||[]).join('\n'))}</textarea>
       <div class="geen" id="oWuit" style="padding-top:9px"></div></div>
     <div class="veld"><label>Hoort bij welke productiestap?</label>
       <div class="chips" id="oStap">${S.werkplan.map(x=>`<button class="chip klein ${x===(o.stap||raadStap(o.naam))?'aan':''}"
         data-v="${esc(x)}">${esc(x)}</button>`).join('')}</div>
       <div class="geen" style="padding-top:8px">Zo weet de app wanneer hij dit recept moet tonen.</div></div>`,
    `<button class="prim" style="margin-top:0" id="oOk">${nieuw?'Onderdeel toevoegen':'Wijzigingen opslaan'}</button>
     ${nieuw?'':`<button class="sec" id="oWis">Onderdeel verwijderen</button>`}
     <button class="sec" id="oTerug">Terug naar smaak</button>`);

  const rijenLezen=()=>$$('#oI .ingrij').map(el=>({
    naam:el.querySelector('[data-in]').value.trim(),
    deel:el.querySelector('[data-id2]').value.trim()
  })).filter(x=>x.naam);

  const ververs=()=>{
    const rijen=$$('#oI .ingrij');
    const enkel=rijen.length===1;
    /* bij één ingrediënt is het gewicht van het onderdeel automatisch dat ingrediënt */
    rijen.forEach(el=>{
      const inp=el.querySelector('[data-id2]');
      inp.disabled=enkel;
      inp.placeholder=enkel?'alles':'gram';
      inp.style.opacity=enkel?'.45':'1';
    });
    const r=rijenLezen(), g=parseFloat($('#oG').value)||0;
    const waarschuwing = g>50
      ? `<div class="norm fout" style="margin-bottom:10px">${svg(I.alarm)}${getal(g)} g per bonbon — klopt dat?
           Een hele bonbon weegt meestal 8 tot 15 gram.</div>` : '';
    if(!r.length){ $('#oSam').innerHTML=waarschuwing; return; }
    if(r.length===1){
      $('#oSam').innerHTML=waarschuwing+`<div class="verhouding">Eén ingrediënt: het hele gewicht van dit onderdeel is ${esc(r[0].naam)}.</div>`;
      return;
    }
    const som=r.reduce((s2,x)=>s2+(parseFloat(x.deel)||0),0);
    if(!som){ $('#oSam').innerHTML=waarschuwing+`<div class="verhouding">Vul bij elk ingrediënt in hoeveel gram er in jouw bak gaat.</div>`; return; }
    const bonbons = g>0 ? Math.floor(som/g) : 0;
    $('#oSam').innerHTML=waarschuwing+`
      <div class="totaalregel"><span class="l">Jouw bak</span><span class="w">${getal(som)} g</span></div>
      ${bonbons?`<div class="totaalregel" style="margin-top:8px"><span class="l">Goed voor</span><span class="w">${bonbons} bonbons</span></div>`:''}
      <div class="verhouding">Verhouding: ${r.map(x=>esc(x.naam)+' '+getal(((parseFloat(x.deel)||0)/som)*100)+'%').join(' · ')}</div>`;
  };
  const bindRijen=()=>{
    $$('[data-wis-i]').forEach(b=>b.onclick=()=>{if($$('#oI .ingrij').length>1){b.parentElement.remove();bindRijen();ververs()}});
    $$('#oI input').forEach(i=>i.oninput=ververs);
    $$('[data-wis-w]').forEach(b=>b.onclick=()=>{if($$('#oW .ingrij').length>1)b.parentElement.remove()});
  };
  chips('#oStap');
  bindRijen(); ververs();
  $('#oG').oninput=ververs;
  $('#oP').onclick=()=>{$('#oI').insertAdjacentHTML('beforeend',ingRij({naam:'',deel:''}));bindRijen();ververs()};
  const wzUit=()=>{
    const rg=$('#oW').value.split('\n').map(x=>x.trim()).filter(Boolean);
    if(!rg.length) return $('#oWuit').textContent='Nog geen stappen. Zonder werkwijze kan de app je niet begeleiden.';
    const mt=rg.filter(x=>leesTijd(x)).length, mg=rg.filter(x=>leesGraden(x)!==null).length;
    let t=`${rg.length} ${rg.length===1?'handeling':'handelingen'}`;
    if(mt) t+=` · ${mt}× een tijd herkend`;
    if(mg) t+=` · ${mg}× een temperatuur herkend`;
    $('#oWuit').textContent=t+'.';
  };
  $('#oW').oninput=wzUit; wzUit();
  $('#oMin').onclick=()=>{$('#oG').value=Math.max(0,(parseFloat($('#oG').value||0)-0.25)).toFixed(2).replace(/\.?0+$/,'');ververs()};
  $('#oPlus').onclick=()=>{$('#oG').value=((parseFloat($('#oG').value||0)+0.25)).toFixed(2).replace(/\.?0+$/,'');ververs()};
  $('#oTerug').onclick=()=>{bewaarSmaak();tekenRecept()};
  if($('#oWis')) $('#oWis').onclick=()=>{R.onderdelen.splice(idx,1);bewaarSmaak();render();tekenRecept();toast('Onderdeel verwijderd.')};
  $('#oOk').onclick=()=>{
    const naam=$('#oN').value.trim(), gram=parseFloat($('#oG').value);
    const ing=rijenLezen();
    if(!naam) return toast('Geef het onderdeel een naam.');
    if(!(gram>0)) return toast('Vul in hoeveel gram hiervan in één bonbon gaat.');
    if(gram>50&&!confirm(getal(gram)+' g per bonbon is ongebruikelijk veel. Weet je het zeker?')) return;
    if(!ing.length) return toast('Vul in waar dit onderdeel uit bestaat.');
    if(ing.length>1&&ing.some(x=>!x.deel)) return toast('Vul bij elk ingrediënt in hoeveel gram er in jouw bak gaat.');
    const werkwijze=$('#oW').value.split('\n').map(x=>x.trim()).filter(Boolean);
    const d={naam,gram,ing,werkwijze,stap:chipV('#oStap')||raadStap(naam)};
    if(nieuw) R.onderdelen.push(d); else R.onderdelen[idx]=d;
    bewaarSmaak(); render(); tekenRecept();
    toast(nieuw?'Onderdeel toegevoegd en smaak opgeslagen.':'Onderdeel bijgewerkt.');
  };
}

    `<p class="hint">Log één keer in. Daarna blijft de app ingelogd en synchroniseert alles vanzelf.</p>

       <input class="inp" id="acM" type="email" inputmode="email" autocomplete="username" placeholder="info@cacaoboetiek.nl"></div>

     <div class="geen" id="acFout"></div>`,
    `<button class="prim" style="margin-top:0" id="acIn">Inloggen</button>

     <button class="sec" id="acK">Later</button>`);

    'auth/weak-password':'Kies een wachtwoord van minimaal 6 tekens.',
    'auth/email-already-in-use':'Dit adres bestaat al — kies Inloggen.',
    'auth/invalid-credential':'E-mailadres of wachtwoord klopt niet.',

    firebase.auth().signInWithEmailAndPassword(m,w)
      .then(()=>{dicht();render();toast('Ingelogd. Je gegevens synchroniseren nu.')}).catch(melden)};
  $('#acNieuw').onclick=()=>{const[m,w]=velden();
    firebase.auth().createUserWithEmailAndPassword(m,w)
      .then(()=>{dicht();render();toast('Account aangemaakt.')}).catch(melden)};
}

/* ================= gegevens meenemen ================= */
function sheetData(){
  const d={}; BEWAARVELDEN.forEach(k=>d[k]=S[k]);
  const json=JSON.stringify(d);
  const kb=Math.max(1,Math.round(json.length/1024));
  sheet('Gegevens meenemen',
    `<p class="hint">Stuur ik je een nieuwe versie, dan begint die leeg. Kopieer hier je gegevens
       en plak ze daar één keer terug — dan staat alles er weer.</p>
     <div class="totaalregel" style="margin-bottom:18px"><span class="l">Smaken · partijen · batches</span>
       <span class="w">${S.recepten.length} · ${S.lots.length} · ${S.batches.length}</span></div>
     <div class="veld"><label>Jouw gegevens (${kb} kB)</label>
       <textarea class="inp" id="dOut" style="height:110px;font-size:12px" readonly>${esc(json)}</textarea>
       <button class="knop2" id="dKopie" style="margin-top:10px">${svg(I.doc)}Kopiëren</button></div>
     <div class="veld"><label>Gegevens terugzetten</label>
       <textarea class="inp" id="dIn" style="height:110px;font-size:12px" placeholder="Plak hier je gekopieerde gegevens"></textarea>
       <button class="knop2" id="dZet" style="margin-top:10px">${svg(I.ververs)}Terugzetten</button>
       <div class="geen" style="padding-top:8px">Let op: dit overschrijft wat er nu in de app staat.</div></div>`,
    `<button class="prim" style="margin-top:0" id="dKlaar">Klaar</button>`);
  $('#dKopie').onclick=async()=>{
    const t=$('#dOut'); t.select(); t.setSelectionRange(0,999999);
    try{ await navigator.clipboard.writeText(json); toast('Gekopieerd. Plak het in een notitie.'); }
    catch(e){ try{document.execCommand('copy');toast('Gekopieerd.')}catch(e2){toast('Selecteer de tekst en kopieer met de hand.')} }
  };
  $('#dZet').onclick=()=>{
    const v=$('#dIn').value.trim(); if(!v) return toast('Plak eerst je gegevens.');
    let n; try{ n=JSON.parse(v) }catch(e){ return toast('Dit is geen geldige export.') }
    if(!confirm('Alles wat nu in de app staat wordt vervangen. Doorgaan?')) return;
    BEWAARVELDEN.forEach(k=>{if(n[k]!==undefined&&n[k]!==null)S[k]=n[k]});
    migreerChecks(); migreerBatches(); bewaarNu(); dicht(); render();
    toast('Gegevens teruggezet: '+S.recepten.length+' smaken.');
  };
  $('#dKlaar').onclick=dicht;
}

/* ================= archief ================= */
function sheetArchief(){
  const dagen=alleDatums();
  sheet('Archief',
    `<p class="hint">Elke dag waarop je iets hebt vastgelegd. Tik een datum aan voor het dagrapport van die dag.</p>
     <div>${dagen.length?dagen.map(d=>{
       const bs=S.batches.filter(b=>batchOpDatum(b,d));
       const klaar=bs.filter(b=>b.eindDatum===d).length;
       const dd=new Date(d);
       return `<button class="rij" data-dag="${d}" style="padding-left:0;padding-right:0">
         <span class="tekst"><span class="t1">${DAG[dd.getDay()]} ${kort(dd)}</span>
           <span class="t2">${bs.length} ${bs.length===1?'batch':'batches'}${klaar?' · '+klaar+' afgerond':''}</span></span>
         <span class="pijl">${svg(I.pijl,'2')}</span></button>`}).join('')
      :'<div class="geen">Nog niets vastgelegd.</div>'}</div>`,
    `<button class="prim" style="margin-top:0" id="arK">Sluiten</button>`);
  $$('[data-dag]').forEach(b=>b.onclick=()=>sheetRapport('dag',null,b.dataset.dag));
  $('#arK').onclick=dicht;
}

function sheetIjking(){
  const lijst=(S.ijkingen||[]).slice().sort((a,b)=>a.datum<b.datum?1:-1);
  sheet('Thermometer ijken',
    `<p class="hint">Leg smeltend ijswater klaar en meet. Een goede thermometer wijst 0 °C aan, met hooguit
       een halve graad afwijking. Zonder deze controle zijn al je metingen aanvechtbaar.</p>
     <div class="veld"><label>Gemeten in ijswater</label>
       <div class="stepper"><button class="stepbtn" id="ijMin">${svg(I.min)}</button>
         <div class="stepval"><input id="ijV" type="number" inputmode="decimal" step="0.1" value="0"><span class="eenh">°C</span></div>
         <button class="stepbtn" id="ijPlus">${svg(I.plus)}</button></div>
       <div class="norm ok" id="ijN"></div></div>
     <div class="veld"><label>Notitie</label><input class="inp" id="ijT" placeholder="Bijv. bijgesteld, of nieuwe thermometer"></div>
     <div class="veld"><label>Eerdere ijkingen</label>
       <div>${lijst.length?lijst.map((x,i)=>`<div class="rrij"><div class="rinfo">
         <div class="rnaam">${kort(new Date(x.datum))} · ${komma(x.gemeten)} °C</div>
         <div class="rsub">${esc(x.notitie||'geen bijzonderheden')}</div></div>
         <button class="wisbtn" data-ijwis="${i}">${svg(I.kruis,'2')}</button></div>`).join('')
        :'<div class="geen">Nog geen ijking vastgelegd.</div>'}</div></div>`,
    `<button class="prim" style="margin-top:0" id="ijOk">IJking vastleggen op ${kort(new Date())}</button>
     <button class="sec" id="ijTerug">Terug</button>`);
  const check=()=>{
    const v=parseFloat($('#ijV').value), ok=!isNaN(v)&&Math.abs(v)<=0.5;
    $('#ijN').className='norm '+(ok?'ok':'fout');
    $('#ijN').innerHTML=svg(ok?I.vink:I.alarm)+(ok?'Binnen de marge van een halve graad':'Meer dan 0,5 °C afwijking — bijstellen of vervangen');
  };
  $('#ijMin').onclick=()=>{$('#ijV').value=(parseFloat($('#ijV').value||0)-0.1).toFixed(1);check()};
  $('#ijPlus').onclick=()=>{$('#ijV').value=(parseFloat($('#ijV').value||0)+0.1).toFixed(1);check()};
  $('#ijV').oninput=check; check();
  $$('[data-ijwis]').forEach(b=>b.onclick=()=>{
    const x=lijst[parseInt(b.dataset.ijwis)];
    S.ijkingen=S.ijkingen.filter(y=>y!==x); bewaarNu(); sheetIjking(); toast('Verwijderd.');
  });
  $('#ijTerug').onclick=sheetInstellingen;
  $('#ijOk').onclick=()=>{
    const v=parseFloat($('#ijV').value);
    if(isNaN(v)) return toast('Vul de gemeten waarde in.');
    S.ijkingen.push({id:uid(),datum:vandaag(),gemeten:v,notitie:$('#ijT').value.trim()});
    bewaarNu(); render(); sheetIjking(); toast('IJking vastgelegd.');
  };
}

/* ================= instellingen ================= */
function sheetInstellingen(){
  sheet('Instellingen',
    `<button class="menurij" data-ins="recepten">${svg(I.boek)}Smaken<span class="tel">${S.recepten.length}</span></button>
     <button class="menurij" data-ins="mal">${svg(I.vorm)}Bonbons per mal<span class="tel">${S.malGrootte}</span></button>
     <button class="menurij" data-ins="ijking">${svg(I.temp)}Thermometer ijken<span class="tel">${
       laatsteIjking()?kort(new Date(laatsteIjking().datum)):'nooit'}</span></button>
     <button class="menurij" data-ins="meetpunten">${svg(I.temp)}Meetpunten<span class="tel">${S.meetpunten.length}</span></button>
     <button class="menurij" data-ins="checks">${svg(I.vink)}Openingscheck<span class="tel">${S.checks.length}</span></button>
     <button class="menurij" data-ins="werkplan">${svg(I.vorm)}Productiestappen<span class="tel">${S.werkplan.length}</span></button>
     <button class="menurij" data-ins="activiteiten">${svg(I.ververs)}Werkzaamheden<span class="tel">${S.activiteiten.length}</span></button>
     <button class="menurij" data-ins="zones">${svg(I.spark)}Schoonmaak-onderdelen<span class="tel">${S.zones.length}</span></button>
     <button class="menurij" data-ins="middelen">${svg(I.spark)}Schoonmaakmiddelen<span class="tel">${S.middelen.length}</span></button>
     <button class="menurij" data-ins="lots">${svg(I.doos)}Partijen in huis<span class="tel">${S.lots.length}</span></button>
     <button class="menurij" data-ins="leveranciers">${svg(I.vracht)}Leveranciers<span class="tel">${S.leveranciers.length}</span></button>`,'');
  $$('[data-ins]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.ins;
    if(k==='recepten') return sheetRecepten();
    if(k==='meetpunten') return sheetMeetpunten();
    if(k==='mal') return sheetMal();
    if(k==='ijking') return sheetIjking();
    if(k==='checks') return sheetChecks();
    if(k==='lots') return sheetLots();
    sheetLijst(k);
  });
}
const LIJSTEN={
  werkplan:{titel:'Productiestappen',hint:'De volgorde waarin je een batch maakt. De app loopt deze met je door.',ph:'Bijv. decoreren'},
  activiteiten:{titel:'Werkzaamheden',hint:'De activiteiten die je met de timer kunt bijhouden tijdens een batch.',ph:'Bijv. decoreren'},
  zones:{titel:'Schoonmaak-onderdelen',hint:'Alles wat jij schoonmaakt, van werkbank tot vloer.',ph:'Bijv. bonbonvormen'},
  middelen:{titel:'Schoonmaakmiddelen',hint:'Waarmee je reinigt. Dit komt in je logboek te staan.',ph:'Bijv. alcohol 70%'},
  leveranciers:{titel:'Leveranciers',hint:'Bij wie je inkoopt. Handig bij het loggen van ontvangsten.',ph:'Bijv. Callebaut'}
};
function sheetLijst(key){
  const c=LIJSTEN[key], arr=S[key];
  sheet(c.titel,
    `<p class="hint">${c.hint}</p>
     <div>${arr.length?arr.map((v,i)=>`<div class="rrij"><div class="rinfo"><div class="rnaam">${esc(v)}</div></div>
        <button class="wisbtn" data-wis="${i}">${svg(I.kruis,'2')}</button></div>`).join('')
      :'<div class="geen">Nog niets toegevoegd.</div>'}</div>
     <div class="inlineform open" style="margin:16px 0 20px"><div class="rijtje">
       <input class="mini" id="lN" placeholder="${esc(c.ph)}">
       <button class="miniknop" id="lOk">Toevoegen</button></div></div>
`,
    `<button class="prim" style="margin-top:0" id="lTerug">Klaar</button>`);
  $('#lOk').onclick=()=>{
    const v=$('#lN').value.trim(); if(!v) return toast('Vul iets in.');
    arr.push(v); sheetLijst(key); toast('Toegevoegd.');
  };
  $$('[data-wis]').forEach(b=>b.onclick=()=>{arr.splice(parseInt(b.dataset.wis),1);sheetLijst(key);toast('Verwijderd.')});
  $('#lTerug').onclick=sheetInstellingen;
}
function sheetLots(){
  sheet('Partijen in huis',
    `<p class="hint">Alles wat je bij ontvangst hebt vastgelegd. Hieruit kies je bij het loggen van je ingrediënten.</p>
     <div>${S.lots.length?S.lots.map((l,i)=>`<div class="rrij">
       <div class="rinfo"><div class="rnaam">${esc(l.product)}</div>
         <div class="rsub">lot ${esc(l.lot)} · ${esc(l.leverancier)}${l.hoeveel?' · '+esc(l.hoeveel)+' '+esc(l.eenheid):''}
           ${l.tht?' · THT '+kort(new Date(l.tht))+(lotOver(l)?' (verlopen)':''):''}</div></div>
       <button class="wisbtn" data-wis="${i}">${svg(I.kruis,'2')}</button></div>`).join('')
      :'<div class="geen">Nog geen partijen. Leg een ontvangst vast in een batch.</div>'}</div>`,
    `<button class="prim" style="margin-top:0" id="ltTerug">Klaar</button>`);
  $$('[data-wis]').forEach(b=>b.onclick=()=>{S.lots.splice(parseInt(b.dataset.wis),1);bewaarNu();sheetLots();toast('Partij verwijderd.')});
  $('#ltTerug').onclick=sheetInstellingen;
}

function sheetChecks(){
  migreerChecks();
  sheet('Openingscheck',
    `<p class="hint">De punten die je bij elke batch naloopt. Een punt kan een vinkje zijn of een meting met grenzen.</p>
     <div>${S.checks.length?S.checks.map((c,i)=>`<div class="rrij">
        ${c.soort==='meting'
          ? `<button class="rinfo" data-bewerk="${c.mpId}" style="text-align:left">
               <div class="rnaam">${esc(c.tekst)}</div>
               <div class="rsub">${normTekst(meetpuntVan(c.mpId))} · tik om aan te passen</div></button>`
          : `<div class="rinfo"><div class="rnaam">${esc(c.tekst)}</div>
               <div class="rsub">afvinken</div></div>`}
        <button class="wisbtn" data-wis="${i}">${svg(I.kruis,'2')}</button></div>`).join('')
      :'<div class="geen">Nog niets toegevoegd.</div>'}</div>
     <div class="inlineform open" style="margin:16px 0 20px"><div class="rijtje">
       <input class="mini" id="cN" placeholder="Je eigen checkpunt">
       <button class="miniknop" id="cOk">Toevoegen</button></div></div>
     <button class="knop2" id="cMeet" style="margin:0 0 22px">${svg(I.temp)}Meting toevoegen</button>
     ${BRONREGEL}${voorstelBlokken('data-voorstel')}`,
    `<button class="prim" style="margin-top:0" id="cTerug">Klaar</button>`);
  $('#cOk').onclick=()=>{
    const v=$('#cN').value.trim(); if(!v) return toast('Vul iets in.');
    S.checks.push({id:uid(),tekst:v,soort:'vink'}); bewaarNu(); sheetChecks(); toast('Toegevoegd.');
  };
  $('#cMeet').onclick=()=>sheetMeting({terug:sheetChecks});
  $$('[data-bewerk]').forEach(b=>b.onclick=()=>sheetMeting({mpId:b.dataset.bewerk,terug:sheetChecks}));
  $$('[data-voorstel]').forEach(x=>x.onclick=()=>{
    if(x.dataset.meting==='1') return sheetMeting({naam:x.dataset.voorstel,min:x.dataset.min,max:x.dataset.max,
      eenheid:x.dataset.eenheid,groep:x.dataset.groep,terug:sheetChecks});
    S.checks.push({id:uid(),tekst:x.dataset.voorstel,soort:'vink',groep:x.dataset.groep}); bewaarNu(); sheetChecks();
  });
  $$('[data-wis]').forEach(b=>b.onclick=()=>{S.checks.splice(parseInt(b.dataset.wis),1);bewaarNu();sheetChecks();toast('Verwijderd.')});
  $('#cTerug').onclick=sheetInstellingen;
}

function sheetMal(){
  sheet('Bonbons per mal',
    `<p class="hint">Hoeveel bonbons passen er in één mal? Hiermee reken je bij een batch in mallen in plaats van in losse stuks.</p>
     <div class="veld"><div class="stepper">
       <button class="stepbtn" id="gMin">${svg(I.min)}</button>
       <div class="stepval"><input id="gV" type="number" inputmode="numeric" value="${S.malGrootte}"><span class="eenh">bonbons</span></div>
       <button class="stepbtn" id="gPlus">${svg(I.plus)}</button></div></div>`,
    `<button class="prim" style="margin-top:0" id="gOk">Opslaan</button>`);
  $('#gMin').onclick=()=>{$('#gV').value=Math.max(1,parseInt($('#gV').value||1)-1)};
  $('#gPlus').onclick=()=>{$('#gV').value=parseInt($('#gV').value||0)+1};
  $('#gOk').onclick=()=>{
    const v=parseInt($('#gV').value);
    if(!v||v<1) return toast('Vul in hoeveel bonbons er in een mal gaan.');
    S.malGrootte=v; render(); sheetInstellingen(); toast('Eén mal is nu '+v+' bonbons.');
  };
}
function sheetMeetpunten(){
  sheet('Meetpunten',
    `<p class="hint">De plekken waar jij temperatuur meet, met de grenzen die je aanhoudt. Buiten die grenzen vraagt de app om een actie.</p>
     <div>${S.meetpunten.length?S.meetpunten.map((m,i)=>`<div class="rrij">
        <div class="rinfo"><div class="rnaam">${esc(m.naam)}</div>
        <div class="rsub">${komma(m.min)} tot ${komma(m.max)} °C</div></div>
        <button class="wisbtn" data-wis="${i}">${svg(I.kruis,'2')}</button></div>`).join('')
      :'<div class="geen">Nog geen meetpunten.</div>'}</div>
     <div class="inlineform open" style="margin-top:16px">
       <div class="rijtje"><input class="mini" id="mN" placeholder="Naam, bijv. Koelkast"></div>
       <div class="rijtje"><input class="mini" id="mMin" type="number" inputmode="decimal" placeholder="Min °C">
         <input class="mini" id="mMax" type="number" inputmode="decimal" placeholder="Max °C">
         <button class="miniknop" id="mOk">Opslaan</button></div></div>`,
    `<button class="prim" style="margin-top:0" id="mTerug">Klaar</button>`);
  $('#mOk').onclick=()=>{
    const n=$('#mN').value.trim(), mi=parseFloat($('#mMin').value), ma=parseFloat($('#mMax').value);
    if(!n) return toast('Geef het meetpunt een naam.');
    if(isNaN(mi)||isNaN(ma)) return toast('Vul een minimum en maximum in.');
    if(mi>ma) return toast('Het minimum moet lager zijn dan het maximum.');
    S.meetpunten.push({id:uid(),naam:n,min:mi,max:ma}); sheetMeetpunten(); toast('Meetpunt toegevoegd.');
  };
  $$('[data-wis]').forEach(b=>b.onclick=()=>{S.meetpunten.splice(parseInt(b.dataset.wis),1);sheetMeetpunten();toast('Verwijderd.')});
  $('#mTerug').onclick=sheetInstellingen;
}

/* merkbalk krimpt zodra je gaat scrollen */
(function(){
  const kop=document.querySelector('header'), scr=$('#scherm');
  if(!kop||!scr) return;
  scr.addEventListener('scroll',()=>{
    if(!kop.classList.contains('gecentreerd')) return;
    const t=scr.scrollTop;
    if(t>34) kop.classList.add('klein');
    else if(t<14) kop.classList.remove('klein');
  },{passive:true});
})();

/* de klok laten lopen zonder het hele scherm te hertekenen */
setInterval(()=>{
  const kl=$$('.tikker'); if(!kl.length) return;
  const b=batch(); if(!b) return;
  const w=lopendWerk(b);
  const t = w ? duurTekst(Date.now()-w.start) : '—';
  kl.forEach(el=>{if(el.textContent!==t)el.textContent=t});
},1000);

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}

(async()=>{ await laden(); render(); })();
</script>
</body>
</html>
