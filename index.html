<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Cacaoboetiek HQ</title>
<meta name="theme-color" content="#18181b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cacaoboetiek">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500;600;700&family=Petit+Formal+Script&family=Caveat:wght@400;500&family=Parisienne&display=swap" rel="stylesheet">
<style>
:root{
  /* Ruimte boven de kop. iOS zet een PWA met status-bar-style "default" al
     onder de statusbalk; tellen we env() daar bovenop, dan staat alles dubbel
     zo laag. Bij het starten meten we het echt en zetten we dit zo nodig op 0.
     Lukt dat meten niet, dan blijft het oude gedrag staan. */
  --veiligBoven: env(safe-area-inset-top);
  --ink:#18181b; --ink2:#3f3f46; --grijs:#71717a; --grijs2:#a1a1aa; --grijs3:#d4d4d8;
  --bg:#f4f4f5; --lijn:#ececee; --card:#fff;
  --groen:#15803d; --amber:#b45309; --rood:#c0392b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
/* Het document zelf mag niet scrollen: anders schuift de kop mee weg zodra
   iOS de layout een tik groter maakt dan het scherm. Alleen de inhoud en de
   bottom-sheets scrollen. */
html,body{margin:0;padding:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{-webkit-text-size-adjust:100%;text-size-adjust:100%;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:#e8e8ea;color:var(--ink);-webkit-font-smoothing:antialiased}
button,input,textarea{font-family:inherit;font-size:16px;color:inherit}
button{cursor:pointer;border:none;background:none;padding:0;text-align:left}
/* Safari laat na een tik een focusring achter. Op een ronde knop leest die als
   een losse cirkel. Weg ermee; met een toetsenbord blijft er wel een ring. */
button:focus{outline:none}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.tab:focus-visible{outline-color:#fff}

.app{position:relative;width:100%;max-width:440px;margin:0 auto;height:100%;height:100dvh;
  max-height:100%;background:var(--bg);
  display:flex;flex-direction:column;overflow:hidden;box-shadow:0 0 70px rgba(0,0,0,.10)}

/* De kop ligt boven de inhoud en schuift weg zodra je scrollt, zodat je
   het hele scherm voor je lijst hebt. Scroll je terug, dan komt hij terug. */
header{position:absolute;top:0;left:0;right:0;z-index:20;background:var(--bg);
  padding:calc(12px + var(--veiligBoven)) 20px 10px;display:flex;align-items:flex-start;gap:12px}
header h1{margin:0;font-size:27px;font-weight:600;letter-spacing:-.04em;line-height:1.15}
/* absoluut, net als de gewone kop. Stond hier relative, dan bleef de
   dashboardkop in de stroom staan én kreeg main er nog eens dezelfde
   hoogte aan marge bovenop: alles stond dubbel zo laag. */
header.gecentreerd{position:absolute;display:block;padding:calc(20px + var(--veiligBoven)) 20px 20px;border-bottom:1px solid var(--lijn);
  transition:padding .24s cubic-bezier(.32,.72,0,1),border-color .24s ease}
header.gecentreerd.klein{padding:calc(12px + var(--veiligBoven)) 20px 12px}
header.gecentreerd.klein .hbtn.menu{top:calc(6px + var(--veiligBoven))}
header.gecentreerd .vlak{text-align:center}
header.gecentreerd .onder{display:none}
header.gecentreerd .hbtn.terug{display:none}
header.gecentreerd .hbtn.menu{position:absolute;top:calc(14px + var(--veiligBoven));right:12px;margin:0}

.merk{display:block;font-family:'Cormorant Garamond',Georgia,serif;font-size:21px;font-weight:600;
  letter-spacing:.16em;line-height:1;color:var(--ink);padding-left:.16em;
  transition:font-size .24s cubic-bezier(.32,.72,0,1),letter-spacing .24s ease}
header.klein .merk{font-size:15px;letter-spacing:.12em;padding-left:.12em}
.merk small{display:block;font-family:'Inter',sans-serif;font-size:7.5px;font-weight:600;
  letter-spacing:.38em;color:var(--grijs2);margin-top:8px;padding-left:.38em;overflow:hidden;max-height:12px;
  transition:opacity .16s ease,max-height .24s cubic-bezier(.32,.72,0,1),margin-top .24s ease}
header.klein .merk small{opacity:0;max-height:0;margin-top:0}
.merklogo{display:block;margin:0 auto;max-width:200px;max-height:52px;width:auto;height:auto;object-fit:contain;
  transition:max-height .24s cubic-bezier(.32,.72,0,1)}
header.klein .merklogo{max-height:30px}
.logovak{border:1px dashed var(--grijs3);border-radius:14px;background:var(--bg);padding:18px;
  display:grid;place-items:center;min-height:104px;margin:0 0 14px}
.logovak img{max-width:100%;max-height:68px;object-fit:contain}
.logovak .geenlogo{font-size:13.5px;color:var(--grijs2);text-align:center;line-height:1.5}
header .onder{margin-top:3px;font-size:14px;font-weight:450;color:var(--grijs);letter-spacing:-.01em}
header .vlak{flex:1;min-width:0}

/* de donkere kopband op het dashboard, met de dagcijfers erin */
header.donker{background:var(--ink);border-bottom-color:transparent}
header.donker .merk{color:#fff}
header.donker .merk small{color:#a1a1aa}
header.donker .hbtn{color:#a1a1aa}
.kpi{display:none;text-align:left;margin-top:20px;
  transition:opacity .2s ease,max-height .24s cubic-bezier(.32,.72,0,1),margin-top .24s ease}
header.donker .kpi{display:block}
.kstrook{display:flex;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.kstrook::-webkit-scrollbar{display:none}
header.donker.klein .kpi{opacity:0;max-height:0;margin-top:0;overflow:hidden}
.kcel{flex:none;padding-right:26px;min-width:76px}
.kcel .kl{font-size:11.5px;font-weight:600;color:#a1a1aa;letter-spacing:.02em;white-space:nowrap}
.kcel .kw{font-size:21px;font-weight:600;color:#fff;letter-spacing:-.035em;margin-top:5px;
  font-variant-numeric:tabular-nums;white-space:nowrap}
.kcel .kw.nul{color:#6b6b73}
.kcel .kw em{font-style:normal;font-size:13px;font-weight:500;color:#71717a;margin-left:5px}
.kbalk{height:5px;border-radius:99px;background:#27272a;overflow:hidden;margin-top:16px}
.kbalk span{display:block;height:100%;border-radius:99px;background:#fff;
  transition:width .4s cubic-bezier(.32,.72,0,1)}
header.donker.klein .kbalk{opacity:0;max-height:0;margin-top:0}

/* het lichte vlak schuift over de donkere band heen */
main.opdonker{border-radius:22px 22px 0 0;margin-top:-18px;padding-top:28px;position:relative;z-index:2}

/* snelacties: dezelfde capsuletaal als de tabbalk */
.snelrij{display:flex;gap:8px;overflow-x:auto;margin:0 -20px;padding:2px 20px 4px;
  scrollbar-width:none;-webkit-overflow-scrolling:touch}
.snelrij::-webkit-scrollbar{display:none}
.snelknop{flex:none;display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 16px;
  border-radius:99px;background:var(--card);border:1px solid var(--lijn);
  font-size:14px;font-weight:600;letter-spacing:-.015em;color:var(--ink2);white-space:nowrap;
  box-shadow:0 1px 2px rgba(24,24,27,.03),0 10px 22px -18px rgba(24,24,27,.2)}
.snelknop svg{width:16px;height:16px;stroke-width:1.9;color:var(--grijs);flex:none}
.snelknop:active{background:var(--bg)}

/* verpakking als raster: kleuren onder elkaar, maten naast elkaar */
.vraster{display:grid;grid-template-columns:1fr repeat(auto-fit,minmax(58px,68px));
  align-items:stretch;padding:0 14px 10px}
.vrhoek{height:34px}
.vrmaat{height:34px;display:grid;place-items:center;font-size:12px;font-weight:700;
  color:var(--grijs2);letter-spacing:.02em}
.vrmaat small{font-size:9.5px;font-weight:600;margin-left:2px;opacity:.75}
.vrkleur{display:flex;align-items:center;font-size:14.5px;font-weight:500;letter-spacing:-.015em;
  padding:0 8px 0 2px;min-height:46px;border-top:1px solid var(--lijn)}
.vrcel{display:grid;place-items:center;min-height:46px;border-top:1px solid var(--lijn);
  font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink);
  border-radius:0;text-align:center}
.vrcel.leeg{color:var(--grijs3);font-weight:500}
.vrcel.amber{color:var(--amber)} .vrcel.rood{color:var(--rood)}
.vrcel:active{background:var(--bg)}
.hbtn{width:34px;height:32px;border-radius:99px;display:grid;place-items:center;color:var(--grijs);flex:none;margin-top:2px}
.hbtn svg{width:18px;height:18px}
.hbtn.terug{margin-left:-8px}
.hbtn.menu{margin-right:-8px}

main{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;
  padding:calc(var(--kopHoogte,72px) + 12px) 20px 32px;-webkit-overflow-scrolling:touch}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--grijs2)}
.blokkop{display:flex;align-items:baseline;gap:12px;margin:32px 2px 12px}
main>.blokkop:first-child{margin-top:8px}
.blokkop .eyebrow{flex:1}
.blokkop .tel{font-size:12.5px;font-weight:600;color:var(--grijs2);letter-spacing:-.01em}
.blokkop .tel.let{color:var(--amber);font-weight:700}
.paneel{background:var(--card);border-radius:18px;border:1px solid var(--lijn);overflow:hidden;
  box-shadow:0 1px 2px rgba(24,24,27,.03),0 12px 26px -20px rgba(24,24,27,.18)}

.balk{display:flex;gap:4px;margin:16px 0 12px}
.balk.top{margin:0 0 8px}
.seg{flex:1;height:3px;border-radius:99px;background:var(--grijs3)}
.seg.vol{background:var(--ink)}
.stap{font-size:12.5px;font-weight:600;color:var(--grijs2);letter-spacing:-.01em}
.hoofdkaart{background:var(--card);border-radius:18px;padding:20px;
  box-shadow:0 1px 2px rgba(24,24,27,.04),0 14px 30px -18px rgba(24,24,27,.22)}
.hoofdkaart h2{margin:8px 0 0;font-size:21px;font-weight:600;letter-spacing:-.03em;line-height:1.2}
.hoofdkaart .sub{margin:8px 0 0;font-size:14px;color:var(--grijs);line-height:1.5}
.loopt{display:flex;align-items:center;gap:8px;margin-top:16px;padding:12px 12px;border-radius:14px;background:var(--bg)}
.loopt .ln{flex:1;font-size:14px;font-weight:600;letter-spacing:-.015em}
.loopt .lt{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.loopt .tp{width:8px;height:8px;border-radius:99px;background:#22c55e;flex:none;animation:pols 2s infinite}
.prim{width:100%;height:48px;border-radius:14px;background:var(--ink);color:#fff;font-size:15px;
  font-weight:600;margin-top:20px;display:flex;align-items:center;justify-content:center;gap:8px;letter-spacing:-.01em}
.prim:active{opacity:.85}
.prim svg{width:16px;height:16px;stroke-width:2.2}
.prim.los{margin-top:0}
.prim.wis{background:var(--rood)}
.knop2{width:100%;height:48px;border-radius:14px;background:var(--card);border:1px solid var(--lijn);
  font-size:15px;font-weight:600;margin-top:12px;display:flex;align-items:center;justify-content:center;gap:8px;letter-spacing:-.01em}
.knop2:active{background:var(--bg)}
.knop2 svg{width:16px;height:16px;stroke-width:2.2}
.hoofdkaart.klaar{box-shadow:none;border:1px solid var(--lijn);text-align:center;padding:24px 20px}
.hoofdkaart.klaar h2{font-size:21px}
.vinkje{width:40px;height:40px;border-radius:99px;background:var(--bg);color:var(--groen);display:grid;place-items:center;margin:0 auto 2px}
.vinkje svg{width:19px;height:20px}

.rij{display:flex;align-items:center;gap:12px;width:100%;padding:16px 16px;border-bottom:1px solid var(--lijn)}
.paneel .rij:last-child{border-bottom:none}
.rij .tekst{flex:1;min-width:0}
.rij .t1{font-size:15px;font-weight:500;letter-spacing:-.015em;display:block}
.rij .t2{font-size:12.5px;color:var(--grijs2);margin-top:4px;line-height:1.4;display:block}
.rij .rechts{font-size:12.5px;font-weight:600;color:var(--ink2);flex:none;text-align:right;letter-spacing:-.01em}
.rij .rechts em{display:block;font-style:normal;font-weight:500;color:var(--grijs2);margin-top:4px}
.rij .rechts.bezig{color:var(--amber)} .rij .rechts.klaar{color:var(--groen)}
.pijl{width:14px;height:14px;color:var(--grijs3);flex:none;transition:transform .25s}
.stip{width:7px;height:7px;border-radius:99px;flex:none;margin:0 2px}
.stip.amber{background:var(--amber)} .stip.rood{background:var(--rood)} .stip.groen{background:var(--groen)}
.meer{width:100%;padding:12px 16px;font-size:14px;font-weight:600;color:var(--grijs);text-align:center;border-top:1px solid var(--lijn)}

.arij{display:flex;align-items:center;gap:12px;width:100%;padding:16px 20px;border-bottom:1px solid var(--lijn)}

/* ── tegels: elk cijfer eigen ruimte, en meteen een knop ── */
.tegels{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tegel{background:var(--card);border:1px solid var(--lijn);border-radius:18px;padding:16px;
  text-align:left;display:flex;flex-direction:column;gap:2px;min-height:92px;
  box-shadow:0 1px 2px rgba(24,24,27,.03),0 12px 26px -20px rgba(24,24,27,.18)}
.tegel:active{background:var(--bg)}
.tegel .tk{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;color:var(--grijs2)}
.tegel .tw{font-size:25px;font-weight:600;letter-spacing:-.04em;line-height:1.1;margin-top:auto;
  font-variant-numeric:tabular-nums}
.tegel .tw.nul{color:var(--grijs3)}
.tegel .ts{font-size:12.5px;color:var(--grijs);letter-spacing:-.01em;line-height:1.35}
.tegel .ts.let{color:var(--amber);font-weight:600}
.tegel .ts.fout{color:var(--rood);font-weight:600}
.tegel.breed{grid-column:1 / -1}

/* ── icoonvlakje voor in lijstrijen ── */
.ivak{width:34px;height:34px;border-radius:11px;flex:none;display:grid;place-items:center;
  background:var(--bg);color:var(--grijs)}
.ivak svg{width:17px;height:17px;stroke-width:1.9}
.ivak.groen{background:#f0fdf4;color:var(--groen)}
.ivak.amber{background:#fffbeb;color:var(--amber)}
.ivak.rood{background:#fef2f2;color:var(--rood)}
.ivak.ink{background:var(--ink);color:#fff}

/* ── voortgangsring: compacter dan een balk, past naast de tekst ── */
.mring{width:38px;height:38px;min-width:38px;flex:none;position:relative;display:grid;place-items:center}
.mring svg{width:38px;height:38px;display:block;transform:rotate(-90deg)}
.mring circle{fill:none;stroke-width:3.4}
.mring .baan{stroke:var(--bg)}
.mring .vul{stroke:var(--ink);stroke-linecap:round;transition:stroke-dasharray .5s cubic-bezier(.32,.72,0,1)}
.mring.groen .vul{stroke:var(--groen)}
.mring.amber .vul{stroke:var(--amber)}
.hkkop{display:flex;align-items:center;gap:12px}
.hkkop .hkl{flex:1;min-width:0}
.mring .rt{position:absolute;font-size:10.5px;font-weight:700;letter-spacing:-.03em;
  font-variant-numeric:tabular-nums;color:var(--ink)}

/* ── hoe lang loopt dit al ── */
.dagenbadge{font-size:11px;font-weight:700;letter-spacing:.02em;color:var(--grijs);
  background:var(--bg);border-radius:99px;padding:3px 8px;white-space:nowrap;flex:none}
.dagenbadge.let{background:#fffbeb;color:var(--amber)}

/* ── weekstrip: veertien dagen vooruit, stip als er iets is ── */
.weekstrip{display:flex;gap:6px;overflow-x:auto;margin:0 -20px 4px;padding:2px 20px 10px;
  scrollbar-width:none;-webkit-overflow-scrolling:touch}
.weekstrip::-webkit-scrollbar{display:none}
.wdag{flex:none;width:48px;padding:9px 0 8px;border-radius:15px;background:var(--card);
  border:1px solid var(--lijn);display:flex;flex-direction:column;align-items:center;gap:1px;position:relative}
.wdag .wd{font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--grijs2)}
.wdag .wn{font-size:17px;font-weight:600;letter-spacing:-.03em;color:var(--ink);
  font-variant-numeric:tabular-nums;line-height:1.15}

/* een lege dag valt weg */
.wdag.leeg{background:var(--bg);border-color:transparent}
.wdag.leeg .wn{color:var(--grijs3)}
.wdag.vol{box-shadow:0 1px 2px rgba(24,24,27,.04),0 10px 20px -16px rgba(24,24,27,.28)}
.wdag.maand{margin-left:8px;position:relative}
.wdag.maand::before{content:'';position:absolute;left:-8px;top:8px;bottom:8px;width:1px;background:var(--lijn)}
.wdag.maand .wd{color:var(--ink)}

/* vandaag wint altijd: zwart blokje */
.wdag.nu,.wdag.nu.leeg,.wdag.nu.vol{background:var(--ink);border-color:var(--ink)}
.wdag.nu .wd{color:#8f8f98}
.wdag.nu .wn,.wdag.nu.leeg .wn{color:#fff}
.wstippen{display:flex;gap:2px;height:6px;margin-top:5px;align-items:center}

/* ── uitleg: genummerde stappen met een lijn ertussen ── */
.uitlegstappen{position:relative}
.ustap{display:flex;gap:14px;padding:0 0 24px;position:relative}
.ustap:last-child{padding-bottom:4px}
.ustap::before{content:'';position:absolute;left:13px;top:30px;bottom:0;width:1.5px;background:var(--lijn)}
.ustap:last-child::before{display:none}
/* de uitleg schuift over het scherm heen; wat eronder ligt blijft intact */
/* ── branchekeuze: kaarten met een icoon, twee per rij ── */
/* ── rondleiding: een blokje uitleg dat naast het veld gaat staan ── */
.hbtn.zoek{display:grid;place-items:center;color:var(--grijs2)}
.hbtn.zoek svg{width:19px;height:19px;stroke-width:1.9}
.hbtn.zoek:active{color:var(--ink)}

.rlblok{position:absolute;left:50%;transform:translateX(-50%) translateY(10px);
  bottom:calc(22px + env(safe-area-inset-bottom));width:calc(100% - 32px);max-width:400px;
  background:var(--ink);color:#fff;border-radius:20px;padding:16px 18px 14px;z-index:200;
  opacity:0;pointer-events:none;transition:opacity .3s,transform .34s cubic-bezier(.32,.72,0,1);
  box-shadow:0 8px 20px -6px rgba(24,24,27,.4),0 24px 50px -20px rgba(24,24,27,.5)}
.rlblok.open{opacity:1;transform:translateX(-50%);pointer-events:auto}
.rlblok.boven{bottom:auto;top:calc(22px + var(--veiligBoven))}
/* zolang de rondleiding loopt maken we onderin ruimte vrij */
body.rlbezig .sheetbody{padding-bottom:230px}
body.rlbezig .sheetvoet{padding-bottom:calc(230px + env(safe-area-inset-bottom))}
body.rlbezig.rlboven .sheetbody{padding-bottom:32px;padding-top:200px}
body.rlbezig.rlboven .sheetvoet{padding-bottom:calc(16px + env(safe-area-inset-bottom))}
.rlkop{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.rlnr{flex:1;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#8f8f98}
.rlweg{font-size:12.5px;font-weight:600;color:#a1a1aa;letter-spacing:-.01em;
  background:none;border:none;padding:2px 0}
.rltitel{font-size:17px;font-weight:600;letter-spacing:-.03em;line-height:1.3}
.rltekst{font-size:14px;color:#c4c4ce;line-height:1.5;margin-top:5px;letter-spacing:-.01em}
.rlknoppen{display:flex;gap:8px;margin-top:14px}
.rlterug{width:44px;height:44px;border-radius:14px;flex:none;border:1px solid #3f3f46;
  background:none;color:#fff;display:none;place-items:center}
.rlterug.aan{display:grid}
.rlterug svg{width:18px;height:18px;stroke-width:2;transform:rotate(180deg)}
.rlterug:active{background:#27272a}
.rldoor{flex:1;height:44px;border-radius:14px;background:#fff;color:var(--ink);
  font-size:15px;font-weight:600;letter-spacing:-.02em;border:none}
.rldoor:active{background:#e4e4e7}

/* het element waar de tip bij hoort krijgt een zachte ring */
.rlmerk{position:relative;z-index:20;border-radius:14px;background:var(--card);
  box-shadow:0 0 0 2.5px var(--ink),0 0 0 7px rgba(24,24,27,.12);
  animation:rlpuls 2.2s ease-in-out infinite}
@keyframes rlpuls{0%,100%{box-shadow:0 0 0 2.5px var(--ink),0 0 0 7px rgba(24,24,27,.12)}

@keyframes schermIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  margin-top:8px;text-align:center;display:flex;align-items:center;justify-content:center;gap:8px}
/* zonder maat schaalt een svg op tot de hoogte van de knop */
.sec svg{width:16px;height:16px;stroke-width:2.2;flex:none}
.mkop{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--grijs3);padding:20px 0 4px}
.mkop:first-child{padding-top:0}
.tel.let{color:var(--amber);font-weight:700}
.menurij{display:flex;align-items:center;gap:12px;padding:16px 0;border-bottom:1px solid var(--lijn);width:100%;font-size:15px;font-weight:500}
.menurij:last-child{border-bottom:none}
.menurij svg{width:18px;height:18px;color:var(--grijs);flex:none}
.menurij .tel{margin-left:auto;font-size:12.5px;font-weight:500;color:var(--grijs2)}

/* beheerrijen in een paneel: zelfde taal als het menu, met de waarde rechts */
.beheerrij{display:flex;align-items:center;gap:12px;width:100%;padding:15px 16px;
  border-bottom:1px solid var(--lijn);font-size:15px;font-weight:500;text-align:left}
.beheerrij:last-child{border-bottom:none}
.beheerrij:active{background:var(--bg)}
.beheerrij>svg{width:18px;height:18px;color:var(--grijs);flex:none}
.beheerrij .l{flex:1;min-width:0;letter-spacing:-.015em}
.beheerrij .w{font-size:13px;font-weight:600;color:var(--grijs2);white-space:nowrap;
  font-variant-numeric:tabular-nums}
.beheerrij .w.let{color:var(--amber)}
.beheerrij .p{width:14px;height:14px;color:var(--grijs3);flex:none}

/* chocolade-keuze */
.choc{display:flex;flex-direction:column;gap:12px}
.chocknop{display:flex;align-items:center;gap:16px;padding:16px;border-radius:18px;background:var(--bg)}
.chocknop.aan{background:var(--ink);color:#fff}
.schijf{width:34px;height:32px;border-radius:99px;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.schijf.wit{background:#f0e6d6} .schijf.melk{background:#a9744f} .schijf.puur{background:#4a2c1d}
.chocknop .ct{flex:1}
.chocknop .cn{font-size:16px;font-weight:600;letter-spacing:-.02em}
.chocknop .cs{font-size:12.5px;color:var(--grijs2);margin-top:2px}
.chocknop.aan .cs{color:#a1a1aa}

.veld{margin-bottom:20px}
.veld label{display:block;font-size:12.5px;font-weight:600;color:var(--grijs);margin-bottom:8px;letter-spacing:-.01em}
.wzvak{min-height:150px;line-height:1.65;resize:vertical;font-family:Inter,sans-serif}
.inp{width:100%;height:48px;border-radius:14px;border:none;background:var(--bg);padding:0 16px;font-size:16px;font-weight:500;outline:none}
.inp:focus{box-shadow:inset 0 0 0 1.5px var(--ink);background:#fff}
textarea.wzvak{min-height:150px;line-height:1.65;resize:vertical;font-family:Inter,sans-serif}
textarea.inp{height:88px;padding:16px;line-height:1.5;resize:none;font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:12px 16px;border-radius:14px;background:var(--bg);font-size:14px;font-weight:600;letter-spacing:-.01em;
  color:var(--ink2);display:inline-flex;align-items:center;gap:8px}
.chip svg{width:13px;height:12px;stroke-width:2.2;flex:none}
.chip.aan{background:var(--ink);color:#fff}
.chip.klein{padding:8px 12px;font-size:12.5px}
.chip.nieuw{background:none;box-shadow:inset 0 0 0 1.5px var(--lijn);color:var(--grijs);display:inline-flex;align-items:center;gap:8px}
.chip.nieuw svg{width:13px;height:12px;stroke-width:2.2}
.inlineform{background:var(--bg);border-radius:14px;padding:12px;margin-top:12px;display:none}
.inlineform.open{display:block}
.rijtje{display:flex;gap:8px}
.inlineform .rijtje{display:flex;gap:8px;margin-bottom:8px}
.inlineform .rijtje:last-child{margin-bottom:0}
.mini{height:48px;border-radius:14px;border:none;background:#fff;padding:0 12px;font-size:16px;font-weight:500;outline:none;width:100%}
.mini:focus{box-shadow:inset 0 0 0 1.5px var(--ink)}
.miniknop{height:48px;padding:0 16px;border-radius:14px;background:var(--ink);color:#fff;font-size:14px;font-weight:600;flex:none;display:flex;align-items:center;justify-content:center}
.stepper{display:flex;align-items:center;gap:12px}
.stepbtn{width:50px;height:48px;border-radius:14px;background:var(--bg);display:grid;place-items:center;flex:none}
.stepbtn svg{width:17px;height:16px}
.stepval{flex:1;height:48px;border-radius:14px;background:var(--bg);display:flex;align-items:center;justify-content:center;gap:4px}
.stepval input{width:76px;border:none;background:none;text-align:right;font-size:21px;font-weight:600;outline:none;padding:0;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.stepval .eenh{font-size:14px;font-weight:600;color:var(--grijs2)}
.norm{margin-top:12px;font-size:12.5px;font-weight:600;line-height:1.45;display:flex;gap:8px;align-items:flex-start}
.norm svg{width:15px;height:15px;flex:none;margin-top:2px}
.norm.ok{color:var(--groen)} .norm.fout{color:var(--rood)}
.tog{display:flex;align-items:center;gap:12px;padding:16px 0;border-bottom:1px solid var(--lijn);width:100%;background:none;border-left:none;border-right:none;border-top:none;text-align:left;-webkit-user-select:none;user-select:none}
.tog:last-of-type{border-bottom:none}
.tog .tekst{flex:1;font-size:15px;font-weight:450;line-height:1.35;letter-spacing:-.01em}
.tbox{width:26px;height:24px;border-radius:10px;background:var(--bg);flex:none;display:grid;place-items:center;color:transparent}
.tbox svg{width:15px;height:15px}
.tog.aan .tbox{background:var(--ink);color:#fff}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--bg);padding:4px;border-radius:14px}
.duo button{height:44px;border-radius:10px;font-size:14px;font-weight:600;color:var(--grijs);text-align:center}
.duo button.aan{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.duo3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;background:var(--bg);padding:4px;border-radius:14px}
.duo3 button{height:44px;border-radius:10px;font-size:13.5px;font-weight:600;color:var(--grijs);text-align:center}
.duo3 button.aan{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.melding{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border-radius:14px;
  font-size:13.5px;line-height:1.45;margin-bottom:12px}
.melding svg{width:16px;height:16px;flex:none;margin-top:2px}
.melding.amber{background:#fffbeb;color:#92400e}
.melding.rood{background:#fef2f2;color:#991b1b}
.melding.groen{background:#f0fdf4;color:#14532d}
.trkop{padding-bottom:16px;border-bottom:2px solid var(--ink);margin-bottom:4px}
.trcode{font-size:21px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.trsub{font-size:12.5px;color:var(--grijs);margin-top:4px;line-height:1.45}
.prim.groot{height:64px;font-size:17px;border-radius:18px}
.prim.groot svg{width:20px;height:20px}
.ritkaart{display:block;background:var(--ink);color:#fff;border-radius:18px;padding:20px}
.rkstatus{display:flex;align-items:center;justify-content:center;gap:8px;
  font-size:12.5px;font-weight:500;opacity:.6}
.rkstatus .rkbol{width:7px;height:7px;border-radius:99px;background:#4ade80;
  flex:none;animation:pols 2s infinite}
.rkkm{display:flex;align-items:baseline;justify-content:center;gap:6px;margin:12px 0 20px;
  font-size:48px;font-weight:700;letter-spacing:-.045em;line-height:1;font-variant-numeric:tabular-nums}
.rkkm em{font-size:17px;font-weight:500;font-style:normal;opacity:.5;letter-spacing:-.01em}
.rkvan{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;
  padding:0 8px 20px;background:none;color:#fff;opacity:.6;font-size:13px;font-weight:500;
  line-height:1.4;text-align:center}
.rkvan svg{width:12px;height:12px;flex:none;color:#4ade80;opacity:1}
.rkvan:active{opacity:.9}
.rkroute{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:44px;
  margin-bottom:8px;border-radius:14px;background:rgba(255,255,255,.14);color:#fff;
  font-size:14px;font-weight:600;letter-spacing:-.01em}
.rkroute svg{width:16px;height:16px}
.rkroute:active{background:rgba(255,255,255,.22)}
.rkstop{display:flex;align-items:center;justify-content:center;width:100%;height:48px;
  border-radius:14px;background:#fff;color:var(--ink);font-size:15px;font-weight:600;letter-spacing:-.01em}
.rkstop:active{opacity:.85}
.rkweg{display:flex;align-items:center;justify-content:center;width:100%;height:40px;
  margin-top:4px;background:none;color:#fff;opacity:.5;font-size:13.5px;font-weight:500}
.rkweg:active{opacity:.8}
.ritklaar{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;
  padding-bottom:20px;margin-bottom:24px;border-bottom:1px solid var(--lijn)}
.rkgetal{display:flex;align-items:baseline;gap:8px;font-size:48px;font-weight:700;
  letter-spacing:-.045em;line-height:.9;font-variant-numeric:tabular-nums}
.rkgetal em{font-size:17px;font-weight:500;font-style:normal;color:var(--grijs);letter-spacing:-.01em}
.rkregels{text-align:right;font-size:12.5px;color:var(--grijs);line-height:1.6}
.rkregels b{font-weight:600;color:var(--ink)}
.mveld{display:flex;align-items:center;gap:8px;height:48px;padding:0 16px;
  border-radius:14px;background:var(--bg)}
.mveld input{flex:1;min-width:0;background:none;border:0;font-size:16px;font-weight:600;
  color:var(--ink);padding:0;height:100%}
.kaartje{background:var(--card);border:1px solid var(--lijn);border-radius:18px;padding:20px 16px 12px;
  box-shadow:0 1px 2px rgba(24,24,27,.03),0 12px 26px -20px rgba(24,24,27,.18)}
.balken{display:flex;align-items:flex-end;gap:4px;height:88px}
.balk2{flex:1;background:var(--ink);border-radius:4px 4px 0 0;min-height:3px}
.scanlaag{position:fixed;inset:0;z-index:90;background:#000;display:grid;place-items:center}
.scanlaag video{width:100%;height:100%;object-fit:cover}
.scankader{position:absolute;width:72%;max-width:300px;aspect-ratio:1.6;border:2px solid #fff;
  border-radius:18px;box-shadow:0 0 0 100vmax rgba(0,0,0,.45)}
.scanstop{position:absolute;bottom:calc(28px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
  background:#fff;color:var(--ink);height:48px;padding:0 26px;border-radius:99px;font-size:15px;font-weight:600}
.balklabels{display:flex;gap:4px;margin-top:8px}
.balklabels span{flex:1;text-align:center;font-size:10.5px;font-weight:600;color:var(--grijs2)}
.bkol{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bstaaf{width:100%;max-width:22px;background:var(--ink);border-radius:4px 4px 0 0;min-height:2px;
  display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
.bstaaf.leeg{background:#ececee;min-height:2px}
.bpri{width:100%;background:var(--grijs3)}
.bkol span{font-size:10px;font-weight:600;color:var(--grijs3);line-height:1}
.bkol.nu span{color:var(--ink)}
.balklegenda{display:flex;align-items:center;gap:14px;margin-top:14px;padding-top:12px;
  border-top:1px solid var(--lijn);font-size:11px;color:var(--grijs)}
.balklegenda .bl{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:5px;vertical-align:-1px}
.balklegenda .bl.zak{background:var(--ink)}
.balklegenda .bl.pri{background:var(--grijs3)}
.balklegenda .rechts{margin-left:auto}
.ordlijst{display:flex;flex-direction:column;gap:8px}
.ordkaart{display:block;width:100%;text-align:left;background:var(--card);
  border:1px solid var(--lijn);border-radius:16px;padding:14px 16px}
.ordkaart.let{border-color:#f6ddb0}
.ordkaart:active{background:#fafafa}
.okop{display:flex;align-items:baseline;gap:8px}
.onr{font-size:15px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.okl{font-size:14px;font-weight:500;color:var(--grijs);flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.obadge{font-size:10.5px;font-weight:700;letter-spacing:.04em;padding:3px 8px;border-radius:99px;flex:none}
.obadge.af{background:var(--ink);color:#fff}
.obadge.let{background:#fffbeb;color:#92400e}
.owat{font-size:13.5px;line-height:1.55;color:var(--ink);margin-top:8px}
.ovoet{display:flex;align-items:center;justify-content:space-between;gap:12px;
  margin-top:12px;padding-top:10px;border-top:1px solid var(--lijn);
  font-size:12px;color:var(--grijs3)}
.odocs{display:flex;gap:4px;flex:none}
.odocs i{width:20px;height:20px;border-radius:6px;background:var(--bg);color:var(--grijs3);
  font-style:normal;font-size:10.5px;font-weight:700;display:grid;place-items:center}
.odocs i.aan{background:var(--ink);color:#fff}
.macbalk{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:16px;
  background:var(--card);border:1px solid var(--lijn)}
.macbalk.aan{background:var(--ink);border-color:var(--ink);color:#fff}
.macbol{width:8px;height:8px;border-radius:99px;background:var(--grijs3);flex:none}
.macbalk.aan .macbol{background:#4ade80;animation:pols 2s infinite}
.mactekst{flex:1;min-width:0;font-size:14.5px;font-weight:600;letter-spacing:-.015em}
.mactekst em{display:block;font-size:12.5px;font-weight:500;font-style:normal;opacity:.6;margin-top:2px}
.macdraai{width:16px;height:16px;border-radius:99px;border:2px solid rgba(255,255,255,.25);
  border-top-color:#fff;animation:draai .9s linear infinite;flex:none}
@keyframes draai{to{transform:rotate(360deg)}}
.doclabel{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--lijn)}
.doclabel:last-child{border-bottom:none}
.doclabel input{width:20px;height:20px;flex:none;margin:0;accent-color:var(--ink)}
.doclabel .dn{flex:1;font-size:15px;font-weight:500;letter-spacing:-.015em}
.doclabel .ds{font-size:12.5px;color:var(--grijs3);font-weight:500}
.doclabel .ds.klaar{color:var(--groen);font-weight:600}
.rmerk{width:24px;height:24px;border-radius:8px;flex:none;display:grid;place-items:center;
  font-size:11px;font-weight:700;letter-spacing:0}
.rmerk.zak{background:var(--ink);color:#fff}
.rmerk.pri{background:var(--bg);color:var(--grijs2)}
.rrij2 .waarde em{font-size:11px;font-weight:500;font-style:normal;color:var(--grijs3);margin-left:3px}
.rrij2 .naam small b{font-weight:600;color:var(--amber)}
.klapkop{display:flex;align-items:center;gap:10px;width:100%;padding:16px 0;
  font-size:14px;font-weight:600;color:var(--grijs);border-top:1px solid var(--lijn);margin-top:4px}
.klapkop svg{width:14px;height:14px;transform:rotate(90deg);transition:transform .2s}
.klapkop.open svg{transform:rotate(-90deg)}
.klapin{display:none}
.klapin.open{display:block;padding-bottom:8px}
.adressug{display:none;margin-top:6px;border:1px solid var(--lijn);border-radius:14px;
  overflow:hidden;background:var(--card)}
.adressug.open{display:block}
.sugrij{display:block;width:100%;text-align:left;padding:13px 16px;font-size:14px;
  line-height:1.35;border-bottom:1px solid var(--lijn);color:var(--ink)}
.sugrij:last-child{border-bottom:none}
.sugrij:active{background:var(--bg)}
.adresvoet{padding-top:8px;min-height:24px}
.onthoud{display:flex;align-items:flex-start;gap:12px;padding:16px 0 8px;
  font-size:13.5px;color:var(--grijs);line-height:1.45;cursor:pointer}
.onthoud.klein{padding:0;font-size:12.5px;gap:10px;align-items:center}
.onthoud input{width:22px;height:22px;flex:none;margin:0 2px 0 0;accent-color:var(--ink)}
.onthoud.klein input{width:18px;height:18px}
.bekend{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--groen);font-weight:500}
.bekend svg{width:13px;height:13px}
.mveld span{font-size:14px;font-weight:600;color:var(--grijs2);flex:none}
.vrkop{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;
  padding-bottom:20px;margin-bottom:4px;border-bottom:1px solid var(--lijn)}
.vrgetal{font-size:44px;font-weight:700;letter-spacing:-.04em;line-height:.95}
.vrgetal em{display:block;font-size:12.5px;font-weight:500;font-style:normal;
  color:var(--grijs);letter-spacing:0;margin-top:4px}
.kies{display:flex;align-items:center;justify-content:space-between;text-align:left;color:var(--ink)}
.kies svg{width:15px;height:15px;color:var(--grijs3);flex:none}
.orij{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--lijn)}
.orij:last-child{border-bottom:none}
.on{flex:1;min-width:0;font-size:15px;font-weight:500;letter-spacing:-.015em}
.on em{display:block;font-size:12.5px;font-weight:500;font-style:normal;color:var(--grijs3);margin-top:2px}
.ostep{display:flex;align-items:center;gap:4px;flex:none}
.stepbtn.klein{width:40px;height:40px;border-radius:10px}
.stepbtn.klein svg{width:14px;height:14px}
.oa{min-width:32px;text-align:center;font-size:16px;font-weight:700;color:var(--grijs3);
  font-variant-numeric:tabular-nums}
.oa.aan{color:var(--ink)}
.vrmeta{font-size:12.5px;color:var(--grijs);text-align:right;line-height:1.5}
.info{margin-bottom:20px}
.inforij{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:8px 0;border-bottom:1px solid var(--lijn)}
.inforij:last-child{border-bottom:none}
.inforij .k{color:var(--grijs);font-weight:450}
.inforij .v{font-weight:600;text-align:right;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.lotrij{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.lotrij .inp{flex:1;min-width:0}
.lotplus{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;color:var(--grijs);padding:2px 0}
.lotplus svg{width:14px;height:14px}
.alblok{padding:16px 0;border-bottom:1px solid var(--lijn)}
.alblok:last-child{border-bottom:none}
.alkop{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.alkop .n{font-size:15px;font-weight:600;letter-spacing:-.015em}
.alkop .g{font-size:12.5px;font-weight:500;color:var(--grijs3);text-align:right}
.alkop .g.aan{color:var(--rood);font-weight:600}
.lotkop .g.goed{color:var(--groen);font-weight:700}
.prijsrij{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px}
.prijsrij label{font-size:12.5px;color:var(--grijs);font-weight:500}
.pveld{display:flex;align-items:center;gap:4px;background:var(--bg);border-radius:10px;padding:0 12px}
.pveld span{font-size:14px;color:var(--grijs);font-weight:600}
.pveld .inp{width:82px;background:none;height:40px;text-align:right;padding:0}
.lotblok{padding:12px 0;border-bottom:1px solid var(--lijn)}
.lotblok:last-of-type{border-bottom:none}
.lotkop{display:flex;align-items:baseline;gap:12px;margin-bottom:8px}
.lotkop .n{flex:1;font-size:15px;font-weight:500;letter-spacing:-.01em}
.lotkop .g{font-size:12.5px;font-weight:600;color:var(--grijs2);font-variant-numeric:tabular-nums}
.lotchips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.lotchip{padding:8px 12px;border-radius:10px;background:var(--bg);font-size:14px;font-weight:600;
  color:var(--ink2);display:inline-flex;align-items:center;gap:8px;line-height:1.2}
.lotchip.aan{background:var(--ink);color:#fff}
.lotchip.over{color:var(--rood)}
.lotchip em{font-style:normal;font-weight:500;opacity:.65;font-size:12.5px}
.lotregel{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--lijn)}
.lotregel:last-child{border-bottom:none}
.lotnaam{flex:1;min-width:0;font-size:14px;font-weight:450;letter-spacing:-.01em}

.meetrij{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--lijn)}

.meetrij .mt{flex:1;min-width:0;font-size:15px;font-weight:500;letter-spacing:-.01em}
.meetrij .mt em{font-style:normal;display:block;font-size:12.5px;font-weight:500;color:var(--grijs2);margin-top:4px}

.mval{width:96px;height:48px;border-radius:14px;border:none;background:var(--bg);padding:0 12px;font-size:16px;

.mlabel{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;

.vgroep{margin-bottom:20px}
.vkop{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--grijs2);margin-bottom:8px}
.vlijst{background:var(--bg);border-radius:14px;overflow:hidden}
.vrij{display:flex;align-items:center;gap:12px;width:100%;padding:12px 16px;border-bottom:1px solid #e6e6e9;

.bron{font-size:12.5px;color:var(--grijs2);line-height:1.5;margin:4px 0 20px}
.verhouding{font-size:12.5px;color:var(--grijs2);padding:8px 0 2px;line-height:1.5}
.uwsub{display:flex;align-items:baseline;gap:12px;padding:8px 0 8px 16px}

.uwsub .h{font-size:12.5px;font-weight:500;font-variant-numeric:tabular-nums;color:var(--grijs)}
.uwond{display:flex;align-items:baseline;gap:12px;padding:8px 0 4px}
.uwond .n{flex:1;font-size:14px;font-weight:600;letter-spacing:-.01em}
.uwond .h{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.hint{font-size:14px;color:var(--grijs);line-height:1.55;margin:0 0 20px}
.overnemen{background:var(--bg);border-radius:14px;padding:16px;margin-bottom:20px}
.overnemen p{margin:0 0 12px;font-size:14px;color:var(--grijs);line-height:1.5}
.overnemen button{width:100%;height:44px;border-radius:14px;background:#fff;font-size:15px;font-weight:600;text-align:center;display:flex;align-items:center;justify-content:center;gap:8px}
.overnemen button svg{width:15px;height:15px;color:var(--groen)}

.toast.metknop{display:flex;align-items:center;gap:14px;text-align:left;padding:13px 14px 13px 18px}
.toast .tm{flex:1;min-width:0}
.toast .tterug{flex:none;background:#fff;color:var(--ink);border:none;border-radius:11px;
  padding:9px 13px;font-size:13.5px;font-weight:600;letter-spacing:-.015em}
.toast .tterug:active{background:#e4e4e7}
.toast{position:absolute;left:20px;right:20px;bottom:88px;z-index:80;background:var(--ink);color:#fff;
  border-radius:14px;padding:16px 16px;font-size:14px;font-weight:450;line-height:1.4;
  opacity:0;transform:translateY(8px);pointer-events:none;transition:all .25s}
.toast.open{opacity:1;transform:translateY(0)}
.tijdbalk{display:flex;align-items:center;gap:12px;width:100%;background:var(--ink);color:#fff;
  border-radius:18px;padding:12px 16px;margin-bottom:16px;text-align:left}
.tijdbalk.uit{background:transparent;color:var(--grijs);border:1px dashed #dcdce0;
  padding:8px 16px;margin-bottom:12px;gap:8px}
.tijdbalk.uit svg{width:15px;height:15px;flex:none;opacity:.75}
.tijdbalk.uit .tn{font-size:14px;font-weight:500}
.tijdbalk.uit .tstart{font-size:14px;font-weight:600;color:var(--ink);flex:none}
.tijdbalk.uit:active{background:#fafafa}
.tijdbalk .tp{width:9px;height:9px;border-radius:99px;background:#4ade80;flex:none;animation:pols 2s infinite}
@keyframes pols{0%,100%{opacity:1}50%{opacity:.35}}
.tijdbalk .tn{flex:1;min-width:0;font-size:15px;font-weight:600;letter-spacing:-.015em;text-align:left}
.tijdbalk .tn small{display:block;font-size:11px;font-weight:500;opacity:.6;margin-top:2px}
.tijdbalk .tt{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em;flex:none}
/* de globale klokbalk staat bovenaan elk scherm, boven de eerste kaart */
.klokbalk{margin-bottom:16px}
.werkrij{display:flex;align-items:center;gap:12px;width:100%;padding:16px 0;border-bottom:1px solid var(--lijn);text-align:left}
.vinkknop{width:36px;height:36px;border-radius:10px;background:var(--bg);flex:none;display:grid;place-items:center;color:transparent}
.vinkknop svg{width:15px;height:15px}
.vinkknop.aan{background:var(--groen);color:#fff}
.startknop{flex:1;display:flex;align-items:center;gap:12px;text-align:left;min-width:0}
/* geleide modus */
.klokvak{position:relative;width:100%;max-width:280px;margin:8px auto 0;aspect-ratio:1}
.klokvak.klein{max-width:190px;margin:0 auto 24px}
.klokvak.klein .kact{font-size:14px}
.klokvak.klein .ktijd{font-size:30px;margin-top:4px}
.klokvak.klein .kvan{font-size:11px}
.klokvak.klein .klokin{padding:0 24px}
.ring{width:100%;height:100%;transform:rotate(-90deg);display:block}
.ring .rbaan{fill:none;stroke:#ececee;stroke-width:7}
.ring .rvul{fill:none;stroke:var(--ink);stroke-width:7;stroke-linecap:round;
  transition:stroke-dashoffset .5s linear}
.klokin{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;text-align:center;padding:0 40px}
.kact{font-size:17px;font-weight:600;letter-spacing:-.02em;line-height:1.25;color:var(--grijs)}
.ktijd{font-size:44px;font-weight:700;letter-spacing:-.045em;line-height:1.1;margin-top:8px;
  font-variant-numeric:tabular-nums}
.kvan{font-size:12.5px;color:var(--grijs3);margin-top:4px}
.klokvoet{text-align:center;font-size:12.5px;color:var(--grijs);margin-top:20px}
.duurbalk{height:5px;border-radius:99px;background:#ececee;overflow:hidden;margin-bottom:8px}
.dvul{height:100%;background:var(--ink);border-radius:99px;transition:width .3s}
.duurtekst{font-size:12.5px;color:var(--grijs);line-height:1.5;margin-bottom:24px}
.duurtekst em{display:block;font-style:normal;color:var(--grijs3);font-size:11px;margin-top:2px}
.gbalk{height:4px;border-radius:99px;background:#ececee;overflow:hidden;margin-bottom:12px}
.gvul{height:100%;background:var(--ink);border-radius:99px;transition:width .25s}
.gtel{font-size:12.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:var(--grijs);margin-bottom:20px}
.gvak{min-height:190px;display:flex;flex-direction:column;justify-content:center;padding:4px 0 12px}
.gwoord{font-size:17px;font-weight:500;color:var(--grijs);letter-spacing:-.01em}
.ggetal{font-size:56px;font-weight:700;letter-spacing:-.04em;line-height:1;margin-top:8px;
  display:flex;align-items:baseline;gap:8px}
.ggetal em{font-size:17px;font-weight:500;font-style:normal;color:var(--grijs);letter-spacing:0}
.gzin{font-size:28px;font-weight:600;letter-spacing:-.025em;line-height:1.25}
.gtimer{display:flex;align-items:center;gap:12px;margin-top:20px;padding:12px 16px;
  border:1px solid var(--lijn);border-radius:14px}
.gtimer.loopt{background:var(--ink);border-color:var(--ink)}
.gklok{flex:1;font-size:32px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.gtimer.loopt .gklok{color:#fff}
.gklok.op{color:var(--rood)}
.gstart{height:40px;padding:0 20px;border-radius:99px;background:var(--ink);color:#fff;
  font-size:15px;font-weight:600;flex:none}
.gtimer.loopt .gstart{background:#fff;color:var(--ink)}
.gmeet{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:44px;
  margin-top:12px;border:1px solid var(--lijn);border-radius:14px;font-size:14px;font-weight:600}
.gmeet svg{width:16px;height:16px}
.gvoet{display:flex;gap:8px;margin-top:8px}
.gvoet button{flex:1;height:48px;border-radius:14px;background:var(--bg);
  font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:4px}
.gvoet button:disabled{opacity:.35}
.gvoet button svg{width:14px;height:14px;transform:rotate(180deg)}
.uvkop{display:flex;align-items:center;gap:12px;background:var(--ink);color:#fff;border-radius:18px;
  padding:16px 16px;margin-bottom:20px}
.uvkop .un{flex:1;font-size:16px;font-weight:600;letter-spacing:-.02em}
.uvkop .un small{display:block;font-size:12.5px;font-weight:500;opacity:.6;margin-top:2px}
.uvkop .ut{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;flex:none}
.uvsmaak{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--grijs2);margin:20px 0 8px}
.weegrij{display:flex;align-items:center;gap:12px;width:100%;padding:16px 0;border-bottom:1px solid var(--lijn);text-align:left}
.weegrij:last-of-type{border-bottom:none}
.weegrij .wgn{flex:1;font-size:15px;font-weight:450;letter-spacing:-.01em}
.weegrij .wgg{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.weegrij.af .wgn,.weegrij.af .wgg{color:var(--grijs3);text-decoration:line-through}
.wzt .wzbij{display:block;font-style:normal;font-size:12px;font-weight:600;color:var(--grijs2);margin-top:3px}
.wzrij{display:flex;gap:12px;padding:16px 0;border-bottom:1px solid var(--lijn);align-items:flex-start}
.wzrij:last-of-type{border-bottom:none}
.wzrij .wznr{width:24px;height:24px;border-radius:99px;background:var(--bg);flex:none;display:grid;place-items:center;
  font-size:12.5px;font-weight:700;color:var(--grijs)}
.wzrij .wzt{flex:1;font-size:15px;line-height:1.45;font-weight:450}
.wzrij.af .wznr{background:var(--groen);color:#fff}
.wzrij.af .wzt{color:var(--grijs2)}
.subkop{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--grijs2);margin:20px 0 4px}
.werkrij:last-of-type{border-bottom:none}
.werkrij .wn{flex:1;font-size:15px;font-weight:500;letter-spacing:-.015em}
.werkrij .wt{font-size:12.5px;font-weight:600;color:var(--grijs2);font-variant-numeric:tabular-nums}
.werkrij.bezig .wn{font-weight:600}
.werkrij.bezig .wt{color:var(--groen)}
/* rapport */
.rapport{width:210mm;min-height:297mm;background:#fff;color:#000;padding:14mm 15mm;box-sizing:border-box;
  font-family:'Inter',sans-serif;font-size:9pt;line-height:1.45}
.rapport .rkop{display:flex;justify-content:space-between;align-items:flex-start;
  border-bottom:.4mm solid #000;padding-bottom:3mm;margin-bottom:5mm}
.rapport .ordlijst{display:flex;flex-direction:column;gap:8px}
.rapport .rmerk{font-size:13pt;font-weight:700;letter-spacing:.12em}
.rapport .rmerk small{display:block;font-size:6.5pt;font-weight:600;letter-spacing:.3em;color:#555;margin-top:.6mm}
.rapport .rtitel{text-align:right;font-size:8pt;color:#333;line-height:1.5}
.rapport .rtitel b{display:block;font-size:11pt;color:#000;letter-spacing:-.01em}
.rapport h3{font-size:8pt;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  margin:6mm 0 2mm;padding-bottom:1mm;border-bottom:.2mm solid #bbb}
.rapport h3:first-of-type{margin-top:0}
.rapport table{width:100%;border-collapse:collapse}
.rapport td,.rapport th{padding:1.4mm 0;vertical-align:top;border-bottom:.15mm solid #e2e2e2;text-align:left}
.rapport th{font-size:7pt;font-weight:700;color:#555;text-transform:uppercase;letter-spacing:.06em}
.rapport td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.rapport td.t{width:16mm;color:#555;font-variant-numeric:tabular-nums}
/* urenstaat heeft smalle kolommen naast elkaar; die hebben lucht nodig */
.rapport table.uren td,.rapport table.uren th{padding-right:4mm}
.rapport table.uren td:last-child,.rapport table.uren th:last-child{padding-right:0}
.rapport .paar{display:grid;grid-template-columns:1fr 1fr;gap:0 10mm}
.rapport .rij{display:flex;justify-content:space-between;gap:6mm;padding:1.3mm 0;border-bottom:.15mm solid #e2e2e2}
.rapport .rij span:first-child{color:#555}
.rapport .rij b{font-weight:600}
.rapport .fout{color:#b02a1c;font-weight:600}
.rapport .let{color:#8a5a09;font-weight:600}
.rapport .leeg{color:#777;padding:1.5mm 0}
.rapport .voet{margin-top:8mm;padding-top:3mm;border-top:.2mm solid #bbb;display:flex;
  justify-content:space-between;font-size:7pt;color:#555}
.rapport .hand{margin-top:10mm;display:flex;gap:12mm}
.rapport .hand div{flex:1;border-top:.2mm solid #000;padding-top:1.5mm;font-size:7pt;color:#555}
/* etiketten */
.etvoorbeeld{background:#fff;border:1px solid var(--lijn);border-radius:14px;padding:16px;margin-bottom:20px;overflow:hidden}
.etiket{font-family:'Inter',sans-serif;color:#000;background:#fff;box-sizing:border-box}
.etiket .en{font-weight:700;letter-spacing:-.02em}
.etiket .er{display:flex;justify-content:space-between;gap:8px}
.etiket .ek{color:#444}
.etiket .eb{font-weight:700}
.wenskaart{width:210mm;height:148mm;background:#fff;position:relative;
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  padding:22mm 26mm;box-sizing:border-box;color:#1a1a1a}
.wktekst{text-align:center;max-width:100%;word-wrap:break-word}
.wkmerk{position:absolute;bottom:14mm;left:0;right:0;text-align:center;
  font-family:'Cormorant Garamond',Georgia,serif;font-size:7.5pt;font-weight:600;
  letter-spacing:.34em;padding-left:.34em;color:#8a8a8a}
.vel.wenskaartvel{width:210mm;height:148mm;padding:0;display:block}

/* ── het factuurdocument: eigen huisstijl, warm en rustig ── */

  padding:22mm 20mm;font-family:'Cormorant Garamond',Georgia,serif;position:relative}
.factuur .fkop{text-align:center;padding-bottom:10mm;border-bottom:.4mm solid #d8cfc4}
.factuur .fmerk{font-size:19pt;font-weight:600;letter-spacing:.34em;padding-left:.34em;color:#3a2f28}
.factuur .fsub{font-family:'Inter',sans-serif;font-size:6.8pt;font-weight:600;letter-spacing:.42em;
  padding-left:.42em;color:#a2907f;margin-top:2.4mm}
.factuur .fmerk img{max-height:16mm;max-width:70mm;object-fit:contain}

.factuur .frij h4{margin:0 0 2mm;font-size:7pt;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;color:#a2907f}
.factuur .ftitel{font-size:15pt;font-weight:600;letter-spacing:.02em;margin:12mm 0 4mm;color:#3a2f28}
.factuur table{width:100%;border-collapse:collapse;font-family:'Inter',sans-serif;font-size:9pt;margin-top:4mm}
.factuur th{text-align:left;font-size:7pt;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:#a2907f;border-bottom:.35mm solid #d8cfc4;padding:0 0 2.4mm}
.factuur td{padding:2.8mm 0;border-bottom:.2mm solid #ece4da;vertical-align:top}
.factuur td.n,.factuur th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.factuur .ftot{margin-top:6mm;margin-left:auto;width:78mm;font-family:'Inter',sans-serif;font-size:9pt}
.factuur .ftot div{display:flex;justify-content:space-between;padding:2mm 0}
.factuur .ftot .eind{border-top:.4mm solid #3a2f28;margin-top:1.5mm;padding-top:3mm;

/* ══════════ Op een groot scherm: zijbalk in plaats van tabbalk ══════════
   Onder de 900 pixels verandert er niets — dan blijft alles zoals op je telefoon. */
@media (min-width:900px){
  body{background:#e9e9ec}
  .app{max-width:1180px;height:100dvh;
    display:grid;grid-template-columns:236px 1fr;grid-template-rows:1fr;
    box-shadow:0 0 90px rgba(0,0,0,.10)}

  /* de zijbalk: de capsule wordt hier weer een gewone kolom */
  nav{grid-column:1;grid-row:1;position:static;display:flex;flex-direction:column;gap:2px;
    background:var(--card);border-top:none;border-right:1px solid var(--lijn);
    padding:96px 14px 20px;overflow-y:auto;pointer-events:auto;justify-content:flex-start}
  nav .tabpil{display:flex;flex-direction:column;gap:2px;width:100%;
    background:none;-webkit-backdrop-filter:none;backdrop-filter:none;
    border-radius:0;padding:0;box-shadow:none}
  nav .tab{flex-direction:row;align-items:center;gap:12px;justify-content:flex-start;
    height:auto;padding:11px 14px;border-radius:12px;font-size:14.5px;font-weight:500;
    letter-spacing:-.015em;text-align:left}
  nav .tab svg{width:19px;height:19px;flex:none}
  nav .tab span{font-size:14.5px;max-width:none;margin-left:0;overflow:visible}
  nav .tab:hover{background:var(--bg)}
  nav .tab.actief{background:var(--ink);color:#fff;padding:11px 14px}
  nav .tab.actief span{font-size:14.5px;margin-left:0}
  main{padding-bottom:64px}

  /* de kop komt boven de zijbalk te staan */
  header{position:absolute;top:0;left:0;width:236px;z-index:5;
    padding:24px 20px 0;background:var(--card)}
  header h1{font-size:17px}
  header .onder{font-size:12.5px}
  header .hbtn.menu{top:22px;right:16px;margin-right:0}

  /* de inhoud krijgt de ruimte */
  main{grid-column:2;grid-row:1;padding:40px 48px 64px;max-width:820px}
  #scherm h1{font-size:34px}
  #scherm .datum{font-size:15px}

  /* twee kolommen waar dat kan */
  .paneel,.kaartje,.hoofdkaart{max-width:640px}
  .ordlijst{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:820px}
  .balken{height:120px}

  /* de bottom-sheet wordt een venster in het midden */
  .overlay{position:fixed;background:rgba(24,24,27,.45)}
  .sheet{position:fixed;left:50%;right:auto;bottom:auto;top:50%;
    transform:translate(-50%,-46%) scale(.98);opacity:0;
    width:min(560px,92vw);max-height:84dvh;border-radius:20px;
    transition:opacity .18s,transform .18s}
  .sheet.open{transform:translate(-50%,-50%) scale(1);opacity:1}
  .sheet .grip{display:none}
  .sheetkop{padding-top:22px}

  /* muisaanwijzer waar je kunt klikken */
  .arij:hover,.ordkaart:hover,.menurij:hover{background:#fafafa}
  .prim:hover{opacity:.92}
}

/* nog breder: meer lucht */
@media (min-width:1300px){
  .app{max-width:1320px;grid-template-columns:260px 1fr}
  header,nav{width:260px}
  main{padding:44px 64px 72px;max-width:900px}
}

  const set=new Set();

  return [...set].sort((a,b)=>a.localeCompare(b,'nl'));

/* welke allergeengroepen zitten in deze smaak? */
function smaakAllergenen(r){
  const set=new Set();
  smaakIngredienten(r).forEach(i=>ingAllerg(i.naam).forEach(k=>set.add(k)));

const claudeOpslag = !!(window.storage && window.storage.get);
function lokaalSchrijf(d){
  const j=JSON.stringify(d);

  }
  try{ const v=localStorage.getItem(SLEUTEL); return v?JSON.parse(v):null }catch(e){ return null }
}

/* --- laag 2: Firebase, zodra je online bent --- */
function fbConfig(){
  if(typeof FIREBASE_CONFIG!=='undefined'&&FIREBASE_CONFIG&&FIREBASE_CONFIG.apiKey) return FIREBASE_CONFIG;
  if(typeof firebaseConfig!=='undefined'&&firebaseConfig&&firebaseConfig.apiKey) return firebaseConfig;
  return null;
}
function firebaseStart(){
  const cfg=fbConfig();
  if(!cfg||typeof firebase==='undefined') return;
  try{
    firebase.initializeApp(cfg);
    fbKlaar=true;
    firebase.database().ref('.info/connected').on('value',s2=>{fbOnline=!!s2.val()});
    firebase.auth().onAuthStateChanged(u=>{
      fbUser=u||null;
      if(fbRef){fbRef.off();fbRef=null}
      if(!u){render();return}
      /* de werkvloer: de Mac schrijft status, de app schrijft opdrachten.
         Klantgegevens blijven op de Mac — hier gaan alleen nummers en fases over. */
      if(fbShop){fbShop.off();fbShop=null}
      fbShop=firebase.database().ref('werkvloer/'+u.uid);
      fbShop.on('value',s3=>{ S.werk=s3.val()||{}; if(S.tab==='orders') render() });
      fbRef=firebase.database().ref('cacaoboetiek/'+u.uid);
      fbRef.on('value',snap=>{
        const d=snap.val();
        if(!d||negeerRemote) return;
        /* alleen overnemen als de server nieuwer is dan wat hier staat */
        if((d.bijgewerkt||0)>(S.bijgewerkt||0)){
          zetData(d); migreerChecks(); migreerBatches(); migreerGrond(); migreerPlanning();
          lokaalSchrijf(d); render();
          toast('Bijgewerkt vanaf je andere apparaat.');
        } else if((S.bijgewerkt||0)>(d.bijgewerkt||0)){
          fbRef.set(pakData()).catch(()=>{});
        }
      });
      render();
    });
  }catch(e){ fbKlaar=false }
}

/* Meet of de app al onder de statusbalk begint. Staat de webview er onder,
   dan heeft iOS die ruimte zelf al gereserveerd en moeten we hem niet nog
   eens optellen. Alleen in een geïnstalleerde app; in de browser blijft
   env() gewoon leidend. */
function meetVeiligBoven(){
  try{
    const staat=window.navigator.standalone===true
      ||(window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches);
    if(!staat) return;
    const scherm=(window.screen&&window.screen.height)||0;
    const zicht=window.innerHeight||0;
    if(!scherm||!zicht) return;
    const alIngesprongen=(scherm-zicht)>20;
    document.documentElement.style.setProperty('--veiligBoven',
      alIngesprongen?'0px':'env(safe-area-inset-top)');
  }catch(e){}
}
meetVeiligBoven();
window.addEventListener('orientationchange',()=>setTimeout(meetVeiligBoven,300));
window.addEventListener('resize',()=>setTimeout(meetVeiligBoven,300));

  if(!S.werkGezet2){
    const onaangeroerd=S.activiteiten.length===WERKOUD.length&&S.activiteiten.every(a=>WERKOUD.includes(a));
    if(onaangeroerd||!S.activiteiten.length) S.activiteiten=WERKVOORSTELLEN.slice();
    else WERKVOORSTELLEN.forEach(a=>{if(!S.activiteiten.includes(a))S.activiteiten.push(a)});
    S.werkGezet=true; S.werkGezet2=true; bewaarNu();
  }
  if(!S.schoonmaakGezet){
    ZONEVOORSTELLEN.forEach(z=>{if(!S.zones.includes(z))S.zones.push(z)});
    MIDDELVOORSTELLEN.forEach(m=>{if(!S.middelen.includes(m))S.middelen.push(m)});
    S.schoonmaakGezet=true; bewaarNu();
  }
  /* wie al aan het werk was houdt zijn eigen instellingen en krijgt geen keuzescherm */
  if(!S.brancheGezet){
    const draaitAl=S.recepten.length||S.batches.length;
    if(draaitAl){ S.brancheGezet=true; bewaarNu(); }
    else setTimeout(()=>{ if(!S.brancheGezet) sheetBranche(true) },600);
  }
  firebaseStart();
}

function lotLijst(b,naam){
  const v=b.lots[naam];
  if(!v) return [];
  if(typeof v==='string') return v.trim()?[v.trim()]:[];
  return v.filter(x=>x&&String(x).trim()).map(x=>String(x).trim());
}

/* leest '10 min', '1 uur', '30 sec' uit een zin en geeft seconden terug */
function leesTijd(t){
  const m=String(t).match(/(\d+(?:[.,]\d+)?)\s*(uur|u\b|minuten|minuut|min\b|seconden|sec\b|s\b)/i);
  if(!m) return 0;
  const n=parseFloat(m[1].replace(',','.')), e=m[2].toLowerCase();
  if(/^u/.test(e)) return Math.round(n*3600);
  if(/^m/.test(e)) return Math.round(n*60);
  return Math.round(n);
}
/* leest '80 °C' of '31,5 C' uit een zin */
function leesGraden(t){
  const tekst=String(t||'');
  /* 31,5 °C · 31.5C · 45 graden · 45° — allemaal geldig */
  const m=tekst.match(/(\d+(?:[.,]\d+)?)\s*(?:°\s*C|°|graden|gr\.|celsius|\bC\b)/i);
  return m?parseFloat(m[1].replace(',','.')):null;
}

/* ingrediënten van één smaak, per bonbon, van zwaar naar licht */
function smaakIngredienten(r){
  const map={};
  (r.onderdelen||[]).forEach(o=>{
    verdeel(o,parseFloat(o.gram)||0).forEach(x=>{if(x.naam)map[x.naam]=(map[x.naam]||0)+x.gram});
  });
  const tot=Object.values(map).reduce((a,b)=>a+b,0)||1;
  return Object.keys(map).map(n=>({naam:n,gram:map[n],pct:map[n]/tot*100}))
    .sort((a,b)=>b.gram-a.gram);
}
function declaratie(r){
  const oud=(r.etiket&&r.etiket.allergenen)||[];
  return smaakIngredienten(r).map(i=>{
    const naam=esc(i.naam)+' '+getal(i.pct)+'%';
    return (isAllergeen(i.naam)||oud.includes(i.naam))?`<b>${naam}</b>`:naam;
  }).join(', ');
}

/* ================= tijdregistratie ================= */
const werkLijst=b=>b.werk=b.werk||[];
const lopendWerk=b=>werkLijst(b).find(w=>!w.eind);
function duurTekst(ms){
  const t=Math.max(0,Math.floor(ms/1000)), u=Math.floor(t/3600), m=Math.floor(t%3600/60), sec=t%60;
  return u?`${u}:${pad(m)}:${pad(sec)}`:`${pad(m)}:${pad(sec)}`;
}
const seconden=w=>Math.max(0,Math.round(((w.eind||Date.now())-w.start)/1000));
function duurKort(sec){
  if(sec<60) return sec+' sec';
  if(sec<3600) return Math.round(sec/60)+' min';
  const u=Math.floor(sec/3600), m=Math.round(sec%3600/60);
  return u+'u '+pad(m);
}
function stopWerk(b){ schermWakker(false);const w=lopendWerk(b); if(w){w.eind=Date.now(); bewaarNu();} return w}
function startWerk(b,act){ stopWerk(b); werkLijst(b).push({id:uid(),act,start:Date.now(),eind:null}); bewaarNu(); schermWakker(true)}
function werkPerActiviteit(b){
  const m={}; werkLijst(b).forEach(w=>{m[w.act]=(m[w.act]||0)+seconden(w)});
  return Object.keys(m).map(a=>({act:a,sec:m[a]})).sort((x,y)=>y.sec-x.sec);
}
const werkTotaal=b=>werkLijst(b).reduce((s,w)=>s+seconden(w),0);

const klusSec=x=>{
  if(x.sec!==undefined&&x.sec!==null) return x.sec;
  if(!x.start) return 0;
  return Math.max(0,Math.round(((x.eind||Date.now())-x.start)/1000));
};
const klusLijst=()=>(S.klussen||[]).slice().sort((a,b)=>
  (b.datum+(b.tijd||'')).localeCompare(a.datum+(a.tijd||'')));

/* de klok loopt; hij overleeft het afsluiten van de app omdat we
   met tijdstempels werken en niet met een teller */
function klusStart(soort,tekst){
  if(S.klus) klusStop();
  S.klus={id:uid(),soort:soort,tekst:tekst||'',start:Date.now(),datum:vandaag(),tijd:nu()};
  bewaarNu(); schermWakker(true); badgeVraag().then(badgeBij);
}
function klusStop(){
  const k=S.klus; if(!k) return null;
  k.eind=Date.now(); k.sec=Math.max(0,Math.round((k.eind-k.start)/1000));
  S.klussen=S.klussen||[];
  if(k.sec>=30) S.klussen.push(k);      /* iets van tien seconden is een misklik */
  S.klus=null; bewaarNu(); schermWakker(false); badgeBij();
  return k;
}
/* uren over een periode; productie-uren tellen mee want die heb je al */
function urenPeriode(van,tot){
  const klus={}, binnen=d=>d>=van&&d<=tot;
  let losSec=0;
  (S.klussen||[]).forEach(x=>{ if(!binnen(x.datum)) return;
    klus[x.soort]=(klus[x.soort]||0)+klusSec(x); losSec+=klusSec(x); });
  let prodSec=0;
  (S.batches||[]).forEach(b=>{
    (werkLijst(b)||[]).forEach(w=>{
      const d=iso(new Date(w.start));
      if(binnen(d)) prodSec+=seconden(w);
    });
  });
  return {klus,losSec,prodSec,totaalSec:losSec+prodSec};
}
const urenTekst=sec=>{
  const u=Math.floor(sec/3600), m=Math.round(sec%3600/60);
  return m===60?(u+1)+'u 00':u+'u '+pad(m);
};
const urenGetal=sec=>Math.round(sec/360)/10;   /* uren met één decimaal */

const jaarEind=()=>new Date().getFullYear()+'-12-31';

/* ================= badge op het app-icoon =================
   iOS laat een PWA geen timer op het vergrendelscherm zetten, maar een badge
   op het icoon mag wel. Dat is genoeg om je eraan te herinneren dat de klok loopt. */
function badgeBij(){
  if(!('setAppBadge' in navigator)) return;
  try{ S.klus ? navigator.setAppBadge(1) : navigator.clearAppBadge() }catch(e){}
}
/* de badge vraagt om notificatietoestemming; dat vragen we één keer,
   op het moment dat het ergens over gaat en niet bij het opstarten */
async function badgeVraag(){
  if(!('setAppBadge' in navigator)) return false;
  if(!('Notification' in window)) return false;
  if(Notification.permission==='granted') return true;
  if(Notification.permission==='denied') return false;
  if(S.badgeGevraagd) return false;
  S.badgeGevraagd=true; bewaarNu();
  try{ return (await Notification.requestPermission())==='granted' }catch(e){ return false }
}



/* een stap timet zichzelf: lopende activiteit pauzeren, na afloop hervatten */
let stapTimer=null;
function startStap(b,naam){
  if(!b||b.status==='klaar') return;
  if(stapTimer&&stapTimer.batchId===b.id&&stapTimer.naam===naam) return;
  stopStap();
  const w=lopendWerk(b);
  stapTimer={batchId:b.id,naam,vorige:w?w.act:null};
  startWerk(b,naam);
}
function stopStap(){
  if(!stapTimer) return;
  const st=stapTimer; stapTimer=null;
  const b=S.batches.find(x=>x.id===st.batchId); if(!b) return;
  const w=stopWerk(b);
  /* alleen een echte misklik weggooien */
  if(w&&(w.eind-w.start)<1500) b.werk=b.werk.filter(x=>x!==w);
  if(st.vorige) startWerk(b,st.vorige);
  bewaarNu();
}

/* ================= batch-logica ================= */
const batch=()=>S.batches.find(b=>b.id===S.batchId);
const recept=id=>S.recepten.find(r=>r.id===id)||{naam:'?',tht:0,onderdelen:[],stappen:[]};
const gramPerBonbon=r=>(r.onderdelen||[]).reduce((s,o)=>s+(parseFloat(o.gram)||0),0);
/* verdeel het gewicht van een onderdeel over zijn ingrediënten, op basis van de verhouding */
function verdeel(o,totaalGram){
  const ing=o.ing||[];
  if(!ing.length) return [];
  if(ing.length===1) return [{naam:ing[0].naam,gram:totaalGram}];
  const som=ing.reduce((s,i)=>s+(parseFloat(i.deel)||0),0);
  if(!som) return ing.map(i=>({naam:i.naam,gram:0}));
  return ing.map(i=>({naam:i.naam,gram:totaalGram*((parseFloat(i.deel)||0)/som)}));
}
const bTel=(b,t)=>b.logs.filter(l=>l.type===t).length;
const lopende=()=>S.batches.filter(b=>b.status==='bezig');
const bTotaal=b=>b.regels.reduce((s,r)=>s+r.aantal,0);
const bMallen=b=>b.regels.reduce((s,r)=>s+(r.mallen||0),0);
/* een batch bewaart zijn eigen kopie van de receptuur, zodat latere wijzigingen
   aan een smaak nooit een afgeronde batch of rapport veranderen */
function receptVan(b,id){
  if(b&&b.recepten&&b.recepten[id]) return b.recepten[id];
  return recept(id);
}
const bPlan=b=>(b&&b.werkplan&&b.werkplan.length)?b.werkplan:S.werkplan;
const bNamen=b=>b.regels.map(r=>receptVan(b,r.receptId).naam).join(' + ');

/* alle ingrediënten van een batch, opgeteld in gram */
function bIngredienten(b){
  const map={};
  b.regels.forEach(rg=>{
    const r=receptVan(b,rg.receptId);
    (r.onderdelen||[]).forEach(o=>{
      verdeel(o,(parseFloat(o.gram)||0)*rg.aantal).forEach(x=>{
        if(!x.naam) return;
        map[x.naam]=(map[x.naam]||0)+x.gram;
      });
    });
  });
  return Object.keys(map).map(n=>({naam:n,hoeveel:map[n],eenheid:'g'}));
}

function batchOpDatum(b,d){
  return b.startDatum===d||b.eindDatum===d||(b.dagen||[]).some(x=>x.datum===d)||b.logs.some(l=>l.datum===d);
}
function alleDatums(){
  const set={};
  S.batches.forEach(b=>{
    if(b.startDatum) set[b.startDatum]=1;
    if(b.eindDatum) set[b.eindDatum]=1;
    (b.dagen||[]).forEach(x=>set[x.datum]=1);
    b.logs.forEach(l=>{if(l.datum)set[l.datum]=1});
  });
  (S.ontvangsten||[]).forEach(x=>{if(x.datum)set[x.datum]=1});
  return Object.keys(set).sort().reverse();
}
const laatsteIjking=()=>(S.ijkingen||[]).slice().sort((a,b)=>a.datum<b.datum?1:-1)[0]||null;

const dagenTot=d=>Math.round((new Date(iso(d))-new Date(vandaag()))/86400000);
function signalen(){
  const uit=[];
  S.batches.forEach(b=>{
    b.logs.filter(l=>l.status==='fout').forEach(l=>uit.push({ernst:'rood',tekst:l.titel,extra:b.code}));
    b.logs.filter(l=>l.status==='let').forEach(l=>uit.push({ernst:'amber',tekst:l.titel,extra:b.code}));
    /* houdbaarheid van wat je al gemaakt hebt */
    if(b.resultaat&&b.resultaat.perSmaak){
      b.resultaat.perSmaak.forEach(ps=>{
        if(!ps.goed) return;
        const r=receptVan(b,ps.receptId), d=thtVan(b,r), n=dagenTot(d);
        if(n>7) return;
        uit.push({ernst:n<0?'rood':'amber',
          tekst:`${ps.goed} bonbons ${r.naam}`,
          extra:n<0?`THT verlopen op ${kort(d)}`:(n===0?'THT is vandaag':`nog ${n} ${n===1?'dag':'dagen'} houdbaar`)});
      });
    }
  });
  const ij=laatsteIjking();
  const maanden=ij?Math.round((new Date(vandaag())-new Date(ij.datum))/2592000000):null;
  if(!ij) uit.push({ernst:'amber',tekst:'Thermometer nog nooit geijkt',extra:'zonder ijking zijn je metingen aanvechtbaar'});
  else if(maanden>=6) uit.push({ernst:'amber',tekst:'Thermometer al '+maanden+' maanden niet geijkt',extra:'laatst op '+kort(new Date(ij.datum))});
  ['ongedierte','recall'].forEach(t=>{
    const o=controleOver(t); if(!o) return;
    uit.push({ernst:'amber',tekst:CTYPES[t].n+(o.nooit?' nog nooit gedaan':' al '+o.dagen+' dagen geleden'),
      extra:'advies: elke '+(CTYPES[t].herhaal===365?'12 maanden':'3 maanden')});
  });
  return uit.sort((a,b)=>(a.ernst==='rood'?0:1)-(b.ernst==='rood'?0:1));
}

/* ================= render =================
   De kop ligt los boven de inhoud. We meten hoe hoog hij is, zetten dat als
   ruimte bovenin de lijst, en schuiven hem bij het scrollen precies zover
   omhoog tot hij uit beeld is. */
let kopHoogte=72, kopVolger=null;
function meetKop(){
  const kop=document.querySelector('header'); if(!kop) return;
  const h=kop.offsetHeight||72;
  if(h!==kopHoogte){
    kopHoogte=h;
    document.documentElement.style.setProperty('--kopHoogte',h+'px');
  }
}
/* de kop verandert van hoogte met een overgang van een kwart seconde; direct
   na het tekenen meet je dus een tussenstand. Even later nog eens kijken. */
let kopTimer=null;
function kopHermeet(){
  clearTimeout(kopTimer);
  kopTimer=setTimeout(()=>{ meetKop(); kopSchuif() },320);
}
function kopSchuif(){
  const kop=document.querySelector('header'), scr=$('#scherm');
  if(!kop||!scr) return;
  /* de hoogte hier vers opvragen: meten we alleen bij het renderen, dan klopt
     het niet meer zodra het lettertype alsnog laadt en de kop groeit. Er bleef
     dan een randje staan. */
  /* de echte hoogte, niet de afgeronde: offsetHeight rondt 131,05 af op 131
     en dan blijft er een streepje van de kop in beeld staan */
  const h=Math.ceil(kop.getBoundingClientRect().height)||kopHoogte;
  if(h!==kopHoogte){ kopHoogte=h; document.documentElement.style.setProperty('--kopHoogte',h+'px'); }
  const y=Math.max(0,Math.min(scr.scrollTop,h));
  kop.style.transform=y?'translate3d(0,'+(-y)+'px,0)':'';
}

let vorigScherm=null;
/* Schermwissel met een echte kruisvervaging (View Transitions, iOS 18+).
   Hetzelfde scherm opnieuw tekenen (opslaan, klok) blijft zonder animatie;
   zonder ondersteuning valt hij terug op de schermIn-fade van v144. */
let vtBezig=false;
function render(){
  const inB=S.tab==='productie'&&S.batchId&&batch();
  const kenmerk=S.tab+(inB?':'+S.batchId:'');
  const wissel=vorigScherm!==null&&kenmerk!==vorigScherm;
  if(wissel&&document.startViewTransition&&!document.hidden&&!vtBezig
     &&!matchMedia('(prefers-reduced-motion: reduce)').matches){
    vtBezig=true;
    try{document.startViewTransition(()=>renderNu()).finished.finally(()=>{vtBezig=false});}
    catch(e){vtBezig=false;renderNu();}
  } else renderNu();
}
function renderNu(){
  const d=S.datum, u=d.getHours();
  const groet=u<12?'Goedemorgen':u<18?'Goedemiddag':'Goedenavond';
  const datumtekst=`${DAG[d.getDay()]} ${d.getDate()} ${MND[d.getMonth()]}`;
  const inBatch=S.tab==='productie'&&S.batchId&&batch();
  $('#btnTerug').style.display=inBatch?'grid':'none';
  $('#btnTerug').style.visibility='visible';

  const kopEl=document.querySelector('header');
  const opDash=S.tab==='dashboard'&&!inBatch;
  kopEl.classList.toggle('gecentreerd',opDash);
  kopEl.classList.remove('donker');
  $('#scherm').classList.remove('opdonker');
  $('#kopKpi').innerHTML='';
  if(!(S.tab==='dashboard'&&!inBatch)||$('#scherm').scrollTop<14) kopEl.classList.remove('klein');
  if(inBatch){
    const b=batch();
    $('#kopTitel').textContent=bNamen(b);
    const dn=dagNummer(b);
    $('#kopOnder').textContent=`${b.code} · dag ${dn} · ${bMallen(b)} ${bMallen(b)===1?'mal':'mallen'} · ${bTotaal(b)} st`;
  } else if(S.tab==='dashboard'){
    $('#kopTitel').innerHTML=merkKop();
    $('#kopOnder').textContent='';
  } else {
    const t=TABS.find(x=>x.key===S.tab)||{};
    $('#kopTitel').textContent=t.label||'';
    $('#kopOnder').textContent=schermOnder(S.tab)||datumtekst;
  }

  /* loopt de urenklok, dan hoort dat op elk tabblad zichtbaar te zijn —
     anders vergeet je hem juist op het tabblad waar je toevallig bent */
  /* alleen bij een echte schermwissel animeren; niet na elke opslag,
     want dan flikkert de hele app bij het minste wat je doet */
  const schermKenmerk=S.tab+(inBatch?':'+S.batchId:'');
  const gewisseld=vorigScherm!==null&&schermKenmerk!==vorigScherm;
  vorigScherm=schermKenmerk;

  $('#scherm').innerHTML = klokbalkHTML() + (inBatch?batchHTML():
    S.tab==='dashboard'?dashboardHTML(): S.tab==='productie'?productieHTML():
    S.tab==='voorraad'?voorraadHTML(): S.tab==='orders'?ordersHTML():
    S.tab==='geld'?geldHTML():straksHTML(S.tab));
  if(gewisseld){
    const el=$('#scherm');
    el.classList.remove('schermIn');
    if(!vtBezig){ void el.offsetWidth; el.classList.add('schermIn'); }
  }
  const balk=balkKeuze();
  /* De balk alleen echt opnieuw bouwen als de samenstelling verandert. Blijft hij
     gelijk, dan wisselen we enkel de actieve knop — dán kan de witte pil
     meebewegen in plaats van verspringen. */
  const balkKenmerk=balk.join('|');
  if($('#tabbar').dataset.kenmerk!==balkKenmerk){
    $('#tabbar').dataset.kenmerk=balkKenmerk;
    $('#tabbar').innerHTML=`<div class="tabpil">
      <button class="tab" data-tab="dashboard" aria-label="Dashboard">${
        svg(I.huis)}<span>Dashboard</span></button>
      ${balk.map(k=>{const it=snelItem(k); if(!it) return '';
        return `<button class="tab" ${
          it.soort==='tab'?`data-tab="${it.key}"`:`data-snel="${it.key}"`}
          aria-label="${esc(it.label)}">${svg(I[it.icon])}<span>${it.label}</span></button>`}).join('')}
      <button class="tab tabmeer" data-meer aria-label="Meer">${svg(I.meer)}<span>Meer</span></button>
    </div>`;
    $$('[data-tab]').forEach(x=>x.onclick=()=>{if(S.tab===x.dataset.tab&&!S.batchId)return;
      S.tab=x.dataset.tab;S.batchId=null;S.open=null;render();$('#scherm').scrollTop=0});
    $$('[data-snel]').forEach(x=>x.onclick=()=>{const it=snelItem(x.dataset.snel); if(it&&it.doe) it.doe()});
    $$('[data-meer]').forEach(x=>x.onclick=sheetMeer);
  }
  $$('#tabbar .tab').forEach(x=>{
    const k=x.dataset.tab;
    x.classList.toggle('actief', !!k && k===S.tab);
  });
  bind();
  meetKop(); kopSchuif();
  kopHermeet();
}
