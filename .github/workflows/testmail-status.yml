name: Testmail status
on: workflow_dispatch
jobs:
  lees:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Status lezen
        env:
          FIREBASE_SLEUTEL: ${{ secrets.FIREBASE_SLEUTEL }}
        run: |
          printf '%s' "$FIREBASE_SLEUTEL" > "$RUNNER_TEMP/s.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/s.json"
          npm i -g firebase-tools >/dev/null 2>&1
          echo "STATUS $(firebase database:get /geheim/_systeem/testmailDrop8 --project cacaoboetiek-hq 2>&1 | tail -3)"
          firebase functions:log --only testmailDrop8 --project cacaoboetiek-hq 2>&1 | tail -15 | sed 's/^/LOG /'
          rm -f "$RUNNER_TEMP/s.json"
