<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cacaoboetiek HQ</title>
<meta name="theme-color" content="#18181b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cacaoboetiek">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500;600;700&family=Petit+Formal+Script&family=Caveat:wght@400;500&family=Parisienne&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#18181b; --ink2:#3f3f46; --grijs:#71717a; --grijs2:#a1a1aa; --grijs3:#d4d4d8;
  --bg:#f4f4f5; --lijn:#ececee; --card:#fff;
  --groen:#15803d; --amber:#b45309; --rood:#c0392b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{margin:0;padding:0}
body{-webkit-text-size-adjust:100%;text-size-adjust:100%;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:#e8e8ea;color:var(--ink);-webkit-font-smoothing:antialiased}
button,input,textarea{font-family:inherit;font-size:16px;color:inherit}
button{cursor:pointer;border:none;background:none;padding:0;text-align:left}

.app{position:relative;width:100%;max-width:440px;margin:0 auto;height:100dvh;background:var(--bg);
  display:flex;flex-direction:column;overflow:hidden;box-shadow:0 0 70px rgba(0,0,0,.10)}

header{flex:none;padding:calc(20px + env(safe-area-inset-top)) 20px 4px;display:flex;align-items:flex-start;gap:12px}
header h1{margin:0;font-size:21px;font-weight:600;letter-spacing:-.035em;line-height:1.2}
header.gecentreerd{position:relative;display:block;padding:calc(20px + env(safe-area-inset-top)) 20px 20px;border-bottom:1px solid var(--lijn);
  transition:padding .24s cubic-bezier(.32,.72,0,1),border-color .24s ease}
header.gecentreerd.klein{padding:calc(12px + env(safe-area-inset-top)) 20px 12px}
header.gecentreerd.klein .hbtn.menu{top:calc(6px + env(safe-area-inset-top))}
header.gecentreerd .vlak{text-align:center}
header.gecentreerd .onder{display:none}
header.gecentreerd .hbtn.terug{display:none}
header.gecentreerd .hbtn.menu{position:absolute;top:calc(14px + env(safe-area-inset-top));right:12px;margin:0}

.merk{display:block;font-family:'Cormorant Garamond',Georgia,serif;font-size:21px;font-weight:600;
  letter-spacing:.16em;line-height:1;color:var(--ink);padding-left:.16em;
  transition:font-size .24s cubic-bezier(.32,.72,0,1),letter-spacing .24s ease}
header.klein .merk{font-size:15px;letter-spacing:.12em;padding-left:.12em}
.merk small{display:block;font-family:'Inter',sans-serif;font-size:7.5px;font-weight:600;
  letter-spacing:.38em;color:var(--grijs2);margin-top:8px;padding-left:.38em;overflow:hidden;max-height:12px;
  transition:opacity .16s ease,max-height .24s cubic-bezier(.32,.72,0,1),margin-top .24s ease}
header.klein .merk small{opacity:0;max-height:0;margin-top:0}
.merklogo{display:block;margin:0 auto;max-width:200px;max-height:52px;width:auto;height:auto;object-fit:contain;
  transition:max-height .24s cubic-bezier(.32,.72,0,1)}
header.klein .merklogo{max-height:30px}
.logovak{border:1px dashed var(--grijs3);border-radius:14px;background:var(--bg);padding:18px;
  display:grid;place-items:center;min-height:104px;margin:0 0 14px}
.logovak img{max-width:100%;max-height:68px;object-fit:contain}
.logovak .geenlogo{font-size:13.5px;color:var(--grijs2);text-align:center;line-height:1.5}
header .onder{margin-top:4px;font-size:14px;font-weight:450;color:var(--grijs);letter-spacing:-.01em}
header .vlak{flex:1;min-width:0}

/* de donkere kopband op het dashboard, met de dagcijfers erin */
header.donker{background:var(--ink);border-bottom-color:transparent}
header.donker .merk{color:#fff}
header.donker .merk small{color:#a1a1aa}
header.donker .hbtn{color:#a1a1aa}
.kpi{display:none;text-align:left;margin-top:20px;
  transition:opacity .2s ease,max-height .24s cubic-bezier(.32,.72,0,1),margin-top .24s ease}
header.donker .kpi{display:block}
.kstrook{display:flex;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.kstrook::-webkit-scrollbar{display:none}
header.donker.klein .kpi{opacity:0;max-height:0;margin-top:0;overflow:hidden}
.kcel{flex:none;padding-right:26px;min-width:76px}
.kcel .kl{font-size:11.5px;font-weight:600;color:#a1a1aa;letter-spacing:.02em;white-space:nowrap}
.kcel .kw{font-size:21px;font-weight:600;color:#fff;letter-spacing:-.035em;margin-top:5px;
  font-variant-numeric:tabular-nums;white-space:nowrap}
.kcel .kw.nul{color:#6b6b73}
.kcel .kw em{font-style:normal;font-size:13px;font-weight:500;color:#71717a;margin-left:5px}
.kbalk{height:5px;border-radius:99px;background:#27272a;overflow:hidden;margin-top:16px}
.kbalk span{display:block;height:100%;border-radius:99px;background:#fff;
  transition:width .4s cubic-bezier(.32,.72,0,1)}
header.donker.klein .kbalk{opacity:0;max-height:0;margin-top:0}

/* het lichte vlak schuift over de donkere band heen */
main.opdonker{border-radius:22px 22px 0 0;margin-top:-18px;padding-top:28px;position:relative;z-index:2}

/* snelacties: dezelfde capsuletaal als de tabbalk */
.snelrij{display:flex;gap:8px;overflow-x:auto;margin:0 -20px;padding:2px 20px 4px;
  scrollbar-width:none;-webkit-overflow-scrolling:touch}
.snelrij::-webkit-scrollbar{display:none}
.snelknop{flex:none;display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 16px;
  border-radius:99px;background:var(--card);border:1px solid var(--lijn);
  font-size:14px;font-weight:600;letter-spacing:-.015em;color:var(--ink2);white-space:nowrap;
  box-shadow:0 1px 2px rgba(24,24,27,.03),0 10px 22px -18px rgba(24,24,27,.2)}
.snelknop svg{width:16px;height:16px;stroke-width:1.9;color:var(--grijs);flex:none}
.snelknop:active{background:var(--bg)}

/* verpakking als raster: kleuren onder elkaar, maten naast elkaar */
.vraster{display:grid;grid-template-columns:1fr repeat(auto-fit,minmax(58px,68px));
  align-items:stretch;padding:0 14px 10px}
.vrhoek{height:34px}
.vrmaat{height:34px;display:grid;place-items:center;font-size:12px;font-weight:700;
  color:var(--grijs2);letter-spacing:.02em}
.vrmaat small{font-size:9.5px;font-weight:600;margin-left:2px;opacity:.75}
.vrkleur{display:flex;align-items:center;font-size:14.5px;font-weight:500;letter-spacing:-.015em;
  padding:0 8px 0 2px;min-height:46px;border-top:1px solid var(--lijn)}
.vrcel{display:grid;place-items:center;min-height:46px;border-top:1px solid var(--lijn);
  font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink);
  border-radius:0;text-align:center}
.vrcel.leeg{color:var(--grijs3);font-weight:500}
.vrcel.amber{color:var(--amber)} .vrcel.rood{color:var(--rood)}
.vrcel:active{background:var(--bg)}
.hbtn{width:34px;height:32px;border-radius:99px;display:grid;place-items:center;color:var(--grijs);flex:none;margin-top:2px}
.hbtn svg{width:18px;height:18px}
.hbtn.terug{margin-left:-8px}
.hbtn.menu{margin-right:-8px}

main{flex:1;overflow-y:auto;padding:20px 20px 32px;-webkit-overflow-scrolling:touch}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--grijs2)}
.blokkop{display:flex;align-items:baseline;gap:12px;margin:32px 2px 12px}
.blokkop .eyebrow{flex:1}
.blokkop .tel{font-size:12.5px;font-weight:600;color:var(--grijs2);letter-spacing:-.01em}
.paneel{background:var(--card);border-radius:18px;border:1px solid var(--lijn);overflow:hidden;
  box-shadow:0 1px 2px rgba(24,24,27,.03),0 12px 26px -20px rgba(24,24,27,.18)}

.balk{display:flex;gap:4px;margin:16px 0 12px}
.balk.top{margin:0 0 8px}
.seg{flex:1;height:3px;border-radius:99px;background:var(--grijs3)}
.seg.vol{background:var(--ink)}
.stap{font-size:12.5px;font-weight:600;color:var(--grijs2);letter-spacing:-.01em}
.hoofdkaart{background:var(--card);border-radius:18px;padding:20px;
  box-shadow:0 1px 2px rgba(24,24,27,.04),0 14px 30px -18px rgba(24,24,27,.22)}
.hoofdkaart h2{margin:8px 0 0;font-size:21px;font-weight:600;letter-spacing:-.03em;line-height:1.2}
.hoofdkaart .sub{margin:8px 0 0;font-size:14px;color:var(--grijs);line-height:1.5}
.loopt{display:flex;align-items:center;gap:8px;margin-top:16px;padding:12px 12px;border-radius:14px;background:var(--bg)}
.loopt .ln{flex:1;font-size:14px;font-weight:600;letter-spacing:-.015em}
.loopt .lt{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.loopt .tp{width:8px;height:8px;border-radius:99px;background:#22c55e;flex:none;animation:pols 2s infinite}
.prim{width:100%;height:48px;border-radius:14px;background:var(--ink);color:#fff;font-size:15px;
  font-weight:600;margin-top:20px;display:flex;align-items:center;justify-content:center;gap:8px;letter-spacing:-.01em}
.prim:active{opacity:.85}
.prim svg{width:16px;height:16px;stroke-width:2.2}
.prim.los{margin-top:0}
.knop2{width:100%;height:48px;border-radius:14px;background:var(--card);border:1px solid var(--lijn);
  font-size:15px;font-weight:600;margin-top:12px;display:flex;align-items:center;justify-content:center;gap:8px;letter-spacing:-.01em}
.knop2:active{background:var(--bg)}
.knop2 svg{width:16px;height:16px;stroke-width:2.2}
.hoofdkaart.klaar{box-shadow:none;border:1px solid var(--lijn);text-align:center;padding:24px 20px}
.hoofdkaart.klaar h2{font-size:21px}
.vinkje{width:40px;height:40px;border-radius:99px;background:var(--bg);color:var(--groen);display:grid;place-items:center;margin:0 auto 2px}
.vinkje svg{width:19px;height:20px}

.rij{display:flex;align-items:center;gap:12px;width:100%;padding:16px 16px;border-bottom:1px solid var(--lijn)}
.paneel .rij:last-child{border-bottom:none}
.rij .tekst{flex:1;min-width:0}
.rij .t1{font-size:15px;font-weight:500;letter-spacing:-.015em;display:block}
.rij .t2{font-size:12.5px;color:var(--grijs2);margin-top:4px;line-height:1.4;display:block}
.rij .rechts{font-size:12.5px;font-weight:600;color:var(--ink2);flex:none;text-align:right;letter-spacing:-.01em}
.rij .rechts em{display:block;font-style:normal;font-weight:500;color:var(--grijs2);margin-top:4px}
.rij .rechts.bezig{color:var(--amber)} .rij .rechts.klaar{color:var(--groen)}
.pijl{width:14px;height:14px;color:var(--grijs3);flex:none;transition:transform .25s}
.stip{width:7px;height:7px;border-radius:99px;flex:none;margin:0 2px}
.stip.amber{background:var(--amber)} .stip.rood{background:var(--rood)} .stip.groen{background:var(--groen)}
.meer{width:100%;padding:12px 16px;font-size:14px;font-weight:600;color:var(--grijs);text-align:center;border-top:1px solid var(--lijn)}

.arij{display:flex;align-items:center;gap:12px;width:100%;padding:16px 20px;border-bottom:1px solid var(--lijn)}
.groep:last-child .arij{border-bottom:none}
.arij .naam{flex:1;font-size:15px;font-weight:500;letter-spacing:-.015em}
.arij .bol{width:20px;height:20px;border-radius:99px;border:1.5px solid #d8d8dc;flex:none;
  display:grid;place-items:center;color:transparent}
.arij .bol.leeg{border-color:transparent}

/* de route: stappen zijn verbonden, je ziet waar je bent */
.groep.inroute{position:relative}
.groep.inroute::before{content:'';position:absolute;left:29px;top:0;bottom:0;width:2px;background:#e9e9ec}
.groep.inroute:first-child::before{top:24px}
.groep.inroute:last-of-type::before{bottom:calc(100% - 26px)}
.arij .rmark{width:20px;height:20px;border-radius:99px;flex:none;display:grid;place-items:center;
  position:relative;z-index:1;background:#fff;border:2px solid #e0e0e4;color:transparent}
.arij.rgedaan .rmark{background:var(--ink);border-color:var(--ink);color:#fff}
.arij.rnu .rmark{border-color:var(--ink);box-shadow:0 0 0 4px rgba(24,24,27,.09)}
.arij.rnu .rmark::after{content:'';width:8px;height:8px;border-radius:99px;background:var(--ink)}
.arij .rmark svg{width:11px;height:11px}
.arij.rstraks .naam{color:var(--grijs2)}
.arij.rstraks .waarde{color:var(--grijs3)}
.arij.rnu .naam{font-weight:600}
.arij .bol svg{width:11px;height:11px}
.arij .naam small{display:block;font-size:11px;font-weight:600;color:var(--grijs3);margin-top:4px;letter-spacing:.03em;text-transform:uppercase}
.arij .waarde{font-size:14px;font-weight:500;color:var(--grijs2);letter-spacing:-.01em}
.arij .waarde.gevuld{color:var(--ink2)}
.groep.open .arij{border-bottom:none}
.groep.open .pijl{transform:rotate(90deg);color:var(--grijs)}
.uit{max-height:0;overflow:hidden;transition:max-height .35s ease}
.groep.open .uit{max-height:2200px}
.uitin{padding:0 20px 8px;border-bottom:1px solid var(--lijn)}
.groep:last-child .uitin{border-bottom:none}
.item{display:flex;gap:12px;align-items:baseline;padding:8px 0}
.item .t{font-size:12.5px;font-weight:600;color:var(--grijs2);font-variant-numeric:tabular-nums;flex:none;width:38px}
.item .b{flex:1;font-size:14px;line-height:1.45;color:var(--ink2);font-weight:450}
.item .b em{font-style:normal;display:block;color:var(--grijs2);font-size:12.5px;margin-top:2px}
.item.let .b{color:var(--amber)} .item.fout .b{color:var(--rood)}
.geen{font-size:14px;color:var(--grijs2);padding:8px 0 12px;line-height:1.5}
.toevoeg{display:flex;align-items:center;gap:8px;padding:12px 0 16px;font-size:14px;font-weight:600;color:var(--ink);width:100%}
.toevoeg svg{width:14px;height:14px}

/* receptuitwerking */
.uw{padding:4px 0 12px}
.uwkop{display:flex;align-items:baseline;gap:8px;padding:12px 0 8px;border-bottom:1px solid var(--lijn)}
.uwkop .n{flex:1;font-size:15px;font-weight:600;letter-spacing:-.015em}
.uwkop .a{font-size:12.5px;font-weight:600;color:var(--grijs2);font-variant-numeric:tabular-nums}
.uwrij{display:flex;align-items:baseline;gap:12px;padding:8px 0}
.uwrij .n{flex:1;font-size:14px;font-weight:450;color:var(--ink2)}
.uwrij .h{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.uwstap{display:flex;gap:12px;padding:8px 0;font-size:14px;line-height:1.5;color:var(--ink2)}
.uwstap .n{flex:none;width:16px;font-weight:700;color:var(--grijs3);font-variant-numeric:tabular-nums}
.uwtot{background:var(--bg);border-radius:14px;padding:12px 16px;margin-top:12px}
.uwtot .kop{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--grijs2);margin-bottom:8px}

.snel{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.snelknop{background:var(--card);border:1px solid var(--lijn);border-radius:18px;padding:16px 16px;display:flex;align-items:center;gap:12px}
.snelknop:active{background:var(--bg)}

/* verpakking als raster: kleuren onder elkaar, maten naast elkaar */
.vraster{display:grid;grid-template-columns:1fr repeat(auto-fit,minmax(58px,68px));
  align-items:stretch;padding:0 14px 10px}
.vrhoek{height:34px}
.vrmaat{height:34px;display:grid;place-items:center;font-size:12px;font-weight:700;
  color:var(--grijs2);letter-spacing:.02em}
.vrmaat small{font-size:9.5px;font-weight:600;margin-left:2px;opacity:.75}
.vrkleur{display:flex;align-items:center;font-size:14.5px;font-weight:500;letter-spacing:-.015em;
  padding:0 8px 0 2px;min-height:46px;border-top:1px solid var(--lijn)}
.vrcel{display:grid;place-items:center;min-height:46px;border-top:1px solid var(--lijn);
  font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink);
  border-radius:0;text-align:center}
.vrcel.leeg{color:var(--grijs3);font-weight:500}
.vrcel.amber{color:var(--amber)} .vrcel.rood{color:var(--rood)}
.vrcel:active{background:var(--bg)}
.snelknop svg{width:19px;height:20px;color:var(--grijs);flex:none;stroke-width:1.7}
.snelknop span{font-size:14px;font-weight:500;letter-spacing:-.015em;line-height:1.25}
.cijfers{display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border:1px solid var(--lijn);border-radius:18px;overflow:hidden}
.ccel{padding:16px 8px;text-align:center;border-right:1px solid var(--lijn)}
.ccel:last-child{border-right:none}
.ccel .w{font-size:17px;font-weight:600;letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.ccel .w.nul{color:var(--grijs3)}
.ccel .l{font-size:11px;font-weight:600;color:var(--grijs2);margin-top:4px;letter-spacing:.03em}

.dagkaart{background:var(--card);border:1px solid var(--lijn);border-radius:18px;padding:20px}
.dagtop{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.daggetal{font-size:34px;font-weight:600;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.daggetal.nul{color:var(--grijs3)}
.dageenheid{font-size:15px;font-weight:500;color:var(--grijs);letter-spacing:-.01em;margin-left:8px}
.dagpct{font-size:14px;font-weight:600;color:var(--grijs2);font-variant-numeric:tabular-nums}
.dagbalk{height:6px;border-radius:99px;background:var(--bg);overflow:hidden;margin:14px 0 10px}
.dagbalk span{display:block;height:100%;border-radius:99px;background:var(--ink);
  transition:width .4s cubic-bezier(.32,.72,0,1)}
.dagonder{font-size:13.5px;color:var(--grijs);letter-spacing:-.01em}
.dagstatus{display:flex;align-items:center;gap:9px;margin-top:16px;padding-top:14px;
  border-top:1px solid var(--lijn);font-size:13.5px;font-weight:500;color:var(--ink2);letter-spacing:-.01em}
.rustig{text-align:center;padding:24px 20px}
.rustig .ico{width:40px;height:40px;border-radius:99px;background:var(--bg);color:var(--groen);display:grid;place-items:center;margin:0 auto 12px}
.rustig .ico svg{width:19px;height:20px}
.rustig p{margin:0;font-size:14px;color:var(--grijs);line-height:1.55}
.voet{margin-top:24px;display:flex;flex-direction:column;gap:2px}
.voet button{font-size:14px;font-weight:600;color:var(--grijs);width:100%;text-align:center;padding:12px}

.straks h2{margin:0 0 8px;font-size:21px;font-weight:600;letter-spacing:-.035em}
.straks .intro{margin:0 0 20px;font-size:14px;color:var(--grijs);line-height:1.55}
.straks .num{width:20px;font-size:12.5px;font-weight:700;color:var(--grijs3);font-variant-numeric:tabular-nums;flex:none}
.wachtlabel{display:inline-flex;align-items:center;gap:8px;margin-top:20px;padding:8px 16px;border-radius:99px;
  background:var(--card);border:1px solid var(--lijn);font-size:12.5px;font-weight:600;color:var(--grijs)}
.wachtlabel .stip{background:var(--grijs3)}

/* de tabbalk zweeft als een capsule boven de inhoud, zoals in de Shopify-app.
   Alleen de tab waar je bent laat zijn naam zien; de rest is een icoon. */
nav{flex:none;position:absolute;left:0;right:0;z-index:30;
  bottom:calc(10px + env(safe-area-inset-bottom));
  display:flex;justify-content:center;pointer-events:none;background:none;border:none;padding:0}
.tabpil{display:flex;align-items:center;gap:2px;pointer-events:auto;
  background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
  border-radius:99px;padding:6px;box-shadow:0 6px 24px rgba(24,24,27,.13),0 1px 3px rgba(24,24,27,.08)}
.tab{display:flex;align-items:center;gap:0;color:var(--grijs2);height:42px;padding:0 12px;
  border-radius:99px;white-space:nowrap;
  transition:background .22s ease,padding .22s cubic-bezier(.32,.72,0,1),color .22s ease}

.et-partij .body{flex:1;display:flex;position:relative;min-height:0}
.et-partij .qrvak{width:25mm;flex:none;display:flex;align-items:center;justify-content:center;
  border-right:.25mm dashed #9a9a9a}
.et-partij .kerf{position:absolute;top:-1.4mm;width:2.8mm;height:2.8mm;background:#fff;
  border:.25mm solid #b0b0b0;border-radius:50%;z-index:3}
.et-partij .kerf.l{left:-1.4mm}
.et-partij .kerf.r{right:-1.4mm}
.et-partij .gegevens{flex:1;min-width:0;padding:2.2mm 2.8mm 2.2mm;display:flex;flex-direction:column;justify-content:space-between}
.et-partij .en{font-size:9.5pt;font-weight:700;letter-spacing:-.02em;line-height:1.12;
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.et-partij .sub{font-size:6.2pt;color:#6a6a6a;letter-spacing:.02em;margin-top:.5mm;line-height:1.2}
.et-partij .raster{display:flex;gap:2mm;align-items:flex-end}
.et-partij .cel{min-width:0}
.et-partij .cel.rechts{margin-left:auto;text-align:right;flex:none}
.et-partij .k{font-size:5.2pt;font-weight:700;letter-spacing:.14em;color:#767676;line-height:1.5}
.et-partij .v{font-size:8.5pt;font-weight:700;letter-spacing:-.01em;line-height:1.15;white-space:nowrap}
.et-partij .v.groot{font-size:12pt;letter-spacing:-.03em}
.et-partij .streep{height:.2mm;background:#d5d5d5;margin:1.4mm 0}
.et-partij .lotv{font-size:7pt;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:0;white-space:nowrap}
.et-partij .qr{display:block}
.et-product{width:99.1mm;height:67.7mm;padding:4mm;display:flex;flex-direction:column;gap:1.2mm}
.et-product .en{font-size:11pt}
.et-product .ing{font-size:6.5pt;line-height:1.3}
.et-product .r{font-size:6.5pt;line-height:1.35}
.et-product .voet{margin-top:auto;font-size:6pt;line-height:1.3;color:#333;border-top:.3mm solid #ccc;padding-top:1.2mm}
.schaal{transform-origin:top left}
.stickerblok{display:flex;align-items:center;gap:12px;width:100%;margin-top:12px;padding:8px 12px;
  background:#fff;border:1px solid var(--lijn);border-radius:14px;text-align:left;cursor:pointer;font:inherit}
.stickerblok:active{background:#fafafa}
.qrmini{width:26px;height:24px;flex:none;display:block;opacity:.9}
.qrmini svg{width:26px!important;height:24px!important;display:block}
.sbnaam{flex:1;min-width:0;font:600 15px Inter,sans-serif;color:var(--ink);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sbaant{font:600 15px Inter,sans-serif;color:var(--grijs);flex:none}
.stickerblok>svg{width:16px;height:16px;color:#a1a1aa;flex:none}
#printvel{display:none}
.vel.postnl{width:152mm;height:102mm;padding:2.5mm;box-sizing:border-box;
  display:grid;grid-template-columns:repeat(2,73mm);grid-template-rows:repeat(2,47mm);
  gap:1mm;justify-content:center;align-content:center}
.vel.a4{width:210mm;height:297mm;padding:8mm;box-sizing:border-box;
  display:grid;grid-template-columns:repeat(2,73mm);grid-template-rows:repeat(5,47mm);
  gap:2mm;justify-content:center;align-content:start}
.vel.postnl .etiket,.vel.a4 .etiket{outline:.12mm dashed #b8b8b8;outline-offset:0}
@media print{
  html,body{background:#fff!important;margin:0!important;padding:0!important;height:auto!important}
  .app{display:none!important}
  #printvel{display:block!important;position:static!important}
  .vel{page-break-after:always}
  .vel:last-child{page-break-after:auto}
  .rapport{width:auto!important;min-height:0!important;padding:0!important}
  .vel .etiket{border:none}
  @page{size:A4;margin:8mm}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ══════════ Op een groot scherm: zijbalk in plaats van tabbalk ══════════
   Onder de 900 pixels verandert er niets — dan blijft alles zoals op je telefoon. */
@media (min-width:900px){
  body{background:#e9e9ec}
  .app{max-width:1180px;height:100dvh;
    display:grid;grid-template-columns:236px 1fr;grid-template-rows:1fr;
    box-shadow:0 0 90px rgba(0,0,0,.10)}

  /* de zijbalk: de capsule wordt hier weer een gewone kolom */
  nav{grid-column:1;grid-row:1;position:static;display:flex;flex-direction:column;gap:2px;
    background:var(--card);border-top:none;border-right:1px solid var(--lijn);
    padding:96px 14px 20px;overflow-y:auto;pointer-events:auto;justify-content:flex-start}
  nav .tabpil{display:flex;flex-direction:column;gap:2px;width:100%;
    background:none;-webkit-backdrop-filter:none;backdrop-filter:none;
    border-radius:0;padding:0;box-shadow:none}
  nav .tab{flex-direction:row;align-items:center;gap:12px;justify-content:flex-start;
    height:auto;padding:11px 14px;border-radius:12px;font-size:14.5px;font-weight:500;
    letter-spacing:-.015em;text-align:left}
  nav .tab svg{width:19px;height:19px;flex:none}
  nav .tab span{font-size:14.5px;max-width:none;margin-left:0;overflow:visible}
  nav .tab:hover{background:var(--bg)}
  nav .tab.actief{background:var(--ink);color:#fff;padding:11px 14px}
  nav .tab.actief span{font-size:14.5px;margin-left:0}
  main{padding-bottom:64px}

  /* de kop komt boven de zijbalk te staan */
  header{position:absolute;top:0;left:0;width:236px;z-index:5;
    padding:24px 20px 0;background:var(--card)}
  header h1{font-size:17px}
  header .onder{font-size:12.5px}
  header .hbtn.menu{top:22px;right:16px;margin-right:0}

  /* de inhoud krijgt de ruimte */
  main{grid-column:2;grid-row:1;padding:40px 48px 64px;max-width:820px}
  #scherm h1{font-size:34px}
  #scherm .datum{font-size:15px}

  /* twee kolommen waar dat kan */
  .paneel,.kaartje,.hoofdkaart{max-width:640px}
  .ordlijst{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:820px}
  .balken{height:120px}

  /* de bottom-sheet wordt een venster in het midden */
  .overlay{position:fixed;background:rgba(24,24,27,.45)}
  .sheet{position:fixed;left:50%;right:auto;bottom:auto;top:50%;
    transform:translate(-50%,-46%) scale(.98);opacity:0;
    width:min(560px,92vw);max-height:84dvh;border-radius:20px;
    transition:opacity .18s,transform .18s}
  .sheet.open{transform:translate(-50%,-50%) scale(1);opacity:1}
  .sheet .grip{display:none}
  .sheetkop{padding-top:22px}

  /* muisaanwijzer waar je kunt klikken */
  .arij:hover,.ordkaart:hover,.menurij:hover{background:#fafafa}
  .prim:hover{opacity:.92}
}

/* nog breder: meer lucht */
@media (min-width:1300px){
  .app{max-width:1320px;grid-template-columns:260px 1fr}
  header,nav{width:260px}
  main{padding:44px 64px 72px;max-width:900px}
}

/* alle ingredientnamen die in je recepten voorkomen */
function alleIngredienten(){
  const set=new Set();
  (S.recepten||[]).forEach(r=>(r.onderdelen||[]).forEach(o=>
    (o.ing||[]).forEach(i=>{if(i.naam&&i.naam.trim())set.add(i.naam.trim())})));
  return [...set].sort((a,b)=>a.localeCompare(b,'nl'));
}

function fbConfig(){
  if(typeof FIREBASE_CONFIG!=='undefined'&&FIREBASE_CONFIG&&FIREBASE_CONFIG.apiKey) return FIREBASE_CONFIG;
  if(typeof firebaseConfig!=='undefined'&&firebaseConfig&&firebaseConfig.apiKey) return firebaseConfig;
  return null;
}
function firebaseStart(){
  const cfg=fbConfig();
  if(!cfg||typeof firebase==='undefined') return;
  try{
    firebase.initializeApp(cfg);
    fbKlaar=true;
    firebase.database().ref('.info/connected').on('value',s2=>{fbOnline=!!s2.val()});
    firebase.auth().onAuthStateChanged(u=>{
      fbUser=u||null;
      if(fbRef){fbRef.off();fbRef=null}
      if(!u){render();return}
      /* de werkvloer: de Mac schrijft status, de app schrijft opdrachten.
         Klantgegevens blijven op de Mac — hier gaan alleen nummers en fases over. */
      if(fbShop){fbShop.off();fbShop=null}
      fbShop=firebase.database().ref('werkvloer/'+u.uid);
      fbShop.on('value',s3=>{ S.werk=s3.val()||{}; if(S.tab==='orders') render() });
      fbRef=firebase.database().ref('cacaoboetiek/'+u.uid);
      fbRef.on('value',snap=>{
        const d=snap.val();
        if(!d||negeerRemote) return;
        /* alleen overnemen als de server nieuwer is dan wat hier staat */
        if((d.bijgewerkt||0)>(S.bijgewerkt||0)){
          zetData(d); migreerChecks(); migreerBatches(); migreerGrond(); lokaalSchrijf(d); render();
          toast('Bijgewerkt vanaf je andere apparaat.');
        } else if((S.bijgewerkt||0)>(d.bijgewerkt||0)){
          fbRef.set(pakData()).catch(()=>{});
        }
      });
      render();
    });
  }catch(e){ fbKlaar=false }
}

  if(!S.planGezet){ S.werkplan=WERKPLAN.slice(); S.planGezet=true; bewaarNu(); }
  if(!S.werkGezet2){
    const onaangeroerd=S.activiteiten.length===WERKOUD.length&&S.activiteiten.every(a=>WERKOUD.includes(a));
    if(onaangeroerd||!S.activiteiten.length) S.activiteiten=WERKVOORSTELLEN.slice();
    else WERKVOORSTELLEN.forEach(a=>{if(!S.activiteiten.includes(a))S.activiteiten.push(a)});
    S.werkGezet=true; S.werkGezet2=true; bewaarNu();
  }
  if(!S.schoonmaakGezet){
    ZONEVOORSTELLEN.forEach(z=>{if(!S.zones.includes(z))S.zones.push(z)});
    MIDDELVOORSTELLEN.forEach(m=>{if(!S.middelen.includes(m))S.middelen.push(m)});
    S.schoonmaakGezet=true; bewaarNu();
  }
  /* wie al aan het werk was houdt zijn eigen instellingen en krijgt geen keuzescherm */
  if(!S.brancheGezet){
    const draaitAl=S.recepten.length||S.batches.length;
    if(draaitAl){ S.brancheGezet=true; bewaarNu(); }
    else setTimeout(()=>{ if(!S.brancheGezet) sheetBranche(true) },600);
  }
  firebaseStart();
}

/* leest '10 min', '1 uur', '30 sec' uit een zin en geeft seconden terug */
function leesTijd(t){
  const m=String(t).match(/(\d+(?:[.,]\d+)?)\s*(uur|u\b|minuten|minuut|min\b|seconden|sec\b|s\b)/i);
  if(!m) return 0;
  const n=parseFloat(m[1].replace(',','.')), e=m[2].toLowerCase();
  if(/^u/.test(e)) return Math.round(n*3600);
  if(/^m/.test(e)) return Math.round(n*60);
  return Math.round(n);
}
/* leest '80 °C' of '31,5 C' uit een zin */
function leesGraden(t){
  const m=String(t).match(/(\d+(?:[.,]\d+)?)\s*(?:°\s*)?C(?![a-z])/i);
  return m?parseFloat(m[1].replace(',','.')):null;
}

/* ingrediënten van één smaak, per bonbon, van zwaar naar licht */
function smaakIngredienten(r){
  const map={};
  (r.onderdelen||[]).forEach(o=>{
    verdeel(o,parseFloat(o.gram)||0).forEach(x=>{if(x.naam)map[x.naam]=(map[x.naam]||0)+x.gram});
  });
  const tot=Object.values(map).reduce((a,b)=>a+b,0)||1;
  return Object.keys(map).map(n=>({naam:n,gram:map[n],pct:map[n]/tot*100}))
    .sort((a,b)=>b.gram-a.gram);
}
function declaratie(r){
  const oud=(r.etiket&&r.etiket.allergenen)||[];
  return smaakIngredienten(r).map(i=>{
    const naam=esc(i.naam)+' '+getal(i.pct)+'%';
    return (isAllergeen(i.naam)||oud.includes(i.naam))?`<b>${naam}</b>`:naam;
  }).join(', ');
}

function duurTekst(ms){
  const t=Math.max(0,Math.floor(ms/1000)), u=Math.floor(t/3600), m=Math.floor(t%3600/60), sec=t%60;
  return u?`${u}:${pad(m)}:${pad(sec)}`:`${pad(m)}:${pad(sec)}`;
}
const seconden=w=>Math.max(0,Math.round(((w.eind||Date.now())-w.start)/1000));

  if(sec<60) return sec+' sec';
  if(sec<3600) return Math.round(sec/60)+' min';
  const u=Math.floor(sec/3600), m=Math.round(sec%3600/60);
  return u+'u '+pad(m);
}
function stopWerk(b){ schermWakker(false);const w=lopendWerk(b); if(w){w.eind=Date.now(); bewaarNu();} return w}
function startWerk(b,act){ stopWerk(b); werkLijst(b).push({id:uid(),act,start:Date.now(),eind:null}); bewaarNu(); schermWakker(true)}
function werkPerActiviteit(b){
  const m={}; werkLijst(b).forEach(w=>{m[w.act]=(m[w.act]||0)+seconden(w)});
  return Object.keys(m).map(a=>({act:a,sec:m[a]})).sort((x,y)=>y.sec-x.sec);
}

  if(stapTimer&&stapTimer.batchId===b.id&&stapTimer.naam===naam) return;
  stopStap();
  const w=lopendWerk(b);
  stapTimer={batchId:b.id,naam,vorige:w?w.act:null};
  startWerk(b,naam);
}
function stopStap(){
  if(!stapTimer) return;
  const st=stapTimer; stapTimer=null;
  const b=S.batches.find(x=>x.id===st.batchId); if(!b) return;
  const w=stopWerk(b);
  /* alleen een echte misklik weggooien */
  if(w&&(w.eind-w.start)<1500) b.werk=b.werk.filter(x=>x!==w);
  if(st.vorige) startWerk(b,st.vorige);
  bewaarNu();
}

const batch=()=>S.batches.find(b=>b.id===S.batchId);
const recept=id=>S.recepten.find(r=>r.id===id)||{naam:'?',tht:0,onderdelen:[],stappen:[]};
const gramPerBonbon=r=>(r.onderdelen||[]).reduce((s,o)=>s+(parseFloat(o.gram)||0),0);
/* verdeel het gewicht van een onderdeel over zijn ingrediënten, op basis van de verhouding */
function verdeel(o,totaalGram){
  const ing=o.ing||[];
  if(!ing.length) return [];
  if(ing.length===1) return [{naam:ing[0].naam,gram:totaalGram}];
  const som=ing.reduce((s,i)=>s+(parseFloat(i.deel)||0),0);
  if(!som) return ing.map(i=>({naam:i.naam,gram:0}));
  return ing.map(i=>({naam:i.naam,gram:totaalGram*((parseFloat(i.deel)||0)/som)}));
}

const lopende=()=>S.batches.filter(b=>b.status==='bezig');
const bTotaal=b=>b.regels.reduce((s,r)=>s+r.aantal,0);
const bMallen=b=>b.regels.reduce((s,r)=>s+(r.mallen||0),0);
/* een batch bewaart zijn eigen kopie van de receptuur, zodat latere wijzigingen
   aan een smaak nooit een afgeronde batch of rapport veranderen */
function receptVan(b,id){
  if(b&&b.recepten&&b.recepten[id]) return b.recepten[id];
  return recept(id);
}
const bPlan=b=>(b&&b.werkplan&&b.werkplan.length)?b.werkplan:S.werkplan;
const bNamen=b=>b.regels.map(r=>receptVan(b,r.receptId).naam).join(' + ');

/* alle ingrediënten van een batch, opgeteld in gram */
function bIngredienten(b){
  const map={};
  b.regels.forEach(rg=>{
    const r=receptVan(b,rg.receptId);
    (r.onderdelen||[]).forEach(o=>{
      verdeel(o,(parseFloat(o.gram)||0)*rg.aantal).forEach(x=>{
        if(!x.naam) return;
        map[x.naam]=(map[x.naam]||0)+x.gram;
      });
    });
  });
  return Object.keys(map).map(n=>({naam:n,hoeveel:map[n],eenheid:'g'}));
}

function batchOpDatum(b,d){
  return b.startDatum===d||b.eindDatum===d||(b.dagen||[]).some(x=>x.datum===d)||b.logs.some(l=>l.datum===d);
}
function alleDatums(){
  const set={};
  S.batches.forEach(b=>{
    if(b.startDatum) set[b.startDatum]=1;
    if(b.eindDatum) set[b.eindDatum]=1;
    (b.dagen||[]).forEach(x=>set[x.datum]=1);
    b.logs.forEach(l=>{if(l.datum)set[l.datum]=1});
  });
  (S.ontvangsten||[]).forEach(x=>{if(x.datum)set[x.datum]=1});
  return Object.keys(set).sort().reverse();
}
const laatsteIjking=()=>(S.ijkingen||[]).slice().sort((a,b)=>a.datum<b.datum?1:-1)[0]||null;

const dagenTot=d=>Math.round((new Date(iso(d))-new Date(vandaag()))/86400000);
function signalen(){
  const uit=[];
  S.batches.forEach(b=>{
    b.logs.filter(l=>l.status==='fout').forEach(l=>uit.push({ernst:'rood',tekst:l.titel,extra:b.code}));
    b.logs.filter(l=>l.status==='let').forEach(l=>uit.push({ernst:'amber',tekst:l.titel,extra:b.code}));
    /* houdbaarheid van wat je al gemaakt hebt */
    if(b.resultaat&&b.resultaat.perSmaak){
      b.resultaat.perSmaak.forEach(ps=>{
        if(!ps.goed) return;
        const r=receptVan(b,ps.receptId), d=thtVan(b,r), n=dagenTot(d);
        if(n>7) return;
        uit.push({ernst:n<0?'rood':'amber',
          tekst:`${ps.goed} bonbons ${r.naam}`,
          extra:n<0?`THT verlopen op ${kort(d)}`:(n===0?'THT is vandaag':`nog ${n} ${n===1?'dag':'dagen'} houdbaar`)});
      });
    }
  });
  const ij=laatsteIjking();
  const maanden=ij?Math.round((new Date(vandaag())-new Date(ij.datum))/2592000000):null;
  if(!ij) uit.push({ernst:'amber',tekst:'Thermometer nog nooit geijkt',extra:'zonder ijking zijn je metingen aanvechtbaar'});
  else if(maanden>=6) uit.push({ernst:'amber',tekst:'Thermometer al '+maanden+' maanden niet geijkt',extra:'laatst op '+kort(new Date(ij.datum))});
  ['ongedierte','recall'].forEach(t=>{
    const o=controleOver(t); if(!o) return;
    uit.push({ernst:'amber',tekst:CTYPES[t].n+(o.nooit?' nog nooit gedaan':' al '+o.dagen+' dagen geleden'),
      extra:'advies: elke '+(CTYPES[t].herhaal===365?'12 maanden':'3 maanden')});
  });
  return uit.sort((a,b)=>(a.ernst==='rood'?0:1)-(b.ernst==='rood'?0:1));
}

  const datumtekst=`${DAG[d.getDay()]} ${d.getDate()} ${MND[d.getMonth()]}`;

  $('#btnTerug').style.display=inBatch?'grid':'none';
  $('#btnTerug').style.visibility='visible';

  const kopEl=document.querySelector('header');
  const opDash=S.tab==='dashboard'&&!inBatch;
  kopEl.classList.toggle('gecentreerd',opDash);
  kopEl.classList.toggle('donker',opDash);
  $('#scherm').classList.toggle('opdonker',opDash);
  if(!opDash) $('#kopKpi').innerHTML='';
  if(!(S.tab==='dashboard'&&!inBatch)||$('#scherm').scrollTop<14) kopEl.classList.remove('klein');
  if(inBatch){
    const b=batch();
    $('#kopTitel').textContent=bNamen(b);
    const dn=dagNummer(b);
    $('#kopOnder').textContent=`${b.code} · dag ${dn} · ${bMallen(b)} ${bMallen(b)===1?'mal':'mallen'} · ${bTotaal(b)} st`;
  } else if(S.tab==='dashboard'){
    $('#kopTitel').innerHTML=merkKop();
    $('#kopOnder').textContent='';
    $('#kopKpi').innerHTML=dagStrook();
  } else if(S.tab==='productie'){
    $('#kopTitel').textContent='Productie';
    $('#kopOnder').textContent=datumtekst;
  } else {
    $('#kopTitel').textContent=(bedrijf().naam||'Cacaoboetiek')+' HQ';
    $('#kopOnder').textContent=TABS.find(x=>x.key===S.tab).label;
  }

  $('#scherm').innerHTML = inBatch?batchHTML():
    S.tab==='dashboard'?dashboardHTML(): S.tab==='productie'?productieHTML():
    S.tab==='voorraad'?voorraadHTML(): S.tab==='orders'?ordersHTML():
    S.tab==='geld'?geldHTML():straksHTML(S.tab);
  $('#tabbar').innerHTML=`<div class="tabpil">${tabsInBalk().map(t=>
    `<button class="tab ${t.key===S.tab?'actief':''}" data-tab="${t.key}" aria-label="${esc(t.label)}">${
      svg(t.icon)}<span>${t.label}</span></button>`).join('')}</div>`;
  $$('[data-tab]').forEach(x=>x.onclick=()=>{S.tab=x.dataset.tab;S.batchId=null;S.open=null;render();$('#scherm').scrollTop=0});
  bind();
}

/* ---------- de dagcijfers in de donkere kopband ----------
   Vier korte cellen die je opzij kunt schuiven, met een balk voor je voortgang.
   Bij het scrollen schuift dit blok dicht, zodat je merk klein bovenin blijft. */
function dagStrook(){
  const kb=S.batches.filter(x=>x.status==='klaar');
  const goed=kb.reduce((s,x)=>s+(x.resultaat?x.resultaat.goed:0),0);
  const afk=kb.reduce((s,x)=>s+(x.resultaat?x.resultaat.afkeur:0),0);
  const afw=S.batches.reduce((s,x)=>s+x.logs.filter(l=>l.type==='afwijking').length,0);
  const gepland=S.batches.reduce((s,x)=>s+bTotaal(x),0);
  const nb=S.batches.length;
  const pct=gepland?Math.min(100,Math.round(goed/gepland*100)):0;

  const cel=(label,waarde,bij)=>`<div class="kcel"><div class="kl">${label}</div>
    <div class="kw ${waarde?'':'nul'}">${waarde}${bij?`<em>${bij}</em>`:''}</div></div>`;

  return `<div class="kstrook">
      ${cel('Bonbons',goed,gepland?'van '+gepland:'')}
      ${cel('Batches',nb?kb.length+'/'+nb:0,'')}
      ${cel('Afkeur',afk,'')}
      ${cel('Afwijkingen',afw,'')}
    </div>
    ${gepland?`<div class="kbalk"><span style="width:${pct}%"></span></div>`:''}`;
}

/* ---------- receptuitwerking ---------- */
function uitwerkingHTML(b){
  let h='<div class="uw">';
  b.regels.forEach(rg=>{
    const r=receptVan(b,rg.receptId);
    h+=`<div class="uwkop"><span class="n">${esc(r.naam)}</span>
      <span class="a">${rg.mallen?rg.mallen+(rg.mallen===1?' mal · ':' mallen · '):''}${rg.aantal} st</span></div>`;
    (r.onderdelen||[]).forEach(o=>{
      const tot=(parseFloat(o.gram)||0)*rg.aantal;
      h+=`<div class="uwond"><span class="n">${esc(o.naam)}</span><span class="h">${getal(tot)} g</span></div>`;
      const del=verdeel(o,tot);
      if(del.length>1||((o.ing||[]).length===1&&o.ing[0].naam!==o.naam)){
        h+=del.map(x=>`<div class="uwsub"><span class="n">${esc(x.naam)}</span><span class="h">${getal(x.gram)} g</span></div>`).join('');
      }
    });
    if(r.stappen&&r.stappen.length){
      h+=`<div style="margin-top:10px">${r.stappen.map((s2,i)=>`<div class="uwstap"><span class="n">${i+1}</span><span>${esc(s2)}</span></div>`).join('')}</div>`;
    }
    h+=`<div class="uwrij" style="color:var(--grijs2);padding-top:8px"><span class="n">THT</span>
      <span class="h" style="font-weight:500;color:var(--grijs2)">${kort(plusDagen(b.eindDatum?new Date(b.eindDatum):new Date(),r.tht))}</span></div>`;
  });
  const alles=bIngredienten(b);
  if(alles.length){
    h+=`<div class="uwtot"><div class="kop">Samen nodig</div>
      ${alles.map(i=>`<div class="uwrij"><span class="n">${esc(i.naam)}</span>
        <span class="h">${getal(i.hoeveel)} g</span></div>`).join('')}</div>`;
  }
  return h+'</div>';
}

function bonnen(jaar){

  return (S.bonnen||[]).filter(b=>b.datum.startsWith(j))
    .sort((a,b2)=>(b2.datum).localeCompare(a.datum));
}

  .reduce((n,b)=>n+b.bedrag,0);

function maandBalken(){
  const j=new Date().getFullYear(), nu2=new Date().getMonth();
  const per=Array.from({length:12},()=>({zak:0,pri:0}));
  (S.ritten||[]).forEach(r=>{
    if(!r.datum.startsWith(String(j))) return;
    const m=new Date(r.datum).getMonth();
    per[m][r.zakelijk?'zak':'pri']+=r.km;
  });
  const hoogste=Math.max(1,...per.map(x=>x.zak+x.pri));
  if(!per.some(x=>x.zak+x.pri>0)) return '';
  const toonPri=autoVanDeZaak();
  return `<div class="balken">${per.map((x,i)=>{
    const tot=x.zak+x.pri, h=tot/hoogste*100;
    const leeg=i<=nu2&&tot===0;
    return `<div class="bkol ${i===nu2?'nu':''}" title="${MND[i]} ${Math.round(tot)} km">
      <div class="bstaaf ${leeg?'leeg':''}" style="height:${Math.max(tot?4:0,h)}%">
        ${toonPri&&x.pri?`<div class="bpri" style="height:${x.pri/Math.max(tot,1)*100}%"></div>`:''}</div>
      <span>${MND[i].slice(0,1).toUpperCase()}</span></div>`}).join('')}</div>
    <div class="balklegenda">${toonPri
      ?'<span><i class="bl zak"></i>zakelijk</span><span><i class="bl pri"></i>privé</span>'
      :'<span>zakelijke kilometers per maand</span>'}
      <span class="rechts">hoogste maand ${getal(Math.round(hoogste))} km</span></div>`;
}

/* ============ wenskaarten, zonder Photoshop ============ */
const KAARTFONTS=[
  {k:'petit', n:'Petit Formal Script', css:"'Petit Formal Script',cursive", basis:34, hoog:1.7},
  {k:'parisienne', n:'Parisienne', css:"'Parisienne',cursive", basis:40, hoog:1.55},
  {k:'caveat', n:'Caveat', css:"'Caveat',cursive", basis:42, hoog:1.5},
  {k:'cormorant', n:'Cormorant', css:"'Cormorant Garamond',Georgia,serif", basis:30, hoog:1.75}
];
const kaartFont=()=>KAARTFONTS.find(f=>f.k===S.kaartFont)||KAARTFONTS[0];

/* Een witregel vóór de afsluiting leest rustiger. */
const AFSLUITERS=['liefs','groetjes','groeten','veel liefs','hartelijke groet','met liefde',
  'tot snel','xxx','xx','warme groet','veel plezier','geniet ervan','dikke kus'];
function kaartRegels(tekst){
  const rijen=String(tekst||'').replace(/\r/g,'').split('\n');
  const uit=[];
  rijen.forEach((r,i)=>{
    const kaal=r.trim().toLowerCase().replace(/[,.!]+$/,'');
    const isAfsluiter=AFSLUITERS.some(a=>kaal===a||kaal.startsWith(a+' '));
    if(isAfsluiter&&i>0&&uit.length&&uit[uit.length-1].trim()!=='') uit.push('');
    uit.push(r);
  });
  return uit;
}
/* De tekst mag krimpen om te passen, maar nooit groeien. */
function kaartGrootte(tekst,font){
  const regels=kaartRegels(tekst);
  const langste=regels.reduce((n,r)=>Math.max(n,r.length),0);
  let pt=font.basis;
  const maxRegels=Math.floor(74/(font.hoog*4.2));
  while(pt>18&&(langste*pt*0.46>860||regels.length*pt*font.hoog>640)) pt-=2;
  return Math.max(18,pt);
}
function kaartHTML(tekst,font,pt){
  const f=font||kaartFont();
  const g=pt||kaartGrootte(tekst,f);
  return `<div class="wenskaart">
    <div class="wktekst" style="font-family:${f.css};font-size:${g}pt;line-height:${f.hoog}">
      ${kaartRegels(tekst).map(r=>r.trim()?esc(r):'&nbsp;').join('<br>')}
    </div>
    <div class="wkmerk">${esc(merkNaam())}</div>
  </div>`;
}

function sheetWenskaart(vooraf){
  S.kaartFont=S.kaartFont||KAARTFONTS[0].k;
  const teken=()=>{

    sheet('Wenskaart',

    setTimeout(()=>pasSchaal('wkSchaal'),20);
    const bij=()=>{
      const t=$('#wkT').value;
      const g=kaartGrootte(t,kaartFont());
      $('#wkSchaal').innerHTML=kaartHTML(t,kaartFont(),g);

      $('#wkU').textContent=t.trim()

        : 'Nog niets ingevuld.';
    };
    $('#wkT').oninput=bij; bij();
    $$('[data-wkf]').forEach(c=>c.onclick=()=>{
      S.kaartFont=c.dataset.wkf; bewaarNu();
      $$('[data-wkf]').forEach(y=>y.classList.remove('aan')); c.classList.add('aan');
      bij();
    });
    $('#wkPrint').onclick=()=>{
      const t=$('#wkT').value;
      if(!t.trim()) return toast('Schrijf eerst iets.');
      $('#printvel').innerHTML=`<div class="vel wenskaartvel">${kaartHTML(t,kaartFont(),kaartGrootte(t,kaartFont()))}</div>`;
      let st=document.getElementById('printstijl');
      if(!st){st=document.createElement('style');st.id='printstijl';document.head.appendChild(st)}
      st.textContent='@media print{@page{size:210mm 148mm;margin:0}}';
      setTimeout(()=>window.print(),80);
    };
  };
  teken();
}

async function ritStart(doel){
  if(S.rit) return;
  toast('Locatie zoeken…');
  try{
    const p=await positieNu({ms:6000,doel:15,min:1});
    S.rit={begonnen:Date.now(),start:{tijd:nu(),lat:p.lat,lon:p.lon,adres:null},
      punten:[{lat:p.lat,lon:p.lon,t:Date.now()}],km:0,nauw:p.nauw,
      doel:doel?{adres:doel.adres,lat:doel.lat,lon:doel.lon}:null};
    bewaarNu(); render(); ritVolgen(true); schermWakker(true);
    toast('Rit gestart.');
    /* het vertrekpunt scherper maken zolang je nog niet weg bent */
    positieNu({ms:15000,doel:5,min:5}).then(async beter=>{
      if(!S.rit||S.rit.punten.length>3) return;
      if(afstandKm(beter,S.rit.start)>0.06) return;      /* je bent al onderweg */
      S.rit.start.lat=beter.lat; S.rit.start.lon=beter.lon; S.rit.nauw=beter.nauw;
      S.rit.punten[0]={lat:beter.lat,lon:beter.lon,t:Date.now()};
      const n2=await plaatsNaam(beter.lat,beter.lon);
      if(n2.adres){S.rit.start.adres=n2.adres;S.rit.start.naam=n2.naam;
        S.rit.start.bekend=n2.bekend;S.rit.start.vestiging=n2.vestiging}
      bewaarNu(); render();
    }).catch(()=>{});
    const n=await plaatsNaam(p.lat,p.lon);
    if(n.adres&&S.rit){S.rit.start.adres=n.adres;S.rit.start.naam=n.naam;
      S.rit.start.bekend=n.bekend;S.rit.start.vestiging=n.vestiging;bewaarNu();render()}
  }catch(e){
    toast(e&&e.code===1?'Geef de app toegang tot je locatie.':'Locatie niet gevonden. Probeer het buiten opnieuw.');
  }
}
async function ritStop(){
  const r=S.rit; if(!r) return;
  schermWakker(false);
  let eind={tijd:nu(),lat:null,lon:null,adres:null,nauw:null};
  const laatste=r.punten[r.punten.length-1];
  if(laatste){ eind.lat=laatste.lat; eind.lon=laatste.lon; }
  /* niet wachten: je wilt de auto uit. De gps meet door terwijl je de reden typt. */
  const verfijnen=positieNu({ms:10000,doel:6,min:4}).catch(()=>null);
  ritVolgen(false);
  /* de app kan alleen meten zolang hij openstaat. Was hij dicht, dan berekenen we de route. */
  let km=Math.round(r.km*10)/10, bron='gemeten';
  if(eind.lat!==null){
    const via=await wegAfstand(r.start,{lat:eind.lat,lon:eind.lon});
    if(via!==null){
      const viaKm=Math.round(via*10)/10;
      if(viaKm>km*1.15){ km=viaKm; bron='berekend'; }   /* gaten in de meting */
    }
  }
  const begin=S.kmStand;
  sheet('Rit afronden',
    `<div class="ritklaar">
       <div class="rkgetal">${komma(km)}<em>km</em></div>
       <div class="rkregels">
         <div><b>${r.start.tijd}${eind.tijd!==r.start.tijd?' – '+eind.tijd:''}</b></div>
         <div>${bron==='gemeten'
           ? esc(toonPlek(r.start)||'vertrek')+' → '+esc(toonPlek(eind)||'…')
           : 'route berekend'}</div>
       </div>
     </div>
     ${bron==='berekend'?`<div class="melding amber" style="margin:0 0 20px">${svg(I.alarm,'2')}
       <span>De app was tussendoor dicht en kon niet meten. Dit is de kortste route over de weg —

     <div class="veld"><label>Waarvoor was deze rit?</label>
       <input class="inp" id="rrR" placeholder="Bijv. levering Bakkerij De Vries">
       <div class="chips" id="rrSug" style="padding-top:10px"></div></div>
     ${autoVanDeZaak()?`<div class="veld"><label>Soort rit</label><div class="duo" id="rrZ">
       <button class="aan" data-v="zak">Zakelijk</button><button data-v="pri">Privé</button></div></div>`:''}

     <button class="klapkop" id="rrMeer">${svg(I.pijl,'2')}<span>Gegevens controleren</span></button>
     <div class="klapin" id="rrDetail">
       <div class="veld"><label>Afstand</label>
         <div class="mveld"><input id="rrKm" type="number" inputmode="decimal" step="0.1" value="${km}"><span>km</span></div></div>
       <div class="veld"><label>Kilometerstand na de rit${autoVanDeZaak()?'':' <span style="font-weight:400">— niet verplicht</span>'}</label>
         <div class="mveld"><input id="rrK" type="number" inputmode="numeric"
           value="${begin!==null?Math.round(begin+km):''}" placeholder="${begin!==null?'':(autoVanDeZaak()?'aflezen van je dashboard':'mag leeg blijven')}"><span>km</span></div>
         <div class="geen" style="padding-top:8px">${autoVanDeZaak()
           ? (begin!==null?'Beginstand was '+getal(begin)+' km. Bij een auto van de zaak moet de reeks sluiten.'
                          :'Eén keer invullen, daarna telt de app zelf door.')
           : 'Met een privéauto hoeft dit niet — je adressen en de afstand zijn genoeg.'}</div></div>
       <div class="veld"><label>Vertrokken vanaf</label>
         <input class="inp" id="rrV" value="${esc(r.start.adres||'')}" placeholder="adres wordt opgezocht…">
         <div class="adresvoet" id="rrVvoet">
           ${r.start.bekend
             ? '<span class="bekend">'+svg(I.vink,'2.6')+'Uit je vaste plekken</span>'
             : '<label class="onthoud klein"><input type="checkbox" id="rrOnthV"><span>Onthouden als vaste plek</span></label>'}
         </div></div>

         </div></div>
       <div class="geen" id="rrNauw">Vertrek gemeten op ${r.nauw||'?'} m nauwkeurig.</div>
     </div>`,
    `<button class="prim" style="margin-top:0" id="rrOk">Rit vastleggen</button>`);
  let zak=true;                       /* met een privéauto leg je alleen zakelijke ritten vast */
  $$('#rrZ button').forEach(x=>x.onclick=()=>{sluitToetsenbord();
    $$('#rrZ button').forEach(y=>y.classList.remove('aan'));x.classList.add('aan');zak=x.dataset.v==='zak'});
  if(r.doel&&r.doel.adres){ eind.adres=eind.adres||r.doel.adres; }
  verfijnen.then(async beter=>{
    if(beter){
      eind.lat=beter.lat; eind.lon=beter.lon; eind.nauw=beter.nauw;
      r.punten.push({lat:beter.lat,lon:beter.lon,t:Date.now()});
      const nieuwKm=Math.round(ritKm(r.punten)*10)/10;
      const veld=$('#rrKm');
      if(veld&&bron==='gemeten'&&!veld.dataset.aangepast&&nieuwKm>0) veld.value=nieuwKm;
      const nw=$('#rrNauw');
      if(nw) nw.textContent='Vertrek gemeten op '+(r.nauw||'?')+' m, aankomst op '+beter.nauw+' m nauwkeurig.';
    }
    if(eind.lat===null) return;
    const n=await plaatsNaam(eind.lat,eind.lon);
    if(!n.adres) return;
    eind.adres=n.adres; eind.naam=n.naam; eind.bekend=n.bekend; eind.vestiging=n.vestiging;
    const el=$('#rrN'); if(el&&!el.dataset.aangepast) el.value=n.adres;
    const voet=$('#rrNvoet');
    if(voet&&n.bekend) voet.innerHTML='<span class="bekend">'+svg(n.vestiging?I.huis:I.vink,'2.4')+
      (n.vestiging?'Je vestigingsadres':'Uit je vaste plekken')+'</span>';
    suggesties();
  });
  ['rrN','rrKm'].forEach(id=>{const el=$('#'+id); if(el) el.addEventListener('input',()=>{el.dataset.aangepast='1'})});
  adresHulp('rrV',d=>{ if(d.lat!==null){r.start.lat=d.lat;r.start.lon=d.lon} });
  adresHulp('rrN',d=>{ if(d.lat!==null){eind.lat=d.lat;eind.lon=d.lon} });
  const suggesties=()=>{
    const vak=$('#rrSug'); if(!vak) return;
    const lijst=redenSuggesties(eind.lat,eind.lon,r.start.lat,r.start.lon);
    vak.innerHTML=lijst.map(x=>`<button class="chip klein" data-sug="${esc(x.reden)}"
      data-zak="${x.zakelijk?1:0}">${esc(x.reden)}</button>`).join('');
    $$('[data-sug]').forEach(c=>c.onclick=()=>{
      $('#rrR').value=c.dataset.sug;
      if(autoVanDeZaak()){
        const wilZak=c.dataset.zak==='1';
        $$('#rrZ button').forEach(b=>b.classList.toggle('aan',(b.dataset.v==='zak')===wilZak));
        zak=wilZak;
      }
      sluitToetsenbord();
    });
  };
  suggesties();
  $('#rrMeer').onclick=()=>{
    const open=$('#rrDetail').classList.toggle('open');
    $('#rrMeer').classList.toggle('open',open);
  };
  $('#rrKm').oninput=()=>{
    const v=parseFloat($('#rrKm').value);
    if(!isNaN(v)&&S.kmStand!==null) $('#rrK').value=Math.round(S.kmStand+v);
  };
  $('#rrOk').onclick=()=>{
    const reden=$('#rrR').value.trim();
    if(!reden) return toast('Vul in waarvoor je hebt gereden.');
    const km2=parseFloat($('#rrKm').value);
    if(isNaN(km2)||km2<=0) return toast('Vul het aantal kilometers in.');
    const km=Math.round(km2*10)/10;
    const stand=parseFloat($('#rrK').value);
    const rit={id:uid(),datum:iso(new Date()),km,reden,zakelijk:zak,bron,
      start:{tijd:r.start.tijd,lat:r.start.lat,lon:r.start.lon,
        adres:$('#rrV').value.trim()||r.start.adres,naam:r.start.bekend?r.start.naam:null},
      eind:{tijd:eind.tijd,lat:eind.lat,lon:eind.lon,
        adres:$('#rrN').value.trim()||eind.adres,naam:eind.bekend?eind.naam:null},
      standBegin:isNaN(stand)?null:Math.round(stand-km), standEind:isNaN(stand)?null:Math.round(stand),
      punten:r.punten.length};
    S.ritten=S.ritten||[]; S.ritten.push(rit);
    S.plekken=S.plekken||[];
    const onthou=(vink,lat,lon,adres)=>{
      if(!vink||!vink.checked||lat===null||!adres) return;
      const best=plekBij(lat,lon);
      if(best){best.adres=adres;best.naam=adres}          /* bestaande plek bijwerken */
      else S.plekken.push({id:uid(),naam:adres,adres,lat,lon});
    };
    onthou($('#rrOnthV'),r.start.lat,r.start.lon,rit.start.adres);
    onthou($('#rrOnth'),eind.lat,eind.lon,rit.eind.adres);
    if(!isNaN(stand)) S.kmStand=Math.round(stand);
    S.rit=null; bewaarNu(); render();
    klaarSheet(komma(km)+' km vastgelegd'+(zak?' · '+euro(km*kmTarief())+' aftrekbaar':'')+'.');
  };
}

];
const macHart=()=>((S.werk||{}).hart)||null;
function macLeeft(){
  const h=macHart(); if(!h||!h.tijd) return false;
  return (Date.now()-new Date(h.tijd).getTime())<90000;      /* 90 sec stilte = offline */
}
const macOrders=()=>Object.values((S.werk||{}).orders||{})
  .sort((a,b2)=>String(b2.nummer).localeCompare(String(a.nummer)));
const macOpdrachten=()=>Object.entries((S.werk||{}).opdrachten||{})
  .map(([id,x])=>Object.assign({id},x))
  .sort((a,b2)=>String(b2.gevraagd||'').localeCompare(String(a.gevraagd||'')));
const lopendeOpdracht=()=>macOpdrachten().find(x=>x.status==='open'||x.status==='bezig')||null;

/* ============ rechtstreeks naar Shopify en MyParcel ============ */
async function roep(naam,gegevens){
  if(!fbUser) throw new Error('Log eerst in.');
  if(typeof firebase==='undefined'||!firebase.functions) throw new Error('Functions niet geladen.');
  const f=firebase.app().functions('europe-west1').httpsCallable(naam);
  const r=await f(gegevens||{});
  return r.data;
}
const koppeling=()=>((S.werk||{}).koppeling)||{};

function sheetKoppelingen(){
  const k=koppeling();
  const rij=(sleutel,naam,uitleg)=>`<button class="arij" data-kop="${sleutel}">
    <span class="bol ${k[sleutel]?'af':''}">${k[sleutel]?svg(I.vink,'2.6'):''}</span>
    <span class="naam">${naam}<small>${k[sleutel]?'gekoppeld':uitleg}</small></span>
    <span class="pijl">${svg(I.pijl,'2')}</span></button>`;
  sheet('Koppelingen',
    `<p class="hint">Je sleutels worden op de server bewaard, niet in deze app.
      Zo kan niemand die de pagina opent erbij.</p>
     <div class="paneel">
       ${rij('shopify','Shopify','je webshop, voor de orders')}
       ${rij('myparcel','MyParcel','voor je verzendlabels')}
     </div>
     ${(S.werk||{}).laatstOpgehaald?`<div class="geen" style="padding-top:12px">
       Laatst opgehaald ${kort(new Date(S.werk.laatstOpgehaald))} om
       ${new Date(S.werk.laatstOpgehaald).toTimeString().slice(0,5)}.</div>`:''}`,
    `${k.shopify?`<button class="prim" style="margin-top:0" id="kpHaal">Orders ophalen</button>`:''}`);
  $$('[data-kop]').forEach(x=>x.onclick=()=>sheetKoppel(x.dataset.kop));
  if($('#kpHaal')) $('#kpHaal').onclick=async()=>{
    $('#kpHaal').disabled=true; $('#kpHaal').textContent='Bezig…';
    try{ const r=await roep('haalOrders'); toast(r.aantal+' orders opgehaald.'); dicht(); render(); }
    catch(e){ toast(fout(e)); $('#kpHaal').disabled=false; $('#kpHaal').textContent='Orders ophalen'; }
  };
}
const fout=e=>((e&&e.message)||'Er ging iets mis.').replace(/^[A-Z_]+:\s*/,'');

function sheetKoppel(welke){
  const k=koppeling();
  const shop=welke==='shopify';
  sheet(shop?'Shopify koppelen':'MyParcel koppelen',
    shop
    ? `<p class="hint">Maak in Shopify een app aan via het Dev Dashboard met leesrechten op orders
        en klanten. Plak hier het adres van je winkel en het toegangstoken.</p>
       <div class="veld"><label>Adres van je winkel</label>
         <input class="inp" id="kpW" placeholder="jouwwinkel.myshopify.com" autocapitalize="off"></div>
       <div class="veld"><label>Toegangstoken</label>
         <input class="inp" id="kpT" placeholder="shpat_…" autocapitalize="off"></div>
       <div class="veld"><label>Webhook-geheim <span style="font-weight:400">— mag leeg</span></label>
         <input class="inp" id="kpG" placeholder="alleen als je webhooks gebruikt" autocapitalize="off"></div>`
    : `<p class="hint">Je vindt je sleutel in MyParcel onder Instellingen, bij API-instellingen.</p>
       <div class="veld"><label>API-sleutel</label>
         <input class="inp" id="kpS" placeholder="je MyParcel-sleutel" autocapitalize="off"></div>`,

     ${k[welke]?`<button class="sec" id="kpWeg" style="color:var(--rood)">Koppeling verwijderen</button>`:''}`);
  $('#kpOk').onclick=async()=>{
    const knop=$('#kpOk'); knop.disabled=true; knop.textContent='Uitproberen…';
    try{
      if(shop){
        const w=$('#kpW').value.trim(), t=$('#kpT').value.trim();
        if(!w||!t) throw new Error('Vul beide velden in.');
        await roep('zetKoppeling',{shopify:{winkel:w,token:t,webhook_geheim:$('#kpG').value.trim()||null}});
      } else {
        const sl=$('#kpS').value.trim();
        if(!sl) throw new Error('Vul je sleutel in.');
        await roep('zetKoppeling',{myparcel:{sleutel:sl}});

      render(); klaarSheet('Gekoppeld en getest.');
    }catch(e){ toast(fout(e)); knop.disabled=false; knop.textContent='Koppelen en uitproberen'; }

    if(!confirm('Koppeling verwijderen?')) return;
    try{ await roep('wisKoppeling',{welke}); render(); sheetKoppelingen(); }catch(e){ toast(fout(e)) }

function macOpdracht(mode,order,boodschap){
  if(!fbUser) return toast('Log eerst in bij synchronisatie.');
  const id='c_'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
  firebase.database().ref('werkvloer/'+fbUser.uid+'/opdrachten/'+id).set({
    mode, order:order||null, boodschap:!!boodschap,
    status:'open', gevraagd:new Date().toISOString()
  }).then(()=>toast(macLeeft()?'Je Mac pakt het op.':'In de wachtrij tot je Mac draait.'))
    .catch(()=>toast('Kon de opdracht niet wegschrijven.'));
}

  return h;

  $$('[data-klant]').forEach(x=>x.onclick=()=>{
    if(kies) return kies(x.dataset.klant);
    const k=S.klanten.find(y=>y.id===x.dataset.klant);
    if(k&&confirm('Klant '+k.naam+' verwijderen?')){
      S.klanten=S.klanten.filter(y=>y.id!==k.id); bewaarNu(); sheetKlanten(kies);
    }
  });
  $('#kOk').onclick=()=>{
    const n=$('#kN').value.trim();
    if(!n) return toast('Vul een naam in.');
    const k={id:uid(),naam:n,zakelijk:zak,plaats:$('#kP').value.trim(),email:$('#kE').value.trim()};
    S.klanten.push(k); bewaarNu();
    if(kies) return kies(k.id);
    sheetKlanten(); toast('Klant toegevoegd.');
  };
}

function sheetNieuweOrder(){
  if(!(S.recepten||[]).length) return toast('Voeg eerst een smaak toe.');
  const W={klantId:null,leverdatum:'',regels:{}};
  const teken=()=>{
    const gekozen=Object.entries(W.regels).filter(([k,v])=>v>0);
    const tot=gekozen.reduce((n,[k,v])=>n+v,0);
    sheet('Nieuwe order',
      `<div class="veld"><label>Klant</label>
         <button class="inp kies" id="oK">${W.klantId?esc(klantNaam(W.klantId)):'Kies een klant'}

       <div class="veld"><label>Leverdatum</label>
         <input class="inp" id="oD" type="date" value="${W.leverdatum}"></div>
       <div class="blokkop"><span class="eyebrow">Wat gaat erin</span>
         <span class="tel">${tot?tot+' stuks':''}</span></div>
       <div class="paneel">${S.recepten.map(r=>{
         const n=W.regels[r.id]||0, op=voorraadPerSmaak()[r.id]||0;
         return `<div class="orij"><span class="on">${esc(r.naam)}<em>${op} op voorraad</em></span>
           <div class="ostep"><button class="stepbtn klein" data-om="${r.id}">${svg(I.min)}</button>
             <span class="oa ${n?'aan':''}">${n}</span>
             <button class="stepbtn klein" data-op="${r.id}">${svg(I.plus)}</button></div></div>`}).join('')}</div>`,
      `<button class="prim" style="margin-top:0" id="oOk">Order aanmaken</button>`);
    $('#oK').onclick=()=>sheetKlanten(id=>{W.klantId=id;teken()});
    $('#oD').onchange=()=>{W.leverdatum=$('#oD').value};
    $$('[data-op]').forEach(x=>x.onclick=()=>{const k=x.dataset.op;
      W.regels[k]=(W.regels[k]||0)+S.malGrootte; teken()});
    $$('[data-om]').forEach(x=>x.onclick=()=>{const k=x.dataset.om;
      W.regels[k]=Math.max(0,(W.regels[k]||0)-S.malGrootte); teken()});
    $('#oOk').onclick=()=>{
      if(!W.klantId) return toast('Kies een klant.');
      const regels=Object.entries(W.regels).filter(([k,v])=>v>0).map(([k,v])=>({receptId:k,aantal:v}));
      if(!regels.length) return toast('Voeg minstens één smaak toe.');
      const o={id:uid(),nummer:nieuwOrdernr(),klantId:W.klantId,regels,
        leverdatum:$('#oD').value||'',datum:iso(new Date()),status:'nieuw',lots:{}};
      S.orders=S.orders||[]; S.orders.push(o); bewaarNu(); render();
      sheetOrder(o.id); toast('Order '+o.nummer+' aangemaakt.');
    };
  };
  teken();
}

/* Welk lot gaat naar welke klant? Dat is de laatste schakel: één stap vooruit. */
function sheetInpakken(id){
  const o=(S.orders||[]).find(x=>x.id===id); if(!o) return;
  const keuze={};                                  /* receptId -> [{lot, aantal}] */
  const dozen={};                                  /* product -> aantal dozen */
  const teken=()=>{
    const rijen=o.regels.map(rg=>{
      const beschikbaar=voorraadGereed().filter(v=>v.receptId===rg.receptId&&v.aantal>0)
        .sort((a,b2)=>(a.tht||'').localeCompare(b2.tht||''));   /* oudste eerst */
      const gekozen=keuze[rg.receptId]||[];
      const tot=gekozen.reduce((n,x)=>n+x.aantal,0);
      return `<div class="veld">
        <div class="lotkop"><span class="n">${esc(smaakNaam(rg.receptId))}</span>
          <span class="g ${tot===rg.aantal?'goed':''}">${tot} van ${rg.aantal}</span></div>
        ${beschikbaar.length?beschikbaar.map(v=>{
          const g=gekozen.find(x=>x.lot===v.lot), n=g?g.aantal:0;
          const d=dagenTotTHT(v.tht);
          return `<div class="orij"><span class="on">lot ${esc(v.lot)}
            <em>${v.aantal} op voorraad${v.tht?' · THT '+kort(new Date(v.tht))+(d<0?' — verlopen':d<=14?' — nog '+d+' dg':''):''}</em></span>
            <div class="ostep"><button class="stepbtn klein" data-im="${rg.receptId}|${v.lot}">${svg(I.min)}</button>
              <span class="oa ${n?'aan':''}">${n}</span>
              <button class="stepbtn klein" data-ip="${rg.receptId}|${v.lot}">${svg(I.plus)}</button></div></div>`
        }).join(''):'<div class="geen">Geen voorraad van deze smaak.</div>'}
      </div>`;
    }).join('');
    const compleet=o.regels.every(rg=>(keuze[rg.receptId]||[]).reduce((n,x)=>n+x.aantal,0)===rg.aantal);

    /* welke doosjes gaan eraan op */
    const verp=grondVoorraad().filter(v=>artSoort(v.product)==='verpakking');
    const totBonbon=orderAantal(o);
    const gedekt=Object.entries(dozen).reduce((n,[p,a])=>n+a*(art(p).maat||0),0);
    const doosBlok=verp.length?`<div class="blokkop"><span class="eyebrow">Verpakking</span>
        <span class="tel ${gedekt>=totBonbon?'':'let'}">${gedekt} van ${totBonbon} bonbons</span></div>
      <div class="paneel">${verp.map(v=>{
        const a=dozen[v.product]||0, m=art(v.product).maat||0;
        const tekort=a>v.saldo;
        return `<div class="orij"><span class="on">${esc(v.product)}
          <em>${getal(v.saldo)} op voorraad${m?' · '+m+' bonbons per doos':''}${tekort?' — te weinig':''}</em></span>
          <div class="ostep"><button class="stepbtn klein" data-dm="${esc(v.product)}">${svg(I.min)}</button>
            <span class="oa ${a?'aan':''}">${a}</span>
            <button class="stepbtn klein" data-dp="${esc(v.product)}">${svg(I.plus)}</button></div></div>`}).join('')}</div>
      <div class="geen" style="padding-top:8px">Laat op nul staan wat je niet gebruikt. Wordt afgeboekt bij het inpakken.</div>`:'';

    sheet('Inpakken voor '+klantNaam(o.klantId),
      `<p class="hint">Kies uit welke partij je pakt. De app boekt het af en legt vast welk lot
        naar deze klant is gegaan — daarmee is je keten compleet.</p>${rijen}${doosBlok}`,
      `<button class="prim" style="margin-top:0" id="ipOk" ${compleet?'':'disabled'}>
        ${compleet?'Afboeken en inpakken':'Kies eerst alle aantallen'}</button>
       ${compleet?`<button class="sec" id="ipEt">${svg(I.doc)}Productetiketten printen</button>`:''}`);
    const pas=(sleutel,delta)=>{
      const [rid,lot]=sleutel.split('|');
      const rg=o.regels.find(x=>x.receptId===rid);
      const v=voorraadGereed().find(x=>x.receptId===rid&&x.lot===lot);
      keuze[rid]=keuze[rid]||[];
      let g=keuze[rid].find(x=>x.lot===lot);
      if(!g){g={lot,aantal:0};keuze[rid].push(g)}
      const anders=keuze[rid].filter(x=>x.lot!==lot).reduce((n,x)=>n+x.aantal,0);
      const ruimte=Math.min(v?v.aantal:0, rg.aantal-anders);
      g.aantal=Math.max(0,Math.min(ruimte,g.aantal+delta));
      keuze[rid]=keuze[rid].filter(x=>x.aantal>0);
      teken();
    };
    $$('[data-ip]').forEach(x=>x.onclick=()=>pas(x.dataset.ip,S.malGrootte||1));
    $$('[data-im]').forEach(x=>x.onclick=()=>pas(x.dataset.im,-(S.malGrootte||1)));
    $$('[data-dp]').forEach(x=>x.onclick=()=>{const p=x.dataset.dp;dozen[p]=(dozen[p]||0)+1;teken()});
    $$('[data-dm]').forEach(x=>x.onclick=()=>{const p=x.dataset.dm;dozen[p]=Math.max(0,(dozen[p]||0)-1);
      if(!dozen[p])delete dozen[p]; teken()});
    if($('#ipEt')) $('#ipEt').onclick=()=>{
      const eerste=o.regels[0];
      sheetProductEtiket(eerste.receptId);
    };
    if($('#ipOk')&&compleet) $('#ipOk').onclick=()=>{
      const naar=klantNaam(o.klantId);
      o.lots={};
      o.regels.forEach(rg=>{
        (keuze[rg.receptId]||[]).forEach(g=>{
          const v=voorraadGereed().find(x=>x.receptId===rg.receptId&&x.lot===g.lot);
          muteer({soort:'verkocht',receptId:rg.receptId,lot:g.lot,tht:v?v.tht:null,
            aantal:-g.aantal,reden:'order '+o.nummer+' · '+naar});
          o.lots[rg.receptId]=(o.lots[rg.receptId]||[]).concat([{lot:g.lot,aantal:g.aantal}]);
        });
      });
      o.verpakking=[];
      Object.entries(dozen).forEach(([prod,a])=>{
        if(a>0){ gBoek(prod,-a,'st','Order '+o.nummer+' · '+naar); o.verpakking.push({product:prod,aantal:a}) }
      });
      o.status='ingepakt'; o.ingepakt=iso(new Date());
      const nd=Object.values(dozen).reduce((n,a)=>n+a,0);
      bewaarNu(); render();
      klaarSheet('Ingepakt en afgeboekt voor '+naar+(nd?' · '+nd+(nd===1?' doosje':' doosjes'):'')+'.');
    };
  };
  teken();
}

       <div class="paneel" style="margin-bottom:20px">${Object.entries(o.lots).map(([rid,ls])=>
         ls.map(x=>`<div class="item"><span class="t">${x.aantal}</span>

     <div class="blokkop"><span class="eyebrow">Dekking</span></div>

         <em>${x.tekort?'tekort van '+x.tekort+' — '+x.beschikbaar+' beschikbaar'

              x.beloofd?' · '+x.beloofd+' aan andere orders':''}</em></span></div>`).join('')}</div>
     ${tekort.length?`<div class="melding amber" style="margin-top:16px">${svg(I.alarm,'2')}
       <span>Je komt ${tekort.reduce((n,x)=>n+x.tekort,0)} bonbons tekort.
         Maak een batch aan voor ${tekort.map(x=>esc(smaakNaam(x.receptId))).join(' en ')}.</span></div>`:''}`,
    `${o.status==='nieuw'?`<button class="prim" style="margin-top:0" id="orKlaar"

     ${o.status==='ingepakt'?`<button class="prim" style="margin-top:0" id="orLever">Als geleverd markeren</button>`:''}
     <button class="sec" id="orVerw" style="color:var(--rood)">Order verwijderen</button>`);
  if($('#orLever')) $('#orLever').onclick=()=>{

    S.orders=S.orders.filter(x=>x.id!==o.id); bewaarNu(); render(); dicht();

function voorraadHTML(){
  const gereed=voorraadGereed();
  const totaal=gereed.reduce((n,v)=>n+v.aantal,0);
  const bijna=gereed.filter(v=>{const d=dagenTotTHT(v.tht);return d!==null&&d<=14});
  const over=gereed.filter(v=>{const d=dagenTotTHT(v.tht);return d!==null&&d<0});

  let h=`<h1>Voorraad</h1><div class="datum">${totaal?totaal+' bonbons op voorraad':'nog niets op voorraad'}</div>`;

  if(over.length) h+=`<div class="melding rood" style="margin-bottom:12px">${svg(I.alarm,'2')}
    <span>${over.length===1?'Eén partij is':over.length+' partijen zijn'} over de THT.
      Boek ${over.length===1?'die':'die'} af als breuk.</span></div>`;
  else if(bijna.length) h+=`<div class="melding amber" style="margin-bottom:12px">${svg(I.alarm,'2')}
    <span>${bijna.length===1?'Eén partij loopt':bijna.length+' partijen lopen'} binnen twee weken af.</span></div>`;
  const laagNu=grondVoorraad().filter(grondOnder);
  if(laagNu.length) h+=`<div class="melding amber" style="margin-bottom:12px">${svg(I.alarm,'2')}
    <span>${laagNu.map(v=>esc(v.product)).slice(0,3).join(', ')}${laagNu.length>3?' en meer':''}
      ${laagNu.length===1?'is':'zijn'} bijna op.</span></div>`;

  h+=`<div class="blokkop"><span class="eyebrow">Gereed product</span>
      <span class="tel">${gereed.length?gereed.length+(gereed.length===1?' partij':' partijen'):''}</span></div>`;
  h+=gereed.length?`<div class="paneel">${gereed.map(v=>{
    const d=dagenTotTHT(v.tht), st=d===null?'':(d<0?'rood':d<=14?'amber':'');
    return `<button class="arij" data-vr="${v.receptId}|${v.lot}">
      <span class="naam">${esc(smaakNaam(v.receptId))}<small>lot ${esc(v.lot)}${
        v.tht?' · THT '+kort(new Date(v.tht))+(d<0?' — verlopen':d<=14?' — nog '+d+' dagen':''):''}</small></span>
      ${st?`<span class="stip ${st}"></span>`:''}
      <span class="waarde gevuld">${v.aantal}</span>
      <span class="pijl">${svg(I.pijl,'2')}</span></button>`}).join('')}</div>`
   :`<div class="paneel"><div class="geen">Zodra je een batch afrondt, komt het gereed product hier vanzelf te staan.</div></div>`;

  const alles=grondVoorraad();
  const rij=v=>{
    const d=grondDrempel(v.product), laag=grondOnder(v), leeg=v.saldo<=0;
    const lots=Object.keys(v.lots).filter(k=>v.lots[k]>0);
    return `<button class="arij" data-gs="${esc(v.product)}">
      <span class="naam">${esc(v.product)}<small>${
        lots.length?lots.length+(lots.length===1?' lot':' lots')+' · '+esc(lots.slice(0,2).join(', '))+(lots.length>2?'…':'')
                   :'geen lot bekend'}${d?' · drempel '+toonHoeveel(d,v.basis):''}</small></span>
      ${laag||leeg?`<span class="stip ${leeg?'rood':'amber'}"></span>`:''}
      <span class="waarde gevuld">${toonHoeveel(v.saldo,v.basis)}</span>
      <span class="pijl">${svg(I.pijl,'2')}</span></button>`;
  };

  /* grondstoffen */
  const grond=alles.filter(v=>artSoort(v.product)==='ingredient');
  const opRaken=grond.filter(grondOnder);
  h+=`<div class="blokkop" style="margin-top:24px"><span class="eyebrow">Grondstoffen</span>
      <span class="tel">${opRaken.length?opRaken.length+' bijna op':(grond.length?grond.length+' producten':'')}</span></div>`;
  h+=grond.length?`<div class="paneel">${grond.map(rij).join('')}</div>`
   :`<div class="paneel"><div class="geen">Nog geen grondstoffen. Leg een levering vast bij Ontvangst.</div></div>`;

  /* verpakking, als raster van maat × kleur */
  const verp=alles.filter(v=>artSoort(v.product)==='verpakking');
  const laagV=verp.filter(grondOnder);
  h+=`<div class="blokkop" style="margin-top:24px"><span class="eyebrow">Verpakking</span>
      <span class="tel">${laagV.length?laagV.length+' bijna op':(verp.length?verp.length+' artikelen':'')}</span></div>`;
  if(verp.length){
    const maten=[...new Set(verp.map(v=>art(v.product).maat).filter(Boolean))].sort((a,b2)=>a-b2);
    const kleuren=[...new Set(verp.map(v=>art(v.product).kleur).filter(Boolean))];
    const los=verp.filter(v=>!art(v.product).maat||!art(v.product).kleur);
    if(maten.length&&kleuren.length){
      h+=`<div class="paneel" style="padding:4px 0"><div class="vraster">
        <div class="vrhoek"></div>
        ${maten.map(m=>`<div class="vrmaat">${m}<small>st</small></div>`).join('')}
        ${kleuren.map(k=>`<div class="vrkleur">${esc(k)}</div>
          ${maten.map(m=>{
            const v=verp.find(x=>art(x.product).maat===m&&art(x.product).kleur===k);
            if(!v) return `<div class="vrcel leeg">—</div>`;
            const st=grondOnder(v)?(v.saldo<=0?'rood':'amber'):'';
            return `<button class="vrcel ${st}" data-gs="${esc(v.product)}">${getal(v.saldo)}</button>`;
          }).join('')}`).join('')}
      </div></div>`;
    }
    if(los.length) h+=`<div class="paneel" style="margin-top:10px">${los.map(rij).join('')}</div>`;
  } else {
    h+=`<div class="paneel"><div class="geen">Nog geen verpakking. Voeg je doosjes in één keer toe.</div></div>`;
  }
  h+=`<button class="knop2" data-verpnieuw style="margin-top:10px">${svg(I.plus)}Verpakking toevoegen</button>`;

  /* hulpmiddelen */
  const hulp=alles.filter(v=>artSoort(v.product)==='hulp');
  if(hulp.length){
    const laagH=hulp.filter(grondOnder);
    h+=`<div class="blokkop" style="margin-top:24px"><span class="eyebrow">Hulpmiddelen</span>
        <span class="tel">${laagH.length?laagH.length+' bijna op':hulp.length+' artikelen'}</span></div>
      <div class="paneel">${hulp.map(rij).join('')}</div>`;
  }

  h+=`<div class="voet">
    <button data-vmut>Alle mutaties${(S.mutaties||[]).length?' ('+S.mutaties.length+')':''}</button>
    <button data-sheet="ontvangst">Ontvangst vastleggen</button></div>`;
  return h;
}

/* ---------- één grondstof: saldo, lots en bijboeken of afboeken ---------- */
function sheetGrondstof(product){
  const v=grondVoorraad().find(x=>gKey(x.product)===gKey(product));
  if(!v) return;
  const basis=v.basis;
  const eenheden=basis==='g'?['kg','g']:basis==='ml'?['l','ml']:['st'];
  const lots=Object.entries(v.lots).filter(([k,n])=>n>0)
    .sort((a,b2)=>b2[1]-a[1]);
  const regels=(S.gmut||[]).filter(m=>gKey(m.product)===gKey(product))
    .sort((a,b2)=>(b2.datum+b2.tijd).localeCompare(a.datum+a.tijd));
  const d=grondDrempel(product);

  sheet(v.product,
    `<div class="vrkop"><div class="vrgetal">${toonHoeveel(v.saldo,basis)}<em>op voorraad</em></div>
      <div class="vrmeta">${d?'drempel '+toonHoeveel(d,basis)+(grondOnder(v)?' — bijna op':''):'geen drempel ingesteld'}</div></div>

     <div class="veld"><label>Wat wil je doen?</label>
       <div class="duo3" id="gS">
         <button class="aan" data-v="bij">Bijboeken</button>
         <button data-v="af">Afboeken</button>
         <button data-v="tel">Tellen</button></div></div>

     <div class="veld" style="display:grid;grid-template-columns:1fr 92px;gap:12px">
       <div><label id="gLab">Hoeveelheid erbij</label>
         <input class="inp" id="gH" type="number" inputmode="decimal" placeholder="0"></div>
       <div><label>Eenheid</label>
         <select class="inp" id="gE" style="text-align:center">${eenheden.map(e=>`<option>${e}</option>`).join('')}</select></div></div>

     <div class="veld" id="gLotV"><label>Van welk lot?</label>
       <div class="chips" id="gL">
         ${lots.map((l,i)=>`<button class="chip ${i?'':'aan'}" data-v="${esc(l[0])}">${esc(l[0])}<small style="opacity:.6;margin-left:6px">${toonHoeveel(l[1],basis)}</small></button>`).join('')}

     <div class="veld"><label>Reden</label>
       <input class="inp" id="gR" placeholder="Bijv. breuk, weggegooid, verbruikt"></div>

     <div class="veld"><label>Soort</label>
       <div class="chips" id="gSo">${Object.keys(SOORTEN).map(k=>

/* ---------- branche kiezen en het sjabloon toepassen ----------
   Toepassen voegt alleen toe wat je nog niet hebt. Wat je zelf hebt ingesteld
   blijft altijd staan; een sjabloon is een startpunt, geen voorschrift. */
function pasSjabloonToe(key){
  const t=BRANCHES[key]; if(!t) return 0;
  let n=0;
  (t.werkplan||[]).forEach(x=>{if(!S.werkplan.includes(x)){S.werkplan.push(x);n++}});
  (t.activiteiten||[]).forEach(x=>{if(!S.activiteiten.includes(x)){S.activiteiten.push(x);n++}});
  (t.zones||[]).forEach(x=>{if(!S.zones.includes(x)){S.zones.push(x);n++}});
  (t.meet||[]).forEach(m=>{
    if(S.meetpunten.some(x=>x.naam===m.t)) return;
    const mp={id:uid(),naam:m.t,min:m.min,max:m.max,eenheid:m.e||'°C'};
    S.meetpunten.push(mp);
    if(!heeftCheck(m.t)) S.checks.push({id:uid(),tekst:m.t,soort:'meting',mpId:mp.id,groep:'Temperatuur en opslag'});
    n++;
  });
  return n;
}

/* ---------- verbruik van grondstoffen bij het afronden ----------
   De brug bestaat al: per ingrediënt koos je een lotnummer, en dat lot hoort
   bij een product uit je voorraad. Zijn er meerdere lots gekozen, dan wordt het
   verbruik daarover verdeeld. Zonder lot valt de app terug op de productnaam. */
function verbruikVanBatch(b){
  const uit=[];
  bIngredienten(b).forEach(i=>{
    const lots=lotLijst(b,i.naam);
    if(lots.length){
      const deel=i.hoeveel/lots.length;
      lots.forEach(l=>{
        const p=(S.lots||[]).find(x=>x.lot===l);
        uit.push({product:p?p.product:i.naam,lot:l,gram:deel});
      });
    } else {
      const bekend=grondVoorraad().find(v=>gKey(v.product)===gKey(i.naam));
      uit.push({product:bekend?bekend.product:i.naam,lot:'',gram:i.hoeveel,onbekend:!bekend});
    }
  });
  return uit;
}
function boekVerbruik(b){
  if(b.verbruikGeboekt) return 0;
  const lijst=verbruikVanBatch(b);
  lijst.forEach(v=>{ if(v.gram>0) gBoek(v.product,-v.gram,'g','Verbruik batch '+b.code,v.lot) });
  b.verbruikGeboekt=true;
  return lijst.length;
}

/* ============ een lot terugzoeken, beide richtingen ============ */
function zoekLot(term){
  const t=term.trim().toUpperCase().split('/')[0];   /* QR kan /1 achter de code hebben */
  if(!t) return {batches:[],partijen:[]};
  const batches=(S.batches||[]).filter(b=>(b.code||'').toUpperCase().indexOf(t)>=0);
  const partijen=[];
  const namen=new Set();
  (S.lots||[]).forEach(l=>{if((l.lot||'').toUpperCase().indexOf(t)>=0) namen.add(l.lot)});
  (S.batches||[]).forEach(b=>Object.keys(b.lots||{}).forEach(ing=>
    lotLijst(b,ing).forEach(c=>{if(c.toUpperCase().indexOf(t)>=0) namen.add(c)})));
  namen.forEach(lot=>{
    const gebruikt=(S.batches||[]).filter(b=>Object.keys(b.lots||{})
      .some(ing=>lotLijst(b,ing).includes(lot)));
    partijen.push({lot,info:(S.lots||[]).find(x=>x.lot===lot),gebruikt});
  });
  return {batches,partijen};
}
