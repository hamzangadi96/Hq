name: IAM check
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v2
        with: { credentials_json: '${{ secrets.FIREBASE_SLEUTEL }}' }
      - uses: google-github-actions/setup-gcloud@v2
      - run: |
          for s in $(gcloud run services list --region europe-west1 --project cacaoboetiek-hq --format='value(metadata.name)'); do
            p=$(gcloud run services get-iam-policy $s --region europe-west1 --project cacaoboetiek-hq --format=json)
            if ! echo "$p" | grep -q allUsers; then
              echo "UIT zonder invoker: $s"
              case "$s" in mail*) gcloud run services add-iam-policy-binding $s --region europe-west1 --project cacaoboetiek-hq --member=allUsers --role=roles/run.invoker >/dev/null 2>&1 && echo "UIT gerepareerd: $s" || echo "UIT REPARATIE MISLUKT: $s";; esac
            fi
          done
