/* ================= het dossier voor de inspectie =================
   Eén knop, alles erin: wat je maakte, waarvan, of het binnen norm bleef,
   en waar het heen ging. Met je bedrijfsgegevens en handtekeningregels. */
function dossierHTML(vanaf,tot){
  const bs=(S.batches||[]).filter(b=>{
    const d=b.startDatum||b.eindDatum; if(!d) return false;
    return d>=vanaf&&d<=tot;
  }).sort((a,b2)=>String(a.startDatum||'').localeCompare(String(b2.startDatum||'')));

  const periode=kort(new Date(vanaf))+' t/m '+kort(new Date(tot));
  let h=`<div class="rapport">${rKop('HACCP-dossier',periode)}`;

  /* samenvatting */
  const tot2=bs.reduce((n,b)=>n+bTotaal(b),0);
  const goed=bs.reduce((n,b)=>n+(b.resultaat?b.resultaat.goed:0),0);
  const afk=bs.reduce((n,b)=>n+(b.resultaat?b.resultaat.afkeur:0),0);
  const afw=bs.reduce((n,b)=>n+b.logs.filter(l=>l.type==='afwijking').length,0);
  const buitenNorm=bs.reduce((n,b)=>n+b.logs.filter(l=>l.status==='fout').length,0);

  h+=`<h3>Samenvatting</h3><div class="paar">
    <div><div class="rij"><span>Periode</span><b>${periode}</b></div>
      <div class="rij"><span>Aantal batches</span><b>${bs.length}</b></div>
      <div class="rij"><span>Gepland</span><b>${tot2} stuks</b></div></div>
    <div><div class="rij"><span>Goedgekeurd</span><b>${goed} stuks</b></div>
      <div class="rij"><span>Afkeur</span><b>${afk} stuks</b></div>
      <div class="rij"><span>Afwijkingen</span><b>${afw}${buitenNorm?' · '+buitenNorm+' buiten norm':''}</b></div></div></div>`;

  /* per batch: waar het vandaan komt en waar het heen ging */
  bs.forEach(b=>{
    const gs=grondstoffenVan(b), ords=ordersMetBatch(b.code);
    const temps=b.logs.filter(l=>l.type==='temperatuur');
    const fout=b.logs.filter(l=>l.status==='fout'||l.status==='let');

    h+=`<h3>${b.code} — ${esc(bNamen(b))}${b.afgebroken?' (afgebroken)':''}</h3>
      <div class="paar">
        <div><div class="rij"><span>Gemaakt</span><b>${b.startDatum?kort(new Date(b.startDatum)):'—'}${
          b.eindDatum&&b.eindDatum!==b.startDatum?' t/m '+kort(new Date(b.eindDatum)):''}</b></div>
          <div class="rij"><span>${branche().basis||'Basis'}</span><b>${chocNaam(b.chocolade)}</b></div>
          <div class="rij"><span>Uitgevoerd door</span><b>${esc(S.naam||'—')}</b></div></div>
        <div><div class="rij"><span>Gepland</span><b>${bTotaal(b)} stuks</b></div>
          <div class="rij"><span>Resultaat</span><b>${b.resultaat
            ? b.resultaat.goed+' goed, '+b.resultaat.afkeur+' afkeur':'nog niet afgerond'}</b></div>
          <div class="rij"><span>Registraties</span><b>${b.logs.length}</b></div></div></div>

      <table><tr><th>Ingrediënt</th><th>Lot</th><th>Leverancier</th><th>THT</th></tr>
      ${gs.length?gs.map(g=>g.lots.map(l=>`<tr><td>${esc(g.naam)}</td><td>${esc(l.lot)}</td>
        <td>${esc(l.leverancier||'—')}</td><td>${l.tht?kort(new Date(l.tht)):'—'}</td></tr>`).join('')).join('')
        :'<tr><td colspan="4">Geen lotnummers vastgelegd</td></tr>'}</table>

      ${temps.length?`<table style="margin-top:3mm"><tr><th>Meting</th><th>Waarde</th><th>Datum</th><th>Binnen norm</th></tr>
        ${temps.map(l=>`<tr><td>${esc(l.titel||'—')}</td><td>${esc(l.sub||'')}</td>
          <td>${l.datum?kort(new Date(l.datum)):''} ${esc(l.tijd||'')}</td>
          <td>${l.status==='ok'?'ja':'nee'}</td></tr>`).join('')}</table>`:''}

      ${fout.length?`<table style="margin-top:3mm"><tr><th>Aandachtspunt</th><th>Toelichting</th><th>Datum</th></tr>
        ${fout.map(l=>`<tr><td>${esc(l.titel||'—')}</td><td>${esc(l.sub||'')}</td>
          <td>${l.datum?kort(new Date(l.datum)):''} ${esc(l.tijd||'')}</td></tr>`).join('')}</table>`:''}

      ${ords.length?`<table style="margin-top:3mm"><tr><th>Geleverd aan</th><th>Order</th><th>Aantal</th><th>Datum</th></tr>
        ${ords.map(o=>{const n=Object.keys(o.lots||{}).reduce((t,rid)=>t+(o.lots[rid]||[])
            .filter(g=>g.lot===b.code).reduce((x,g)=>x+g.aantal,0),0);
          return `<tr><td>${esc(klantNaam(o.klantId))}</td><td>${esc(o.nummer)}</td>
            <td class="n">${n}</td><td>${o.ingepakt?kort(new Date(o.ingepakt)):'—'}</td></tr>`}).join('')}</table>`
        :`<div class="leeg" style="margin-top:2mm">Nog niet uitgeleverd${
            restVanBatch(b.code)?' — '+restVanBatch(b.code)+' stuks op voorraad':''}</div>`}`;
  });

  if(!bs.length) h+=rLeeg('Geen batches in deze periode.');

  /* ijking en periodieke controles horen erbij */
  const ijk=laatsteIjking();
  h+=`<h3>Beheersmaatregelen</h3>
    <div class="rij"><span>Thermometer geijkt</span><b>${ijk?kort(new Date(ijk.datum)):'nog nooit'}</b></div>
    <div class="rij"><span>Openingscheck</span><b>${S.checks.length} punten vastgelegd</b></div>
    <div class="rij"><span>Meetpunten met norm</span><b>${S.meetpunten.length}</b></div>`;

  h+=`<div class="hand"><div>Uitgevoerd door — ${esc(S.naam||'')}</div>
    <div>Gecontroleerd door — ${esc(S.controleur||'')} / datum</div></div>${rVoet()}</div>`;
  return h;
}

    const html=dossierHTML(vanaf,tot);
    sheet('HACCP-dossier',
      `<p class="hint">Alles wat je in deze periode hebt vastgelegd, in één document:
        wat je maakte, van welke partijen, of het binnen norm bleef en waar het heen ging.</p>
       <div class="veld"><label>Periode</label>
         <div class="duo3" id="dsP">
           <button class="${label==='maand'?'aan':''}" data-v="maand">Deze maand</button>
           <button class="${label==='kwartaal'?'aan':''}" data-v="kwartaal">Kwartaal</button>
           <button class="${label==='jaar'?'aan':''}" data-v="jaar">Dit jaar</button></div></div>
       <div class="etvoorbeeld" style="padding:0"><div class="schaal" id="dsSchaal">${html}</div></div>
       <div class="veld" style="margin-top:16px"><label>Gecontroleerd door — mag leeg</label>
         <input class="inp" id="dsC" value="${esc(S.controleur||'')}" placeholder="Naam van wie controleert">
         <div class="hint" style="margin:8px 0 0">Komt op de handtekeningregel van al je rapporten.</div></div>`,
      `<button class="prim" style="margin-top:0" id="dsPrint">${svg(I.doc)}Printen of bewaren</button>`);
    setTimeout(()=>pasSchaal('dsSchaal'),30);
    chips('#dsP',false,()=>{
      const k=chipV('#dsP');
      const j=nu5.getFullYear();
      if(k==='maand') return teken(iso(new Date(j,nu5.getMonth(),1)),vandaag(),'maand');
      if(k==='kwartaal') return teken(iso(new Date(j,(kwartaalVan(nu5)-1)*3,1)),vandaag(),'kwartaal');
      return teken(j+'-01-01',vandaag(),'jaar');
    });
    $('#dsC').onchange=()=>{S.controleur=$('#dsC').value.trim();bewaarNu()};
    $('#dsPrint').onclick=()=>{
      S.controleur=$('#dsC').value.trim(); bewaarNu();
      drukAf(dossierHTML(vanaf,tot),'HACCP-dossier','@page{size:A4;margin:8mm}');
    };
  };
  teken(iso(new Date(nu5.getFullYear(),nu5.getMonth(),1)),vandaag(),'maand');
}

/* ================= smaken / recepten ================= */
function sheetRecepten(){
  const perChoc=soorten().map(c=>{
    const l=S.recepten.filter(r=>r.chocolade===c.key);
    if(!l.length) return '';
    return `<div class="uwkop" style="border-bottom:none;padding-top:16px"><span class="n">${c.naam}</span>
        <span class="a">${l.length}</span></div>`+
      l.map(r=>`<div class="rrij"><div class="rinfo"><div class="rnaam">${esc(r.naam)}</div>
        <div class="rsub">${(r.onderdelen||[]).length
          ? getal(gramPerBonbon(r))+' g per bonbon · '+r.onderdelen.length+(r.onderdelen.length===1?' onderdeel':' onderdelen')+' · THT '+r.tht+' dg'
            +(()=>{const k=kostprijs(r);return k.compleet&&k.per>0?' · '+euro(k.per)+' grondstof':''})()
          : 'nog niet af — voeg de onderdelen toe'}</div></div>
        <button class="chip klein" data-edit="${r.id}">Wijzig</button></div>`).join('');
  }).join('');
  sheet('Smaken',
    S.recepten.length
    ? `${S.recepten.length>6?`<div class="veld" style="margin-bottom:4px">
         <input class="inp" id="rzZ" placeholder="Zoek een smaak" autocomplete="off"></div>`:''}
       <div id="rzL">${perChoc}</div>`
    :`<p class="hint">Nog geen smaken. Een smaak is de opbouw van één bonbon: de schelp, de lagen erin, en hoeveel gram elk onderdeel weegt. Hoeveel bonbons je maakt kies je pas bij een batch.</p>`,
    `<button class="prim" style="margin-top:0" id="rN">Nieuwe smaak</button>`);
  if($('#rzZ')) $('#rzZ').oninput=()=>{
    const t=$('#rzZ').value.trim().toLowerCase();
    let zichtbaar=0;
    $$('#rzL .rrij').forEach(rij=>{
      const raak=!t||rij.querySelector('.rnaam').textContent.toLowerCase().includes(t);
      rij.style.display=raak?'':'none'; if(raak) zichtbaar++;
    });
    /* een kop zonder zichtbare smaken eronder hoort ook weg */
    $$('#rzL .uwkop').forEach(kop=>{
      let el=kop.nextElementSibling, n=0;
      while(el&&el.classList.contains('rrij')){ if(el.style.display!=='none') n++; el=el.nextElementSibling }
      kop.style.display=n?'':'none';
    });
  };
  $('#rN').onclick=()=>sheetReceptForm();
  $$('[data-edit]').forEach(b=>b.onclick=()=>sheetReceptForm(b.dataset.edit));
}

function sheetReceptForm(id,voorChoc){
  const best=id?S.recepten.find(x=>x.id===id):null;
  R.id=id||null;
  R.naam=best?best.naam:'';
  R.chocolade=best?best.chocolade:(voorChoc||'melk');
  R.tht=best?best.tht:14;
  R.onderdelen=best?JSON.parse(JSON.stringify(best.onderdelen||[])):[];
  R.stappen=best?(best.stappen||[]).slice():[];
  R.wizard=null; R.voorstel='';
  if(best) tekenRecept(); else sheetSmaakWizard(1);
}

function leesRecept(){
  if($('#rNaam')) R.naam=$('#rNaam').value.trim();
  if($('#rT')) R.tht=parseInt($('#rT').value)||1;
  if(document.querySelector('#rC .chip.aan')) R.chocolade=chipV('#rC');
  if($('#rS')) R.stappen=$$('#rS .insblok').map(blok=>{
    const t=blok.querySelector('[data-stap]');
    const k=blok.querySelector('[data-stapbij]');
    const tekst=t?t.value.trim():'';
    if(!tekst) return null;
    const bij=k?k.value:'';
    return bij?{t:tekst,stap:bij}:tekst;   /* platte tekst blijft werken */
  }).filter(Boolean);
}

/* ================= nieuwe smaak: één vraag tegelijk =================
   Bij een nieuwe smaak loop je een korte wizard door. Na de eerste stap is
   de smaak al bewaard, dus je kunt altijd stoppen en later verder.
   Bewerken van een bestaande smaak gaat via het overzicht. */

function sheetSmaakWizard(stap){
  stap=stap||1;
  if(stap===1) return smaakStap1();
  if(stap===2) return smaakStap2();
  if(stap===3) return smaakStap3();
  return smaakStap4();
}

function smaakStap1(){
  sheet('Hoe heet je smaak?',
    `<p class="hint">Alleen de naam. De rest vul je zo in — je kunt altijd stoppen en later verder.</p>

       placeholder="Bijv. pistache & rode vruchten" autocapitalize="sentences"></div>`,
    `<button class="prim" style="margin-top:0" id="sw1">Volgende</button>`,'Stap 1 van 4');
  setTimeout(()=>{const el=$('#swN'); if(el) el.focus()},250);
  const door=()=>{
    const n=$('#swN').value.trim();
    if(!n) return toast('Geef je smaak een naam.');
    R.naam=n; bewaarSmaak(); bewaarNu(); sheetSmaakWizard(2);
  };
  $('#sw1').onclick=door;
  $('#swN').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();door()}};
}

function smaakStap2(){
  sheet('Waar maak je het van?',
    `<p class="hint">Kies je ${(branche().basis||'basissoort').toLowerCase()} en hoe lang het product houdbaar is.</p>

         `<button class="chip ${c.key===R.chocolade?'aan':''}" data-v="${c.key}">${c.naam}</button>`).join('')}</div></div>
     <div class="veld"><label>Houdbaar na productie</label>
       <div class="keuzeraster" id="swT">${[7,14,21,30,60,90].map(d=>
         `<button class="chip ${R.tht===d?'aan':''}" data-v="${d}">${d} dagen</button>`).join('')}
         <button class="chip breed ${[7,14,21,30,60,90].includes(R.tht)?'':'aan'}" data-v="anders">Ander aantal</button></div>
       <div class="inlineform ${[7,14,21,30,60,90].includes(R.tht)?'':'open'}" id="swTF" style="margin-top:10px">
         <div class="rijtje"><input class="mini" id="swTN" type="number" inputmode="numeric"
           value="${R.tht}" style="max-width:96px">
           <span class="hint" style="margin:0;align-self:center">dagen</span></div></div></div>`,
    `<button class="prim" style="margin-top:0" id="sw2">Volgende</button>
     <button class="sec" id="sw2T">Terug</button>`,'Stap 2 van 4');

  chips('#swT',false,()=>{
    const v=chipV('#swT');

  });
  $('#sw2T').onclick=()=>sheetSmaakWizard(1);

         `<button class="chip" data-nieuwond="${esc(x)}">${x}</button>`).join('')}
         <button class="chip nieuw breed" data-nieuwond="">${svg(I.plus)}Andere laag</button></div></div>`,
    `<button class="prim" style="margin-top:0" id="sw3">${R.onderdelen.length?'Volgende':'Overslaan'}</button>
     <button class="sec" id="sw3T">Terug</button>`,'Stap 3 van 4');
  $$('[data-ond]').forEach(b=>b.onclick=()=>{R.wizard=3;sheetOnderdeel(parseInt(b.dataset.ond))});
  $$('[data-nieuwond]').forEach(b=>b.onclick=()=>{R.wizard=3;R.voorstel=b.dataset.nieuwond;sheetOnderdeel(null)});
  $('#sw3T').onclick=()=>sheetSmaakWizard(2);
  $('#sw3').onclick=()=>sheetSmaakWizard(4);
}

  sheet('Hoe maak je het?',
    `<p class="hint">Schrijf per stap wat je doet. Tijdens het maken krijg je ze vanzelf te zien,

     ${(R.stappen||[]).length?`<div class="paneel" style="margin-bottom:12px">${

         <span class="ivak">${svg(I.doc)}</span>

         <button class="wisbtn" data-wisins="${i}">${svg(I.kruis,'2')}</button></div>`).join('')}</div>`:''}
     <div class="veld"><label>Instructie toevoegen</label>

function tekenRecept(){
  const totaal=gramPerBonbon(R);
  const stapTekst=x=>typeof x==='string'?x:(x&&x.t)||'';
  const stapBij=x=>(x&&typeof x!=='string'&&x.stap)||'';
  const stapRij=(s,i)=>`<div class="insblok">
    <div class="ingrij">
      <input class="nm" data-stap value="${esc(stapTekst(s))}" placeholder="Bijv. tempereren tot 31,5 °C">
      <button class="wisbtn" data-wis-s>${svg(I.kruis,'2')}</button></div>
    <div class="inschips">
      <button type="button" class="chip klein ${!stapBij(s)?'aan':''}" data-bij="${i}" data-w="">Los</button>
      ${(S.werkplan||[]).map(w=>`<button type="button" class="chip klein ${stapBij(s)===w?'aan':''}"
        data-bij="${i}" data-w="${esc(w)}">${esc(w)}</button>`).join('')}
    </div>
    <input type="hidden" data-stapbij value="${esc(stapBij(s))}"></div>`;
  sheet(R.id?'Smaak wijzigen':'Nieuwe smaak',
    `<div class="veld"><label>Naam van de smaak</label>
      <input class="inp" id="rNaam" value="${esc(R.naam)}" placeholder="Bijv. pistache & rode vruchten"></div>
     <div class="veld"><label>Chocolade</label><div class="chips" id="rC">
      ${soorten().map(c=>`<button class="chip ${c.key===R.chocolade?'aan':''}" data-v="${c.key}">${c.naam}</button>`).join('')}</div></div>
     <div class="veld"><label>Houdbaar na productie</label>
      <div class="rijtje"><input class="mini" id="rT" type="number" inputmode="numeric" value="${R.tht}"
        style="max-width:96px"><span class="hint" style="margin:0;align-self:center">dagen na productie</span></div></div>
     <div class="veld"><label>Opbouw van één bonbon</label>
      ${R.onderdelen.length?`<div class="paneel" style="margin-bottom:10px">${
        R.onderdelen.map((o,i)=>`<button class="arij" data-ond="${i}">
          <span class="ivak">${svg(I.vorm)}</span>
          <span class="naam">${esc(o.naam||'Naamloos onderdeel')}<small>${
            (o.ing||[]).length?((o.ing.length===1)?esc(o.ing[0].naam||'1 ingrediënt'):o.ing.length+' ingrediënten'):'nog geen ingrediënten'}${
            (o.werkwijze||[]).length?' · '+o.werkwijze.length+' stappen':''}${o.stap?' · '+esc(o.stap.toLowerCase()):''}</small></span>
          <span class="waarde gevuld">${getal(o.gram||0)} g</span>
          <span class="pijl">${svg(I.pijl,'2')}</span></button>`).join('')}</div>`
        :`<p class="hint" style="margin:0 0 10px">Denk aan de schelp, een gelei-laag en een ganache-laag.</p>`}
      <button class="knop2" id="rOnd" style="margin:0">${svg(I.plus)}Onderdeel toevoegen</button>
      ${totaal?`<div class="totaalregel"><span class="l">Eén bonbon weegt</span>
        <span class="w">${getal(totaal)} g</span></div>`:''}</div>
     <div class="veld"><label>Werkinstructies</label>
      <p class="hint" style="margin:0 0 14px">Kies bij welke stap een instructie hoort, dan krijg je hem
        tijdens het maken vanzelf te zien. Noem je een tijd of temperatuur, dan leest de app die eruit.</p>
      <div id="rS">${(R.stappen.length?R.stappen:['']).map((x,i)=>stapRij(x,i)).join('')}</div>
      <button class="sec" id="rPS" style="margin-top:2px">${svg(I.plus)}&nbsp; Instructie toevoegen</button></div>
     ${R.id?`<div class="veld"><label>Etiket voor de klant</label>
       <button class="knop2" id="rEt" style="margin-top:0">${svg(I.doc)}Productetiket instellen</button></div>`:''}`,
    `<button class="prim" style="margin-top:0" id="rOk">${R.id?'Klaar':'Smaak opslaan'}</button>
     ${S.recepten.length?`<button class="sec" id="rTerug">Terug naar overzicht</button>`:''}`,
    R.id?'Opgeslagen':'');
  bijSluiten=()=>{leesRecept();bewaarSmaak()};

  chips('#rC');
  const bindIns=()=>{
    $$('#rS [data-wis-s]').forEach(b=>b.onclick=()=>{
      if($$('#rS .insblok').length>1) b.closest('.insblok').remove();
      else { b.closest('.insblok').querySelector('[data-stap]').value=''; }
    });
    $$('#rS [data-bij]').forEach(c=>c.onclick=()=>{
      const blok=c.closest('.insblok');
      blok.querySelectorAll('[data-bij]').forEach(x=>x.classList.remove('aan'));
      c.classList.add('aan');
      blok.querySelector('[data-stapbij]').value=c.dataset.w||'';
    });
  };
  bindIns();
  $('#rPS').onclick=()=>{
    $('#rS').insertAdjacentHTML('beforeend',stapRij('',$$('#rS .insblok').length));
    bindIns();
    const laatst=$$('#rS .insblok').pop();
    if(laatst) laatst.querySelector('[data-stap]').focus();
  };
  if($('#rEt')) $('#rEt').onclick=()=>{leesRecept();bewaarSmaak();sheetProductEtiket(R.id)};
  $('#rOnd').onclick=()=>{
    leesRecept();
    if(!R.naam){ toast('Geef de smaak eerst een naam, dan bewaar ik \'m meteen.'); $('#rNaam').focus(); return; }
    bewaarSmaak(); sheetOnderdeel(null);
  };
  $$('[data-ond]').forEach(b=>b.onclick=()=>{leesRecept();bewaarSmaak();sheetOnderdeel(parseInt(b.dataset.ond))});
  if($('#rTerug')) $('#rTerug').onclick=sheetRecepten;
  $('#rOk').onclick=()=>{
    leesRecept();
    if(!R.naam) return toast('Geef de smaak een naam.');
    if(!R.onderdelen.length) return toast('Voeg minimaal één onderdeel toe, bijvoorbeeld de schelp.');
    const bestond=!!R.id;
    bewaarSmaak(); bijSluiten=null;
    render();sheetRecepten();toast(bestond?'Smaak bijgewerkt.':'Smaak opgeslagen.');
  };
}

/* onderdeel bewerken: gewicht per bonbon + het eigen recept van dat onderdeel */
function raadStap(naam){
  const n=(naam||'').toLowerCase();
  return S.werkplan.find(x=>x.toLowerCase().includes(n)||n.includes(x.toLowerCase().split(' ')[0]))||'';
}
function sheetOnderdeel(idx){
  const nieuw = idx===null;
  const o = nieuw ? {naam:R.voorstel||'',gram:'',ing:[{naam:'',deel:''}],werkwijze:[''],stap:''}
                  : JSON.parse(JSON.stringify(R.onderdelen[idx]));
  if(nieuw) R.voorstel='';
  if(!o.ing||!o.ing.length) o.ing=[{naam:'',deel:''}];
  if(!o.werkwijze||!o.werkwijze.length) o.werkwijze=[''];
  const ingRij=i=>`<div class="ingrij">
    <input class="nm" data-in value="${esc(i.naam)}" placeholder="Ingrediënt">
    <input class="hv" data-id2 type="number" inputmode="decimal" value="${esc(i.deel)}" placeholder="gram">
    <button class="wisbtn" data-wis-i>${svg(I.kruis,'2')}</button></div>`;
  sheet(nieuw?'Onderdeel toevoegen':'Onderdeel',
    `<div class="veld"><label>Wat is dit onderdeel?</label>
      <input class="inp" id="oN" value="${esc(o.naam)}" placeholder="Bijv. schelp, gelei of ganache"></div>
     <div class="veld"><label>Hoeveel gaat er in één bonbon?</label>
      <div class="stepper"><button class="stepbtn" id="oMin">${svg(I.min)}</button>
       <div class="stepval"><input id="oG" type="number" inputmode="decimal" step="0.25" value="${esc(o.gram)}" placeholder="0"><span class="eenh">g</span></div>
       <button class="stepbtn" id="oPlus">${svg(I.plus)}</button></div></div>
     <div class="veld"><label>Jouw recept voor dit onderdeel</label>
      <p class="hint" style="margin-bottom:12px">Vul je recept in zoals je het écht maakt — één hele bak, in grammen.
        De app rekent zelf uit hoeveel daarvan in één bonbon gaat.</p>
      <div id="oI">${o.ing.map(ingRij).join('')}</div>
      <button class="sec" id="oP" style="margin-top:2px">${svg(I.plus)}&nbsp; Ingrediënt toevoegen</button>
      <div id="oSam"></div></div>
     <div class="veld"><label>Werkwijze voor dit onderdeel</label>
       <p class="hint" style="margin-bottom:10px">Elke regel is één handeling. Typ, druk op enter, typ door.
         Straks krijg je ze één voor één te zien tijdens het maken.</p>
       <textarea class="inp wzvak" id="oW" rows="7"
         placeholder="Room verwarmen tot 80 °C&#10;Van het vuur halen&#10;Chocolade erdoor roeren&#10;Laten afkoelen 20 min&#10;Boter erdoor mixen">${esc((o.werkwijze||[]).join('\n'))}</textarea>
       <div class="geen" id="oWuit" style="padding-top:9px"></div></div>
     <div class="veld"><label>Hoort bij welke productiestap?</label>
       <div class="chips" id="oStap">${S.werkplan.map(x=>`<button class="chip klein ${x===(o.stap||raadStap(o.naam))?'aan':''}"
         data-v="${esc(x)}">${esc(x)}</button>`).join('')}</div>
       <div class="geen" style="padding-top:8px">Zo weet de app wanneer hij dit recept moet tonen.</div></div>`,
    `<button class="prim" style="margin-top:0" id="oOk">${nieuw?'Onderdeel toevoegen':'Wijzigingen opslaan'}</button>
     ${nieuw?'':`<button class="sec" id="oWis">Onderdeel verwijderen</button>`}
     <button class="sec" id="oTerug">Terug naar smaak</button>`);

  const rijenLezen=()=>$$('#oI .ingrij').map(el=>({
    naam:el.querySelector('[data-in]').value.trim(),
    deel:el.querySelector('[data-id2]').value.trim()
  })).filter(x=>x.naam);

  const ververs=()=>{
    const rijen=$$('#oI .ingrij');
    const enkel=rijen.length===1;
    /* bij één ingrediënt is het gewicht van het onderdeel automatisch dat ingrediënt */
    rijen.forEach(el=>{
      const inp=el.querySelector('[data-id2]');
      inp.disabled=enkel;
      inp.placeholder=enkel?'alles':'gram';
      inp.style.opacity=enkel?'.45':'1';
    });
    const r=rijenLezen(), g=parseFloat($('#oG').value)||0;
    const waarschuwing = g>50
      ? `<div class="norm fout" style="margin-bottom:10px">${svg(I.alarm)}${getal(g)} g per bonbon — klopt dat?
           Een hele bonbon weegt meestal 8 tot 15 gram.</div>` : '';
    if(!r.length){ $('#oSam').innerHTML=waarschuwing; return; }
    if(r.length===1){
      $('#oSam').innerHTML=waarschuwing+`<div class="verhouding">Eén ingrediënt: het hele gewicht van dit onderdeel is ${esc(r[0].naam)}.</div>`;
      return;
    }
    const som=r.reduce((s2,x)=>s2+(parseFloat(x.deel)||0),0);
    if(!som){ $('#oSam').innerHTML=waarschuwing+`<div class="verhouding">Vul bij elk ingrediënt in hoeveel gram er in jouw bak gaat.</div>`; return; }
    const bonbons = g>0 ? Math.floor(som/g) : 0;
    $('#oSam').innerHTML=waarschuwing+`
      <div class="totaalregel"><span class="l">Jouw bak</span><span class="w">${getal(som)} g</span></div>
      ${bonbons?`<div class="totaalregel" style="margin-top:8px"><span class="l">Goed voor</span><span class="w">${bonbons} bonbons</span></div>`:''}
      <div class="verhouding">Verhouding: ${r.map(x=>esc(x.naam)+' '+getal(((parseFloat(x.deel)||0)/som)*100)+'%').join(' · ')}</div>`;
  };
  const bindRijen=()=>{
    $$('[data-wis-i]').forEach(b=>b.onclick=()=>{if($$('#oI .ingrij').length>1){b.parentElement.remove();bindRijen();ververs()}});
    $$('#oI input').forEach(i=>i.oninput=ververs);
    $$('[data-wis-w]').forEach(b=>b.onclick=()=>{if($$('#oW .ingrij').length>1)b.parentElement.remove()});
  };
  chips('#oStap');
  bindRijen(); ververs();
  $('#oG').oninput=ververs;
  $('#oP').onclick=()=>{$('#oI').insertAdjacentHTML('beforeend',ingRij({naam:'',deel:''}));bindRijen();ververs()};
  const wzUit=()=>{
    const rg=$('#oW').value.split('\n').map(x=>x.trim()).filter(Boolean);
    if(!rg.length) return $('#oWuit').textContent='Nog geen stappen. Zonder werkwijze kan de app je niet begeleiden.';
    const mt=rg.filter(x=>leesTijd(x)).length, mg=rg.filter(x=>leesGraden(x)!==null).length;
    let t=`${rg.length} ${rg.length===1?'handeling':'handelingen'}`;
    if(mt) t+=` · ${mt}× een tijd herkend`;
    if(mg) t+=` · ${mg}× een temperatuur herkend`;
    $('#oWuit').textContent=t+'.';
  };
  $('#oW').oninput=wzUit; wzUit();
  $('#oMin').onclick=()=>{$('#oG').value=Math.max(0,(parseFloat($('#oG').value||0)-0.25)).toFixed(2).replace(/\.?0+$/,'');ververs()};
  $('#oPlus').onclick=()=>{$('#oG').value=((parseFloat($('#oG').value||0)+0.25)).toFixed(2).replace(/\.?0+$/,'');ververs()};
  const terug=()=>{bewaarSmaak();bewaarNu();R.wizard?smaakStap3():tekenRecept()};
  $('#oTerug').onclick=terug;
  if($('#oWis')) $('#oWis').onclick=()=>{R.onderdelen.splice(idx,1);bewaarSmaak();render();
    R.wizard?smaakStap3():tekenRecept();toast('Onderdeel verwijderd.')};
  $('#oOk').onclick=()=>{
    const naam=$('#oN').value.trim(), gram=parseFloat($('#oG').value);
    const ing=rijenLezen();
    if(!naam) return toast('Geef het onderdeel een naam.');
    if(!(gram>0)) return toast('Vul in hoeveel gram hiervan in één bonbon gaat.');
    if(gram>50&&!confirm(getal(gram)+' g per bonbon is ongebruikelijk veel. Weet je het zeker?')) return;
    if(!ing.length) return toast('Vul in waar dit onderdeel uit bestaat.');
    if(ing.length>1&&ing.some(x=>!x.deel)) return toast('Vul bij elk ingrediënt in hoeveel gram er in jouw bak gaat.');
    const werkwijze=$('#oW').value.split('\n').map(x=>x.trim()).filter(Boolean);
    const d={naam,gram,ing,werkwijze,stap:chipV('#oStap')||raadStap(naam)};
    if(nieuw) R.onderdelen.push(d); else R.onderdelen[idx]=d;
    bewaarSmaak(); bewaarNu(); render(); R.wizard?smaakStap3():tekenRecept();
    toast(nieuw?'Onderdeel toegevoegd en smaak opgeslagen.':'Onderdeel bijgewerkt.');
  };
}

/* ================= account en synchronisatie ================= */

    const cfg=fbConfig();

    return sheet('Synchronisatie',
      `<p class="hint">${mist
        ? 'Je gegevens zijn ingevuld, maar er ontbreekt een <b>databaseURL</b>. Dat betekent dat de Realtime Database nog niet bestond toen je de web-app aanmaakte. Maak eerst de database aan, kopieer daarna opnieuw je gegevens.'
        : 'Firebase is nog niet ingesteld. Vul je projectgegevens in het bestand <b>config.js</b>.'} Tot die tijd werkt alles gewoon,
        maar staat je data alleen op dit toestel.</p>`,
      `<button class="prim" style="margin-top:0" id="acK">Sluiten</button>`), $('#acK').onclick=dicht;
  }
  if(fbUser){
    return sheet('Synchronisatie',
      `<div class="veld"><div class="rrij"><div class="rinfo">
         <div class="rnaam">${esc(fbUser.email||'Ingelogd')}</div>
         <div class="rsub">${fbOnline?'verbonden met Firebase':'offline — wijzigingen gaan mee zodra je weer verbinding hebt'}</div>
       </div></div></div>
       <p class="hint">Je gegevens staan op dit toestel én in je eigen database. Log je op je laptop in met
         hetzelfde adres, dan zie je daar precies hetzelfde.</p>`,
      `<button class="prim" style="margin-top:0" id="acUit">Uitloggen</button>
       <button class="sec" id="acK">Sluiten</button>`), 
      $('#acK').onclick=dicht,
      $('#acUit').onclick=()=>{if(confirm('Uitloggen? Je gegevens blijven op dit toestel staan.'))
        firebase.auth().signOut().then(()=>{dicht();render();toast('Uitgelogd.')})};
  }
  sheet('Inloggen',
    `<p class="hint">Log één keer in. Daarna blijft de app ingelogd en synchroniseert alles vanzelf.</p>
     <div class="veld"><label>E-mailadres</label>
       <input class="inp" id="acM" type="email" inputmode="email" autocomplete="username" placeholder="info@cacaoboetiek.nl"></div>
     <div class="veld"><label>Wachtwoord</label>
       <input class="inp" id="acW" type="password" autocomplete="current-password" placeholder="minimaal 6 tekens"></div>
     <div class="geen" id="acFout"></div>`,
    `<button class="prim" style="margin-top:0" id="acIn">Inloggen</button>
     <button class="sec" id="acNieuw">Account aanmaken</button>
     <button class="sec" id="acK">Later</button>`);
  const melden=e=>{$('#acFout').textContent=({
    'auth/invalid-email':'Dat lijkt geen geldig e-mailadres.',
    'auth/missing-password':'Vul je wachtwoord in.',
    'auth/weak-password':'Kies een wachtwoord van minimaal 6 tekens.',
    'auth/email-already-in-use':'Dit adres bestaat al — kies Inloggen.',
    'auth/invalid-credential':'E-mailadres of wachtwoord klopt niet.',
    'auth/network-request-failed':'Geen verbinding. Je kunt gewoon doorwerken; synchroniseren lukt later.'
  })[e.code]||e.message};
  const velden=()=>[$('#acM').value.trim(),$('#acW').value];
  $('#acK').onclick=dicht;
  $('#acIn').onclick=()=>{const[m,w]=velden();
    firebase.auth().signInWithEmailAndPassword(m,w)
      .then(()=>{dicht();render();toast('Ingelogd. Je gegevens synchroniseren nu.')}).catch(melden)};
  $('#acNieuw').onclick=()=>{const[m,w]=velden();
    firebase.auth().createUserWithEmailAndPassword(m,w)
      .then(()=>{dicht();render();toast('Account aangemaakt.')}).catch(melden)};
}

     <div class="veld"><label>Jouw gegevens (${kb} kB)</label>
       <textarea class="inp" id="dOut" style="height:110px;font-size:12px" readonly>${esc(json)}</textarea>

/* ================= instellingen ================= */
/* volgorde-advies: allergeenarm eerst, allergeenrijk laatst */
function batchAllergenen(b){
  const rij=b.regels.map(rg=>{
    const r=receptVan(b,rg.receptId);
    return {receptId:rg.receptId,naam:r.naam,groepen:smaakAllergenen(r)};
  });
  const alle=new Set(); rij.forEach(x=>x.groepen.forEach(g=>alle.add(g)));
  const advies=[...rij].sort((a,b2)=>a.groepen.length-b2.groepen.length||a.naam.localeCompare(b2.naam,'nl'));
  const verschil=rij.length>1&&rij.some(x=>x.groepen.join()!==rij[0].groepen.join());
  return {rij,alle:ALLERGENEN.filter(a=>alle.has(a.k)).map(a=>a.k),advies,verschil};
}
/* voorraad gereed product: alles is een mutatie, het saldo volgt daaruit */
const MUTATIES={
  batch:{n:'Uit productie',plus:true},
  verkocht:{n:'Verkocht'},
  breuk:{n:'Breuk'},
  proef:{n:'Proeverij'},
  correctie:{n:'Correctie',vrij:true}
};
function muteer(m){
  S.mutaties=S.mutaties||[];
  S.mutaties.push(Object.assign({id:uid(),datum:iso(new Date()),tijd:nu()},m));
}
/* saldo per smaak en lot */
function voorraadGereed(){
  const map={};
  (S.mutaties||[]).forEach(m=>{
    const k=m.receptId+'|'+m.lot;
    map[k]=map[k]||{receptId:m.receptId,lot:m.lot,tht:m.tht,aantal:0};
    if(m.tht&&!map[k].tht) map[k].tht=m.tht;
    map[k].aantal+=m.aantal;
  });
  return Object.values(map).filter(x=>x.aantal!==0)
    .sort((a,b2)=>(a.tht||'').localeCompare(b2.tht||''));
}
const voorraadPerSmaak=()=>{
  const map={};
  voorraadGereed().forEach(v=>{map[v.receptId]=(map[v.receptId]||0)+v.aantal});
  return map;
};
const dagenTotTHT=t=>t?Math.round((new Date(t)-new Date(vandaag()))/86400000):null;

/* ---------- grondstofvoorraad ----------
   Net als bij gereed product is elke wijziging een regel; het saldo volgt uit de historie.
   Alles wordt binnen een product omgerekend naar één eenheid, zodat kg en g optellen. */
const BASIS={kg:['g',1000],g:['g',1],l:['ml',1000],ml:['ml',1],st:['st',1]};
const naarBasis=(n,e)=>n*((BASIS[e]||BASIS.st)[1]);
function toonHoeveel(n,basis){
  if(basis==='g') return n>=1000?getal(n/1000)+' kg':getal(n)+' g';
  if(basis==='ml') return n>=1000?getal(n/1000)+' l':getal(n)+' ml';
  return getal(n)+' st';
}
/* naam netjes vergelijkbaar maken, zodat 'Melkchocolade' en 'melkchocolade ' samenvallen */
const gKey=p=>String(p||'').trim().toLowerCase();

function grondVoorraad(){
  const map={};
  (S.gmut||[]).forEach(m=>{
    const k=gKey(m.product); if(!k) return;
    const soort=artSoort(m.product);
    const basis=(soort==='ingredient'||soort==='half')?(BASIS[m.eenheid]||BASIS.st)[0]:'st';
    map[k]=map[k]||{product:m.product,basis:basis,saldo:0,lots:{}};
    map[k].saldo+=naarBasis(m.aantal||0,m.eenheid);
    if(m.lot){
      map[k].lots[m.lot]=(map[k].lots[m.lot]||0)+naarBasis(m.aantal||0,m.eenheid);
    }
  });
  return Object.values(map).sort((a,b2)=>{
    const da=grondOnder(a), db=grondOnder(b2);
    if(da!==db) return da?-1:1;
    return a.product.localeCompare(b2.product);
  });
}
/* elk artikel heeft een soort; verpakking en hulpmiddelen tellen anders dan grondstoffen */
const SOORTEN={
  ingredient:{naam:'Grondstoffen',enk:'Grondstof',eenheid:'g'},
  half:{naam:'Halffabricaat',enk:'Halffabricaat',eenheid:'g'},
  verpakking:{naam:'Verpakking',enk:'Verpakkingsartikel',eenheid:'st'},
  hulp:{naam:'Hulpmiddelen',enk:'Hulpmiddel',eenheid:'st'}
};
function art(product){
  const k=gKey(product);
  S.artikelen=S.artikelen||{};
  return S.artikelen[k]||{soort:'ingredient'};
}
function zetArt(product,d){
  const k=gKey(product); if(!k) return;
  S.artikelen=S.artikelen||{};
  S.artikelen[k]=Object.assign({soort:'ingredient'},S.artikelen[k]||{},d);
}
const artSoort=p=>art(p).soort||'ingredient';

const grondDrempel=p=>((S.drempels||{})[gKey(p)]||0);
const grondOnder=v=>{const d=grondDrempel(v.product);return d>0&&v.saldo<=d};

/* boekt een wijziging bij de grondstoffen */
function gBoek(product,aantal,eenheid,reden,lot){
  if(!product||!aantal) return;
  S.gmut=S.gmut||[];
  S.gmut.push({id:uid(),datum:vandaag(),tijd:nu(),product:product,lot:lot||'',
    aantal:aantal,eenheid:eenheid||'g',reden:reden||''});
}
/* eenmalig: wat al als partij is vastgelegd telt alsnog mee als beginvoorraad */
function migreerGrond(){
  if(S.gmutGezet) return;
  (S.lots||[]).forEach(l=>{
    if(l.product&&l.hoeveel) gBoek(l.product,parseFloat(l.hoeveel)||0,l.eenheid||'g','Ontvangst',l.lot);
  });
  S.gmutGezet=true;
}
const smaakNaam=id=>{const r=(S.recepten||[]).find(x=>x.id===id);return r?r.naam:'onbekende smaak'};

/* orders */
const OSTATUS={
  nieuw:{n:'Nieuw',k:'amber'},
  ingepakt:{n:'Ingepakt',k:'groen'},
  geleverd:{n:'Geleverd',k:''},
  vervallen:{n:'Vervallen',k:''}
};
const klantNaam=id=>{const k=(S.klanten||[]).find(x=>x.id===id);return k?k.naam:'onbekende klant'};
const nieuwOrdernr=()=>{
  const jaar=new Date().getFullYear(), voor='O-'+jaar+'-';
  const nrs=(S.orders||[]).filter(o=>o.nummer&&o.nummer.indexOf(voor)===0)
    .map(o=>parseInt(o.nummer.slice(voor.length),10)||0);
  return voor+String((nrs.length?Math.max.apply(null,nrs):0)+1).padStart(3,'0');
};
const orderAantal=o=>(o.regels||[]).reduce((n,r)=>n+(r.aantal||0),0);
/* wat is er al beloofd aan andere orders die nog niet geleverd zijn? */
function gereserveerd(negeerId){
  const map={};
  (S.orders||[]).filter(o=>o.status==='nieuw'&&o.id!==negeerId).forEach(o=>
    (o.regels||[]).forEach(r=>{map[r.receptId]=(map[r.receptId]||0)+r.aantal}));
  return map;
}
/* per smaak: heb ik genoeg, en wat komt er tekort? */
function dekking(o){
  const vrij=voorraadPerSmaak(), res=gereserveerd(o?o.id:null);
  return ((o&&o.regels)||[]).map(r=>{
    const op=vrij[r.receptId]||0, beloofd=res[r.receptId]||0;
    const beschikbaar=op-beloofd;
    return {receptId:r.receptId,nodig:r.aantal,op,beloofd,beschikbaar,
      tekort:Math.max(0,r.aantal-beschikbaar)};
  });
}
/* je registreert je tijd al — dan mag je er ook iets voor terugkrijgen */
/* wat kost een bonbon aan grondstof? prijs per kilo, vastgelegd op ingredientnaam */
/* de prijs per kilo van een ingrediënt.
   Eerst wat je handmatig invulde; anders wat je bij de laatste ontvangst betaalde. */
const ingPrijs=naam=>{
  const eigen=(S.prijzen||{})[naam];
  if(typeof eigen==='number') return eigen;
  /* art().prijs is per basiseenheid (gram), kostprijs rekent per kilo */
  const a=art(naam);
  if(a&&typeof a.prijs==='number'&&a.prijs>0){
    const basis=(SOORTEN[a.soort||'ingredient']||{}).eenheid||'g';
    return basis==='st' ? a.prijs : a.prijs*1000;
  }
  return null;
};
function kostprijs(r){
  const ing=smaakIngredienten(r);
  let cent=0, mist=[];
  ing.forEach(i=>{
    const p=ingPrijs(i.naam);
    if(p===null){mist.push(i.naam);return}
    cent+=(i.gram/1000)*p;
  });
  return {per:cent,mist,compleet:mist.length===0};
}
const euro=n=>'€ '+n.toFixed(2).replace('.',',');

/* ═══════════ kostenbasis: derving, vaste lasten, volledige kostprijs ═══════════
   kostprijs() geeft alleen je grondstoffen. Je arbeid rekent al met goede
   stuks, je grondstoffen niet — je betaalt je afkeur dus stilzwijgend zelf.
   Hier komen de ontbrekende lagen erbij. */

/* hoeveel gaat er onderweg verloren? */
function dervingInfo(){
  if(typeof S.derving==='number') return {pct:S.derving,bron:'ingesteld'};
  const af=(S.batches||[]).filter(b=>b.status==='klaar'&&b.resultaat);
  const goed=af.reduce((n,b)=>n+(b.resultaat.goed||0),0);
  const afk=af.reduce((n,b)=>n+(b.resultaat.afkeur||0),0);
  if(goed+afk<1) return {pct:null,bron:'geen'};
  return {pct:Math.round(afk/(goed+afk)*1000)/10,bron:'gemeten',goed,afkeur:afk,batches:af.length};
}

/* vaste lasten bij elkaar, alles omgerekend naar per maand */
const vasteLastenPerMaand=()=>(S.vasteLasten||[])
  .reduce((n,p)=>n+(p.per==='jaar'?(parseFloat(p.bedrag)||0)/12:(parseFloat(p.bedrag)||0)),0);

/* waar smeren we die lasten over uit? */
function productiePerMaand(){
  if(typeof S.prodPerMaand==='number'&&S.prodPerMaand>0)
    return {n:S.prodPerMaand,bron:'ingesteld'};
  const af=(S.batches||[]).filter(b=>b.status==='klaar'&&b.resultaat&&b.eindDatum);
  if(!af.length) return {n:null,bron:'geen'};
  const stuks=af.reduce((n,b)=>n+(b.resultaat.goed||0),0);
  const d=af.map(b=>b.eindDatum).sort();
  const dagen=Math.max(30,dagenTussen(d[0],d[d.length-1])+1);
  return {n:Math.max(1,Math.round(stuks/(dagen/30.4))),bron:'gemeten',stuks,dagen};
}

function vastPerBonbon(){
  const maand=vasteLastenPerMaand();
  const p=productiePerMaand();
  if(!maand) return {per:0,maand:0,prod:p.n,bron:p.bron};
  if(!p.n) return {per:null,maand,prod:null,bron:'geen'};
  return {per:maand/p.n,maand,prod:p.n,bron:p.bron};
}

/* de volledige kostprijs van één bonbon, met alle vier de lagen apart */
function kostprijsVol(r){
  const kp=kostprijs(r);
  const dv=dervingInfo().pct||0;
  const grond=kp.compleet?kp.per:null;
  /* derving deel je erdoor, niet bij op: bij 5% afkeur heb je voor 100 goede
     bonbons grondstof voor 105 nodig */
  const grondNa=grond===null?null:grond/(1-Math.min(Math.max(dv,0),90)/100);
  const ap=arbeidPerBonbon();
  const arbeid=ap?ap.perStuk:0;
  const vb=vastPerBonbon();
  const vast=vb.per||0;
  return {grond,dervingPct:dv,grondNa,
    verlies:(grondNa===null||grond===null)?0:grondNa-grond,
    arbeid,vast,vastOnbekend:vb.per===null&&vb.maand>0,
    totaal:grondNa===null?null:grondNa+arbeid+vast,
    mist:kp.mist,compleet:kp.compleet};
}

/* ═══════════ verpakking: op welke schaal telt een artikel mee? ═══════════
   Een lint per doos is iets heel anders dan een lint per bonbon. Bij 96 stuks
   zit je er anders een factor 96 naast. */
const VERPAKSCHAAL={
  bonbon: {n:'Per bonbon', u:'elke bonbon'},
  doos:   {n:'Per doos',   u:'elke doos'},
  zending:{n:'Per zending',u:'elke levering'}
};
const artSchaal=p=>VERPAKSCHAAL[art(p).schaal]?art(p).schaal:'doos';
const artInhoud=p=>{const i=art(p).inhoud;return (typeof i==='number'&&i>0)?i:null};

/* alle verpakkingsartikelen die je kent, op naam */
function verpakkingsArtikelen(){
  const namen={};
  grondVoorraad().forEach(v=>{if(artSoort(v.product)==='verpakking') namen[gKey(v.product)]=v.product});
  (S.lots||[]).forEach(l=>{if(artSoort(l.product)==='verpakking') namen[gKey(l.product)]=l.product});
  Object.keys(S.artikelen||{}).forEach(k=>{
    if((S.artikelen[k]||{}).soort==='verpakking'&&!namen[k])
      namen[k]=(S.artikelen[k].naam)||k;
  });
  return Object.values(namen).sort((a,b)=>a.localeCompare(b));
}

/* ═══════════ leveringsvormen: wat neemt de klant af? ═══════════
   Los in bulk, in doosjes, of compleet afgewerkt. Per vorm leg je vast welke
   verpakking meegaat en hoeveel bonbons er in één eenheid zitten. */
const VORMVOORBEELDEN=[
  {naam:'Los / bulk',    inhoud:96, regels:[]},
  {naam:'Kaal doosje',   inhoud:25, regels:[]},
  {naam:'Compleet',      inhoud:25, regels:[]}
];
const vormen=()=>(S.vormen||[]);
const vorm=id=>vormen().find(v=>v.id===id)||null;

/* verpakkingskosten per bonbon voor één leveringsvorm */
function verpakkingPerBonbon(v){
  if(!v) return {per:0,mist:[],zending:0};
  const inh=Math.max(1,parseInt(v.inhoud,10)||1);
  let per=0, zending=0; const mist=[];
  (v.regels||[]).forEach(rg=>{
    const n=parseFloat(rg.aantal)||0; if(n<=0) return;
    const prijs=ingPrijs(rg.product);
    if(prijs===null){mist.push(rg.product);return}
    const sch=artSchaal(rg.product);
    if(sch==='bonbon')      per+=prijs*n;
    else if(sch==='doos')   per+=(prijs*n)/inh;
    else                    zending+=prijs*n;
  });
  return {per,mist,zending};
}

/* ═══════════ staffel en B2B-prijs ═══════════ */
const STAFFEL_STANDAARD=[{van:1,pct:0},{van:50,pct:5},{van:200,pct:10}];
const staffel=()=>(S.staffel&&S.staffel.length?S.staffel:STAFFEL_STANDAARD)
  .slice().sort((a,b)=>a.van-b.van);
function staffelTrede(aantal){
  const s=staffel(); let uit=s[0];
  s.forEach(t=>{if(aantal>=t.van) uit=t});
  return uit;
}
const b2bMarge=()=>typeof S.b2bMarge==='number'?S.b2bMarge:35;

/* de hele som voor één smaak, één vorm, één aantal bonbons */
function b2bBereken(r,v,aantalBonbons){
  const kv=kostprijsVol(r);
  const vp=verpakkingPerBonbon(v);
  const inh=v?Math.max(1,parseInt(v.inhoud,10)||1):1;
  const stuks=Math.max(1,parseInt(aantalBonbons,10)||1);
  const dozen=v?Math.ceil(stuks/inh):0;
  const kostBonbon=kv.totaal===null?null:kv.totaal+vp.per;
  const marge=b2bMarge();
  const trede=staffelTrede(stuks);
  let lijst=null, prijs=null;
  if(kostBonbon!==null&&marge<100){
    lijst=kostBonbon/(1-marge/100);
    prijs=lijst*(1-(trede.pct||0)/100);
  }
  const zending=vp.zending||0;
  return {
    kv, vp, inh, stuks, dozen, kostBonbon, marge, trede,
    lijst, prijs,
    perDoos: prijs===null?null:prijs*inh,
    totaal:  prijs===null?null:prijs*stuks+zending,
    zending,
    winst:   prijs===null?null:(prijs-kostBonbon)*stuks,
    margePct:(prijs===null||prijs<=0)?null:Math.round((prijs-kostBonbon)/prijs*100),
    onderKost: prijs!==null&&kostBonbon!==null&&prijs<kostBonbon,
    mist: (kv.mist||[]).concat(vp.mist)
  };
}

/* ═══════════ prijsafspraak per klant ═══════════
   Je legt de lijstprijs vast, niet de kortingsprijs: de staffel hangt aan het
   aantal en rekent bij elke order opnieuw. */
const afspraken=()=>(S.afspraken||{});
const afspraak=klantId=>afspraken()[klantId]||null;

function zetAfspraak(klantId,vormId,marge){
  const v=vorm(vormId); if(!v) return null;
  const prijzen={};
  (S.recepten||[]).forEach(r=>{
    const b=b2bBereken(r,v,1);            /* trede 1 = lijstprijs, zonder korting */
    if(b.lijst!==null) prijzen[r.id]=b.lijst;
  });
  S.afspraken=Object.assign({},afspraken());
  S.afspraken[klantId]={vormId,marge:marge,prijzen,datum:iso(new Date())};
  bewaarNu();
  return S.afspraken[klantId];
}

/* de prijs die deze klant betaalt, inclusief btw zodat hij in de factuur past */
function prijsVoor(klantId,receptId,aantal){
  const a=klantId?afspraak(klantId):null;
  if(a&&typeof a.prijzen[receptId]==='number'){
    const korting=(staffelTrede(aantal||1).pct||0)/100;
    return a.prijzen[receptId]*(1-korting)*(1+BTW_ETEN);
  }
  return verkoopPrijs(receptId);
}

/* wat houdt je afnemer over als hij doorverkoopt tegen jouw adviesprijs? */
function afnemerMarge(r,prijsExcl){
  const vk=verkoopPrijs(r.id);
  if(vk===null||prijsExcl===null) return null;
  const advExcl=vk/(1+BTW_ETEN);
  if(advExcl<=0) return null;
  return {advExcl,pct:Math.round((advExcl-prijsExcl)/advExcl*100)};
}

function batchDuurStat(){
  const af=(S.batches||[]).filter(b=>b.status==='klaar'&&werkTotaal(b)>60);
  if(af.length<2) return null;
  const perBonbon=af.map(b=>werkTotaal(b)/Math.max(1,bTotaal(b)));
  perBonbon.sort((a,b2)=>a-b2);
  const mid=perBonbon[Math.floor(perBonbon.length/2)];
  return {n:af.length,secPerBonbon:mid,
    laatste:werkTotaal(af[af.length-1]),laatsteCode:af[af.length-1].code};
}
const verwachteDuur=b=>{const st=batchDuurStat();return st?Math.round(st.secPerBonbon*bTotaal(b)):null};

/* ============ kilometerregistratie ============ */
/* onbelaste kilometervergoeding: per 2026 verhoogd van 0,23 naar 0,25 (beleidsbesluit,
   met terugwerkende kracht vanaf 1 januari). Zelf aanpasbaar als het bedrag wijzigt. */
const KM_STANDAARD=0.25;
const kmTarief=()=>typeof S.kmTarief==='number'?S.kmTarief:KM_STANDAARD;
function afstandKm(a,b){              /* hemelsbrede afstand tussen twee punten */
  const R=6371, dl=(b.lat-a.lat)*Math.PI/180, dn=(b.lon-a.lon)*Math.PI/180;
  const x=Math.sin(dl/2)**2+Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dn/2)**2;
  return 2*R*Math.asin(Math.sqrt(x));
}
function ritKm(punten){
  let n=0;
  for(let i=1;i<punten.length;i++) n+=afstandKm(punten[i-1],punten[i]);
  return n;
}
const ritten=()=>(S.ritten||[]).slice().sort((a,b)=>(b.datum+b.start.tijd).localeCompare(a.datum+a.start.tijd));
const kmDitJaar=z=>{
  const j=String(new Date().getFullYear());
  return (S.ritten||[]).filter(r=>r.datum.startsWith(j)&&(z===undefined||r.zakelijk===z))
    .reduce((n,r)=>n+r.km,0);
};
/* adres bij een punt opzoeken; lukt dat niet, dan blijven de coördinaten staan */
async function adresVan(lat,lon){
  try{
    const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}&zoom=18&addressdetails=1`,
      {headers:{'Accept-Language':'nl'}});
    if(!r.ok) return null;
    const d=await r.json(), a=d.address||{};
    const straat=[a.road,a.house_number].filter(Boolean).join(' ');
    const plaats=a.city||a.town||a.village||a.municipality||'';
    return [straat,plaats].filter(Boolean).join(', ')||d.display_name||null;
  }catch(e){ return null; }
}
/* In de echte app blijft de gps doortellen als je naar Kaarten gaat of je telefoon
   wegleg. In de webversie bestaat dat niet — dan valt hij terug op watchPosition. */
const achtergrondGps=()=>{
  try{
    if(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform()
       &&window.Capacitor.registerPlugin){
      return window.Capacitor.registerPlugin('BackgroundGeolocation');
    }
  }catch(e){}
  return null;
};
const inApp=()=>!!achtergrondGps();
let ritWatch=null, bgWatch=null;
function meetPunt(lat,lon,nauw){
  if(!S.rit) return;
  if(nauw>60) return;                               /* te onnauwkeurig, negeren */
  const punt={lat,lon,t:Date.now()};
  const vorig=S.rit.punten[S.rit.punten.length-1];
  if(vorig&&afstandKm(vorig,punt)<0.015) return;    /* onder de 15 meter is ruis */
  S.rit.punten.push(punt);
  S.rit.km=ritKm(S.rit.punten);
  bewaarNu();
  const el=$('#rkKm'); if(el) el.textContent=komma(Math.round(S.rit.km*10)/10);
}

function ritVolgen(aan){
  const bg=achtergrondGps();
  if(!aan){
    if(ritWatch!==null){navigator.geolocation.clearWatch(ritWatch);ritWatch=null}
    if(bg&&bgWatch){ bg.removeWatcher({id:bgWatch}).catch(()=>{}); bgWatch=null }
    return;
  }
  if(bg){
    if(bgWatch) return;
    bg.addWatcher({
      backgroundTitle:'Rit loopt',
      backgroundMessage:'Je kilometers worden bijgehouden.',
      requestPermissions:true, stale:false, distanceFilter:15
    },(pos,fout)=>{
      if(fout){
        if(fout.code==='NOT_AUTHORIZED') toast('Zet locatie op "Altijd" om tijdens het rijden te blijven meten.');
        return;
      }
      meetPunt(pos.latitude,pos.longitude,pos.accuracy||10);
    }).then(id=>{bgWatch=id}).catch(()=>{});
    return;
  }
  if(ritWatch!==null||!navigator.geolocation) return;
  ritWatch=navigator.geolocation.watchPosition(pos=>{
    const c=pos.coords;
    meetPunt(c.latitude,c.longitude,c.accuracy);
  },()=>{},{enableHighAccuracy:true,maximumAge:5000,timeout:20000});
}

/* Opent Kaarten met de route erheen. Werkt in de app én in de browser. */
function routeNaar(bestemming,lat,lon){
  const q=lat!=null&&lon!=null
    ? lat+','+lon+(bestemming?'&dirflg=d':'')
    : encodeURIComponent(bestemming||'');
  const appel='maps://?daddr='+q+'&dirflg=d';
  const web='https://maps.apple.com/?daddr='+q+'&dirflg=d';
  try{ window.location.href=appel; setTimeout(()=>{ window.open(web,'_blank') },700); }
  catch(e){ window.open(web,'_blank') }
}
/* Eén gps-meting zit er zo tien meter naast. Meerdere metingen middelen is veel scherper:
   elke meting weegt mee naar 1/nauwkeurigheid², zoals dat hoort bij ruis. */
function positieNu(opt){
  opt=opt||{};
  const maxMs=opt.ms||14000, doel=opt.doel||5, minAantal=opt.min||5;
  return new Promise((res,rej)=>{
    if(!navigator.geolocation) return rej(new Error('geen locatie'));
    let punten=[], id=null, klaar=false, tijd=null;
    const middel=()=>{
      if(!punten.length) return null;
      const beste=Math.min.apply(null,punten.map(p=>p.nauw));
      const bruik=punten.filter(p=>p.nauw<=Math.max(beste*2,beste+8));
      let gw=0,la=0,lo=0;
      bruik.forEach(p=>{const w=1/(p.nauw*p.nauw);gw+=w;la+=p.lat*w;lo+=p.lon*w});
      /* de spreiding neemt af met de wortel van het aantal metingen */
      const nauw=Math.max(3,Math.round(beste/Math.sqrt(bruik.length)));
      return {lat:la/gw,lon:lo/gw,nauw,metingen:bruik.length,ruw:beste};
    };
    const stop=fout=>{
      if(klaar) return; klaar=true;
      if(id!==null) navigator.geolocation.clearWatch(id);
      if(tijd) clearInterval(tijd);
      const g=middel();
      g?res(g):rej(fout||new Error('geen fix'));
    };
    id=navigator.geolocation.watchPosition(p=>{
      punten.push({lat:p.coords.latitude,lon:p.coords.longitude,nauw:Math.max(1,p.coords.accuracy)});
      const g=middel();
      if(opt.onder) opt.onder(g);
      if(punten.length>=minAantal&&g.nauw<=doel) stop();
    },e=>{ if(!punten.length) stop(e) },{enableHighAccuracy:true,maximumAge:0,timeout:maxMs});
    setTimeout(()=>stop(),maxMs);
  });
}

/* afstand over de weg tussen twee punten — werkt ook als de app dicht was tijdens de rit */
async function wegAfstand(a,b){
  try{
    const u=`https://router.project-osrm.org/route/v1/driving/${a.lon},${a.lat};${b.lon},${b.lat}?overview=false`;
    const r=await fetch(u); if(!r.ok) return null;
    const d=await r.json();
    if(!d.routes||!d.routes.length) return null;
    return d.routes[0].distance/1000;
  }catch(e){ return null; }
}

/* Adressen opzoeken bij het Kadaster (PDOK). Gratis, geen sleutel, en het is
   de bron zelf — nauwkeuriger dan welke kaartdienst dan ook voor Nederland. */
async function adresZoek(tekst){
  if(!tekst||tekst.trim().length<3) return [];
  try{
    const u='https://api.pdok.nl/bzk/locatieserver/search/v3_1/suggest'
      +'?q='+encodeURIComponent(tekst)+'&fq=type:adres&rows=6';
    const r=await fetch(u); if(!r.ok) return [];
    const d=await r.json();
    return ((d.response||{}).docs||[]).map(x=>({id:x.id,naam:x.weergavenaam}));
  }catch(e){ return [] }
}
/* Het gekozen adres opzoeken, inclusief coördinaten. */
async function adresDetail(id){
  try{
    const u='https://api.pdok.nl/bzk/locatieserver/search/v3_1/lookup'
      +'?id='+encodeURIComponent(id)+'&fl=weergavenaam,centroide_ll,straatnaam,huis_nlt,postcode,woonplaatsnaam';
    const r=await fetch(u); if(!r.ok) return null;
    const d=await r.json(), doc=((d.response||{}).docs||[])[0];
    if(!doc) return null;
    const m=String(doc.centroide_ll||'').match(/POINT\(([-\d.]+) ([-\d.]+)\)/);
    const straat=[doc.straatnaam,doc.huis_nlt].filter(Boolean).join(' ');
    return {
      adres:[straat,doc.woonplaatsnaam].filter(Boolean).join(', ')||doc.weergavenaam,
      volledig:doc.weergavenaam,
      lon:m?parseFloat(m[1]):null, lat:m?parseFloat(m[2]):null
    };
  }catch(e){ return null }
}
/* Hangt een suggestielijst onder een invoerveld. */
function adresHulp(veldId,opKeuze){
  const veld=$('#'+veldId); if(!veld) return;
  let lijst=veld.parentElement.querySelector('.adressug');
  if(!lijst){
    lijst=document.createElement('div');
    lijst.className='adressug';
    veld.insertAdjacentElement('afterend',lijst);
  }
  let wacht=null, laatste='';
  const sluit=()=>{lijst.innerHTML='';lijst.classList.remove('open')};
  veld.addEventListener('input',()=>{
    const t=veld.value;
    if(wacht) clearTimeout(wacht);
    if(t.trim().length<3) return sluit();
    wacht=setTimeout(async()=>{
      if(t===laatste) return; laatste=t;
      const res=await adresZoek(t);
      if(veld.value!==t) return;                 /* alweer verder getypt */
      if(!res.length) return sluit();
      lijst.innerHTML=res.map(x=>`<button class="sugrij" data-sid="${esc(x.id)}">
        ${esc(x.naam)}</button>`).join('');
      lijst.classList.add('open');
      lijst.querySelectorAll('[data-sid]').forEach(b=>b.onclick=async()=>{
        sluit(); sluitToetsenbord();
        const d=await adresDetail(b.dataset.sid);
        if(!d) return;
        veld.value=d.adres; veld.dataset.aangepast='1';
        if(opKeuze) opKeuze(d);
      });
    },280);
  });
  veld.addEventListener('blur',()=>setTimeout(sluit,220));
}

/* plekken waar je vaker komt: je vestiging, vaste klanten */
function plekBij(lat,lon,meter){
  const grens=(meter||75)/1000;
  let dichtst=null, kort=Infinity;
  (S.plekken||[]).forEach(pl=>{
    const d=afstandKm({lat,lon},{lat:pl.lat,lon:pl.lon});
    if(d<grens&&d<kort){kort=d;dichtst=pl}
  });
  return dichtst;
}
/* eerst kijken of je hier vaker bent, pas dan het adres opzoeken */
async function plaatsNaam(lat,lon){
  const pl=plekBij(lat,lon);
  if(pl) return {naam:pl.naam||pl.adres,adres:pl.adres,plekId:pl.id,bekend:true,vestiging:!!pl.vestiging};
  const a=await adresVan(lat,lon);
  return {naam:a,adres:a,plekId:null,bekend:false,vestiging:false};
}
/* De Belastingdienst keurt een registratie af zodra er gaten in zitten: als rit A eindigt op
   84.243 en rit B begint op 84.310, dan is er 67 km niet verantwoord. Dat moet je zien. */
function kmControle(){
  if(!autoVanDeZaak()) return [];    /* sluitende reeks hoeft alleen bij een auto van de zaak */
  const lijst=(S.ritten||[]).filter(r=>r.standBegin!==null&&r.standEind!==null)
    .sort((a,b)=>(a.standBegin||0)-(b.standBegin||0));
  const gaten=[];
  for(let i=1;i<lijst.length;i++){
    const vorig=lijst[i-1], nu2=lijst[i];
    const verschil=nu2.standBegin-vorig.standEind;
    if(verschil>1) gaten.push({soort:'gat',km:verschil,van:vorig,naar:nu2});
    else if(verschil<-1) gaten.push({soort:'terug',km:-verschil,van:vorig,naar:nu2});
  }
  return gaten;
}
/* Wat je moet vastleggen hangt af van je auto.
   Auto van de zaak: alles, inclusief kilometerstanden — daarmee toon je aan dat je
   onder de 500 privékilometers blijft.
   Privéauto: alleen je zakelijke ritten, met adressen en afstand. Kilometerstanden
   hoeven niet, en privéritten hoef je helemaal niet te verantwoorden. */
const autoVanDeZaak=()=>S.autoSoort==='zaak';   /* alles anders telt als privéauto */
function ritMankeert(r){
  if(!autoVanDeZaak()&&!r.zakelijk) return [];      /* privérit, privéauto: vrij */
  const m=[];
  if(!r.start.adres) m.push('vertrekadres');
  if(!r.eind.adres) m.push('aankomstadres');
  if(!r.reden) m.push('reden');
  if(autoVanDeZaak()&&(r.standBegin===null||r.standEind===null)) m.push('kilometerstand');
  return m;
}
const onvolledig=()=>(S.ritten||[]).filter(r=>ritMankeert(r).length);
const kwartaalVan=d=>Math.floor(new Date(d).getMonth()/3)+1;
function kmPeriode(zakelijk,kwartaal){
  const j=String(new Date().getFullYear()), k=kwartaal||kwartaalVan(new Date());
  return (S.ritten||[]).filter(r=>r.datum.startsWith(j)&&r.zakelijk===zakelijk
    &&(!kwartaal||kwartaalVan(r.datum)===k)).reduce((n,r)=>n+r.km,0);
}
/* Je rijdt steeds dezelfde routes. Wat vulde je eerder in toen je hier was? */
function redenSuggesties(lat,lon,vanLat,vanLon){
  const bij=(a,b,c,d)=>a!==null&&c!==null&&afstandKm({lat:a,lon:b},{lat:c,lon:d})<0.12;
  const punten=[];
  (S.ritten||[]).forEach(r=>{
    if(!r.reden) return;
    const zelfdeEind=bij(lat,lon,r.eind.lat,r.eind.lon);
    const zelfdeRoute=zelfdeEind&&bij(vanLat,vanLon,r.start.lat,r.start.lon);
    if(zelfdeRoute) punten.push({reden:r.reden,zakelijk:r.zakelijk,score:3,datum:r.datum});
    else if(zelfdeEind) punten.push({reden:r.reden,zakelijk:r.zakelijk,score:2,datum:r.datum});
  });
  /* zelfde reden vaker gebruikt telt zwaarder, recenter ook */
  const map={};
  punten.forEach(x=>{
    const k=x.reden.toLowerCase();
    map[k]=map[k]||{reden:x.reden,zakelijk:x.zakelijk,punt:0,datum:x.datum};
    map[k].punt+=x.score;
    if(x.datum>map[k].datum) map[k].datum=x.datum;
  });
  return Object.values(map).sort((a,b2)=>b2.punt-a.punt||b2.datum.localeCompare(a.datum)).slice(0,3);
}

    if(type==='ongedierte'){
      const w=$$('#cW button.aan').map(x=>x.dataset.w);
      if(!w.length) return toast('Vink aan wat je gecontroleerd hebt.');
      const vondst=$$('#cB button.aan')[0].dataset.v==='vondst';
      const actie=vondst?($('#cA').value.trim()):'';
      if(vondst&&!actie) return toast('Noteer wat je eraan gedaan hebt.');
      c.titel=vondst?'iets aangetroffen':'niets aangetroffen';
      c.sub=w.join(', ')+(actie?' · '+actie:'');
      c.status=vondst?'let':'ok';
    } else if(type==='klacht'){
      const k=$('#cK').value.trim();
      if(!k) return toast('Beschrijf de klacht.');
      c.titel=$('#cVan').value.trim()||'anoniem';
      c.sub=k+($('#cLot').value.trim()?' · lot '+$('#cLot').value.trim():'')
        +($('#cAf').value.trim()?' · afgehandeld: '+$('#cAf').value.trim():'');
      c.status='let';
    } else {
      const u=$('#cU').value.trim();
      if(!u) return toast('Noteer de uitkomst van de oefening.');
      c.titel='lot '+($('#cLot2').value.trim()||'onbekend');
      c.sub=u+($('#cDuur').value.trim()?' · duurde '+$('#cDuur').value.trim():'');
    }
    S.controles.push(c); bewaarNu(); render(); sheetControles();
    toast('Vastgelegd.');
  };
}

function sheetAllergenenBatch(){
  const b=batch(); if(!b) return;
  const A=batchAllergenen(b);
  const onbekend=bIngredienten(b).filter(i=>!isAllergeen(i.naam)&&!(S.allerg&&S.allerg[i.naam]));
  sheet('Allergenen in deze batch',
    `<p class="hint">${A.alle.length
       ? 'Deze batch bevat '+A.alle.map(alNaam).join(', ').toLowerCase()+'.'
       : 'Er zijn nog geen allergenen gekoppeld aan de ingrediënten van deze batch.'}</p>
     <div class="paneel" style="margin-bottom:16px">${A.rij.map(x=>`
       <div class="item"><span class="t">${x.groepen.length||'—'}</span>
         <span class="b">${esc(x.naam)}<em>${x.groepen.length?x.groepen.map(alNaam).join(', '):'geen allergenen'}</em></span>
       </div>`).join('')}</div>
     ${A.verschil?`<div class="blokkop"><span class="eyebrow">Adviesvolgorde</span></div>
       <p class="hint">Je smaken bevatten niet dezelfde allergenen. Maak ze in deze volgorde,
         dan sleep je geen allergeen mee naar een smaak die het niet hoort te bevatten.</p>
       <div class="paneel" style="margin-bottom:16px">${A.advies.map((x,i)=>`
         <div class="item"><span class="t">${i+1}</span>
           <span class="b">${esc(x.naam)}<em>${x.groepen.length?x.groepen.map(alNaam).join(', '):'allergeenvrij'}</em></span>
         </div>`).join('')}</div>`:''}
     ${onbekend.length?`<div class="geen">Nog niet ingevuld: ${onbekend.map(i=>esc(i.naam)).join(', ')}.
       Zolang dat zo is, kan de app niet garanderen dat dit overzicht compleet is.</div>`:''}`,
    `${A.verschil?`<button class="prim" style="margin-top:0" id="abR">Allergenenreiniging vastleggen</button>`:''}
     <button class="${A.verschil?'sec':'prim'}" style="margin-top:${A.verschil?'8px':'0'}" id="abI">Allergenen instellen</button>`);
  if($('#abR')) $('#abR').onclick=()=>{
    bLog(b,{type:'schoonmaak',titel:'Allergenenreiniging tussen smaken',
      sub:'Gereedschap en werkvlak gereinigd bij wissel van allergeengroep',status:'ok'});
    bewaarNu(); render(); klaarSheet('Reiniging vastgelegd.');
  };
  $('#abI').onclick=sheetAllergenen;
}

function sheetAllergenen(){
  S.allerg=S.allerg||{};
  const ing=alleIngredienten();
  if(!ing.length){
    return sheet('Allergenen',
      `<p class="hint">Je hebt nog geen ingrediënten in je smaken staan. Vul eerst een recept in,
        dan kun je hier per ingrediënt aangeven welke allergenen erin zitten.</p>`,'');
  }
  const rij=n=>{
    const gk=ingAllerg(n), pr=ingPrijs(n);
    return `<div class="alblok">
      <div class="alkop"><span class="n">${esc(n)}</span>
        <span class="g ${gk.length?'aan':''}">${gk.length?gk.map(alNaam).join(', '):'geen'}</span></div>
      <div class="chips">${ALLERGENEN.map(a=>`<button class="chip klein ${gk.includes(a.k)?'aan':''}"
        data-ing="${esc(n)}" data-al="${a.k}">${a.n}</button>`).join('')}</div>
      <div class="prijsrij"><label>Prijs per kilo</label>
        <div class="pveld"><span>€</span><input class="inp" data-prijs="${esc(n)}" type="number"
          inputmode="decimal" step="0.01" value="${pr!==null?pr:''}" placeholder="—"></div></div>
    </div>`;
  };
  sheet('Ingrediënten',
    `<p class="hint">Geef per ingrediënt aan welke van de veertien wettelijke allergenen erin zitten,
      en wat je ervoor betaalt. Je smaken, etiketten en batches nemen dit automatisch over.</p>
     <div id="alL">${ing.map(rij).join('')}</div>`,
    `<button class="prim" style="margin-top:0" id="alOk">Klaar</button>`);
  $$('[data-al]').forEach(c=>c.onclick=()=>{
    const n=c.dataset.ing, k=c.dataset.al;
    const lijst=new Set(ingAllerg(n));
    lijst.has(k)?lijst.delete(k):lijst.add(k);
    const v=ALLERGENEN.filter(a=>lijst.has(a.k)).map(a=>a.k);
    if(v.length) S.allerg[n]=v; else delete S.allerg[n];
    bewaarNu(); sheetAllergenen();
  });
  $$('[data-prijs]').forEach(i=>i.onchange=()=>{
    S.prijzen=S.prijzen||{};
    const v=parseFloat(i.value.replace(',','.'));
    if(isNaN(v)||v<=0) delete S.prijzen[i.dataset.prijs]; else S.prijzen[i.dataset.prijs]=v;
    bewaarNu();
  });
  $('#alOk').onclick=sheetInstellingen;
}

/* welk onderwerp hoort bij welk scherm — zo weet het hulpknopje wat het moet tonen */
const SCHERMHULP={

  'Waar maak je het van?':'smaak','Waar bestaat het uit?':'smaak','Hoe maak je het?':'smaak',

  'Uitwerking':'batch','Welke chocolade?':'batch','Hoeveel mallen?':'batch',

  'Ontvangst vastleggen':'voorraad','Bestellijst':'voorraad','Boodschappenlijst':'voorraad',
  'Houdbaarheid':'voorraad','Telronde':'voorraad','Voorraadwaardering':'voorraad',
  'Alle mutaties':'voorraad','Verpakking toevoegen':'voorraad','Levertijden':'voorraad',
  'HACCP-registraties':'haccp','Thermometer ijken':'haccp','Meetpunten':'haccp',
  'Openingscheck':'haccp','Temperatuur meten':'haccp','Dossier voor de inspectie':'haccp',
  'Nieuwe order':'orders','Order':'orders','Factuur':'orders','Verzendregel':'orders',
  'Btw-aangifte':'geld','Verkoopprijzen':'geld','Marge per smaak':'geld',
  'Winst en verlies':'geld','Uurtarief':'geld','Openstaand':'geld',
  'Voorraadstickers':'trace','Traceren':'trace','Lot zoeken':'trace',
  'Instellingen':'start','Bedrijfsprofiel':'start','Branche en sjabloon':'start',
  'Bonbons per mal':'start','Productiestappen':'start','Planning':'batch'
};

function hulpVoor(titel){
  if(SCHERMHULP[titel]) return SCHERMHULP[titel];
  /* valt de titel niet exact, dan zoeken op sleutelwoorden */
  const t=String(titel||'').toLowerCase();
  if(/smaak|recept|onderdeel/.test(t)) return 'smaak';
  if(/batch|mallen|productie|stap/.test(t)) return 'batch';
  if(/voorraad|ontvangst|bestel|boodschap|partij|lot/.test(t)) return 'voorraad';
  if(/haccp|temperatuur|ijk|meetpunt|check|dossier|schoonmaak/.test(t)) return 'haccp';
  if(/order|klant|factuur|verzend|inpak/.test(t)) return 'orders';
  if(/btw|prijs|marge|winst|uurtarief|openstaand|kilometer/.test(t)) return 'geld';
  if(/trace|sticker|qr|recall/.test(t)) return 'trace';
  return null;
}

/* de uitleg openen als paneel over het huidige scherm */
function hulpOpen(ond){
  const p2=$('#hulpPaneel'); if(!p2) return;
  const u=UITLEG.find(x=>x.id===ond);
  if(u) hulpToon(u); else hulpLijst();
  p2.classList.add('open');
}
function hulpDicht(){ const p2=$('#hulpPaneel'); if(p2) p2.classList.remove('open') }

function hulpToon(u){
  const rl=Object.keys(RONDLEIDINGEN).find(k=>k===u.id
    ||(u.id==='voorraad'&&k==='ontvangst'));
  $('#hulpTitel').textContent=u.titel;
  $('#hulpBody').innerHTML=`${rl?`<button class="prim" style="margin:0 0 20px" data-rlstart="${rl}">
      ${svg(I.spark)}Leid me er stap voor stap doorheen</button>
     <p class="hint" style="margin:-12px 0 18px">De app opent het scherm en wijst je aan wat je waar invult.</p>`:''}
    <div class="uitlegstappen">${u.stappen.map((st,i)=>`<div class="ustap">
    <span class="unr">${i+1}</span>
    <div class="uin"><div class="ut">${esc(st.t)}</div><div class="uu">${esc(st.u)}</div>
      ${st.knop?`<button class="knop2" data-udoe="${esc(st.doe)}" style="margin:12px 0 0">
        ${esc(st.knop)}${svg(I.pijl,'2')}</button>`:''}
    </div></div>`).join('')}</div>`;
  bindHulpKnoppen();
  $$('#hulpBody [data-rlstart]').forEach(b=>b.onclick=()=>rondleidingStart(b.dataset.rlstart));
}

function hulpLijst(){
  $('#hulpTitel').textContent='Hoe werkt het?';
  $('#hulpBody').innerHTML=`<p class="hint">Kies een onderwerp. Je krijgt de stappen op volgorde.</p>
    <div class="paneel">${UITLEG.map(u=>`<button class="arij" data-hulpond="${u.id}">
      <span class="ivak">${svg(I[u.ico])}</span>
      <span class="naam">${esc(u.titel)}<small>${esc(u.kort)}</small></span>
      <span class="waarde gevuld">${u.stappen.length}</span>
      <span class="pijl">${svg(I.pijl,'2')}</span></button>`).join('')}</div>`;
  $$('[data-hulpond]').forEach(b=>b.onclick=()=>{
    const u=UITLEG.find(x=>x.id===b.dataset.hulpond); if(u) hulpToon(u);
  });
}

function bindHulpKnoppen(){
  $$('#hulpBody [data-udoe]').forEach(b=>b.onclick=()=>{
    hulpDicht();
    const d=b.dataset.udoe;
    if(d==='bedrijf') return sheetBedrijf();
    if(d==='branche') return sheetBranche(false);
    if(d==='mal') return sheetMal();
    if(d==='receptnieuw') return sheetReceptForm(null);
    if(d==='recepten') return sheetRecepten();
    if(d==='nieuwbatch') return sheetNieuweBatch();
    if(d==='ontvangst') return sheetOntvangst();
    if(d==='ijking') return sheetIjking();
    if(d==='meetpunten') return sheetMeetpunten();
    if(d==='dossier') return sheetDossier();
    if(d==='verkoop') return sheetVerkoopprijzen();
    if(d==='verzend') return sheetVerzendregel();
    if(d==='trace') return sheetTrace('');
    if(d==='naarvoorraad'){ S.tab='voorraad'; dicht(); render(); return }
    if(d==='naarorders'){ S.tab='orders'; dicht(); render(); return }
    if(d==='naargeld'){ S.tab='geld'; dicht(); render(); return }
  });
}

function rlToon(){
  if(!RL) return;
  const st=RL.stappen[RL.i];
  if(!st) return rlKlaar();
  const el=document.querySelector(st.kies);
  if(!el){ RL.i++; return rlToon() }

  rlLosmaken();
  document.querySelectorAll('.rlmerk').forEach(e=>e.classList.remove('rlmerk'));
  el.classList.add('rlmerk');
  document.body.classList.add('rlbezig');

  const blok=$('#rlBlok');
  $('#rlNr').textContent=(RL.i+1)+' van '+RL.stappen.length;
  $('#rlTitel').textContent=st.t;
  $('#rlTekst').textContent=st.u||'';
  $('#rlTekst').style.display=st.u?'':'none';
  $('#rlDoor').textContent=RL.i===RL.stappen.length-1?'Klaar':'Volgende';
  const tb=$('#rlTerug');
  if(tb){ tb.classList.toggle('aan',RL.i>0); if(!tb.innerHTML) tb.innerHTML=svg(I.pijl,'2') }

  /* boven of onder, net waar het element staat */
  setTimeout(()=>{
    const r2=el.getBoundingClientRect();
    const boven=r2.top>window.innerHeight*0.5;
    blok.classList.toggle('boven',boven);
    document.body.classList.toggle('rlboven',boven);
    el.scrollIntoView({behavior:'smooth',block:'center'});
    blok.classList.add('open');
  },200);

  /* meekijken met wat je doet: klaar? dan zelf door */
  rlLuister(el,st);
}

/* de rondleiding luistert mee, zodat hij vanzelf meeloopt */
let rlAf=[];
function rlLosmaken(){ rlAf.forEach(f=>{try{f()}catch(e){}}); rlAf=[] }

function rlLuister(el,st){
  const door=()=>{ rlLosmaken(); setTimeout(()=>{ if(!RL) return; RL.i++; 
    $('#rlBlok').classList.remove('open'); setTimeout(rlToon,180) },520) };

  /* een invoerveld: door zodra je iets getypt hebt en het veld verlaat */
  if(el.matches('input,textarea,select')){
    const kijk=()=>{ if(String(el.value||'').trim()) door() };
    el.addEventListener('change',kijk); el.addEventListener('blur',kijk);
    rlAf.push(()=>{el.removeEventListener('change',kijk);el.removeEventListener('blur',kijk)});
    return;
  }
  /* een rij chips of knoppen: door zodra je er een kiest */
  const klik=e=>{
    const k=e.target.closest('button,.chip,.arij,.chocknop,.brkaart,.orij');
    if(k) door();
  };
  el.addEventListener('click',klik);
  rlAf.push(()=>el.removeEventListener('click',klik));

  /* verandert het scherm door jouw actie? dan ook door */
  const wacht=new MutationObserver(()=>{
    if(!document.contains(el)){ wacht.disconnect(); door() }
  });
  const body=$('#sheetBody');
  if(body){ wacht.observe(body,{childList:true,subtree:true});
    rlAf.push(()=>wacht.disconnect()) }
}

function rlKlaar(){
  rlLosmaken();
  document.body.classList.remove('rlbezig','rlboven');
  const blok=$('#rlBlok');
  $('#rlNr').textContent='Klaar';
  $('#rlTitel').textContent='Dat was het';
  $('#rlTekst').textContent='Je weet nu hoe het werkt. Vul de rest in je eigen tempo in.';
  $('#rlTekst').style.display='';
  $('#rlDoor').textContent='Sluiten';
  const tb2=$('#rlTerug');
  if(tb2){ tb2.classList.add('aan'); if(!tb2.innerHTML) tb2.innerHTML=svg(I.pijl,'2') }
  document.querySelectorAll('.rlmerk').forEach(e=>e.classList.remove('rlmerk'));
  RL.klaar=true;
  RL.i=RL.stappen.length;
}

/* ================= zoeken =================
   Eén veld dat door alles heen kijkt: smaken, batches, orders, klanten,
   grondstoffen en lotnummers. */

function zoekAlles(q){
  const t=String(q||'').trim().toLowerCase();
  if(t.length<2) return [];
  const raak=x=>String(x||'').toLowerCase().includes(t);
  const uit=[];

  (S.recepten||[]).forEach(r=>{
    if(raak(r.naam)||(r.onderdelen||[]).some(x=>raak(x.naam)||(x.ing||[]).some(i=>raak(i.naam))))
      uit.push({soort:'Smaak',ico:'boek',naam:r.naam,
        sub:chocNaam(r.chocolade).toLowerCase()+' · THT '+r.tht+' dagen',
        doe:()=>sheetReceptForm(r.id)});
  });

  (S.batches||[]).forEach(b=>{
    const namen=bNamen(b);
    if(raak(b.code)||raak(namen)||Object.values(b.lots||{}).some(l=>
        Array.isArray(l)?l.some(x=>raak(x.lot)):raak(l)))
      uit.push({soort:'Batch',ico:'vorm',naam:namen,
        sub:b.code+' · '+bTotaal(b)+' st · '+(b.status==='klaar'?'afgerond':'loopt'),
        doe:()=>{S.tab='productie';S.batchId=b.id;dicht();render()}});
  });

  (S.orders||[]).forEach(od=>{
    if(raak(od.nummer)||raak(klantNaam(od.klantId)))
      uit.push({soort:'Order',ico:'doos',naam:klantNaam(od.klantId),
        sub:od.nummer+' · '+orderAantal(od)+' bonbons · '+esc(od.status||'nieuw'),
        doe:()=>{S.tab='orders';dicht();render();setTimeout(()=>sheetOrder(od.id),140)}});
  });

  (S.klanten||[]).forEach(k=>{
    if(raak(k.naam)||raak(k.email)||raak(k.plaats))
      uit.push({soort:'Klant',ico:'lijst',naam:k.naam,
        sub:[k.plaats,k.email].filter(Boolean).join(' · ')||'klant',
        doe:()=>{S.tab='orders';dicht();render()}});
  });

  grondVoorraad().forEach(v=>{
    if(raak(v.product))
      uit.push({soort:'Grondstof',ico:'doos',naam:v.product,
        sub:toonHoeveel(v.saldo,v.basis)+' op voorraad'+(leverancierVan(v.product)
          ?' · '+leverancierVan(v.product):''),
        doe:()=>{S.tab='voorraad';dicht();render()}});
  });

  (S.lots||[]).forEach(l=>{
    if(raak(l.lot)||raak(l.product))
      uit.push({soort:'Partij',ico:'qr',naam:l.product+' · lot '+l.lot,
        sub:[l.leverancier,l.tht?'THT '+kort(new Date(l.tht)):''].filter(Boolean).join(' · '),
        doe:()=>{S.tab='voorraad';dicht();render()}});
  });

  return uit.slice(0,24);
}

/* ================= bedrijfsprofiel =================
   Naam, ondertitel en logo. Het logo wordt verkleind naar maximaal 480 px breed,
   zodat het klein genoeg blijft om mee te reizen in de database. */
const LOGO_MAX_BREED=480, LOGO_MAX_BYTES=280*1024;

function verkleinLogo(bestand){
  return new Promise((klaar,fout)=>{
    if(!/^image\//.test(bestand.type)) return fout('geen afbeelding');
    const lezer=new FileReader();
    lezer.onerror=()=>fout('lezen mislukt');
    lezer.onload=()=>{
      const img=new Image();
      img.onerror=()=>fout('afbeelding onleesbaar');
      img.onload=()=>{
        const schaal=Math.min(1,LOGO_MAX_BREED/(img.width||1));
        const b=Math.max(1,Math.round(img.width*schaal)), h=Math.max(1,Math.round(img.height*schaal));
        const c=document.createElement('canvas'); c.width=b; c.height=h;
        c.getContext('2d').drawImage(img,0,0,b,h);
        /* png houdt een doorzichtige achtergrond heel; is het te zwaar, dan jpeg */
        let uit=c.toDataURL('image/png');
        if(uit.length>LOGO_MAX_BYTES){
          const c2=document.createElement('canvas'); c2.width=b; c2.height=h;
          const x=c2.getContext('2d');
          x.fillStyle='#ffffff'; x.fillRect(0,0,b,h); x.drawImage(img,0,0,b,h);
          uit=c2.toDataURL('image/jpeg',0.86);
        }
        if(uit.length>LOGO_MAX_BYTES) return fout('te groot');
        klaar(uit);
      };
      img.src=lezer.result;
    };
    lezer.readAsDataURL(bestand);
  });
}

/* de kop schuift weg zodra je gaat scrollen */
(function(){
  const scr=$('#scherm'); if(!scr) return;
  let wacht=false;
  scr.addEventListener('scroll',()=>{
    if(wacht) return;
    wacht=true;
    requestAnimationFrame(()=>{ wacht=false; kopSchuif() });
  },{passive:true});
  window.addEventListener('resize',()=>{ meetKop(); kopSchuif() });
  /* het merklettertype laadt na, waardoor de kop nog groeit */
  if(document.fonts&&document.fonts.ready)
    document.fonts.ready.then(()=>{ meetKop(); kopSchuif() }).catch(()=>{});
  /* De kop verandert van hoogte door een tabwissel, een ladend lettertype of
     een lopende padding-overgang. Meten we maar één keer, dan klopt de ruimte
     eronder niet meer. Dus volgen we hem. */
  const kop=document.querySelector('header');
  if(kop&&window.ResizeObserver){
    let bezig=false;
    /* de verwijzing vasthouden: zonder variabele ruimt de browser de
       observer op en blijft de kophoogte op zijn eerste meting hangen */
    kopVolger=new ResizeObserver(()=>{
      if(bezig) return; bezig=true;
      requestAnimationFrame(()=>{ bezig=false; meetKop(); kopSchuif() });
    });
    /* op de border-box letten, niet op de content-box. Bij de dashboardkop
       verandert alleen de padding, en daar gaat een content-box-observer
       niet van af — de hoogte bleef dan op zijn eerste meting hangen. */
    try{ kopVolger.observe(kop,{box:'border-box'}) }catch(e){ kopVolger.observe(kop) }
  }
  /* en voor de zekerheid nog na de padding-overgang */
  if(kop) kop.addEventListener('transitionend',e=>{
    if(e.propertyName&&e.propertyName.indexOf('padding')===0){ meetKop(); kopSchuif() }
  });
})();

/* een sheet sluit je op de telefoon door omlaag te vegen */
(function(){
  const vel=$('#sheet'), body=$('#sheetBody'); if(!vel) return;
  let y0=null, y=0, bezig=false;
  vel.addEventListener('touchstart',e=>{
    /* alleen vegen als je bovenaan staat of de kop vastpakt, anders wil je scrollen */
    if(body&&body.scrollTop>2&&!e.target.closest('.sheetkop')&&!e.target.closest('.grip')) return;
    if(e.target.closest('input,textarea,select,button')) return;
    y0=e.touches[0].clientY; y=0; bezig=true; vel.style.transition='none';
  },{passive:true});
  vel.addEventListener('touchmove',e=>{
    if(!bezig||y0===null) return;
    y=Math.max(0,e.touches[0].clientY-y0);
    vel.style.transform='translateY('+y+'px)';
    const ov=$('#overlay'); if(ov) ov.style.opacity=String(Math.max(0,1-y/400));
  },{passive:true});
  const los=()=>{
    if(!bezig) return;
    bezig=false; vel.style.transition='transform .22s ease-out';
    const ov=$('#overlay');
    if(y>110){ vel.style.transform='translateY(100%)';
      setTimeout(()=>{vel.style.transform='';vel.style.transition='';if(ov)ov.style.opacity='';dicht()},170); }
    else { vel.style.transform=''; if(ov) ov.style.opacity=''; }
    y0=null; y=0;
  };
  vel.addEventListener('touchend',los);
  vel.addEventListener('touchcancel',los);
})();

/* je telefoon valt in slaap terwijl je staat te werken — met chocoladehanden ontgrendelen is geen optie */
let wakeSlot=null;
async function schermWakker(aan){
  try{
    if(aan){
      if(wakeSlot||!('wakeLock' in navigator)) return;
      wakeSlot=await navigator.wakeLock.request('screen');
      wakeSlot.addEventListener('release',()=>{wakeSlot=null});
    } else if(wakeSlot){ await wakeSlot.release(); wakeSlot=null; }
  }catch(e){ wakeSlot=null; }
}
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'){
    const b=batch();
    if(b&&(lopendWerk(b)||S.kook)) schermWakker(true);
  }
});

/* een afgelopen timer moet je hóren, niet zien.
   iOS speelt alleen geluid af als de context door een tik is vrijgegeven. */
let piepCtx=null;
function geluidVrijgeven(){
  try{
    piepCtx=piepCtx||new (window.AudioContext||window.webkitAudioContext)();
    if(piepCtx.state==='suspended') piepCtx.resume();
    const o=piepCtx.createOscillator(), g=piepCtx.createGain();
    g.gain.value=0; o.connect(g); g.connect(piepCtx.destination);
    o.start(); o.stop(piepCtx.currentTime+.01);
  }catch(e){}
}
function piep(){
  try{
    piepCtx=piepCtx||new (window.AudioContext||window.webkitAudioContext)();
    if(piepCtx.state==='suspended') piepCtx.resume();
    [0,340,680].forEach(vert=>{
      const o=piepCtx.createOscillator(), g=piepCtx.createGain();
      o.type='sine'; o.frequency.value=880;
      const t=piepCtx.currentTime+vert/1000;
      g.gain.setValueAtTime(0,t);
      g.gain.linearRampToValueAtTime(.28,t+.02);
      g.gain.exponentialRampToValueAtTime(.001,t+.26);
      o.connect(g); g.connect(piepCtx.destination); o.start(t); o.stop(t+.28);
    });
  }catch(e){}
  if(navigator.vibrate) try{navigator.vibrate([220,120,220])}catch(e){}
}

  const w=lopendWerk(b);
  const t = w ? duurTekst(Date.now()-w.start) : '—';
  kl.forEach(el=>{if(el.textContent!==t)el.textContent=t});
  const ring=document.querySelector('.rvul');
  if(ring&&w){
    const c=2*Math.PI*92, sec=Math.floor((Date.now()-w.start)/1000);
    ring.setAttribute('stroke-dashoffset',(c*(1-((sec%60)/60))).toFixed(1));
  }
},1000);
